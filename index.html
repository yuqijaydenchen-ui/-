<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>👻 暗影勇者 · 无尽恐怖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            overflow: hidden;
        }
        #wrapper {
            background: #141425;
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            position: relative;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #1a1a30;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
            cursor: crosshair;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: #ccc;
            font-weight: bold;
            font-size: 17px;
            padding: 0 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        #uiLeft {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }
        .label {
            color: #667799;
            font-weight: normal;
        }
        #hpDisplay {
            color: #ff6b6b;
            font-size: 22px;
            text-shadow: 0 0 25px #ff6b6b55;
        }
        #worldDisplay {
            color: #6bcbff;
            font-size: 20px;
            text-shadow: 0 0 25px #6bcbff55;
        }
        #keyDisplay {
            color: #f7d44a;
            font-size: 20px;
        }
        #jumpDisplay {
            color: #9b6bff;
            font-size: 20px;
            text-shadow: 0 0 25px #9b6bff55;
        }
        #weaponDisplay {
            color: #ffaa44;
            font-size: 18px;
        }
        #skillDisplay {
            color: #44ff88;
            font-size: 16px;
            background: #0a1a12;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #44ff8866;
        }
        #levelDisplay {
            color: #f7d44a;
            font-size: 20px;
            text-shadow: 0 0 25px #f7d44a55;
        }
        #bossHpBar {
            color: #ff3333;
            font-size: 18px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        #bossHpBar .bar {
            width: 150px;
            height: 12px;
            background: #2a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #663333;
        }
        #bossHpBar .fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3333, #ff8833);
            border-radius: 10px;
            transition: width 0.15s;
        }
        #bossNameDisplay {
            color: #ff8866;
            font-size: 16px;
            display: none;
            text-shadow: 0 0 30px #ff663355;
        }
        #infiniteToggle {
            background: #2a1a3a;
            color: #ffaa44;
            border: 2px solid #ffaa44;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #infiniteToggle:hover {
            background: #3a2a4a;
        }
        #infiniteToggle.active {
            border-color: #44ff88;
            color: #44ff88;
        }
        #statBtn {
            background: #1a2a3a;
            color: #6bcbff;
            border: 2px solid #6bcbff;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #statBtn:hover {
            background: #2a3a4a;
        }
        #hint {
            color: #445566;
            font-size: 13px;
            background: #0e0e1e;
            padding: 6px 18px;
            border-radius: 30px;
            text-align: right;
        }
        #msgOverlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 80px);
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #msgOverlay.show {
            display: flex;
        }
        #msgText {
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 80px #ff000066;
            animation: pop 0.5s ease;
            text-align: center;
            line-height: 1.4;
            padding: 20px;
        }
        #msgSub {
            font-size: 20px;
            color: #ff6666;
            margin-top: 10px;
            font-weight: normal;
            text-shadow: 0 0 40px #ff000044;
        }
        @keyframes pop {
            0% {
                transform: scale(0.2) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        #statPanel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a0a1aee;
            border: 2px solid #6bcbff;
            border-radius: 20px;
            padding: 30px 40px;
            color: #fff;
            z-index: 20;
            display: none;
            min-width: 300px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 60px #6bcbff33;
        }
        #statPanel h2 {
            text-align: center;
            color: #f7d44a;
            margin-bottom: 15px;
            font-size: 28px;
            text-shadow: 0 0 30px #f7d44a44;
        }
        #statPanel .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #33445544;
        }
        #statPanel .stat-row .stat-name {
            color: #aabbdd;
            font-size: 16px;
        }
        #statPanel .stat-row .stat-val {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
        }
        #statPanel .stat-row button {
            background: #2a3a5a;
            color: #6bcbff;
            border: 1px solid #6bcbff;
            border-radius: 30px;
            padding: 2px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        #statPanel .stat-row button:hover {
            background: #3a4a6a;
        }
        #statPanel .stat-row button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #statPanel .points-remaining {
            text-align: center;
            color: #44ff88;
            font-size: 20px;
            margin: 15px 0 10px 0;
            padding: 8px;
            background: #0a1a12;
            border-radius: 10px;
            border: 1px solid #44ff8844;
        }
        #statPanel .close-btn {
            display: block;
            margin: 15px auto 0 auto;
            background: #3a1a1a;
            color: #ff6666;
            border: 1px solid #ff6666;
            border-radius: 30px;
            padding: 6px 30px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        #statPanel .close-btn:hover {
            background: #4a2a2a;
        }
        #wrapper {
            position: relative;
        }
        @media (max-width: 760px) {
            #wrapper {
                padding: 10px;
            }
            canvas {
                width: 100%;
                height: auto;
            }
            #ui {
                font-size: 14px;
            }
            #hint {
                font-size: 11px;
                padding: 4px 12px;
            }
            #msgText {
                font-size: 28px;
            }
            #msgSub {
                font-size: 16px;
            }
            #uiLeft {
                gap: 12px;
            }
            #bossHpBar .bar {
                width: 80px;
            }
            #statPanel {
                padding: 20px;
                min-width: 260px;
            }
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <canvas id="gameCanvas" width="800" height="560"></canvas>
        <div id="msgOverlay">
            <div id="msgText">🎉<div id="msgSub"></div></div>
        </div>
        <div id="statPanel">
            <h2>📊 属性分配</h2>
            <div class="points-remaining" id="pointsRemaining">剩余点数: 0</div>
            <div class="stat-row">
                <span class="stat-name">❤️ 生命上限</span>
                <span class="stat-val" id="statHp">100</span>
                <button onclick="upgradeStat('maxHp')">+</button>
            </div>
            <div class="stat-row">
                <span class="stat-name">🏃 移动速度</span>
                <span class="stat-val" id="statSpeed">4.2</span>
                <button onclick="upgradeStat('speed')">+</button>
            </div>
            <div class="stat-row">
                <span class="stat-name">🦘 跳跃力</span>
                <span class="stat-val" id="statJump">10.8</span>
                <button onclick="upgradeStat('jumpPower')">+</button>
            </div>
            <div class="stat-row">
                <span class="stat-name">⚔️ 伤害加成</span>
                <span class="stat-val" id="statDamage">+0</span>
                <button onclick="upgradeStat('damageBonus')">+</button>
            </div>
            <div class="stat-row">
                <span class="stat-name">🔫 射速</span>
                <span class="stat-val" id="statFireRate">1.0</span>
                <button onclick="upgradeStat('fireRate')">+</button>
            </div>
            <button class="close-btn" onclick="toggleStatPanel()">✕ 关闭</button>
        </div>
        <div id="ui">
            <div id="uiLeft">
                <span><span class="label">❤️</span> <span id="hpDisplay">100</span></span>
                <span><span class="label">⭐</span> <span id="levelDisplay">Lv.1</span></span>
                <span><span class="label">🌍</span> <span id="worldDisplay">1-1-1</span></span>
                <span><span class="label">🔑</span> <span id="keyDisplay">0 / 0</span></span>
                <span><span class="label">🦘</span> <span id="jumpDisplay">3</span></span>
                <span><span class="label">⚔️</span> <span id="weaponDisplay">普通</span></span>
                <span id="skillDisplay">⏳ 技能: 就绪</span>
                <span id="bossNameDisplay" style="display:none;">👹 Boss</span>
                <button id="infiniteToggle">♾️ 无尽模式</button>
                <button id="statBtn">📊 属性 (F)</button>
                <span id="bossHpBar" style="display:none;">
                    👹 <span class="bar"><span class="fill" id="bossFill"></span></span>
                    <span id="bossHpText">30</span>
                </span>
            </div>
            <span id="hint">🖱️射击 &nbsp;|&nbsp; ← → 移动 &nbsp;|&nbsp; 空格跳 &nbsp;|&nbsp; Q切武器 &nbsp;|&nbsp; E技能 &nbsp;|&nbsp; F属性</span>
        </div>
    </div>

    <script>
        // ================================================================
        //  👻 暗影勇者 · 无尽恐怖版
        //  6种Boss随机出现、地图动态扩大、无尽模式每关不同
        // ================================================================

        // ---------- 配置 ----------
        const W = 800,
            H = 560;
        const GRAVITY = 0.55;
        const FRICTION = 0.80;

        // ---------- DOM ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hpSpan = document.getElementById('hpDisplay');
        const worldSpan = document.getElementById('worldDisplay');
        const keySpan = document.getElementById('keyDisplay');
        const jumpSpan = document.getElementById('jumpDisplay');
        const weaponSpan = document.getElementById('weaponDisplay');
        const skillSpan = document.getElementById('skillDisplay');
        const levelSpan = document.getElementById('levelDisplay');
        const bossHpBar = document.getElementById('bossHpBar');
        const bossFill = document.getElementById('bossFill');
        const bossHpText = document.getElementById('bossHpText');
        const bossNameDisplay = document.getElementById('bossNameDisplay');
        const msgOverlay = document.getElementById('msgOverlay');
        const msgText = document.getElementById('msgText');
        const msgSub = document.getElementById('msgSub');
        const infiniteBtn = document.getElementById('infiniteToggle');
        const statBtn = document.getElementById('statBtn');
        const statPanel = document.getElementById('statPanel');
        const pointsRemaining = document.getElementById('pointsRemaining');

        const WORLDS = [
            { name: '翡翠森林', bg1: '#1a3a2a', bg2: '#2a5a3a', plat: '#4a8a4a', scary: 0 },
            { name: '暗影沼泽', bg1: '#0a0a1a', bg2: '#1a0a2a', plat: '#2a1a3a', scary: 1 },
            { name: '地狱深渊', bg1: '#0a0000', bg2: '#1a0000', plat: '#3a0a0a', scary: 2 }
        ];

        const WEAPONS = [
            { name: '普通', damage: 1, speed: 9, color: '#6bcbff', spread: 1, icon: '🔫' },
            { name: '速射', damage: 1, speed: 14, color: '#ffaa44', spread: 1, icon: '⚡' },
            { name: '重炮', damage: 3, speed: 5, color: '#ff4444', spread: 1, icon: '💥' },
            { name: '散射', damage: 1, speed: 7, color: '#44ff88', spread: 3, icon: '🔱' }
        ];

        // ---------- 6种Boss定义 ----------
        const BOSS_TYPES = [{
            id: 'flesh',
            name: '腐肉聚合体',
            color: '#44aa44',
            eyeColor: '#88ff44',
            desc: '直线弹幕',
            hpMult: 1.0,
            speedMult: 0.6,
            attackPattern: 'linear'
        }, {
            id: 'banshee',
            name: '暗影女妖',
            color: '#aa44ff',
            eyeColor: '#cc88ff',
            desc: '散射+瞬移',
            hpMult: 0.8,
            speedMult: 1.4,
            attackPattern: 'spread'
        }, {
            id: 'watcher',
            name: '深渊守望者',
            color: '#ff4444',
            eyeColor: '#ff8844',
            desc: '环形+召唤',
            hpMult: 1.4,
            speedMult: 0.5,
            attackPattern: 'ring'
        }, {
            id: 'skeleton',
            name: '骸骨君王',
            color: '#dddddd',
            eyeColor: '#ff4444',
            desc: '追踪+冲刺',
            hpMult: 1.2,
            speedMult: 1.0,
            attackPattern: 'chase'
        }, {
            id: 'chaos',
            name: '混沌之卵',
            color: '#ff44aa',
            eyeColor: '#ff88cc',
            desc: '随机+分裂',
            hpMult: 0.9,
            speedMult: 0.8,
            attackPattern: 'random'
        }, {
            id: 'shadow',
            name: '终焉之影',
            color: '#222244',
            eyeColor: '#8844ff',
            desc: '全屏弹幕',
            hpMult: 1.6,
            speedMult: 1.2,
            attackPattern: 'omnidirectional'
        }];

        // ---------- 音频 ----------
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new(window.AudioContext || webkitAudioContext)(); } catch (e) {}
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                switch (type) {
                    case 'shoot':
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                        break;
                    case 'jump':
                        osc.frequency.setValueAtTime(300 + (game?.player?.jumpCount || 0) * 80, now);
                        gain.gain.setValueAtTime(0.10, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'kill':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;
                    case 'key':
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'damage':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                        gain.gain.setValueAtTime(0.35, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                    case 'heal':
                        osc.frequency.setValueAtTime(500, now);
                        osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'weapon':
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.25);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;
                    case 'death':
                        osc.frequency.setValueAtTime(100, now);
                        osc.frequency.exponentialRampToValueAtTime(15, now + 0.8);
                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                        osc.start(now);
                        osc.stop(now + 0.8);
                        break;
                    case 'boss_hit':
                        osc.frequency.setValueAtTime(60, now);
                        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        osc.start(now);
                        osc.stop(now + 0.15);
                        break;
                    case 'skill':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                        osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                        break;
                    case 'levelup':
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                        osc.start(now);
                        osc.stop(now + 0.35);
                        break;
                    case 'boss_spawn':
                        osc.frequency.setValueAtTime(100, now);
                        osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
                        osc.frequency.exponentialRampToValueAtTime(80, now + 0.6);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                        osc.start(now);
                        osc.stop(now + 0.6);
                        break;
                }
            } catch (e) {}
        }

        // ---------- 升级系统 ----------
        const STAT_CONFIG = {
            maxHp: { label: '生命上限', base: 100, cost: 2, inc: 10, min: 100 },
            speed: { label: '移动速度', base: 4.2, cost: 2, inc: 0.15, min: 3.0 },
            jumpPower: { label: '跳跃力', base: 10.8, cost: 2, inc: 0.3, min: 8.0 },
            damageBonus: { label: '伤害加成', base: 0, cost: 3, inc: 0.2, min: 0 },
            fireRate: { label: '射速', base: 1.0, cost: 3, inc: 0.08, min: 0.5 },
        };

        let statPoints = 0;
        let stats = {};
        let level = 1;
        let exp = 0;
        let expToNext = 20;

        function initStats() {
            stats = {};
            for (const key in STAT_CONFIG) {
                stats[key] = STAT_CONFIG[key].base;
            }
            statPoints = 0;
            level = 1;
            exp = 0;
            expToNext = 20;
            updateStatUI();
        }

        function addExp(amount) {
            exp += amount;
            while (exp >= expToNext) {
                exp -= expToNext;
                level++;
                expToNext = Math.floor(20 + level * 15);
                statPoints += 3;
                playSound('levelup');
                showMessage('⬆ 升级！', `等级 ${level}！获得 3 个属性点`);
                setTimeout(() => msgOverlay.classList.remove('show'), 1200);
                updateStatUI();
                updateUI();
            }
            updateStatUI();
            updateUI();
        }

        function upgradeStat(key) {
            if (statPoints <= 0) return;
            const cfg = STAT_CONFIG[key];
            if (!cfg) return;
            const cost = Math.floor(cfg.cost);
            if (statPoints < cost) return;
            statPoints -= cost;
            stats[key] += cfg.inc;
            updateStatUI();
            updateUI();
            applyStats();
        }

        function applyStats() {
            const p = game?.player;
            if (!p) return;
            p.maxHp = stats.maxHp;
            p.speed = stats.speed;
            p.jumpPower = -stats.jumpPower;
            updateUI();
        }

        function updateStatUI() {
            pointsRemaining.textContent = `剩余点数: ${statPoints}`;
            document.getElementById('statHp').textContent = stats.maxHp;
            document.getElementById('statSpeed').textContent = stats.speed.toFixed(2);
            document.getElementById('statJump').textContent = stats.jumpPower.toFixed(2);
            document.getElementById('statDamage').textContent = '+' + (stats.damageBonus * 100).toFixed(0) + '%';
            document.getElementById('statFireRate').textContent = stats.fireRate.toFixed(2);
            document.querySelectorAll('#statPanel .stat-row button').forEach(b => {
                b.disabled = statPoints <= 0;
            });
        }

        function toggleStatPanel() {
            if (statPanel.style.display === 'block') {
                statPanel.style.display = 'none';
            } else {
                statPanel.style.display = 'block';
                updateStatUI();
            }
        }
        window.upgradeStat = upgradeStat;
        window.toggleStatPanel = toggleStatPanel;

        // ---------- Boss选择器 ----------
        function selectRandomBoss(cycle) {
            // 根据轮次选择Boss，越往后越强
            let available = [...BOSS_TYPES];
            // 前3轮只出前3种
            if (cycle < 3) available = available.slice(0, 3);
            else if (cycle < 6) available = available.slice(0, 5);
            // 随机选一个
            const idx = Math.floor(Math.random() * available.length);
            return available[idx];
        }

        // ---------- 无尽地图生成器 ----------
        function generateInfiniteLevel(cycle, branch, level) {
            const platforms = [];
            const enemies = [];
            const keys = [];
            const items = [];
            const difficulty = cycle * 1.5 + branch + level;

            // 地图大小随轮次增长
            const widthScale = 1 + cycle * 0.08;
            const heightScale = 1 + cycle * 0.05;
            const platCount = 6 + Math.floor(difficulty * 0.8) + Math.floor(cycle * 0.5);

            // 地面
            platforms.push({ x: 0, y: 460, w: W, h: 40 });

            // 动态平台 - 高度和跨度随轮次增加
            const baseY = [420, 380, 340, 300, 260, 220, 180, 140, 100];
            for (let i = 0; i < platCount; i++) {
                const offset = (i * 73 + cycle * 137 + level * 53) % 120;
                let x = 40 + i * 70 + offset * 0.5;
                if (x > W - 100) x = W - 100 - (i * 13) % 80;
                const yIdx = i % baseY.length;
                let y = baseY[yIdx] - (i % 4) * 10 - cycle * 2;
                if (y < 60) y = 60;
                let w = 60 + ((i * 7 + cycle * 11 + level * 13) % 80) + cycle * 2;
                if (w > 160) w = 160;
                platforms.push({ x, y, w, h: 14 });
            }
            platforms.sort((a, b) => a.y - b.y);

            // 出口在最高处附近
            const lastPlat = platforms[platforms.length - 1];
            const exitX = lastPlat.x + lastPlat.w / 2 - 15;
            const exitY = lastPlat.y - 40;

            // 敌人 - 数量随轮次增加
            const enemyCount = 3 + Math.floor(difficulty * 0.5) + Math.floor(cycle * 0.7);
            for (let i = 0; i < enemyCount; i++) {
                let plat = platforms[1 + (i * 3 + cycle * 7) % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                let lv = Math.min(3, Math.floor((difficulty + i + cycle * 0.5) / 2));
                const size = 18 + lv * 5;
                const type = ['mushroom', 'ghost', 'bat', 'mushroom', 'ghost'][(i + cycle) % 5];
                enemies.push({
                    x: plat.x + 10 + i * 15,
                    y: plat.y - size,
                    w: size,
                    h: size,
                    type: type,
                    level: lv,
                    hp: 2 + lv + Math.floor(cycle * 0.3),
                    vx: (0.5 + lv * 0.2) * (i % 2 === 0 ? 1 : -1),
                    speed: 0.7 + lv * 0.2 + cycle * 0.02,
                    minX: plat.x + 3,
                    maxX: plat.x + plat.w - size - 3,
                    startY: plat.y - size,
                    damage: 10 + lv * 8 + Math.floor(cycle * 1.2),
                    hitFlash: 0,
                    aggroRange: 160 + lv * 40 + cycle * 8,
                    jumpTimer: 0,
                    expReward: 10 + lv * 4 + Math.floor(cycle * 1.5),
                });
            }

            // 钥匙
            const keyCount = 2 + Math.floor(difficulty / 3) + Math.floor(cycle * 0.3);
            const usedPlats = platforms.slice(1);
            for (let i = 0; i < Math.min(keyCount, usedPlats.length); i++) {
                const plat = usedPlats[i % usedPlats.length];
                keys.push({ x: plat.x + 12 + i * 18, y: plat.y - 28, collected: false, r: 9 });
            }
            while (keys.length < 2) {
                const plat = platforms[1 + keys.length % (platforms.length - 1)];
                keys.push({ x: plat.x + 30 + keys.length * 20, y: plat.y - 28, collected: false, r: 9 });
            }

            // 血包
            const healCount = 1 + Math.floor(difficulty / 4) + Math.floor(cycle * 0.2);
            for (let i = 0; i < Math.min(healCount, 5); i++) {
                let plat = platforms[1 + (i * 7 + cycle * 13) % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                items.push({
                    type: 'heal',
                    x: plat.x + 15 + i * 22,
                    y: plat.y - 30,
                    r: 12,
                    value: 20 + Math.floor(cycle * 2),
                });
            }

            // 武器
            if ((cycle + level + branch) % 2 === 1) {
                let plat = platforms[2 % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                const wIdx = Math.min(3, Math.floor(difficulty / 2) + 1);
                items.push({
                    type: 'weapon',
                    weaponIdx: wIdx,
                    x: plat.x + 30,
                    y: plat.y - 30,
                    r: 14,
                });
            }

            // ---- Boss：随机出现，每关都有 ----
            const bossType = selectRandomBoss(cycle);
            const bossPlat = platforms[Math.floor(platforms.length / 2)] || platforms[0];
            const baseHp = 40 + cycle * 25 + Math.floor(difficulty * 3);
            const bossHp = Math.floor(baseHp * bossType.hpMult);
            const boss = {
                x: bossPlat.x + bossPlat.w / 2 - 35,
                y: bossPlat.y - 75,
                w: 70,
                h: 75,
                hp: bossHp,
                maxHp: bossHp,
                timer: 0,
                bullets: [],
                hitCooldown: 0,
                expReward: 80 + cycle * 15,
                type: bossType,
                phase: 0,
                speed: 1.2 + cycle * 0.05,
                attackTimer: 0,
                spawnY: bossPlat.y - 75,
                teleportTimer: 0,
                spawnCount: 0,
                splitCount: 0,
                // 独特属性
                eyeAngle: 0,
                dashTimer: 0,
                dashDir: { x: 0, y: 0 },
            };

            // Boss关减少普通敌人
            enemies.splice(0, Math.floor(enemies.length / 3));

            return { platforms, enemies, keys, items, exit: { x: exitX, y: exitY, w: 30, h: 38 }, isBoss: true, boss };
        }

        // ---------- 游戏状态 ----------
        let game = {};

        function initGame() {
            initStats();
            game = {
                world: 0,
                branch: 0,
                level: 0,
                maxWorld: 3,
                maxBranch: 3,
                maxLevel: 3,
                infiniteMode: false,
                totalCycles: 0,
                hp: stats.maxHp,
                maxHp: stats.maxHp,
                keysCollected: 0,
                totalKeys: 0,
                running: true,
                levelComplete: false,
                gameOver: false,
                player: {
                    x: 40,
                    y: 400,
                    w: 24,
                    h: 30,
                    vx: 0,
                    vy: 0,
                    speed: stats.speed,
                    jumpPower: -stats.jumpPower,
                    onGround: false,
                    jumpCount: 0,
                    maxJumps: 3,
                    facing: 1,
                    invincible: 0,
                    weapon: 0,
                    trail: [],
                    maxHp: stats.maxHp,
                },
                platforms: [],
                enemies: [],
                keys: [],
                items: [],
                exit: { x: 680, y: 60, w: 30, h: 38 },
                keysPressed: { left: false, right: false, up: false },
                frame: 0,
                particles: [],
                bullets: [],
                boss: null,
                isBoss: false,
                totalKills: 0,
                screenShake: 0,
                skillCooldown: 0,
                skillActive: false,
                skillTimer: 0,
                skillMaxCooldown: 480,
                skillDuration: 90,
                bossSpawned: false,
                currentBossType: null,
            };
            loadLevel(0, 0, 0);
            updateUI();
            msgOverlay.classList.remove('show');
            game.running = true;
            game.gameOver = false;
            bossHpBar.style.display = 'none';
            bossNameDisplay.style.display = 'none';
            applyStats();
        }

        function loadLevel(w, b, l) {
            let worldIdx = w;
            let branchIdx = b;
            let levelIdx = l;
            const cycle = game.totalCycles;
            const isInfinite = game.infiniteMode;

            let data;
            if (isInfinite) {
                // 无尽模式：每关不同，地图变大
                data = generateInfiniteLevel(cycle, branchIdx, levelIdx);
                // 显示Boss名字
                if (data.boss) {
                    bossNameDisplay.style.display = 'inline';
                    bossNameDisplay.textContent = '👹 ' + data.boss.type.name;
                    bossNameDisplay.style.color = data.boss.type.color;
                }
            } else {
                // 普通模式：用原来的生成器
                data = generateNormalLevel(worldIdx % 3, branchIdx, levelIdx, cycle * 0.5);
            }

            game.platforms = data.platforms;
            game.enemies = data.enemies.map(e => ({ ...e, hitFlash: 0 }));
            game.keys = data.keys.map(k => ({ ...k, collected: false }));
            game.items = data.items.map(i => ({ ...i }));
            game.exit = data.exit;
            game.totalKeys = game.keys.length;
            game.keysCollected = 0;
            game.levelComplete = false;
            game.bullets = [];
            game.isBoss = data.isBoss || false;
            game.boss = data.boss ? { ...data.boss, bullets: [], hitCooldown: 0, timer: 0, teleportTimer: 0, dashTimer: 0,
                splitCount: 0 } : null;
            game.screenShake = 0;
            game.bossSpawned = false;

            if (game.boss) {
                game.currentBossType = game.boss.type;
            }

            const displayW = isInfinite ? (cycle * 3 + worldIdx + 1) : (worldIdx + 1);
            game.displayWorld = displayW;
            game.displayBranch = branchIdx + 1;
            game.displayLevel = levelIdx + 1;

            const p = game.player;
            p.x = 40;
            p.y = 400;
            p.vx = 0;
            p.vy = 0;
            p.onGround = false;
            p.jumpCount = 0;
            p.invincible = 0;
            p.trail = [];
            p.speed = stats.speed;
            p.jumpPower = -stats.jumpPower;
            p.maxHp = stats.maxHp;
            if (game.hp > p.maxHp) game.hp = p.maxHp;

            if (game.isBoss && game.boss) {
                bossHpBar.style.display = 'flex';
                bossNameDisplay.style.display = 'inline';
                updateBossUI();
                playSound('boss_spawn');
                showMessage('👹 ' + game.boss.type.name + ' 出现！', '击败它获得大量经验！');
                setTimeout(() => msgOverlay.classList.remove('show'), 1500);
            } else {
                bossHpBar.style.display = 'none';
                bossNameDisplay.style.display = 'none';
            }
            updateUI();
        }

        // 普通模式生成器（保留原有风格）
        function generateNormalLevel(worldIdx, branchIdx, levelIdx, cycleOffset = 0) {
            const idx = worldIdx * 9 + branchIdx * 3 + levelIdx;
            const difficulty = worldIdx + branchIdx + levelIdx + cycleOffset * 0.5;
            const platforms = [];
            const enemies = [];
            const keys = [];
            const items = [];

            platforms.push({ x: 0, y: 460, w: W, h: 40 });

            const platCount = 5 + Math.floor(difficulty / 2);
            const baseY = [420, 380, 340, 300, 260, 220, 180];
            for (let i = 0; i < platCount; i++) {
                let x = 60 + i * 70 + (idx * 13) % 120;
                if (x > W - 100) x = W - 100;
                let y = baseY[i % baseY.length] - (i % 3) * 15;
                let w = 70 + (i * 7 + idx) % 50;
                platforms.push({ x, y, w, h: 14 });
            }
            platforms.sort((a, b) => a.y - b.y);

            const lastPlat = platforms[platforms.length - 1];
            const exitX = lastPlat.x + lastPlat.w / 2 - 15;
            const exitY = lastPlat.y - 40;

            const enemyCount = 3 + Math.floor(difficulty * 0.6);
            for (let i = 0; i < enemyCount; i++) {
                let plat = platforms[1 + (i * 3) % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                let lv = Math.min(2, Math.floor((difficulty + i) / 3));
                const size = 20 + lv * 6;
                const type = (worldIdx === 0) ? 'mushroom' : (worldIdx === 1) ? 'ghost' : 'bat';
                enemies.push({
                    x: plat.x + 10 + i * 20,
                    y: plat.y - size,
                    w: size,
                    h: size,
                    type: type,
                    level: lv,
                    hp: 2 + lv,
                    vx: (0.6 + lv * 0.2) * (i % 2 === 0 ? 1 : -1),
                    speed: 0.8 + lv * 0.2 + worldIdx * 0.05,
                    minX: plat.x + 5,
                    maxX: plat.x + plat.w - size - 5,
                    startY: plat.y - size,
                    damage: 10 + lv * 10,
                    hitFlash: 0,
                    aggroRange: 150 + lv * 50,
                    jumpTimer: 0,
                    expReward: 10 + lv * 5,
                });
            }

            const keyCount = 2 + Math.floor(difficulty / 2);
            const usedPlats = platforms.slice(1);
            for (let i = 0; i < Math.min(keyCount, usedPlats.length); i++) {
                const plat = usedPlats[i % usedPlats.length];
                keys.push({ x: plat.x + 15 + i * 20, y: plat.y - 28, collected: false, r: 9 });
            }
            while (keys.length < 2) {
                const plat = platforms[1 + keys.length % (platforms.length - 1)];
                keys.push({ x: plat.x + 30 + keys.length * 20, y: plat.y - 28, collected: false, r: 9 });
            }

            const healCount = 1 + Math.floor(difficulty / 3);
            for (let i = 0; i < healCount; i++) {
                let plat = platforms[1 + (i * 7 + idx) % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                items.push({
                    type: 'heal',
                    x: plat.x + 20 + i * 25,
                    y: plat.y - 30,
                    r: 12,
                    value: 20,
                });
            }
            if ((idx % 2 === 1) && difficulty > 0) {
                let plat = platforms[2 % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                const wIdx = Math.min(3, Math.floor(difficulty / 2) + 1);
                items.push({
                    type: 'weapon',
                    weaponIdx: wIdx,
                    x: plat.x + 30,
                    y: plat.y - 30,
                    r: 14,
                });
            }

            let isBoss = (branchIdx === 2 && levelIdx === 2);
            let boss = null;
            if (isBoss) {
                const bossPlat = platforms[Math.floor(platforms.length / 2)] || platforms[0];
                const bossHp = 40 + worldIdx * 20 + Math.floor(cycleOffset * 15);
                const bossType = BOSS_TYPES[worldIdx % BOSS_TYPES.length];
                boss = {
                    x: bossPlat.x + bossPlat.w / 2 - 30,
                    y: bossPlat.y - 70,
                    w: 60,
                    h: 70,
                    hp: Math.floor(bossHp * bossType.hpMult),
                    maxHp: Math.floor(bossHp * bossType.hpMult),
                    timer: 0,
                    bullets: [],
                    hitCooldown: 0,
                    expReward: 50 + worldIdx * 20,
                    type: bossType,
                    phase: 0,
                    speed: 1.0,
                };
                enemies.splice(0, Math.floor(enemies.length / 2));
            }

            return { platforms, enemies, keys, items, exit: { x: exitX, y: exitY, w: 30, h: 38 }, isBoss, boss };
        }

        // ---------- 更新UI ----------
        function updateUI() {
            hpSpan.textContent = Math.ceil(game.hp);
            const w = game.displayWorld || (game.world + 1);
            const b = game.displayBranch || (game.branch + 1);
            const l = game.displayLevel || (game.level + 1);
            worldSpan.textContent = `${w}-${b}-${l}`;
            keySpan.textContent = `${game.keysCollected} / ${game.totalKeys}`;
            const rem = Math.max(0, game.player.maxJumps - game.player.jumpCount);
            jumpSpan.textContent = rem;
            weaponSpan.textContent = WEAPONS[game.player.weapon].icon + ' ' + WEAPONS[game.player.weapon].name;
            levelSpan.textContent = `Lv.${level}`;

            if (game.skillCooldown > 0) {
                const cdSec = Math.ceil(game.skillCooldown / 60);
                skillSpan.textContent = `⏳ 技能: ${cdSec}s`;
                skillSpan.style.color = '#ff6666';
            } else if (game.skillActive) {
                skillSpan.textContent = `⏳ 技能: 激活中`;
                skillSpan.style.color = '#44ff88';
            } else {
                skillSpan.textContent = `⏳ 技能: 就绪`;
                skillSpan.style.color = '#44ff88';
            }
            updateStatUI();
        }

        function updateBossUI() {
            if (!game.boss) return;
            const pct = Math.max(0, (game.boss.hp / game.boss.maxHp) * 100);
            bossFill.style.width = pct + '%';
            bossHpText.textContent = Math.ceil(game.boss.hp);
            if (game.boss.type) {
                bossNameDisplay.textContent = '👹 ' + game.boss.type.name;
                bossNameDisplay.style.color = game.boss.type.color;
            }
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        // ---------- 粒子 ----------
        function spawnParticles(x, y, color, count = 12, speedMult = 1) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (1 + Math.random() * 3) * speedMult;
                game.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 30 + Math.random() * 30,
                    maxLife: 60,
                    color,
                    size: 3 + Math.random() * 5,
                });
            }
        }

        function spawnBlood(x, y, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 5;
                game.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 40 + Math.random() * 40,
                    maxLife: 80,
                    color: Math.random() > 0.5 ? '#8b0000' : '#cc0000',
                    size: 2 + Math.random() * 6,
                });
            }
        }

        function updateParticles() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06;
                p.life--;
                if (p.life <= 0) game.particles.splice(i, 1);
            }
            if (game.particles.length > 500) game.particles.splice(0, 150);
        }

        // ---------- 射击 ----------
        let lastShootTime = 0;
        let shootSoundCooldown = 0;

        function shootBullet(targetX, targetY) {
            const now = performance.now();
            const fireRate = Math.max(0.3, 1.0 / stats.fireRate);
            const coolDownMs = 70 * fireRate;
            if (now - lastShootTime < coolDownMs) return;
            lastShootTime = now;

            if (!game.running || game.gameOver || game.levelComplete) return;
            const p = game.player;
            const cx = p.x + p.w / 2;
            const cy = p.y + p.h / 2;
            const dx = targetX - cx;
            const dy = targetY - cy;
            const len = Math.hypot(dx, dy);
            if (len < 10) return;
            const weapon = WEAPONS[p.weapon];
            const count = weapon.spread || 1;
            const damageBonus = 1 + stats.damageBonus;
            for (let i = 0; i < count; i++) {
                const angle = Math.atan2(dy, dx) + (i - (count - 1) / 2) * 0.25;
                const speed = game.skillActive ? weapon.speed * 0.4 : weapon.speed;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                game.bullets.push({
                    x: cx,
                    y: cy,
                    vx: vx,
                    vy: vy,
                    r: 5,
                    life: 130,
                    damage: Math.ceil(weapon.damage * damageBonus),
                    color: weapon.color,
                });
            }
            spawnParticles(cx, cy, weapon.color, 4);
            if (now - shootSoundCooldown > 100) {
                playSound('shoot');
                shootSoundCooldown = now;
            }
        }

        // ---------- 技能 ----------
        function activateSkill() {
            if (game.skillCooldown > 0 || game.skillActive) return;
            game.skillActive = true;
            game.skillTimer = game.skillDuration;
            playSound('skill');
            spawnParticles(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, '#44ff88', 30, 2);
        }

        // ---------- 玩家更新 ----------
        function updatePlayer() {
            const p = game.player;
            const keys = game.keysPressed;

            if (p.invincible > 0) p.invincible--;

            if (game.skillActive) {
                game.skillTimer--;
                if (game.skillTimer <= 0) {
                    game.skillActive = false;
                    game.skillCooldown = game.skillMaxCooldown;
                }
            }
            if (game.skillCooldown > 0) {
                game.skillCooldown--;
            }

            if (keys.left) { p.vx = -p.speed;
                p.facing = -1; } else if (keys.right) { p.vx = p.speed;
                p.facing = 1; } else { p.vx *= FRICTION; if (Math.abs(p.vx) < 0.1) p.vx = 0; }

            if (keys.up) {
                if (p.jumpCount < p.maxJumps) {
                    const power = p.jumpCount === 0 ? p.jumpPower : p.jumpPower * (0.85 - p.jumpCount * 0.06);
                    p.vy = power;
                    p.jumpCount++;
                    p.onGround = false;
                    spawnParticles(p.x + p.w / 2, p.y + p.h, '#9b6bff', 6);
                    playSound('jump');
                    game.keysPressed.up = false;
                }
            }

            p.vy += GRAVITY;
            if (p.vy > 13) p.vy = 13;

            p.x += p.vx;
            if (p.x < 0) p.x = 0;
            if (p.x + p.w > W) p.x = W - p.w;

            p.y += p.vy;
            p.onGround = false;
            for (const plat of game.platforms) {
                if (rectCollide(p, plat)) {
                    if (p.vy > 0) {
                        p.y = plat.y - p.h;
                        p.vy = 0;
                        p.onGround = true;
                        p.jumpCount = 0;
                    } else if (p.vy < 0) {
                        p.y = plat.y + plat.h;
                        p.vy = 0;
                    }
                }
            }
            if (p.y > H + 50) { takeDamage(50); return; }

            if (game.frame % 2 === 0) {
                p.trail.push({ x: p.x, y: p.y, life: 20 });
                if (p.trail.length > 15) p.trail.shift();
            }
            for (let i = p.trail.length - 1; i >= 0; i--) {
                p.trail[i].life--;
                if (p.trail[i].life <= 0) p.trail.splice(i, 1);
            }

            for (const key of game.keys) {
                if (key.collected) continue;
                if (dist(p.x + p.w / 2, p.y + p.h / 2, key.x, key.y) < 26) {
                    key.collected = true;
                    game.keysCollected++;
                    spawnParticles(key.x, key.y, '#f7d44a', 20);
                    playSound('key');
                    addExp(5);
                    updateUI();
                }
            }

            for (let i = game.items.length - 1; i >= 0; i--) {
                const item = game.items[i];
                if (dist(p.x + p.w / 2, p.y + p.h / 2, item.x, item.y) < 25) {
                    if (item.type === 'heal') {
                        game.hp = Math.min(game.player.maxHp, game.hp + item.value);
                        spawnParticles(item.x, item.y, '#44ff88', 15);
                        playSound('heal');
                        addExp(5);
                        game.items.splice(i, 1);
                        updateUI();
                    } else if (item.type === 'weapon') {
                        p.weapon = item.weaponIdx;
                        spawnParticles(item.x, item.y, '#ffaa44', 20);
                        playSound('weapon');
                        addExp(10);
                        game.items.splice(i, 1);
                        updateUI();
                    }
                }
            }

            if (game.keysCollected >= game.totalKeys) {
                if (rectCollide(p, game.exit)) {
                    game.levelComplete = true;
                    addExp(50 + game.totalCycles * 10);
                    let nw = game.world,
                        nb = game.branch,
                        nl = game.level + 1;
                    if (nl >= game.maxLevel) {
                        nl = 0;
                        nb++;
                        if (nb >= game.maxBranch) {
                            nb = 0;
                            nw++;
                            if (nw >= game.maxWorld) {
                                if (game.infiniteMode) {
                                    nw = 0;
                                    game.totalCycles++;
                                    // 无尽模式下每关重置分支和关卡，但保留轮次
                                    showMessage('♾️ 无尽轮回', `第 ${game.totalCycles} 轮 · 难度提升！`);
                                    // 重新加载无尽地图
                                    setTimeout(() => {
                                        msgOverlay.classList.remove('show');
                                        game.world = 0;
                                        game.branch = 0;
                                        game.level = 0;
                                        loadLevel(0, 0, 0);
                                        game.levelComplete = false;
                                        updateUI();
                                    }, 1500);
                                    return;
                                } else {
                                    game.running = false;
                                    showMessage('🏆 通关！', '按空格开启无尽模式继续挑战');
                                    return;
                                }
                            }
                        }
                    }
                    const displayW = game.infiniteMode ? (game.totalCycles * 3 + nw + 1) : (nw + 1);
                    showMessage('🎉 过关！', `进入 ${displayW}-${nb+1}-${nl+1}`);
                    setTimeout(() => {
                        msgOverlay.classList.remove('show');
                        game.world = nw;
                        game.branch = nb;
                        game.level = nl;
                        loadLevel(nw, nb, nl);
                        game.levelComplete = false;
                        updateUI();
                    }, 1200);
                }
            }

            // 敌人碰撞
            for (const e of game.enemies) {
                if (e.y > H + 50) continue;
                if (rectCollide(p, e)) {
                    if (p.vy > 0 && p.y + p.h - e.y < 20) {
                        e.y = H + 100;
                        p.vy = p.jumpPower * 0.6;
                        p.jumpCount = 0;
                        spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 30);
                        playSound('kill');
                        game.totalKills++;
                        addExp(e.expReward || 10);
                        if (Math.random() < 0.2) {
                            game.items.push({ type: 'heal', x: e.x + e.w / 2, y: e.y - 30, r: 12, value: 20 + Math.floor(game
                                    .totalCycles * 2) });
                        }
                    } else if (p.invincible <= 0) {
                        takeDamage(e.damage || 10);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
            }

            // Boss
            if (game.isBoss && game.boss && game.boss.hp > 0) {
                const b = game.boss;
                if (rectCollide(p, b)) {
                    if (p.vy > 0 && p.y + p.h - b.y < 30) {
                        b.hp -= 2 + Math.floor(stats.damageBonus);
                        b.hitCooldown = 15;
                        p.vy = p.jumpPower * 0.6;
                        p.jumpCount = 0;
                        spawnBlood(b.x + b.w / 2, b.y + 10, 30);
                        playSound('boss_hit');
                        game.screenShake = 10;
                        updateBossUI();
                        if (b.hp <= 0) bossDefeated();
                    } else if (p.invincible <= 0) {
                        takeDamage(25 + Math.floor(game.totalCycles * 0.5));
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
                updateBossAI();
            }

            // 子弹
            const timeScale = game.skillActive ? 0.6 : 1.0;
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const bull = game.bullets[i];
                bull.x += bull.vx * timeScale;
                bull.y += bull.vy * timeScale;
                bull.life--;
                if (bull.x < -20 || bull.x > W + 20 || bull.y < -20 || bull.y > H + 20 || bull.life <= 0) {
                    game.bullets.splice(i, 1);
                    continue;
                }
                let hit = false;
                for (const e of game.enemies) {
                    if (e.y > H + 50) continue;
                    if (dist(bull.x, bull.y, e.x + e.w / 2, e.y + e.h / 2) < bull.r + 12) {
                        e.hp -= bull.damage;
                        if (e.hp <= 0) {
                            e.y = H + 100;
                            spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                            playSound('kill');
                            game.totalKills++;
                            addExp(e.expReward || 10);
                            if (Math.random() < 0.15) {
                                game.items.push({ type: 'heal', x: e.x + e.w / 2, y: e.y - 30, r: 12, value: 20 + Math.floor(
                                        game.totalCycles * 2) });
                            }
                        } else {
                            e.hitFlash = 10;
                            spawnParticles(bull.x, bull.y, '#ffaa44', 5);
                        }
                        hit = true;
                        break;
                    }
                }
                if (!hit && game.isBoss && game.boss && game.boss.hp > 0) {
                    const b = game.boss;
                    if (bull.x > b.x && bull.x < b.x + b.w && bull.y > b.y && bull.y < b.y + b.h) {
                        b.hp -= bull.damage;
                        b.hitCooldown = 10;
                        spawnBlood(bull.x, bull.y, 10);
                        playSound('boss_hit');
                        game.screenShake = 6;
                        updateBossUI();
                        hit = true;
                        if (b.hp <= 0) bossDefeated();
                    }
                }
                if (hit) game.bullets.splice(i, 1);
            }

            const enemyTimeScale = game.skillActive ? 0.4 : 1.0;
            updateEnemies(enemyTimeScale);
            updateParticles();
            updateUI();
        }

        // ---------- 敌人AI ----------
        function updateEnemies(timeScale = 1.0) {
            const p = game.player;
            for (const e of game.enemies) {
                if (e.y > H + 50) continue;
                const dx = p.x + p.w / 2 - (e.x + e.w / 2);
                const dy = p.y + p.h / 2 - (e.y + e.h / 2);
                const d = Math.hypot(dx, dy);
                if (d < e.aggroRange && d > 20) {
                    e.x += Math.sign(dx) * e.speed * 0.6 * timeScale;
                    if (e.level >= 1 && Math.random() < 0.01 * timeScale) e.y -= 4 * timeScale;
                    if (e.x < 0) e.x = 0;
                    if (e.x > W - e.w) e.x = W - e.w;
                } else {
                    e.x += e.vx * e.speed * timeScale;
                    if (e.x < e.minX || e.x > e.maxX) e.vx *= -1;
                }
                if (e.type === 'bat') e.y += Math.sin(game.frame * 0.05 + e.x) * 0.4 * timeScale;
                else if (e.type === 'ghost') e.y = e.startY + Math.sin(game.frame * 0.04 + e.x * 0.1) * 10 * timeScale;
                if (e.hitFlash > 0) e.hitFlash--;
            }
        }

        // ---------- Boss AI (6种模式) ----------
        function updateBossAI() {
            const b = game.boss;
            if (!b || b.hp <= 0) return;
            const p = game.player;
            const dx = p.x + p.w / 2 - (b.x + b.w / 2);
            const dy = p.y + p.h / 2 - (b.y + b.h / 2);
            const d = Math.hypot(dx, dy);
            const timeScale = game.skillActive ? 0.5 : 1.0;
            const pattern = b.type.attackPattern;

            // Boss移动
            if (pattern === 'chase') {
                // 骸骨君王：追踪+冲刺
                if (b.dashTimer > 0) {
                    b.dashTimer -= timeScale;
                    b.x += b.dashDir.x * 4 * timeScale;
                    b.y += b.dashDir.y * 4 * timeScale;
                } else {
                    if (d > 120) {
                        b.x += Math.sign(dx) * 1.2 * timeScale;
                        b.y += Math.sign(dy) * 0.8 * timeScale;
                    } else if (d < 80 && Math.random() < 0.02 * timeScale) {
                        // 冲刺
                        b.dashTimer = 20;
                        b.dashDir = { x: Math.sign(dx), y: Math.sign(dy) };
                    }
                }
            } else if (pattern === 'teleport') {
                // 暗影女妖：瞬移
                b.teleportTimer -= timeScale;
                if (b.teleportTimer <= 0) {
                    if (Math.random() < 0.02 * timeScale) {
                        // 瞬移到玩家附近
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 100 + Math.random() * 150;
                        b.x = p.x + p.w / 2 + Math.cos(angle) * dist - b.w / 2;
                        b.y = p.y + p.h / 2 + Math.sin(angle) * dist - b.h / 2;
                        b.x = Math.max(20, Math.min(W - b.w - 20, b.x));
                        b.y = Math.max(50, Math.min(380, b.y));
                        b.teleportTimer = 60 + Math.random() * 60;
                        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#aa44ff', 20, 2);
                    }
                }
            } else {
                // 其他Boss：缓慢移动
                if (d > 150) {
                    b.x += Math.sign(dx) * 0.6 * timeScale;
                    b.y += Math.sign(dy) * 0.4 * timeScale;
                } else if (d < 80) {
                    b.x -= Math.sign(dx) * 0.4 * timeScale;
                    b.y -= Math.sign(dy) * 0.3 * timeScale;
                }
            }

            // 边界
            b.x = Math.max(20, Math.min(W - b.w - 20, b.x));
            b.y = Math.max(50, Math.min(380, b.y));

            // 攻击
            b.timer++;
            let fireRate = Math.max(15, 40 - Math.floor((b.maxHp - b.hp) / 4) - Math.floor(game.totalCycles * 0.5));
            if (fireRate < 10) fireRate = 10;

            if (b.timer > fireRate / timeScale) {
                b.timer = 0;
                const angle = Math.atan2(dy, dx);
                const baseSpeed = (2.5 + (1 - b.hp / b.maxHp) * 1.8 + game.totalCycles * 0.08) * timeScale;

                switch (pattern) {
                    case 'linear':
                        // 腐肉聚合体：直线弹幕
                        for (let i = -1; i <= 1; i++) {
                            const a = angle + i * 0.15;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * baseSpeed,
                                vy: Math.sin(a) * baseSpeed,
                                r: 8,
                                color: '#44ff44'
                            });
                        }
                        break;

                    case 'spread':
                        // 暗影女妖：散射
                        for (let i = -3; i <= 3; i++) {
                            const a = angle + i * 0.2;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * baseSpeed * 0.8,
                                vy: Math.sin(a) * baseSpeed * 0.8,
                                r: 6,
                                color: '#cc88ff'
                            });
                        }
                        break;

                    case 'ring':
                        // 深渊守望者：环形
                        for (let i = 0; i < 8 + Math.floor(game.totalCycles * 0.3); i++) {
                            const a = (i / 8) * Math.PI * 2 + game.frame * 0.02;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * baseSpeed * 0.6,
                                vy: Math.sin(a) * baseSpeed * 0.6,
                                r: 7,
                                color: '#ff8844'
                            });
                        }
                        // 召唤小怪
                        if (b.hp < b.maxHp * 0.5 && Math.random() < 0.1) {
                            const spawnX = b.x + Math.random() * b.w;
                            const spawnY = b.y + b.h + 10;
                            game.enemies.push({
                                x: spawnX,
                                y: spawnY,
                                w: 20,
                                h: 20,
                                type: 'ghost',
                                level: 1,
                                hp: 3 + Math.floor(game.totalCycles * 0.3),
                                vx: (Math.random() - 0.5) * 2,
                                speed: 1.0 + game.totalCycles * 0.05,
                                minX: 0,
                                maxX: W,
                                startY: spawnY,
                                damage: 10 + Math.floor(game.totalCycles * 0.5),
                                hitFlash: 0,
                                aggroRange: 200,
                                jumpTimer: 0,
                                expReward: 5 + Math.floor(game.totalCycles * 0.5),
                            });
                        }
                        break;

                    case 'chase':
                        // 骸骨君王：追踪弹幕
                        for (let i = -2; i <= 2; i++) {
                            const a = angle + i * 0.25;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * baseSpeed * 0.9,
                                vy: Math.sin(a) * baseSpeed * 0.9,
                                r: 9,
                                color: '#ff4444'
                            });
                        }
                        break;

                    case 'random':
                        // 混沌之卵：随机弹幕
                        for (let i = 0; i < 5 + Math.floor(game.totalCycles * 0.2); i++) {
                            const a = Math.random() * Math.PI * 2;
                            const speed = baseSpeed * (0.5 + Math.random() * 0.8);
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed,
                                vy: Math.sin(a) * speed,
                                r: 5 + Math.random() * 4,
                                color: '#ff88cc'
                            });
                        }
                        // 分裂
                        if (b.hp < b.maxHp * 0.4 && b.splitCount < 3) {
                            b.splitCount++;
                            // 生成小分身
                            for (let i = 0; i < 2; i++) {
                                const angle2 = Math.random() * Math.PI * 2;
                                const dist2 = 40 + Math.random() * 30;
                                const cx = b.x + b.w / 2 + Math.cos(angle2) * dist2;
                                const cy = b.y + b.h / 2 + Math.sin(angle2) * dist2;
                                game.enemies.push({
                                    x: cx - 12,
                                    y: cy - 12,
                                    w: 24,
                                    h: 24,
                                    type: 'mushroom',
                                    level: 2,
                                    hp: 5 + Math.floor(game.totalCycles * 0.5),
                                    vx: (Math.random() - 0.5) * 3,
                                    speed: 1.5 + game.totalCycles * 0.05,
                                    minX: 0,
                                    maxX: W,
                                    startY: cy - 12,
                                    damage: 15 + Math.floor(game.totalCycles * 0.5),
                                    hitFlash: 0,
                                    aggroRange: 200,
                                    jumpTimer: 0,
                                    expReward: 8 + Math.floor(game.totalCycles * 0.5),
                                });
                            }
                        }
                        break;

                    case 'omnidirectional':
                        // 终焉之影：全屏弹幕
                        for (let i = 0; i < 12 + Math.floor(game.totalCycles * 0.5); i++) {
                            const a = (i / 12) * Math.PI * 2 + game.frame * 0.015;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * baseSpeed * 0.7,
                                vy: Math.sin(a) * baseSpeed * 0.7,
                                r: 6,
                                color: '#8844ff'
                            });
                        }
                        break;
                }
            }

            // 更新Boss子弹
            for (let i = b.bullets.length - 1; i >= 0; i--) {
                const bull = b.bullets[i];
                bull.x += bull.vx;
                bull.y += bull.vy;
                if (bull.x < -30 || bull.x > W + 30 || bull.y < -30 || bull.y > H + 30) {
                    b.bullets.splice(i, 1);
                    continue;
                }
                // 玩家碰撞
                if (dist(p.x + p.w / 2, p.y + p.h / 2, bull.x, bull.y) < bull.r + 12) {
                    if (p.invincible <= 0) {
                        takeDamage(15 + Math.floor(game.totalCycles * 0.3));
                        b.bullets.splice(i, 1);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
            }
            if (b.hitCooldown > 0) b.hitCooldown--;
        }

        function bossDefeated() {
            const b = game.boss;
            spawnBlood(b.x + b.w / 2, b.y + b.h / 2, 100);
            spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ff8833', 60, 2);
            game.screenShake = 25;
            playSound('death');
            const expReward = (b.expReward || 80) + game.totalCycles * 15;
            addExp(expReward);
            game.boss = null;
            game.isBoss = false;

            // 大量奖励
            game.items.push({ type: 'heal', x: b.x + 10, y: b.y + 10, r: 12, value: 60 + game.totalCycles * 5 });
            game.items.push({ type: 'heal', x: b.x + b.w - 30, y: b.y + 10, r: 12, value: 60 + game.totalCycles * 5 });
            game.items.push({ type: 'weapon', weaponIdx: 3, x: b.x + b.w / 2 - 10, y: b.y + b.h + 10, r: 14 });

            showMessage('💀 ' + b.type.name + ' 被击败！', '获得 ' + expReward + ' 经验！');
            setTimeout(() => {
                msgOverlay.classList.remove('show');
                // 自动收集奖励
                const p = game.player;
                for (const item of game.items) {
                    if (dist(p.x + p.w / 2, p.y + p.h / 2, item.x, item.y) < 60) {
                        if (item.type === 'heal') {
                            game.hp = Math.min(game.player.maxHp, game.hp + item.value);
                            spawnParticles(item.x, item.y, '#44ff88', 10);
                            playSound('heal');
                            game.items = game.items.filter(it => it !== item);
                        } else if (item.type === 'weapon') {
                            p.weapon = item.weaponIdx;
                            spawnParticles(item.x, item.y, '#ffaa44', 15);
                            playSound('weapon');
                            game.items = game.items.filter(it => it !== item);
                        }
                    }
                }
                updateUI();
            }, 2000);

            bossHpBar.style.display = 'none';
            bossNameDisplay.style.display = 'none';
            updateUI();
        }

        // ---------- 伤害/死亡 ----------
        function takeDamage(amount) {
            if (game.player.invincible > 0) return;
            game.hp -= amount;
            game.player.invincible = 30;
            game.screenShake = 8;
            playSound('damage');
            spawnBlood(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, 25);
            if (game.hp <= 0) { game.hp = 0;
                gameOver(); }
            updateUI();
        }

        function gameOver() {
            game.running = false;
            game.gameOver = true;
            playSound('death');
            showMessage('💀 死亡', `在无尽第 ${game.totalCycles+1} 轮倒下\n按 空格键 重新开始`);
        }

        function showMessage(title, sub = '') {
            msgText.innerHTML = `${title}<div id="msgSub">${sub}</div>`;
            msgOverlay.classList.add('show');
        }

        // ---------- 绘制 ----------
        function draw() {
            const w = game.world;
            const theme = WORLDS[w % WORLDS.length] || WORLDS[0];
            const scary = theme.scary;

            ctx.clearRect(0, 0, W, H);

            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, theme.bg1);
            grad.addColorStop(1, theme.bg2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // 恐怖特效
            if (scary >= 1 || game.infiniteMode) {
                const fog = ctx.createRadialGradient(W / 2, H / 2, 30, W / 2, H / 2, 500);
                fog.addColorStop(0, 'rgba(0,0,0,0)');
                fog.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = fog;
                ctx.fillRect(0, 0, W, H);

                const ghostCount = 20 + (game.infiniteMode ? game.totalCycles * 3 : 0);
                for (let i = 0; i < Math.min(ghostCount, 60); i++) {
                    const x = (i * 37 + game.frame * 0.08) % W;
                    const y = (i * 29 + Math.sin(i + game.frame * 0.01) * 20) % H;
                    const alpha = 0.04 + Math.sin(game.frame * 0.02 + i) * 0.02;
                    ctx.shadowColor = '#6b3aff';
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = `rgba(120,80,255,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 4 + Math.sin(game.frame * 0.03 + i) * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;

                if (scary >= 2 || game.infiniteMode) {
                    ctx.fillStyle = 'rgba(120,60,60,0.08)';
                    ctx.font = '34px sans-serif';
                    ctx.fillText('💀', 30, 55);
                    ctx.fillText('💀', W - 70, 45);
                    ctx.fillText('💀', W / 2 - 20, 30);
                }
            }

            // 平台
            for (const plat of game.platforms) {
                const platColor = game.infiniteMode ? `hsl(${240 + game.totalCycles * 5}, 30%, ${20 + game.totalCycles * 0.5}%)` :
                    theme.plat;
                ctx.fillStyle = platColor;
                ctx.shadowColor = scary >= 2 || game.infiniteMode ? '#ff333355' : 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.05)';
                ctx.beginPath();
                ctx.roundRect(plat.x + 4, plat.y - 1, plat.w - 8, 3, 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 出口
            const ex = game.exit.x,
                ey = game.exit.y;
            const canEnter = game.keysCollected >= game.totalKeys;
            ctx.shadowColor = canEnter ? '#6bcbff' : '#445566';
            ctx.shadowBlur = 40;
            ctx.fillStyle = canEnter ? 'rgba(100,200,255,0.3)' : 'rgba(50,50,80,0.2)';
            ctx.beginPath();
            ctx.arc(ex + 15, ey + 19, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = canEnter ? 35 : 10;
            ctx.fillStyle = canEnter ? '#4a8ab5' : '#3a3a5a';
            ctx.beginPath();
            ctx.roundRect(ex, ey, game.exit.w, game.exit.h, 6);
            ctx.fill();
            if (canEnter) {
                ctx.shadowBlur = 60;
                ctx.fillStyle = `rgba(100,220,255,${0.3 + Math.sin(game.frame*0.05)*0.2})`;
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 19, 12 + Math.sin(game.frame * 0.04) * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 70;
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 19, 5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#665555';
                ctx.shadowBlur = 5;
                ctx.font = '22px sans-serif';
                ctx.fillText('🔒', ex + 4, ey + 30);
            }
            ctx.shadowBlur = 0;

            // 钥匙
            for (const key of game.keys) {
                if (key.collected) continue;
                const bob = Math.sin(game.frame * 0.04 + key.x) * 3;
                ctx.shadowColor = '#f7d44a';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#f7d44a';
                ctx.beginPath();
                ctx.arc(key.x, key.y + bob, key.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffdd77';
                ctx.beginPath();
                ctx.arc(key.x - 3, key.y - 3 + bob, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff9e6';
                ctx.beginPath();
                ctx.arc(key.x + 2, key.y - 5 + bob, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 物品
            for (const item of game.items) {
                if (item.type === 'heal') {
                    const bob = Math.sin(game.frame * 0.04 + item.x) * 3;
                    ctx.shadowColor = '#44ff88';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#44ff88';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bob, item.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '18px sans-serif';
                    ctx.fillText('+', item.x - 6, item.y + bob + 7);
                } else if (item.type === 'weapon') {
                    const bob = Math.sin(game.frame * 0.05 + item.x * 1.2) * 4;
                    ctx.shadowColor = '#ffaa44';
                    ctx.shadowBlur = 35;
                    ctx.fillStyle = '#ffaa44';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bob, item.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px sans-serif';
                    ctx.fillText(WEAPONS[item.weaponIdx]?.icon || '⚔', item.x - 7, item.y + bob + 6);
                }
            }
            ctx.shadowBlur = 0;

            // 敌人
            for (const e of game.enemies) {
                if (e.y > H + 50) continue;
                const flash = e.hitFlash > 0;
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 25;
