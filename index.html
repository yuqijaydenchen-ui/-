            grad.addColorStop(0.6, theme.bg2);
            grad.addColorStop(1, '#0a0a12');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // ---- 恐怖特效（鬼火、雾气、骷髅） ----
            if (scary >= 0.8) {
                // 雾气
                const fog = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 500);
                fog.addColorStop(0, 'rgba(0,0,0,0)');
                fog.addColorStop(0.5, 'rgba(0,0,0,0.2)');
                fog.addColorStop(1, 'rgba(0,0,0,0.6)');
                ctx.fillStyle = fog;
                ctx.fillRect(0, 0, W, H);

                // 鬼火（大量飘动）
                const ghostCount = Math.min(30 + Math.floor(game.totalCycles * 2), 80);
                for (let i = 0; i < ghostCount; i++) {
                    const x = (i * 47 + game.frame * 0.06 + Math.sin(i + game.frame * 0.005) * 20) % W;
                    const y = (i * 37 + Math.sin(i * 1.3 + game.frame * 0.008) * 25 + game.frame * 0.04) % H;
                    const size = 3 + Math.sin(game.frame * 0.02 + i * 0.7) * 2;
                    const alpha = 0.04 + Math.sin(game.frame * 0.015 + i * 0.5) * 0.03 + 0.04;
                    ctx.shadowColor = '#6b3aff';
                    ctx.shadowBlur = 35;
                    ctx.fillStyle = `rgba(120,80,255,${alpha})`;
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;

                // 骷髅装饰（固定位置 + 浮动）
                if (scary >= 1.5) {
                    ctx.fillStyle = 'rgba(120,60,60,0.08)';
                    ctx.font = '34px sans-serif';
                    ctx.fillText('💀', 25 + Math.sin(game.frame * 0.01) * 5, 50 + Math.sin(game.frame * 0.015) * 3);
                    ctx.fillText('💀', W - 70 + Math.sin(game.frame * 0.012 + 1) * 5, 45 + Math.sin(game.frame * 0.018 + 2) *
                    3);
                    ctx.fillText('💀', W / 2 - 20 + Math.sin(game.frame * 0.008 + 3) * 8, 30 + Math.sin(game.frame * 0.02 +
                        4) * 4);
                    // 血迹
                    ctx.fillStyle = 'rgba(80,0,0,0.06)';
                    for (let i = 0; i < 6; i++) {
                        const bx = 80 + i * 130 + Math.sin(i * 2 + game.frame * 0.005) * 30;
                        const by = 70 + Math.sin(i * 1.5 + game.frame * 0.008) * 20;
                        ctx.beginPath();
                        ctx.arc(bx, by, 12 + i * 4 + Math.sin(game.frame * 0.01 + i) * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // ---- 平台 ----
            for (const plat of game.platforms) {
                const platColor = game.infiniteMode ? `hsl(${220 + game.totalCycles * 3}, 30%, ${20 + game.totalCycles * 0.3}%)` :
                    theme.plat;
                ctx.fillStyle = platColor;
                ctx.shadowColor = (scary >= 1.5 || game.infiniteMode) ? '#ff333355' : 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.06)';
                ctx.beginPath();
                ctx.roundRect(plat.x + 4, plat.y - 1, plat.w - 8, 3, 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // ---- 出口 ----
            const ex = game.exit.x,
                ey = game.exit.y;
            const canEnter = game.keysCollected >= game.totalKeys;
            ctx.shadowColor = canEnter ? '#6bcbff' : '#445566';
            ctx.shadowBlur = 40;
            ctx.fillStyle = canEnter ? 'rgba(100,200,255,0.3)' : 'rgba(50,50,80,0.2)';
            ctx.beginPath();
            ctx.arc(ex + 15, ey + 19, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = canEnter ? 35 : 10;
            ctx.fillStyle = canEnter ? '#4a8ab5' : '#3a3a5a';
            ctx.beginPath();
            ctx.roundRect(ex, ey, game.exit.w, game.exit.h, 6);
            ctx.fill();
            if (canEnter) {
                ctx.shadowBlur = 60;
                ctx.fillStyle = `rgba(100,220,255,${0.3 + Math.sin(game.frame*0.05)*0.2})`;
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 19, 12 + Math.sin(game.frame * 0.04) * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 70;
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 19, 5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#665555';
                ctx.shadowBlur = 5;
                ctx.font = '22px sans-serif';
                ctx.fillText('🔒', ex + 4, ey + 30);
            }
            ctx.shadowBlur = 0;

            // ---- 钥匙 ----
            for (const key of game.keys) {
                if (key.collected) continue;
                const bob = Math.sin(game.frame * 0.04 + key.x) * 3;
                ctx.shadowColor = '#f7d44a';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#f7d44a';
                ctx.beginPath();
                ctx.arc(key.x, key.y + bob, key.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffdd77';
                ctx.beginPath();
                ctx.arc(key.x - 3, key.y - 3 + bob, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff9e6';
                ctx.beginPath();
                ctx.arc(key.x + 2, key.y - 5 + bob, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // ---- 物品 ----
            for (const item of game.items) {
                if (item.type === 'heal') {
                    const bob = Math.sin(game.frame * 0.04 + item.x) * 3;
                    ctx.shadowColor = '#44ff88';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#44ff88';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bob, item.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '18px sans-serif';
                    ctx.fillText('+', item.x - 6, item.y + bob + 7);
                } else if (item.type === 'weapon') {
                    const bob = Math.sin(game.frame * 0.05 + item.x * 1.2) * 4;
                    ctx.shadowColor = '#ffaa44';
                    ctx.shadowBlur = 35;
                    ctx.fillStyle = '#ffaa44';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bob, item.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px sans-serif';
                    ctx.fillText(WEAPONS[item.weaponIdx]?.icon || '⚔', item.x - 7, item.y + bob + 6);
                }
            }
            ctx.shadowBlur = 0;

            // ---- 敌人 ----
            for (const e of game.enemies) {
                if (e.y > H + 50) continue;
                const flash = e.hitFlash > 0;
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 25;
                const col = ['#2d1a1a', '#4a1a1a', '#6a1a1a', '#8a2a2a'][e.level] || '#2d1a1a';
                ctx.fillStyle = flash ? '#ff6666' : col;
                const size = e.w;
                ctx.beginPath();
                ctx.arc(e.x + size / 2, e.y + size / 2, size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0000';
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(e.x + size * 0.3, e.y + size * 0.35, size * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x + size * 0.7, e.y + size * 0.35, size * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#0a0a0a';
                ctx.beginPath();
                ctx.arc(e.x + size * 0.35, e.y + size * 0.4, size * 0.07, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x + size * 0.75, e.y + size * 0.4, size * 0.07, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.fillText('Lv' + e.level, e.x + 2, e.y + size + 14);
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(e.x, e.y - 8, size, 4);
                ctx.fillStyle = e.hp > 0 ? '#44ff44' : '#ff4444';
                ctx.fillRect(e.x, e.y - 8, size * (e.hp / (1 + e.level)), 4);
            }
            ctx.shadowBlur = 0;

            // ---- Boss ----
            if (game.isBoss && game.boss && game.boss.hp > 0) {
                const b = game.boss;
                const bt = b.type;
                const pulse = 0.95 + Math.sin(game.frame * 0.05) * 0.05;

                ctx.shadowColor = bt.color;
                ctx.shadowBlur = 70 * pulse;
                ctx.fillStyle = bt.color + '22';
                ctx.beginPath();
                ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 90 * pulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 25;
                ctx.shadowColor = bt.color + '88';
                ctx.fillStyle = bt.color;
                ctx.beginPath();
                ctx.roundRect(b.x, b.y, b.w, b.h, 12);
                ctx.fill();

                // 独特Boss特征
                if (bt.id === 'flesh') {
                    for (let i = 0; i < 5; i++) {
                        const fx = b.x + 10 + i * 12 + Math.sin(i + game.frame * 0.01) * 4;
                        const fy = b.y + 15 + i * 10 + Math.cos(i * 2 + game.frame * 0.02) * 4;
                        ctx.fillStyle = '#66dd66';
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(fx, fy, 5 + Math.sin(game.frame * 0.03 + i) * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (bt.id === 'banshee') {
                    for (let i = 0; i < 6; i++) {
                        const angle = (i / 6) * Math.PI * 2 + game.frame * 0.02;
                        const len = 20 + Math.sin(game.frame * 0.04 + i) * 8;
                        ctx.strokeStyle = '#cc88ff';
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.moveTo(b.x + b.w / 2, b.y + b.h / 2);
                        ctx.lineTo(b.x + b.w / 2 + Math.cos(angle) * len, b.y + b.h / 2 + Math.sin(angle) * len);
                        ctx.stroke();
                    }
                } else if (bt.id === 'watcher') {
                    const eyeX = b.x + b.w / 2,
                        eyeY = b.y + b.h / 2;
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#ff8844';
                    ctx.fillStyle = '#ff8844';
                    ctx.beginPath();
                    ctx.arc(eyeX, eyeY, 20 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a0a0a';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(eyeX + Math.sin(game.frame * 0.02) * 4, eyeY + Math.cos(game.frame * 0.02) * 4, 8, 0, Math.PI *
                    2);
                    ctx.fill();
                    ctx.fillStyle = '#ff8844';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(eyeX + Math.sin(game.frame * 0.02) * 6, eyeY + Math.cos(game.frame * 0.02) * 6, 3, 0, Math.PI *
                        2);
                    ctx.fill();
                } else if (bt.id === 'skeleton') {
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = '#ffdd44';
                    ctx.beginPath();
                    ctx.moveTo(b.x + 10, b.y + 8);
                    ctx.lineTo(b.x + 20, b.y - 4);
                    ctx.lineTo(b.x + 30, b.y + 8);
                    ctx.lineTo(b.x + 40, b.y - 4);
                    ctx.lineTo(b.x + 50, b.y + 8);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#dddddd';
                    ctx.shadowBlur = 20;
                    ctx.font = '18px sans-serif';
                    ctx.fillText('☠', b.x + 18, b.y + 32);
                } else if (bt.id === 'chaos') {
                    for (let i = 0; i < 8; i++) {
                        const a = (i / 8) * Math.PI * 2 + game.frame * 0.01;
                        const r = 15 + Math.sin(game.frame * 0.04 + i) * 5;
                        ctx.fillStyle = `hsl(${320 + i * 10}, 80%, ${50 + Math.sin(game.frame*0.03+i)*10}%)`;
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(b.x + b.w / 2 + Math.cos(a) * r * pulse, b.y + b.h / 2 + Math.sin(a) * r * pulse, 6 * pulse,
                            0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (bt.id === 'shadow') {
                    ctx.shadowBlur = 40;
                    ctx.shadowColor = '#8844ff';
                    for (let i = 0; i < 10; i++) {
                        const a = (i / 10) * Math.PI * 2 + game.frame * 0.01;
                        const r = 20 + Math.sin(game.frame * 0.03 + i * 2) * 10;
                        const alpha = 0.3 + Math.sin(game.frame * 0.04 + i) * 0.15;
                        ctx.fillStyle = `rgba(136,68,255,${alpha})`;
                        ctx.beginPath();
                        ctx.arc(b.x + b.w / 2 + Math.cos(a + game.frame * 0.01) * r, b.y + b.h / 2 + Math.sin(a + game
                            .frame * 0.01) * r, 10 * pulse, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Boss眼睛
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ff0000';
                const pp = game.player;
                for (let i = 0; i < 2; i++) {
                    const ex = b.x + 14 + i * (b.w - 28);
                    const ey = b.y + 18 + (b.hitCooldown > 0 ? 5 : 0);
                    ctx.fillStyle = bt.eyeColor || '#ff4444';
                    ctx.beginPath();
                    ctx.arc(ex, ey, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a0a0a';
                    ctx.shadowBlur = 0;
                    const dx = pp.x + pp.w / 2 - ex,
                        dy = pp.y + pp.h / 2 - ey;
                    const d = Math.hypot(dx, dy);
                    if (d > 0) { const mx = (dx / d) * 4,
                            my = (dy / d) * 4;
                        ctx.beginPath();
                        ctx.arc(ex + mx, ey + my, 4, 0, Math.PI * 2);
                        ctx.fill(); }
                }

                // Boss子弹
                for (const bull of b.bullets) {
                    const color = bull.color || '#ff6633';
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    ctx.arc(bull.x, bull.y, bull.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(bull.x - 2, bull.y - 2, bull.r * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;

                if (b.hp < b.maxHp * 0.3 && Math.floor(game.frame / 8) % 2 === 0) {
                    ctx.fillStyle = 'rgba(255,0,0,0.1)';
                    ctx.fillRect(0, 0, W, H);
                }
            }

            // ---- 玩家子弹 ----
            for (const bull of game.bullets) {
                ctx.shadowColor = bull.color || '#6bcbff';
                ctx.shadowBlur = 30;
                ctx.fillStyle = bull.color || '#6bcbff';
                ctx.beginPath();
                ctx.arc(bull.x, bull.y, bull.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(bull.x - 2, bull.y - 2, bull.r * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // ---- 玩家 ----
            const p = game.player;
            for (const t of p.trail) {
                ctx.globalAlpha = t.life / 20 * 0.2;
                ctx.fillStyle = '#3498db';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.roundRect(t.x, t.y, p.w, p.h, 4);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            if (p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0) ctx.globalAlpha = 0.5;

            const capeWave = Math.sin(game.frame * 0.06) * 3;
            ctx.shadowColor = '#6bcbff';
            ctx.shadowBlur = 15;
            const capeColor = ['#2ecc71', '#8e44ad', '#ff3333'][game.world % 3] || '#2ecc71';
            ctx.fillStyle = capeColor;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(p.x + p.w, p.y + 6);
            ctx.quadraticCurveTo(p.x + p.w + 12 + capeWave, p.y + 16, p.x + p.w - 2 + capeWave * 0.5, p.y + 26);
            ctx.quadraticCurveTo(p.x + p.w - 6 + capeWave * 0.3, p.y + 20, p.x + p.w, p.y + 14);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.shadowColor = '#6bcbff';
            ctx.shadowBlur = 25;
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, p.h, 5);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#5dade2';
            ctx.beginPath();
            ctx.roundRect(p.x + 3, p.y + 4, 5, 12, 3);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(p.x + 16, p.y + 4, 5, 12, 3);
            ctx.fill();
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(p.x + 2, p.y + 20, p.w - 4, 3);

            ctx.fillStyle = '#5dade2';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(p.x + p.w / 2, p.y - 2, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(p.x + 7, p.y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + 17, p.y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(100,200,255,0.4)';
            ctx.beginPath();
            ctx.arc(p.x + 6, p.y - 6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + 16, p.y - 6, 3, 0, Math.PI * 2);
            ctx.fill();

            const mx = game._mouseX || 0,
                my = game._mouseY || 0;
            const eyeDx = mx - (p.x + p.w / 2),
                eyeDy = my - (p.y + p.h / 2);
            const eyeDist = Math.hypot(eyeDx, eyeDy);
            if (eyeDist > 0) {
                const ox = (eyeDx / eyeDist) * 2,
                    oy = (eyeDy / eyeDist) * 2;
                ctx.fillStyle = '#44ff88';
                ctx.beginPath();
                ctx.arc(p.x + 7 + ox, p.y - 4 + oy, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + 17 + ox, p.y - 4 + oy, 2.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#44ff88';
                ctx.beginPath();
                ctx.arc(p.x + 7, p.y - 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + 17, p.y - 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            // ---- 粒子 ----
            for (const pt of game.particles) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = pt.color;
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life / pt.maxLife;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size * (pt.life / pt.maxLife), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // ---- 屏幕震动 ----
            if (game.screenShake > 0) {
                const shake = game.screenShake * 0.5;
                ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
                game.screenShake *= 0.9;
                if (game.screenShake < 0.1) game.screenShake = 0;
            }

            // ---- HUD ----
            ctx.fillStyle = 'rgba(255,255,255,0.07)';
            ctx.font = '14px sans-serif';
            const expPct = Math.floor((exp / expToNext) * 100);
            const modeText = game.infiniteMode ? '♾️ 第' + (game.totalCycles + 1) + '轮' : '普通';
            ctx.fillText('🌍 ' + theme.name + '  |  🗡️ ' + game.totalKills + '杀  |  EXP ' + exp + '/' + expToNext + '(' +
                expPct + '%)  |  ' + modeText, 14, 28);
            if (game.hp < 30) {
                ctx.fillStyle = 'rgba(255,0,0,0.15)';
                ctx.fillRect(0, 0, W, H);
            }

            if (game.isBoss && game.boss && game.boss.hp > 0) {
                ctx.fillStyle = game.boss.type.color + '88';
                ctx.font = '16px sans-serif';
                ctx.fillText('⚔️ ' + game.boss.type.name + ' · ' + game.boss.type.desc, W / 2 - 120, 24);
            }
        }

        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w / 2) r = w / 2;
            if (r > h / 2) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        // ================================================================
        //  事件
        // ================================================================
        canvas.addEventListener('mousedown', (e) => {
            if (!game.running || game.gameOver || game.levelComplete) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width,
                scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX,
                my = (e.clientY - rect.top) * scaleY;
            game._mouseX = mx;
            game._mouseY = my;
            shootBullet(mx, my);
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width,
                scaleY = canvas.height / rect.height;
            game._mouseX = (e.clientX - rect.left) * scaleX;
            game._mouseY = (e.clientY - rect.top) * scaleY;
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { game.keysPressed.left = true;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { game.keysPressed.right = true;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === ' ') { game.keysPressed.up = true;
                e.preventDefault(); }
            if (key === 'q' || key === 'Q') {
                game.player.weapon = (game.player.weapon + 1) % WEAPONS.length;
                playSound('weapon');
                updateUI();
                e.preventDefault();
            }
            if (key === 'r' || key === 'R') {
                cycleBulletType();
                e.preventDefault();
            }
            if (key === 'e' || key === 'E') {
                activateSkill();
                updateUI();
                e.preventDefault();
            }
            if (key === ' ') {
                e.preventDefault();
                if (game.gameOver || !game.running) initGame();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { game.keysPressed.left = false;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { game.keysPressed.right = false;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === ' ') { game.keysPressed.up = false;
                e.preventDefault(); }
        });

        infiniteBtn.addEventListener('click', function() {
            game.infiniteMode = !game.infiniteMode;
            this.classList.toggle('active');
            this.textContent = game.infiniteMode ? '♾️ 无尽模式 (开)' : '♾️ 无尽模式 (关)';
            if (game.infiniteMode) {
                game.totalCycles = 0;
                game.world = 0;
                game.branch = 0;
                game.level = 0;
                loadLevel(0, 0, 0);
                showMessage('♾️ 无尽模式已开启', '每关随机Boss，地图不断扩张！');
                setTimeout(() => msgOverlay.classList.remove('show'), 1500);
            }
            updateUI();
        });

        // ================================================================
        //  主循环
        // ================================================================
        function gameLoop() {
            if (game.running && !game.gameOver && !game.levelComplete) {
                game.frame++;
                updatePlayer();
                if (game.particles.length > 500) game.particles.splice(0, 150);
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        initGame();
        gameLoop();

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'q', 'Q', 'r', 'R', 'e', 'E'].includes(e.key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('click', () => { initAudio(); }, { once: true });
    </script>
</body>
</html>
