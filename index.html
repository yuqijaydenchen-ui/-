<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>👻 暗影勇者 · 特色怪物</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            overflow: hidden;
            touch-action: none;
        }
        #wrapper {
            background: #141425;
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #1a1a30;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: auto;
            max-width: 800px;
            max-height: 550px;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: #ccc;
            font-weight: bold;
            font-size: 17px;
            padding: 0 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        #uiLeft {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }
        .label {
            color: #667799;
            font-weight: normal;
        }
        #hpDisplay {
            color: #ff6b6b;
            font-size: 22px;
            text-shadow: 0 0 25px #ff6b6b55;
        }
        #worldDisplay {
            color: #6bcbff;
            font-size: 20px;
            text-shadow: 0 0 25px #6bcbff55;
        }
        #keyDisplay {
            color: #f7d44a;
            font-size: 20px;
        }
        #jumpDisplay {
            color: #9b6bff;
            font-size: 20px;
            text-shadow: 0 0 25px #9b6bff55;
        }
        #weaponDisplay {
            color: #ffaa44;
            font-size: 18px;
        }
        #skillDisplay {
            color: #44ff88;
            font-size: 16px;
            background: #0a1a12;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #44ff8866;
            cursor: pointer;
        }
        #skillDisplay:hover {
            background: #1a2a22;
        }
        #levelDisplay {
            color: #f7d44a;
            font-size: 20px;
            text-shadow: 0 0 25px #f7d44a55;
        }
        #bossNameDisplay {
            color: #ff4444;
            font-size: 18px;
            text-shadow: 0 0 30px #ff444466;
            display: none;
        }
        #bossHpBar {
            color: #ff3333;
            font-size: 18px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        #bossHpBar .bar {
            width: 180px;
            height: 14px;
            background: #2a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #663333;
        }
        #bossHpBar .fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3333, #ff8833);
            border-radius: 10px;
            transition: width .15s;
        }
        .btn {
            background: #2a1a3a;
            color: #ffaa44;
            border: 2px solid #ffaa44;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        .btn:hover {
            background: #3a2a4a;
        }
        .btn.active {
            border-color: #44ff88;
            color: #44ff88;
        }
        .btn-stat {
            background: #1a2a3a;
            color: #6bcbff;
            border: 2px solid #6bcbff;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        .btn-stat:hover {
            background: #2a3a4a;
        }
        #hint {
            color: #445566;
            font-size: 13px;
            background: #0e0e1e;
            padding: 6px 18px;
            border-radius: 30px;
            text-align: right;
        }
        #msgOverlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 80px);
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #msgOverlay.show {
            display: flex;
        }
        #msgText {
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 80px #ff000066;
            animation: pop .5s ease;
            text-align: center;
            line-height: 1.4;
            padding: 20px;
        }
        #msgSub {
            font-size: 20px;
            color: #ff6666;
            margin-top: 10px;
            font-weight: normal;
            text-shadow: 0 0 40px #ff000044;
        }
        @keyframes pop {
            0% {
                transform: scale(.2) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        #statPanel {
            position: absolute;
            top: 80px;
            right: 20px;
            background: #0a0a1aee;
            border: 2px solid #6bcbff;
            border-radius: 16px;
            padding: 20px 24px;
            color: #fff;
            z-index: 20;
            display: none;
            min-width: 240px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 60px #6bcbff33;
            font-size: 14px;
        }
        #statPanel h3 {
            text-align: center;
            color: #f7d44a;
            margin-bottom: 12px;
            font-size: 20px;
        }
        #statPanel .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid #33445544;
        }
        #statPanel .stat-row .stat-name {
            color: #aabbdd;
        }
        #statPanel .stat-row .stat-val {
            color: #fff;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }
        #statPanel .stat-row button {
            background: #2a3a5a;
            color: #6bcbff;
            border: 1px solid #6bcbff;
            border-radius: 30px;
            padding: 0 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        #statPanel .stat-row button:hover {
            background: #3a4a6a;
        }
        #statPanel .stat-row button:disabled {
            opacity: .3;
            cursor: not-allowed;
        }
        #statPanel .points-remaining {
            text-align: center;
            color: #44ff88;
            font-size: 18px;
            margin: 10px 0 8px;
            padding: 6px;
            background: #0a1a12;
            border-radius: 10px;
            border: 1px solid #44ff8844;
        }
        #statPanel .close-btn {
            display: block;
            margin: 10px auto 0;
            background: #3a1a1a;
            color: #ff6666;
            border: 1px solid #ff6666;
            border-radius: 30px;
            padding: 4px 24px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        #statPanel .close-btn:hover {
            background: #4a2a2a;
        }
        #wrapper {
            position: relative;
        }
        #levelUpMsg {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #f7d44a;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 40px #f7d44a88;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            transition: opacity .3s;
        }
        #levelUpMsg.show {
            opacity: 1;
        }
        #mobileControls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: calc(100% - 80px);
            pointer-events: none;
            z-index: 5;
            display: none;
        }
        #mobileControls.active {
            display: block;
        }
        .ctrl-zone {
            position: absolute;
            pointer-events: auto;
            touch-action: none;
        }
        #joystickZone {
            left: 20px;
            bottom: 30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 2px solid rgba(255, 255, 255, .15);
        }
        #joystickKnob {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(100, 200, 255, .4);
            border: 2px solid rgba(100, 200, 255, .6);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #shootZone {
            right: 20px;
            bottom: 30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 100, 100, .15);
            border: 2px solid rgba(255, 100, 100, .3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .4);
            font-size: 14px;
            font-weight: bold;
            pointer-events: auto;
        }
        #jumpBtn {
            position: absolute;
            left: 180px;
            bottom: 40px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(155, 107, 255, .25);
            border: 2px solid rgba(155, 107, 255, .4);
            color: rgba(255, 255, 255, .5);
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }
        #mobileWeaponBtn {
            position: absolute;
            right: 170px;
            bottom: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 170, 68, .2);
            border: 2px solid rgba(255, 170, 68, .3);
            color: rgba(255, 255, 255, .4);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }
        #mobileSkillBtn {
            position: absolute;
            right: 170px;
            bottom: 95px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(68, 255, 136, .2);
            border: 2px solid rgba(68, 255, 136, .3);
            color: rgba(255, 255, 255, .4);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }
        @media(max-width:760px) {
            #wrapper {
                padding: 10px;
            }
            #ui {
                font-size: 13px;
            }
            #hint {
                font-size: 10px;
                padding: 4px 10px;
                display: none;
            }
            #msgText {
                font-size: 28px;
            }
            #msgSub {
                font-size: 16px;
            }
            #uiLeft {
                gap: 10px;
            }
            #bossHpBar .bar {
                width: 80px;
            }
            #statPanel {
                top: 60px;
                right: 10px;
                padding: 14px 16px;
                min-width: 180px;
                font-size: 12px;
            }
            #levelUpMsg {
                font-size: 20px;
                top: 20px;
                left: 20px;
            }
            #mobileControls.active {
                display: block !important;
            }
            .btn,
            .btn-stat {
                font-size: 12px;
                padding: 3px 12px;
            }
        }
        @media(pointer:coarse) {
            #mobileControls.active {
                display: block !important;
            }
            #hint {
                display: none;
            }
        }
        @media(pointer:fine) {
            #mobileControls.active {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <canvas id="gameCanvas" width="800" height="550"></canvas>
        <div id="msgOverlay"><div id="msgText">🎉<div id="msgSub"></div></div></div>
        <div id="levelUpMsg">⬆ Lv.1</div>
        <div id="mobileControls">
            <div id="joystickZone" class="ctrl-zone"><div id="joystickKnob"></div></div>
            <div id="shootZone" class="ctrl-zone">🔫</div>
            <div id="jumpBtn" class="ctrl-zone">⬆</div>
            <div id="mobileWeaponBtn" class="ctrl-zone">⚔</div>
            <div id="mobileSkillBtn" class="ctrl-zone">⏳</div>
        </div>
        <div id="statPanel">
            <h3>📊 属性分配</h3>
            <div class="points-remaining" id="pointsRemaining">剩余: 0</div>
            <div class="stat-row"><span class="stat-name">❤️ 生命</span><span class="stat-val" id="statHp">100</span><button onclick="upgradeStat('maxHp')">+</button></div>
            <div class="stat-row"><span class="stat-name">🏃 速度</span><span class="stat-val" id="statSpeed">4.2</span><button onclick="upgradeStat('speed')">+</button></div>
            <div class="stat-row"><span class="stat-name">🦘 跳跃</span><span class="stat-val" id="statJump">10.8</span><button onclick="upgradeStat('jumpPower')">+</button></div>
            <div class="stat-row"><span class="stat-name">⚔️ 伤害</span><span class="stat-val" id="statDamage">+0</span><button onclick="upgradeStat('damageBonus')">+</button></div>
            <div class="stat-row"><span class="stat-name">🔫 射速</span><span class="stat-val" id="statFireRate">1.0</span><button onclick="upgradeStat('fireRate')">+</button></div>
            <button class="close-btn" onclick="toggleStatPanel()">✕ 关闭</button>
        </div>
        <div id="ui">
            <div id="uiLeft">
                <span><span class="label">❤️</span> <span id="hpDisplay">100</span></span>
                <span><span class="label">⭐</span> <span id="levelDisplay">Lv.1</span></span>
                <span><span class="label">🌍</span> <span id="worldDisplay">1-1</span></span>
                <span><span class="label">🔑</span> <span id="keyDisplay">0 / 0</span></span>
                <span><span class="label">🦘</span> <span id="jumpDisplay">3</span></span>
                <span><span class="label">⚔️</span> <span id="weaponDisplay">普通</span></span>
                <span id="skillDisplay">⏳ 技能: 凝滞</span>
                <span id="bossNameDisplay">👹 Boss</span>
                <span id="bossHpBar"><span class="bar"><span class="fill" id="bossFill"></span></span></span>
                <button class="btn" id="infiniteToggle">♾️ 无尽</button>
                <button class="btn-stat" id="statBtn">📊 属性</button>
                <button class="btn" id="langToggle">🌐 EN</button>
            </div>
            <span id="hint">🖱️射击 | ← → 移动 | 空格跳 | Q切武器 | E切换技能 | F属性</span>
        </div>
    </div>

        function initAudio() {

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                switch (type) {
                    case 'shoot':
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                        break;
                    case 'jump':
                        osc.frequency.setValueAtTime(300 + (game?.player?.jumpCount || 0) * 80, now);
                        gain.gain.setValueAtTime(0.10, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'kill':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;
                    case 'key':

                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'damage':

                        gain.gain.setValueAtTime(0.35, now);

                        osc.stop(now + 0.3);

        function initStats() {
            stats = {};
            for (const key in STAT_CONFIG) {
                stats[key] = STAT_CONFIG[key].base;
            }
            statPoints = 0;
            level = 1;
            exp = 0;
            expToNext = 20;
            updateStatUI();
        }

        function addExp(amount) {
            exp += amount;
            while (exp >= expToNext) {
                exp -= expToNext;
                level++;
                expToNext = Math.floor(20 + level * 15);
                statPoints += 3;
                playSound('levelup');
                showLevelUp(level);
                updateStatUI();
                updateUI();
            }
            updateStatUI();
            updateUI();
        }

        function showLevelUp(lv) {
            levelUpMsg.textContent = t('levelUp', { lv: lv });
            levelUpMsg.classList.add('show');
            levelUpTimer = 120;
        }

        function upgradeStat(key) {
            if (statPoints <= 0) return;
            const cfg = STAT_CONFIG[key];
            if (!cfg) return;
            const cost = Math.floor(cfg.cost);
            if (statPoints < cost) return;
            statPoints -= cost;
            stats[key] += cfg.inc;
            updateStatUI();
            updateUI();
            applyStats();
        }

        function applyStats() {
            const p = game?.player;
            if (!p) return;
            p.maxHp = stats.maxHp;
            p.speed = stats.speed;
            p.jumpPower = -stats.jumpPower;
            updateUI();

        // ----- 移动端控制 -----
        let joystickDX = 0,
            joystickDY = 0;

        function setupMobileControls() {
            const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (!isMobile) {
                document.getElementById('mobileControls').classList.remove('active');
                return;
            }
            document.getElementById('mobileControls').classList.add('active');

            const joystickZone = document.getElementById('joystickZone');
            const knob = document.getElementById('joystickKnob');
            const shootZone = document.getElementById('shootZone');
            const jumpBtn = document.getElementById('jumpBtn');
            const weaponBtn = document.getElementById('mobileWeaponBtn');
            const skillBtn = document.getElementById('mobileSkillBtn');

            let joystickTouchId = null;
            let shootTouchId = null;

            joystickZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                joystickTouchId = touch.identifier;
                updateJoystick(touch);
            });
            joystickZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (const touch of e.changedTouches) {
                    if (touch.identifier === joystickTouchId) {
                        updateJoystick(touch);
                    }
                }
            });
            joystickZone.addEventListener('touchend', (e) => {
                e.preventDefault();
                joystickTouchId = null;
                joystickDX = 0;
                joystickDY = 0;
                knob.style.top = '50%';
                knob.style.left = '50%';
                knob.style.transform = 'translate(-50%, -50%)';
                game.touchLeft = false;
                game.touchRight = false;
                game.keysPressed.up = false;
            });

            function updateJoystick(touch) {
                const rect = joystickZone.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                let dx = (touch.clientX - cx) / (rect.width / 2);
                let dy = (touch.clientY - cy) / (rect.height / 2);
                const dist = Math.hypot(dx, dy);
                if (dist > 1) { dx /= dist;
                    dy /= dist; }
                joystickDX = dx;
                joystickDY = dy;
                knob.style.top = (50 + dy * 35) + '%';
                knob.style.left = (50 + dx * 35) + '%';
                knob.style.transform = 'translate(-50%, -50%)';
                game.touchLeft = dx < -0.3;
                game.touchRight = dx > 0.3;
                if (dy < -0.5) {
                    game.keysPressed.up = true;
                } else {
                    game.keysPressed.up = false;
                }
            }

            shootZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                shootTouchId = touch.identifier;
                game.touchShoot = true;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const cx = (touch.clientX - rect.left) * scaleX;
                const cy = (touch.clientY - rect.top) * scaleY;
                game.touchX = cx;
                game.touchY = cy;
                tryShootMobile(cx, cy);
            });
            shootZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (const touch of e.changedTouches) {
                    if (touch.identifier === shootTouchId) {
                        const rect = canvas.getBoundingClientRect();
                        const scaleX = canvas.width / rect.width;
                        const scaleY = canvas.height / rect.height;
                        const cx = (touch.clientX - rect.left) * scaleX;
                        const cy = (touch.clientY - rect.top) * scaleY;
                        game.touchX = cx;
                        game.touchY = cy;
                        tryShootMobile(cx, cy);
                    }
                }
            });
            shootZone.addEventListener('touchend', (e) => {
                e.preventDefault();
                shootTouchId = null;
                game.touchShoot = false;
            });

            function tryShootMobile(cx, cy) {
                if (!game.running || game.gameOver || game.levelComplete) return;
                game._mouseX = cx;
                game._mouseY = cy;
                shootBullet(cx, cy);
            }

            jumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                game.keysPressed.up = true;
                game.touchJump = true;
            });
            jumpBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                game.keysPressed.up = false;
                game.touchJump = false;
            });
            jumpBtn.addEventListener('touchcancel', (e) => {
                game.keysPressed.up = false;
                game.touchJump = false;
            });

            weaponBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                game.player.weapon = (game.player.weapon + 1) % WEAPONS.length;
                playSound('weapon');
                updateUI();
            });

            skillBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                activateSkill();
                updateUI();
            });

            document.addEventListener('touchmove', (e) => {
                if (e.target.closest('#wrapper')) e.preventDefault();
            }, { passive: false });
        }

        // ----- 加载关卡 -----
        function loadLevel(levelIdx) {
            const cycle = game.totalCycles;
            const difficulty = levelIdx + cycle * 3;
            const mapScale = 1 + Math.floor(cycle / 2) * 0.2;
            game.mapWidth = Math.min(1200, Math.floor(W * mapScale));
            game.mapHeight = H;

            // 地形
            const terrainIdx = (levelIdx + cycle * 7) % TERRAIN_TEMPLATES.length;
            game.terrainType = terrainIdx;
            const seed = levelIdx * 100 + cycle * 33;

            let platforms = [];
            platforms.push({ x: 0, y: game.mapHeight - 40, w: game.mapWidth, h: 40 });
            const extraPlats = TERRAIN_TEMPLATES[terrainIdx](seed);
            for (const p of extraPlats) {
                if (p.x + p.w < game.mapWidth - 20) {
                    platforms.push(p);
                }
            }
            if (platforms.length < 3) {
                for (let i = 0; i < 5; i++) {
                    const x = 60 + i * 130 + Math.sin(seed + i) * 30;
                    const y = 350 - i * 50 + Math.sin(seed * 1.5 + i * 2) * 15;
                    platforms.push({ x: Math.max(10, Math.min(game.mapWidth - 70, x)), y: Math.max(60, Math.min(440, y)),
                        w: 70 + Math.sin(seed + i * 1.5) * 20, h: 14 });
                }
            }
            platforms.sort((a, b) => a.y - b.y);

            const lastPlat = platforms[platforms.length - 1] || platforms[0];
            const exitX = Math.min(game.mapWidth - 50, lastPlat.x + lastPlat.w / 2 - 15);
            const exitY = lastPlat.y - 40;

            // ---- 怪物（8种混合，每关随机） ----
            const enemies = [];
            const enemyCount = 4 + Math.floor(difficulty * 0.7);
            for (let i = 0; i < enemyCount; i++) {
                let plat = platforms[1 + (i * 3) % (platforms.length - 1)];
                if (!plat) plat = platforms[1] || platforms[0];
                // 从8种怪物中随机选，保证多样性
                const typeIdx = (levelIdx + i * 3 + cycle * 5) % MONSTER_TYPES.length;
                const mType = MONSTER_TYPES[typeIdx];
                const lvl = Math.min(2, Math.floor((difficulty + i) / 3));
                const size = (mType.size || 20) + lvl * 4;
                const hp = mType.hp + lvl + Math.floor(cycle * 0.5);
                const dmg = mType.damage + lvl * 3 + Math.floor(cycle * 1.5);
                enemies.push({
                    x: plat.x + 10 + i * 20,
                    y: plat.y - size,
                    w: size,
                    h: size,
                    type: mType.id,
                    name: mType.name,
                    color: mType.color,
                    glow: mType.glow,
                    level: lvl,
                    hp: hp,
                    maxHp: hp,
                    vx: (0.6 + lvl * 0.2) * (i % 2 === 0 ? 1 : -1),
                    speed: mType.speed + lvl * 0.05 + cycle * 0.02,
                    minX: Math.max(0, plat.x + 5),
                    maxX: Math.min(game.mapWidth, plat.x + plat.w - size - 5),
                    startY: plat.y - size,
                    damage: dmg,
                    hitFlash: 0,
                    aggroRange: mType.aggro + lvl * 20 + cycle * 5,
                    expReward: mType.exp + lvl * 2 + Math.floor(cycle * 2),
                    split: mType.split || false,
                    ranged: mType.ranged || false,
                    stealth: mType.stealth || false,
                    explode: mType.explode || false,
                    slow: mType.slow || false,
                    shootTimer: 0,
                    stealthTimer: 0,
                    isStealthed: false,
                });
            }

            // ---- 钥匙 ----
            const keys = [];
            const keyCount = 2 + Math.floor(difficulty / 2);
            const usedPlats = platforms.slice(1);
            for (let i = 0; i < Math.min(keyCount, usedPlats.length); i++) {
                const plat = usedPlats[i % usedPlats.length];
                keys.push({ x: plat.x + 15 + i * 20, y: plat.y - 28, collected: false, r: 9 });
            }
            while (keys.length < 2) {
                const plat = platforms[1 + keys.length % (platforms.length - 1)] || platforms[0];
                keys.push({ x: plat.x + 30 + keys.length * 20, y: plat.y - 28, collected: false, r: 9 });
            }

            // ---- 物品 ----
            const items = [];
            const healCount = 1 + Math.floor(difficulty / 3);
            for (let i = 0; i < healCount; i++) {
                let plat = platforms[1 + (i * 7 + levelIdx) % (platforms.length - 1)];
                if (!plat) plat = platforms[1] || platforms[0];
                items.push({
                    type: 'heal',
                    x: plat.x + 20 + i * 25,
                    y: plat.y - 30,
                    r: 12,
                    value: 20,
                });
            }
            if ((levelIdx % 2 === 1) && difficulty > 0) {
                let plat = platforms[2 % (platforms.length - 1)];
                if (!plat) plat = platforms[1] || platforms[0];
                const wIdx = Math.min(5, Math.floor(difficulty / 2) + 1);
                items.push({
                    type: 'weapon',
                    weaponIdx: wIdx,
                    x: plat.x + 30,
                    y: plat.y - 30,
                    r: 14,
                });
            }

            // ---- Boss ----
            let isBoss = (levelIdx % 5 === 4);
            let boss = null;
            let bossType = null;
            if (isBoss) {
                const bossPlat = platforms[Math.floor(platforms.length / 2)] || platforms[0];
                const bossIdx = (levelIdx + cycle * 7) % BOSS_TYPES.length;
                bossType = BOSS_TYPES[bossIdx];
                const hpMult = 1 + cycle * 0.3 + levelIdx * 0.05;
                const bossHp = Math.floor((60 + cycle * 20 + levelIdx * 5) * hpMult);
                boss = {
                    x: Math.min(game.mapWidth - 100, bossPlat.x + bossPlat.w / 2 - 35),
                    y: bossPlat.y - 80,
                    w: 70,
                    h: 80,
                    hp: bossHp,
                    maxHp: bossHp,
                    timer: 0,
                    bullets: [],
                    hitCooldown: 0,
                    expReward: 80 + cycle * 15 + levelIdx * 5,
                    type: bossType,
                    phase: 0,
                };
                enemies.splice(0, Math.floor(enemies.length / 2));
                game.bossType = bossType;
                bossNameSpan.textContent = t('boss') + ' ' + bossType.desc;
                bossNameSpan.style.display = 'block';
            } else {
                game.bossType = null;
                bossNameSpan.style.display = 'none';
            }

            game.platforms = platforms;
            game.enemies = enemies.map(e => ({ ...e, hitFlash: 0 }));
            game.keys = keys.map(k => ({ ...k, collected: false }));
            game.items = items.map(i => ({ ...i }));
            game.exit = { x: exitX, y: exitY, w: 30, h: 38 };
            game.totalKeys = game.keys.length;
            game.keysCollected = 0;
            game.levelComplete = false;
            game.bullets = [];
            game.isBoss = isBoss;
            game.boss = boss ? { ...boss, bullets: [], hitCooldown: 0, timer: 0 } : null;
            game.screenShake = 0;
            game.bossSpawned = isBoss;
            game.thunderTimer = 0;

            const p = game.player;
            p.x = 40;
            p.y = 400;
            p.vx = 0;
            p.vy = 0;
            p.onGround = false;
            p.jumpCount = 0;
            p.invincible = 0;
            p.trail = [];
            p.speed = stats.speed;
            p.jumpPower = -stats.jumpPower;
            p.maxHp = stats.maxHp;
            p.healTimer = 0;
            if (game.hp > p.maxHp) game.hp = p.maxHp;

            if (game.isBoss && game.boss) {
                bossHpBar.style.display = 'flex';
                updateBossUI();
            } else {
                bossHpBar.style.display = 'none';
            }
            updateUI();
        }

        function updateUI() {
            hpSpan.textContent = Math.ceil(game.hp);
            const displayLvl = game.level + 1 + game.totalCycles * 5;
            worldSpan.textContent = `${displayLvl}`;
            keySpan.textContent = `${game.keysCollected} / ${game.totalKeys}`;
            const rem = Math.max(0, game.player.maxJumps - game.player.jumpCount);
            jumpSpan.textContent = rem;
            weaponSpan.textContent = WEAPONS[game.player.weapon].icon + ' ' + WEAPONS[game.player.weapon].name;
            levelSpan.textContent = `Lv.${level}`;
            updateSkillUI();
            updateStatUI();
        }

        function updateBossUI() {
            if (!game.boss) return;
            const pct = Math.max(0, (game.boss.hp / game.boss.maxHp) * 100);
            bossFill.style.width = pct + '%';
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        // ----- 粒子 -----
        function spawnParticles(x, y, color, count = 12, speedMult = 1) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (1 + Math.random() * 3) * speedMult;
                game.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 30 + Math.random() * 30,
                    maxLife: 60,
                    color,
                    size: 3 + Math.random() * 5,
                });
            }
        }

        function spawnExplosion(x, y, color, count = 40) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 6;
                game.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 30 + Math.random() * 30,
                    maxLife: 60,
                    color: Math.random() > 0.5 ? color : '#ffaa44',
                    size: 3 + Math.random() * 8,
                });
            }
        }

        function spawnBlood(x, y, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 5;
                game.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 40 + Math.random() * 40,
                    maxLife: 80,
                    color: Math.random() > 0.5 ? '#8b0000' : '#cc0000',
                    size: 2 + Math.random() * 6,
                });
            }
        }

        function updateParticles() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06;
                p.life--;
                if (p.life <= 0) game.particles.splice(i, 1);
            }
            if (game.particles.length > 500) game.particles.splice(0, 150);
        }

        // ----- 射击 -----
        let lastShootTime = 0;
        let shootSoundCooldown = 0;

        function shootBullet(targetX, targetY) {
            const now = performance.now();
            const fireRate = Math.max(0.3, 1.0 / stats.fireRate);
            const coolDownMs = 70 * fireRate;
            if (now - lastShootTime < coolDownMs) return;
            lastShootTime = now;

            if (!game.running || game.gameOver || game.levelComplete) return;
            const p = game.player;
            const cx = p.x + p.w / 2;
            const cy = p.y + p.h / 2;
            const dx = targetX - cx;
            const dy = targetY - cy;
            const len = Math.hypot(dx, dy);
            if (len < 10) return;
            const weapon = WEAPONS[p.weapon];
            const count = weapon.spread || 1;
            const damageBonus = 1 + stats.damageBonus;
            const isPierce = weapon.type === 'pierce';
            const isExplode = weapon.type === 'explode';

            for (let i = 0; i < count; i++) {
                const angle = Math.atan2(dy, dx) + (i - (count - 1) / 2) * 0.25;
                const speed = game.skillActive && game.skillType === 0 ? weapon.speed * 0.4 : weapon.speed;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                game.bullets.push({
                    x: cx,
                    y: cy,
                    vx: vx,
                    vy: vy,
                    r: isPierce ? 4 : (isExplode ? 7 : 5),
                    life: isPierce ? 200 : 130,
                    damage: Math.ceil(weapon.damage * damageBonus),
                    color: weapon.color,
                    type: weapon.type || 'normal',
                    pierceCount: isPierce ? 5 : 1,
                });
            }
            spawnParticles(cx, cy, weapon.color, 4);
            if (now - shootSoundCooldown > 100) {
                playSound('shoot');
                shootSoundCooldown = now;
            }
        }

        // ----- 技能 -----
        function activateSkill() {
            if (game.skillCooldown > 0 || game.skillActive) return;
            const skill = SKILLS[currentSkill];
            game.skillActive = true;
            game.skillTimer = skill.duration;
            game.skillCooldown = skill.cooldown;
            game.skillType = currentSkill;
            playSound('skill');

            switch (currentSkill) {
                case 0:
                    spawnParticles(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, '#44ff88', 30, 2);
                    break;
                case 1:
                    const p = game.player;
                    const dashDist = 80;
                    const dir = p.facing;
                    p.x += dir * dashDist;
                    p.x = Math.max(0, Math.min(game.mapWidth - p.w, p.x));
                    spawnParticles(p.x + p.w / 2, p.y + p.h / 2, '#aa44ff', 30, 3);
                    for (const e of game.enemies) {
                        if (e.y > game.mapHeight + 50) continue;
                        if (Math.abs(e.x - p.x) < 120 && Math.abs(e.y - p.y) < 60) {
                            e.hp -= 5 + stats.damageBonus * 2;
                            if (e.hp <= 0) {
                                e.y = game.mapHeight + 100;
                                spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                                playSound('kill');
                                game.totalKills++;
                                addExp(e.expReward || 10);
                            } else {
                                e.hitFlash = 15;
                            }
                        }
                    }
                    break;
                case 2:
                    game.hp = Math.min(game.player.maxHp, game.hp + 20);
                    spawnParticles(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, '#44ff88', 40, 2);
                    playSound('heal');
                    break;
                case 3:
                    spawnParticles(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, '#ffff44', 40, 3);
                    game.thunderTimer = 60;
                    playSound('thunder');
                    thunderStrike();
                    break;
            }
            updateUI();
        }

        function thunderStrike() {
            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;
                const tx = e.x + Math.random() * 60 - 30;
                const ty = e.y - 20;
                spawnExplosion(tx, ty, '#ffff44', 20);
                if (dist(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, tx, ty) < 100) {
                    e.hp -= 8 + stats.damageBonus * 2;
                    if (e.hp <= 0) {
                        e.y = game.mapHeight + 100;
                        spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                        playSound('kill');
                        game.totalKills++;
                        addExp(e.expReward || 10);
                    } else {
                        e.hitFlash = 15;
                    }
                }
            }
            if (game.isBoss && game.boss && game.boss.hp > 0) {
                const b = game.boss;
                const tx = b.x + b.w / 2 + Math.random() * 40 - 20;
                const ty = b.y + b.h / 2;
                spawnExplosion(tx, ty, '#ffff44', 30);
                b.hp -= 5 + stats.damageBonus * 1.5;
                updateBossUI();
                if (b.hp <= 0) bossDefeated();
            }
            game.screenShake = 8;
        }

        // ----- 玩家更新（包含怪物特色行为） -----
        function updatePlayer() {
            const p = game.player;
            const keys = game.keysPressed;

            if (p.invincible > 0) p.invincible--;

            if (p.healTimer > 0) {
                p.healTimer--;
                if (p.healTimer % 10 === 0) {
                    game.hp = Math.min(p.maxHp, game.hp + 5);
                    spawnParticles(p.x + p.w / 2, p.y + p.h / 2, '#44ff88', 2);
                }
            }

            if (game.skillCooldown > 0) {
                game.skillCooldown--;
            }
            if (game.skillActive) {
                game.skillTimer--;
                if (game.skillTimer <= 0) {
                    game.skillActive = false;
                    if (game.skillType === 3) {
                        game.thunderTimer = 0;
                    }
                }
            }

            if (game.thunderTimer > 0) {
                game.thunderTimer--;
                if (game.thunderTimer % 10 === 0) {
                    thunderStrike();
                }
            }

            let moveX = 0;
            if (keys.left || game.touchLeft) moveX = -1;
            if (keys.right || game.touchRight) moveX = 1;
            if (Math.abs(joystickDX) > 0.1) {
                moveX = joystickDX;
            }

            if (moveX < 0) { p.vx = -p.speed * Math.min(1, Math.abs(moveX));
                p.facing = -1; } else if (moveX > 0) { p.vx = p.speed * Math.min(1, Math.abs(moveX));
                p.facing = 1; } else { p.vx *= FRICTION; if (Math.abs(p.vx) < 0.1) p.vx = 0; }

            const jumpRequest = keys.up || game.touchJump || (joystickDY < -0.5);
            if (jumpRequest) {
                if (p.jumpCount < p.maxJumps) {
                    const power = p.jumpCount === 0 ? p.jumpPower : p.jumpPower * (0.85 - p.jumpCount * 0.06);
                    p.vy = power;
                    p.jumpCount++;
                    p.onGround = false;
                    spawnParticles(p.x + p.w / 2, p.y + p.h, '#9b6bff', 6);
                    playSound('jump');
                    if (keys.up) game.keysPressed.up = false;
                    if (game.touchJump) game.touchJump = false;
                }
            }

            p.vy += GRAVITY;
            if (p.vy > 13) p.vy = 13;

            p.x += p.vx;
            if (p.x < 0) p.x = 0;
            if (p.x + p.w > game.mapWidth) p.x = game.mapWidth - p.w;

            p.y += p.vy;
            p.onGround = false;
            for (const plat of game.platforms) {
                if (rectCollide(p, plat)) {
                    if (p.vy > 0) {
                        p.y = plat.y - p.h;
                        p.vy = 0;
                        p.onGround = true;
                        p.jumpCount = 0;
                    } else if (p.vy < 0) {
                        p.y = plat.y + plat.h;
                        p.vy = 0;
                    }
                }
            }
            if (p.y > game.mapHeight + 50) { takeDamage(50); return; }

            if (game.frame % 2 === 0) {
                p.trail.push({ x: p.x, y: p.y, life: 20 });
                if (p.trail.length > 15) p.trail.shift();
            }
            for (let i = p.trail.length - 1; i >= 0; i--) {
                p.trail[i].life--;
                if (p.trail[i].life <= 0) p.trail.splice(i, 1);
            }

            // 收集钥匙
            for (const key of game.keys) {
                if (key.collected) continue;
                if (dist(p.x + p.w / 2, p.y + p.h / 2, key.x, key.y) < 26) {
                    key.collected = true;
                    game.keysCollected++;
                    spawnParticles(key.x, key.y, '#f7d44a', 20);
                    playSound('key');
                    addExp(5);
                    updateUI();
                }
            }

            // 拾取物品
            for (let i = game.items.length - 1; i >= 0; i--) {
                const item = game.items[i];
                if (dist(p.x + p.w / 2, p.y + p.h / 2, item.x, item.y) < 25) {
                    if (item.type === 'heal') {
                        p.healTimer = 240;
                        spawnParticles(item.x, item.y, '#44ff88', 15);
                        playSound('heal');
                        addExp(5);
                        game.items.splice(i, 1);
                        updateUI();
                    } else if (item.type === 'weapon') {
                        p.weapon = item.weaponIdx;
                        spawnParticles(item.x, item.y, '#ffaa44', 20);
                        playSound('weapon');
                        addExp(10);
                        game.items.splice(i, 1);
                        updateUI();
                    }
                }
            }

            // 出口
            if (game.keysCollected >= game.totalKeys) {
                if (rectCollide(p, game.exit)) {
                    game.levelComplete = true;
                    addExp(50);
                    let nl = game.level + 1;
                    if (nl >= game.maxLevel) {
                        nl = 0;
                        game.totalCycles++;
                        if (game.infiniteMode) {
                            showMessage(t('infiniteStart'), t('infiniteSub'));
                        } else {
                            game.running = false;
                            showMessage(t('victory'), t('victorySub'));
                            return;
                        }
                    }
                    const nextLevel = nl + 1 + game.totalCycles * 5;
                    showMessage(t('levelComplete'), t('levelCompleteSub', { n: nextLevel }));
                    setTimeout(() => {
                        msgOverlay.classList.remove('show');
                        game.level = nl;
                        loadLevel(nl);
                        game.levelComplete = false;
                        updateUI();
                    }, 1200);
                }
            }

            // ---- 怪物碰撞（特色行为） ----
            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;

                // 毒爆虫：死亡爆炸
                if (e.explode && e.hp > 0) {
                    const d = dist(p.x + p.w / 2, p.y + p.h / 2, e.x + e.w / 2, e.y + e.h / 2);
                    if (d < 60) {
                        spawnExplosion(e.x + e.w / 2, e.y + e.h / 2, '#88cc33', 40);
                        game.screenShake = 10;
                        if (d < 45) {
                            takeDamage(e.damage);
                            if (game.hp <= 0) { gameOver(); return; }
                        }
                        e.y = game.mapHeight + 100;
                        playSound('kill');
                        continue;
                    }
                }

                if (rectCollide(p, e)) {
                    if (p.vy > 0 && p.y + p.h - e.y < 20) {
                        // 踩扁
                        e.y = game.mapHeight + 100;
                        p.vy = p.jumpPower * 0.6;
                        p.jumpCount = 0;
                        spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 30);
                        playSound('kill');
                        game.totalKills++;
                        addExp(e.expReward || 10);
                        // 史莱姆分裂
                        if (e.split && e.hp > 1) {
                            for (let s = 0; s < 2; s++) {
                                const size2 = e.w * 0.6;
                                game.enemies.push({
                                    x: e.x + s * 30 - 10,
                                    y: e.y + 20,
                                    w: size2,
                                    h: size2,
                                    type: e.type,
                                    name: e.name,
                                    color: e.color,
                                    glow: e.glow,
                                    level: e.level,
                                    hp: Math.ceil(e.maxHp / 2),
                                    maxHp: Math.ceil(e.maxHp / 2),
                                    vx: (0.4 + Math.random() * 0.4) * (s === 0 ? 1 : -1),
                                    speed: e.speed * 1.2,
                                    minX: 10,
                                    maxX: game.mapWidth - 10,
                                    startY: e.y + 20,
                                    damage: e.damage * 0.6,
                                    hitFlash: 0,
                                    aggroRange: e.aggroRange,
                                    expReward: Math.ceil(e.expReward / 2),
                                    split: false,
                                    ranged: false,
                                    stealth: false,
                                    explode: false,
                                    slow: false,
                                    shootTimer: 0,
                                    stealthTimer: 0,
                                    isStealthed: false,
                                });
                            }
                        }
                        if (Math.random() < 0.2) {
                            game.items.push({ type: 'heal', x: e.x + e.w / 2, y: e.y - 30, r: 12, value: 20 });
                        }
                    } else if (p.invincible <= 0) {
                        takeDamage(e.damage || 10);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
            }

            // Boss
            if (game.isBoss && game.boss && game.boss.hp > 0) {
                const b = game.boss;
                if (rectCollide(p, b)) {
                    if (p.vy > 0 && p.y + p.h - b.y < 30) {
                        b.hp -= 2;
                        b.hitCooldown = 15;
                        p.vy = p.jumpPower * 0.6;
                        p.jumpCount = 0;
                        spawnBlood(b.x + b.w / 2, b.y + 10, 30);
                        playSound('boss_hit');
                        game.screenShake = 12;
                        updateBossUI();
                        if (b.hp <= 0) bossDefeated();
                    } else if (p.invincible <= 0) {
                        takeDamage(30);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
                updateBossAI();
            }

            // 子弹更新
            const timeScale = game.skillActive && game.skillType === 0 ? 0.6 : 1.0;
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const bull = game.bullets[i];
                bull.x += bull.vx * timeScale;
                bull.y += bull.vy * timeScale;
                bull.life--;
                if (bull.x < -20 || bull.x > game.mapWidth + 20 || bull.y < -20 || bull.y > game.mapHeight + 20 || bull
                    .life <= 0) {
                    game.bullets.splice(i, 1);
                    continue;
                }
                let hit = false;

                if (bull.type === 'explode') {
                    let exploded = false;
                    for (const e of game.enemies) {
                        if (e.y > game.mapHeight + 50) continue;
                        if (dist(bull.x, bull.y, e.x + e.w / 2, e.y + e.h / 2) < bull.r + 20) {
                            e.hp -= bull.damage;
                            if (e.hp <= 0) {
                                e.y = game.mapHeight + 100;
                                spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                                playSound('kill');
                                game.totalKills++;
                                addExp(e.expReward || 10);
                                if (e.split && e.hp > 1) {
                                    // 分裂逻辑（同上）
                                    for (let s = 0; s < 2; s++) {
                                        const size2 = e.w * 0.6;
                                        game.enemies.push({
                                            x: e.x + s * 30 - 10,
                                            y: e.y + 20,
                                            w: size2,
                                            h: size2,
                                            type: e.type,
                                            name: e.name,
                                            color: e.color,
                                            glow: e.glow,
                                            level: e.level,
                                            hp: Math.ceil(e.maxHp / 2),
                                            maxHp: Math.ceil(e.maxHp / 2),
                                            vx: (0.4 + Math.random() * 0.4) * (s === 0 ? 1 : -1),
                                            speed: e.speed * 1.2,
                                            minX: 10,
                                            maxX: game.mapWidth - 10,
                                            startY: e.y + 20,
                                            damage: e.damage * 0.6,
                                            hitFlash: 0,
                                            aggroRange: e.aggroRange,
                                            expReward: Math.ceil(e.expReward / 2),
                                            split: false,
                                            ranged: false,
                                            stealth: false,
                                            explode: false,
                                            slow: false,
                                            shootTimer: 0,
                                            stealthTimer: 0,
                                            isStealthed: false,
                                        });
                                    }
                                }
                            } else {
                                e.hitFlash = 10;
                            }
                            exploded = true;
                        }
                    }
                    if (exploded) {
                        spawnExplosion(bull.x, bull.y, '#ff8833', 30);
                        game.screenShake = 6;
                        if (game.isBoss && game.boss && game.boss.hp > 0) {
                            const b = game.boss;
                            if (dist(bull.x, bull.y, b.x + b.w / 2, b.y + b.h / 2) < 60) {
                                b.hp -= bull.damage;
                                updateBossUI();
                                if (b.hp <= 0) bossDefeated();
                            }
                        }
                        game.bullets.splice(i, 1);
                        continue;
                    }
                }

                for (const e of game.enemies) {
                    if (e.y > game.mapHeight + 50) continue;
                    if (dist(bull.x, bull.y, e.x + e.w / 2, e.y + e.h / 2) < bull.r + 12) {
                        e.hp -= bull.damage;
                        if (e.hp <= 0) {
                            e.y = game.mapHeight + 100;
                            spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                            playSound('kill');
                            game.totalKills++;
                            addExp(e.expReward || 10);
                            if (e.split && e.hp > 1) {
                                for (let s = 0; s < 2; s++) {
                                    const size2 = e.w * 0.6;
                                    game.enemies.push({
                                        x: e.x + s * 30 - 10,
                                        y: e.y + 20,
                                        w: size2,
                                        h: size2,
                                        type: e.type,
                                        name: e.name,
                                        color: e.color,
                                        glow: e.glow,
                                        level: e.level,
                                        hp: Math.ceil(e.maxHp / 2),
                                        maxHp: Math.ceil(e.maxHp / 2),
                                        vx: (0.4 + Math.random() * 0.4) * (s === 0 ? 1 : -1),
                                        speed: e.speed * 1.2,
                                        minX: 10,
                                        maxX: game.mapWidth - 10,
                                        startY: e.y + 20,
                                        damage: e.damage * 0.6,
                                        hitFlash: 0,
                                        aggroRange: e.aggroRange,
                                        expReward: Math.ceil(e.expReward / 2),
                                        split: false,
                                        ranged: false,
                                        stealth: false,
                                        explode: false,
                                        slow: false,
                                        shootTimer: 0,
                                        stealthTimer: 0,
                                        isStealthed: false,
                                    });
                                }
                            }
                            if (Math.random() < 0.15) {
                                game.items.push({ type: 'heal', x: e.x + e.w / 2, y: e.y - 30, r: 12, value: 20 });
                            }
                        } else {
                            e.hitFlash = 10;
                            spawnParticles(bull.x, bull.y, '#ffaa44', 5);
                        }
                        hit = true;
                        if (bull.type !== 'pierce') break;
                        bull.pierceCount--;
                        if (bull.pierceCount <= 0) { hit = true; break; }
                    }
                }
                if (hit && bull.type === 'pierce') continue;
                if (hit) { game.bullets.splice(i, 1); continue; }

                if (!hit && game.isBoss && game.boss && game.boss.hp > 0 && bull.type !== 'explode') {
                    const b = game.boss;
                    if (bull.x > b.x && bull.x < b.x + b.w && bull.y > b.y && bull.y < b.y + b.h) {
                        b.hp -= bull.damage;
                        b.hitCooldown = 10;
                        spawnBlood(bull.x, bull.y, 10);
                        playSound('boss_hit');
                        game.screenShake = 8;
                        updateBossUI();
                        hit = true;
                        if (b.hp <= 0) bossDefeated();
                        if (bull.type !== 'pierce') game.bullets.splice(i, 1);
                    }
                }
                if (hit && bull.type === 'pierce') {
                    bull.pierceCount--;
                    if (bull.pierceCount <= 0) game.bullets.splice(i, 1);
                } else if (hit) {
                    game.bullets.splice(i, 1);
                }
            }

            const enemyTimeScale = game.skillActive && game.skillType === 0 ? 0.4 : 1.0;
            updateEnemies(enemyTimeScale);
            updateParticles();
            updateUI();
        }

        // ----- 敌人AI（包含特色行为） -----
        function updateEnemies(timeScale = 1.0) {
            const p = game.player;
            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;

                // 暗影刺客：隐身闪现
                if (e.stealth) {
                    e.stealthTimer--;
                    if (e.stealthTimer <= 0) {
                        e.isStealthed = !e.isStealthed;
                        e.stealthTimer = 60 + Math.random() * 60;
                        if (e.isStealthed) {
                            const angle = Math.random() * Math.PI * 2;
                            const dist2 = 60 + Math.random() * 80;
                            e.x = p.x + p.w / 2 + Math.cos(angle) * dist2 - e.w / 2;
                            e.y = p.y + p.h / 2 + Math.sin(angle) * dist2 - e.h / 2;
                            e.x = Math.max(0, Math.min(game.mapWidth - e.w, e.x));
                            e.y = Math.max(20, Math.min(game.mapHeight - 40, e.y));
                            spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#6633cc', 15);
                        }
                    }
                    if (e.isStealthed) continue;
                }

                // 远程怪物攻击
                if (e.ranged) {
                    const d = dist(p.x + p.w / 2, p.y + p.h / 2, e.x + e.w / 2, e.y + e.h / 2);
                    if (d < e.aggroRange) {
                        e.shootTimer--;
                        if (e.shootTimer <= 0) {
                            e.shootTimer = 35 + Math.random() * 30;
                            const angle = Math.atan2(p.y + p.h / 2 - (e.y + e.h / 2), p.x + p.w / 2 - (e.x + e.w / 2));
                            const speed = 2.5 + e.level * 0.4;
                            const color = e.type === 'imp' ? '#ff6633' : (e.type === 'crystal' ? '#aa66ff' : '#ccccdd');
                            const size = e.type === 'crystal' ? 6 : 5;
                            // 水晶构造体：追踪弹
                            let vx = Math.cos(angle) * speed;
                            let vy = Math.sin(angle) * speed;
                            if (e.type === 'crystal') {
                                // 追踪效果：稍微瞄准玩家当前位置
                                const dx2 = p.x + p.w / 2 - (e.x + e.w / 2);
                                const dy2 = p.y + p.h / 2 - (e.y + e.h / 2);
                                const d2 = Math.hypot(dx2, dy2);
                                if (d2 > 0) {
                                    vx = (dx2 / d2) * speed;
                                    vy = (dy2 / d2) * speed;
                                }
                            }
                            game.bullets.push({
                                x: e.x + e.w / 2,
                                y: e.y + e.h / 2,
                                vx: vx,
                                vy: vy,
                                r: size,
                                life: 120,
                                damage: e.damage * 0.4,
                                color: color,
                                type: 'normal',
                                isEnemy: true,
                            });
                            spawnParticles(e.x + e.w / 2, e.y + e.h / 2, color, 5);
                        }
                    }
                }

                // 普通移动
                const dx = p.x + p.w / 2 - (e.x + e.w / 2);
                const dy = p.y + p.h / 2 - (e.y + e.h / 2);
                const d = Math.hypot(dx, dy);
                const slowMult = (e.slow && p.invincible <= 0) ? 0.5 : 1.0;

                if (d < e.aggroRange && d > 20) {
                    e.x += Math.sign(dx) * e.speed * 0.6 * timeScale * slowMult;
                    if (e.level >= 1 && Math.random() < 0.01 * timeScale) e.y -= 4 * timeScale;
                    if (e.x < 0) e.x = 0;
                    if (e.x > game.mapWidth - e.w) e.x = game.mapWidth - e.w;
                } else {
                    e.x += e.vx * e.speed * timeScale * slowMult;
                    if (e.x < e.minX || e.x > e.maxX) e.vx *= -1;
                }
                // 特殊浮动
                if (e.type === 'frost') {
                    // 冰霜行者走路带冰霜特效
                    if (game.frame % 10 === 0) {
                        spawnParticles(e.x + e.w / 2, e.y + e.h, '#88ddff', 2);
                    }
                }
                if (e.type === 'wraith') {
                    e.y = e.startY + Math.sin(game.frame * 0.04 + e.x * 0.1) * 8;
                }
                if (e.type === 'slime') {
                    // 史莱姆跳着移动
                    if (game.frame % 8 === 0 && d < 200) {
                        e.y -= 2;
                    }
                }
                if (e.hitFlash > 0) e.hitFlash--;
            }

            // 敌方子弹碰撞
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const bull = game.bullets[i];
                if (!bull.isEnemy) continue;
                if (bull.x < -20 || bull.x > game.mapWidth + 20 || bull.y < -20 || bull.y > game.mapHeight + 20 || bull
                    .life <= 0) {
                    game.bullets.splice(i, 1);
                    continue;
                }
                const p = game.player;
                if (dist(p.x + p.w / 2, p.y + p.h / 2, bull.x, bull.y) < bull.r + 12) {
                    if (p.invincible <= 0) {
                        takeDamage(bull.damage || 10);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                    game.bullets.splice(i, 1);
                }
            }
        }

        // ----- Boss AI（保留） -----
        function updateBossAI() {
            const b = game.boss;
            if (!b || b.hp <= 0) return;
            const p = game.player;
            const dx = p.x + p.w / 2 - (b.x + b.w / 2);
            const dy = p.y + p.h / 2 - (b.y + b.h / 2);
            const d = Math.hypot(dx, dy);
            const timeScale = game.skillActive && game.skillType === 0 ? 0.5 : 1.0;
            const type = b.type || BOSS_TYPES[0];

            if (d > 120) {
                b.x += Math.sign(dx) * 0.5 * timeScale;
                b.y += Math.sign(dy) * 0.3 * timeScale;
            }
            b.x = Math.max(20, Math.min(game.mapWidth - b.w - 20, b.x));
            b.y = Math.max(50, Math.min(450, b.y));

            b.timer++;
            let fireRate = 35 - Math.floor((b.maxHp - b.hp) / 6);
            if (fireRate < 12) fireRate = 12;

            if (b.timer > fireRate / timeScale) {
                b.timer = 0;
                const angle = Math.atan2(dy, dx);
                const speed = (2.0 + (1 - b.hp / b.maxHp) * 2.0) * timeScale;

                switch (type.attackType) {
                    case 'spray':
                        for (let i = -3; i <= 3; i++) {
                            const a = angle + i * 0.15;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed,
                                vy: Math.sin(a) * speed,
                                r: 8,
                                color: type.bulletColor || '#44ff44',
                            });
                        }
                        break;
                    case 'scatter':
                        for (let i = 0; i < 6; i++) {
                            const a = (i / 6) * Math.PI * 2 + game.frame * 0.02;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed * 0.8,
                                vy: Math.sin(a) * speed * 0.8,
                                r: 6,
                                color: type.bulletColor || '#cc66ff',
                            });
                        }
                        break;
                    case 'ring':
                        for (let i = 0; i < 10; i++) {
                            const a = (i / 10) * Math.PI * 2 + game.frame * 0.015;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed * 1.2,
                                vy: Math.sin(a) * speed * 1.2,
                                r: 7,
                                color: type.bulletColor || '#ff6633',
                            });
                        }
                        break;
                    case 'cone':
                        for (let i = -4; i <= 4; i++) {
                            const a = angle + i * 0.12;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed * 0.9,
                                vy: Math.sin(a) * speed * 0.9,
                                r: 5,
                                color: type.bulletColor || '#66ddff',
                            });
                        }
                        break;
                    case 'nova':
                    default:
                        for (let i = 0; i < 12; i++) {
                            const a = (i / 12) * Math.PI * 2 + game.frame * 0.025;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed * 0.6,
                                vy: Math.sin(a) * speed * 0.6,
                                r: 4,
                                color: type.bulletColor || '#aa44ff',
                            });
                        }
                        break;
                }

                if (b.hp < b.maxHp * 0.3) {
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2 + game.frame * 0.03;
                        b.bullets.push({
                            x: b.x + b.w / 2,
                            y: b.y + b.h / 2,
                            vx: Math.cos(a) * speed * 0.5,
                            vy: Math.sin(a) * speed * 0.5,
                            r: 4,
                            color: '#ffffff',
                        });
                    }
                }
            }

            for (let i = b.bullets.length - 1; i >= 0; i--) {
                const bull = b.bullets[i];
                bull.x += bull.vx;
                bull.y += bull.vy;
                if (bull.x < -30 || bull.x > game.mapWidth + 30 || bull.y < -30 || bull.y > game.mapHeight + 30) {
                    b.bullets.splice(i, 1);
                    continue;
                }
                if (dist(p.x + p.w / 2, p.y + p.h / 2, bull.x, bull.y) < bull.r + 12) {
                    if (p.invincible <= 0) {
                        takeDamage(20);
                        b.bullets.splice(i, 1);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
            }
            if (b.hitCooldown > 0) b.hitCooldown--;
        }

        function bossDefeated() {
            const b = game.boss;
            spawnBlood(b.x + b.w / 2, b.y + b.h / 2, 80);
            spawnExplosion(b.x + b.w / 2, b.y + b.h / 2, '#ff8833', 50);
            game.screenShake = 25;
            playSound('death');
            addExp(b.expReward || 50);
            game.boss = null;
            game.isBoss = false;
            game.items.push({ type: 'heal', x: b.x + 20, y: b.y + 10, r: 12, value: 20 });
            game.items.push({ type: 'weapon', weaponIdx: Math.floor(Math.random() * WEAPONS.length), x: b.x + b.w - 30, y: b
                    .y + 10, r: 14 });
            bossHpBar.style.display = 'none';
            bossNameSpan.style.display = 'none';
            const bossName = b.type?.desc || 'Boss';
            showMessage(t('bossDefeated'), t('bossDefeatedSub', { name: bossName }));
            setTimeout(() => { msgOverlay.classList.remove('show'); }, 1500);
        }

        // ----- 伤害/死亡 -----
        function takeDamage(amount) {
            if (game.player.invincible > 0) return;
            game.hp -= amount;
            game.player.invincible = 30;
            game.screenShake = 8;
            playSound('damage');
            spawnBlood(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, 20);
            if (game.hp <= 0) { game.hp = 0;
                gameOver(); }
            updateUI();
        }

        function gameOver() {
            game.running = false;
            game.gameOver = true;
            playSound('death');
            showMessage(t('gameOver'), t('restart'));
        }

        function showMessage(title, sub = '') {
            msgText.innerHTML = `${title}<div id="msgSub">${sub}</div>`;
            msgOverlay.classList.add('show');
        }

        // ----- 绘制怪物（8种特色外观） -----
        function drawMonster(e) {
            const flash = e.hitFlash > 0;
            const size = e.w;
            const cx = e.x + size / 2;
            const cy = e.y + size / 2;

            // 隐身刺客：隐身状态半透明
            if (e.stealth && e.isStealthed) {
                ctx.globalAlpha = 0.2;
            }

            ctx.shadowColor = e.glow || '#ff4444';
            ctx.shadowBlur = 20;

            switch (e.type) {
                case 'slime':
                    // 腐化史莱姆 - 绿色粘液球
                    ctx.fillStyle = flash ? '#88ff88' : (e.color || '#44aa44');
                    ctx.beginPath();
                    ctx.arc(cx, cy + 2, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    // 眼睛
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 1, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 1, 2, 0, Math.PI * 2);
                    ctx.fill();
                    // 粘液滴
                    ctx.fillStyle = e.color + '66';
                    ctx.shadowBlur = 10;
                    for (let i = 0; i < 3; i++) {
                        const dx = Math.sin(game.frame * 0.05 + i * 2) * 6;
                        const dy = 4 + Math.sin(game.frame * 0.07 + i * 3) * 2;
                        ctx.beginPath();
                        ctx.arc(cx + dx - 6 + i * 6, cy + size / 2 + dy, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;

                case 'frost':
                    // 冰霜行者 - 冰蓝色，带冰晶
                    ctx.fillStyle = flash ? '#88ddff' : (e.color || '#44ccff');
                    ctx.beginPath();
                    ctx.roundRect(e.x + 2, e.y + 2, size - 4, size - 4, 6);
                    ctx.fill();
                    // 冰晶装饰
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = '#88ddff66';
                    for (let i = 0; i < 4; i++) {
                        const angle = i * Math.PI / 2 + game.frame * 0.02;
                        const dx = Math.cos(angle) * size * 0.4;
                        const dy = Math.sin(angle) * size * 0.4;
                        ctx.beginPath();
                        ctx.arc(cx + dx, cy + dy, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // 眼睛
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#004466';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#88ddff';
                    ctx.beginPath();
