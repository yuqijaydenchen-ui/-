        function receiveSyncData(data) {
            if (!data || !data.type) return;
            const g = game;

            if (data.type === 'fullSync') {
                g.otherPlayer.x = data.px || 150;
                g.otherPlayer.y = data.py || 300;
                g.otherPlayer.hp = data.hp || 100;
                g.otherPlayer.maxHp = data.maxHp || 100;
                g.otherPlayer.facing = data.facing || 1;
                g.otherPlayer.weapon = data.weapon || 0;
                g.otherPlayer.jumpCount = data.jumpCount || 0;
                g.otherPlayer.maxJumps = data.maxJumps || 3;
                g.otherPlayer.gold = data.gold || 0;
                g.otherPlayer.gems = data.gems || 0;
                g.otherPlayer.level = data.level || 1;
                g.otherPlayer.exp = data.exp || 0;
                g.otherPlayer.expToNext = data.expToNext || 20;
                g.otherPlayer.statPoints = data.statPoints || 0;
                g.otherPlayer.stats = data.stats || {};
                g.otherPlayer.unlockedSkills = data.unlockedSkills || [];
                g.otherPlayer.alive = true;

                if (!isHost) {
                    g.keysCollected = data.keysCollected || 0;
                    g.totalKeys = data.totalKeys || 0;
                    g.level = data.level || 0;
                    g.totalCycles = data.totalCycles || 0;
                    g.world = data.world || 0;
                    g.enemies = data.enemies || [];
                    g.boss = data.boss ? { ...data.boss, bullets: [], timer: data.boss.timer || 0 } : null;
                    g.isBoss = data.isBoss || false;
                    g.keys = data.keys || [];
                    g.items = data.items || [];
                    g.bullets = (data.bullets || []).concat(data.enemyBullets || []);
                    g.exit = data.exit || { x: 740, y: 60, w: 30, h: 38 };
                    g.platforms = data.platforms || [];
                    g.mapWidth = data.mapWidth || W;
                    g.mapHeight = data.mapHeight || H;
                    g.levelComplete = data.levelComplete || false;
                    g.bossSpawned = data.bossSpawned || false;
                    g.totalKills = data.totalKills || 0;
                    g.terrainType = data.terrainType || 0;
                }
                updateUI();
                updateStatUI();
                if (g.isBoss && g.boss) {
                    bossHpBar.style.display = 'flex';
                    updateBossUI();
                } else {
                    bossHpBar.style.display = 'none';
                    bossNameSpan.style.display = 'none';
                }
                msgOverlay.classList.remove('show');
                return;
            }

            if (data.type === 'incSync' || data.type === 'state') {
                if (data.px !== undefined) g.otherPlayer.x = data.px;
                if (data.py !== undefined) g.otherPlayer.y = data.py;
                if (data.hp !== undefined) g.otherPlayer.hp = data.hp;
                if (data.maxHp !== undefined) g.otherPlayer.maxHp = data.maxHp;
                if (data.facing !== undefined) g.otherPlayer.facing = data.facing;
                if (data.weapon !== undefined) g.otherPlayer.weapon = data.weapon;
                if (data.jumpCount !== undefined) g.otherPlayer.jumpCount = data.jumpCount;
                if (data.maxJumps !== undefined) g.otherPlayer.maxJumps = data.maxJumps;
                if (data.gold !== undefined) g.otherPlayer.gold = data.gold;
                if (data.gems !== undefined) g.otherPlayer.gems = data.gems;
                if (data.level !== undefined) g.otherPlayer.level = data.level;
                if (data.exp !== undefined) g.otherPlayer.exp = data.exp;
                if (data.expToNext !== undefined) g.otherPlayer.expToNext = data.expToNext;
                if (data.statPoints !== undefined) g.otherPlayer.statPoints = data.statPoints;
                if (data.stats !== undefined) g.otherPlayer.stats = data.stats;
                if (data.unlockedSkills !== undefined) g.otherPlayer.unlockedSkills = data.unlockedSkills;
                g.otherPlayer.alive = true;

                if (!isHost) {
                    if (data.keysCollected !== undefined) g.keysCollected = data.keysCollected;
                    if (data.totalKeys !== undefined) g.totalKeys = data.totalKeys;
                    if (data.totalKills !== undefined) g.totalKills = data.totalKills;
                    if (data.levelComplete !== undefined) g.levelComplete = data.levelComplete;
                    if (data.isBoss !== undefined) g.isBoss = data.isBoss;

                    if (data.enemies) {
                        for (let i = 0; i < Math.min(data.enemies.length, g.enemies.length); i++) {
                            if (data.enemies[i]) {
                                g.enemies[i].x = data.enemies[i].x;
                                g.enemies[i].y = data.enemies[i].y;
                                g.enemies[i].hp = data.enemies[i].hp;
                                g.enemies[i].hitFlash = data.enemies[i].hitFlash || 0;
                                g.enemies[i].isStealthed = data.enemies[i].isStealthed || false;
                                g.enemies[i].shootTimer = data.enemies[i].shootTimer || 0;
                            }
                        }
                    }

                    if (data.boss && g.boss) {
                        g.boss.x = data.boss.x;
                        g.boss.y = data.boss.y;
                        g.boss.hp = data.boss.hp;
                        g.boss.hitCooldown = data.boss.hitCooldown || 0;
                        updateBossUI();
                    }

                    if (data.bullets) {
                        for (const b of data.bullets) {
                            g.bullets.push({
                                x: b.x,
                                y: b.y,
                                vx: b.vx || 0,
                                vy: b.vy || 0,
                                r: b.r || 5,
                                damage: b.damage || 1,
                                color: b.color || '#6bcbff',
                                type: b.type || 'normal',
                                life: b.life || 120,
                                pierceCount: b.pierceCount || 1,
                                isEnemy: false,
                            });
                        }
                        if (g.bullets.length > 200) g.bullets.splice(0, 50);
                    }
                    if (data.enemyBullets) {
                        for (const b of data.enemyBullets) {
                            g.bullets.push({
                                x: b.x,
                                y: b.y,
                                vx: b.vx || 0,
                                vy: b.vy || 0,
                                r: b.r || 5,
                                damage: b.damage || 10,
                                color: b.color || '#ff4444',
                                life: b.life || 120,
                                isEnemy: true,
                            });
                        }
                        if (g.bullets.length > 200) g.bullets.splice(0, 50);
                    }

                    if (data.items) {
                        g.items = data.items;
                    }
                    if (data.keys) {
                        for (let i = 0; i < Math.min(data.keys.length, g.keys.length); i++) {
                            if (data.keys[i]) {
                                g.keys[i].collected = data.keys[i].collected;
                            }
                        }
                    }
                }

                updateUI();
                if (g.isBoss && g.boss) {
                    bossHpBar.style.display = 'flex';
                    updateBossUI();
                }
                return;
            }

            if (data.type === 'requestSync' && isHost) {
                sendFullSync();
            }
        }

        function syncLoop() {
            if (!isConnected || !conn) return;
            syncCounter++;
            if (syncCounter % 6 === 0) {
                sendIncrementalSync();
            }
            if (syncCounter % 60 === 0) {
                sendFullSync();
            }
        }

        function toggleGameMode() {
            if (gameMode === 'coop') {
                gameMode = 'pvp';
                document.getElementById('modeToggle').textContent = t('modePvp');
                document.getElementById('modeToggle').style.borderColor = '#ff4444';
                document.getElementById('modeToggle').style.color = '#ff4444';
                showMessage('⚔️ PVP', '玩家可以互相攻击！');
            } else {
                gameMode = 'coop';
                document.getElementById('modeToggle').textContent = t('modeCoop');
                document.getElementById('modeToggle').style.borderColor = '#44ff88';
                document.getElementById('modeToggle').style.color = '#44ff88';
                showMessage('🤝 合作', '共同对抗怪物！');
            }
            setTimeout(() => msgOverlay.classList.remove('show'), 1200);
        }

        function checkPVPDamage() {
            if (gameMode !== 'pvp') return;
            if (!isConnected) return;
            const p = game.player;
            const op = game.otherPlayer;
            if (!op || !op.alive) return;
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const bull = game.bullets[i];
                if (bull.isEnemy || bull.owner === 'self') continue;
                const d = dist(bull.x, bull.y, op.x + 12, op.y + 15);
                if (d < bull.r + 15) {
                    op.hp -= bull.damage;
                    spawnBlood(op.x + 12, op.y + 15, 15);
                    game.bullets.splice(i, 1);
                    if (op.hp <= 0) {
                        op.alive = false;
                        showMessage(t('pvpKill'), t('pvpKillSub'));
                        setTimeout(() => msgOverlay.classList.remove('show'), 1500);
                    }
                    sendFullSync();
                }
            }
        }

        // ----- 按空格键关闭弹窗 -----
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                var overlay = document.getElementById('msgOverlay');
                if (overlay.classList.contains('show')) {
                    overlay.classList.remove('show');
                    e.preventDefault();
                }
            }
        });

        // ----- 事件绑定 -----
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { game.keysPressed.left = true;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { game.keysPressed.right = true;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === ' ') { game.keysPressed.up = true;
                e.preventDefault(); }
            if (key === 'q' || key === 'Q') { game.player.weapon = (game.player.weapon + 1) % WEAPONS.length;
                    playSound('weapon');
                    updateUI();
                    e.preventDefault(); }
            if (key === 'e' || key === 'E') {
                const available = [0];
                for (let i = 1; i < SKILLS.length; i++) {
                    const skId = SKILL_ID_MAP[i];
                    if (skId && playerData.unlockedSkills.has(skId)) available.push(i);
                }
                const idx = available.indexOf(currentSkill);
                const nextIdx = (idx + 1) % available.length;
                currentSkill = available[nextIdx];
                updateUI();
                e.preventDefault();
            }
            if (key === 'f' || key === 'F') { toggleStatPanel();
                e.preventDefault(); }
            if (key === 't' || key === 'T') { toggleGameMode();
                e.preventDefault(); }
            if (key === ' ') {
                e.preventDefault();
                if (game.gameOver || !game.running) initGame();
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { game.keysPressed.left = false;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { game.keysPressed.right = false;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === ' ') { game.keysPressed.up = false;
                e.preventDefault(); }
        });

        document.getElementById('skillDisplay').addEventListener('click', function() {
            const available = [0];
            for (let i = 1; i < SKILLS.length; i++) {
                const skId = SKILL_ID_MAP[i];
                if (skId && playerData.unlockedSkills.has(skId)) available.push(i);
            }
            const idx = available.indexOf(currentSkill);
            const nextIdx = (idx + 1) % available.length;
            currentSkill = available[nextIdx];
            updateUI();
        });

        document.addEventListener('keydown', (e) => { if (e.key === 'e' || e.key === 'E') activateSkill(); });
        document.getElementById('mobileSkillBtn').addEventListener('touchstart', (e) => { e.preventDefault();
                activateSkill(); });

        infiniteBtn.addEventListener('click', function() {
            game.infiniteMode = !game.infiniteMode;
            this.classList.toggle('active');
            this.textContent = game.infiniteMode ? t('infiniteOn') : t('infiniteOff');
            if (game.infiniteMode) { game.totalCycles = 0;
                    game.level = 0;
                    loadLevel(0);
                    showMessage(t('infiniteStart'), t('infiniteSub'));
                    setTimeout(() => msgOverlay.classList.remove('show'), 1500); }
            updateUI();
        });

        statBtn.addEventListener('click', toggleStatPanel);

        canvas.addEventListener('mousedown', (e) => {
            if (!game.running || game.gameOver || game.levelComplete) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            game._mouseX = mx;
            game._mouseY = my;
            shootBullet(mx, my);
        });
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            game._mouseX = (e.clientX - rect.left) * scaleX;
            game._mouseY = (e.clientY - rect.top) * scaleY;
        });

        document.getElementById('hostBtn').addEventListener('click', createRoom);
        document.getElementById('joinBtn').addEventListener('click', () => {
            const inputField = document.getElementById('roomInput');
            if (inputField.style.display === 'none' || inputField.style.display === '') {
                const code = prompt('请输入6位房间码：');
                if (code && code.length === 6) {
                    document.getElementById('roomInput').value = code.toUpperCase();
                    document.getElementById('roomInput').style.display = 'inline-block';
                    joinRoom();
                } else if (code !== null) {
                    alert('房间码必须是6位字母或数字');
                }
                return;
            }
            const code = inputField.value.toUpperCase().trim();
            if (code.length === 6) {
                joinRoom();
            } else {
                showMessage(t('invalidCode'), t('enterCode'));
                setTimeout(() => msgOverlay.classList.remove('show'), 1200);
            }
        });
        document.getElementById('roomInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('joinBtn').click();
            }
        });
        document.getElementById('modeToggle').addEventListener('click', toggleGameMode);

        document.getElementById('langToggle').addEventListener('click', function() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            this.textContent = currentLang === 'zh' ? '🌐 EN' : '🌐 中文';
            updateAllUI();
            if (game && game.running === false && game.gameOver) showMessage(t('gameOver'), t('restart'));
            if (isConnected) {
                document.getElementById('peerStatus').textContent = t('peerConnected');
                document.getElementById('peerStatus').style.color = '#44ff88';
            } else {
                document.getElementById('peerStatus').textContent = t('peerOffline');
                document.getElementById('peerStatus').style.color = '#8899aa';
            }
            document.getElementById('hostBtn').textContent = t('hostBtn');
            document.getElementById('joinBtn').textContent = t('joinBtn');
            document.getElementById('roomInput').placeholder = t('roomPlaceholder');
            if (gameMode === 'coop') {
                document.getElementById('modeToggle').textContent = t('modeCoop');
            } else {
                document.getElementById('modeToggle').textContent = t('modePvp');
            }
        });

        function updateAllUI() {
            document.getElementById('statTitle') && (document.getElementById('statTitle').textContent = t('statTitle'));
            document.getElementById('statClose') && (document.getElementById('statClose').textContent = t('statClose'));
            document.getElementById('statBtn').textContent = t('statBtn');
            document.getElementById('hint').textContent = t('hint');
            const infBtn = document.getElementById('infiniteToggle');
            if (game && game.infiniteMode) infBtn.textContent = t('infiniteOn');
            else infBtn.textContent = t('infiniteOff');
            document.getElementById('hostBtn').textContent = t('hostBtn');
            document.getElementById('joinBtn').textContent = t('joinBtn');
            document.getElementById('roomInput').placeholder = t('roomPlaceholder');
            document.getElementById('roomInput').style.display = 'inline-block';
            if (isConnected) {
                document.getElementById('peerStatus').textContent = t('peerConnected');
                document.getElementById('peerStatus').style.color = '#44ff88';
            } else {
                document.getElementById('peerStatus').textContent = t('peerOffline');
                document.getElementById('peerStatus').style.color = '#8899aa';
            }
            if (gameMode === 'coop') {
                document.getElementById('modeToggle').textContent = t('modeCoop');
                document.getElementById('modeToggle').style.borderColor = '#44ff88';
                document.getElementById('modeToggle').style.color = '#44ff88';
            } else {
                document.getElementById('modeToggle').textContent = t('modePvp');
                document.getElementById('modeToggle').style.borderColor = '#ff4444';
                document.getElementById('modeToggle').style.color = '#ff4444';
            }
            updateUI();
            updateStatUI();
            updateSkillTreeUI();
        }

        // ----- 主循环 -----
        function gameLoop() {
            if (levelUpTimer > 0) {
                levelUpTimer--;
                if (levelUpTimer < 30) levelUpMsg.style.opacity = levelUpTimer / 30;
                if (levelUpTimer <= 0) levelUpMsg.classList.remove('show');
            }

            if (game.running && !game.gameOver && !game.levelComplete) {
                game.frame++;
                updatePlayer();
                if (game.particles.length > 500) game.particles.splice(0, 150);
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ----- 启动 -----
        initGame();
        setupMobileControls();
        gameLoop();
        updateAllUI();

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'q', 'Q', 'e', 'E', 'f', 'F', 't', 'T'].includes(e
                    .key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('click', () => { initAudio(); }, { once: true });
        window.addEventListener('resize', setupMobileControls);

        console.log('✅ 暗影勇者 · 双人联机版加载完成！');
        console.log('👾 8种特色怪物 | 5种Boss | 7个技能树节点');
        console.log('🪙 各自独立金币/宝石 | 💎 各自独立技能');
        console.log('🎮 两人各自控制各自角色');
        console.log('🤝 默认合作模式，按 T 切换PVP');
        console.log('⌨️ 弹窗显示时，按 空格键 关闭');
    </script>
</body>
</html>
