                    ctx.arc(cx - 4, cy - 3, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 3, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'assassin':
                    // 暗影刺客 - 紫色半透明，飘动
                    ctx.fillStyle = flash ? '#9966ff' : (e.color || '#6633cc');
                    ctx.globalAlpha = e.isStealthed ? 0.2 : 0.8;
                    ctx.beginPath();
                    ctx.arc(cx, cy, size / 2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                    // 飘带
                    ctx.shadowBlur = 25;
                    ctx.fillStyle = e.color + '88';
                    for (let i = -1; i <= 1; i++) {
                        const wx = cx + i * 10 + Math.sin(game.frame * 0.06 + i) * 4;
                        const wy = cy + size / 2 + Math.sin(game.frame * 0.05 + i * 2) * 6;
                        ctx.beginPath();
                        ctx.moveTo(cx + i * 8, cy + size / 2 - 2);
                        ctx.quadraticCurveTo(wx + 3, wy + 4, wx, wy + 10);
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = e.color + '88';
                        ctx.stroke();
                    }
                    // 红色眼睛
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ff0000';
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 2, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 2, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    break;

                case 'imp':
                    // 烈焰小鬼 - 燃烧的火焰
                    ctx.fillStyle = flash ? '#ff8844' : (e.color || '#ff6622');
                    ctx.shadowBlur = 35;
                    ctx.shadowColor = '#ff4400';
                    ctx.beginPath();
                    ctx.arc(cx, cy + 2, size / 2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                    // 火焰头发
                    for (let i = 0; i < 5; i++) {
                        const fx = cx - 8 + i * 4 + Math.sin(game.frame * 0.06 + i) * 3;
                        const fy = cy - size / 2 + 2 + Math.sin(game.frame * 0.07 + i * 2) * 4;
                        ctx.fillStyle = '#ff883366';
                        ctx.shadowBlur = 25;
                        ctx.beginPath();
                        ctx.arc(fx, fy, 5 + Math.sin(game.frame * 0.05 + i) * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // 眼睛
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffff00';
                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ff4400';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 1, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 1, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'bomber':
                    // 毒爆虫 - 黄绿色，鼓胀
                    ctx.fillStyle = flash ? '#aadd44' : (e.color || '#88cc33');
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = '#88cc33';
                    const swell = 1 + Math.sin(game.frame * 0.04) * 0.05;
                    ctx.beginPath();
                    ctx.arc(cx, cy, size / 2 * swell, 0, Math.PI * 2);
                    ctx.fill();
                    // 毒囊斑点
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#66aa22';
                    for (let i = 0; i < 5; i++) {
                        const angle = i * 1.2 + game.frame * 0.01;
                        const dx = Math.cos(angle) * size * 0.3;
                        const dy = Math.sin(angle) * size * 0.3;
                        ctx.beginPath();
                        ctx.arc(cx + dx, cy + dy, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // 眼睛
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 2, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 2, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'crystal':
                    // 水晶构造体 - 紫色发光晶体
                    ctx.fillStyle = flash ? '#cc88ff' : (e.color || '#aa66ff');
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#aa66ff';
                    // 菱形
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - size / 2);
                    ctx.lineTo(cx + size / 2, cy);
                    ctx.lineTo(cx, cy + size / 2);
                    ctx.lineTo(cx - size / 2, cy);
                    ctx.closePath();
                    ctx.fill();
                    // 内部发光
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#ffffff44';
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - size / 4);
                    ctx.lineTo(cx + size / 4, cy);
                    ctx.lineTo(cx, cy + size / 4);
                    ctx.lineTo(cx - size / 4, cy);
                    ctx.closePath();
                    ctx.fill();
                    // 核心
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = '#ffffff88';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'skeleton':
                    // 枯骨守卫 - 暗金色骨架
                    ctx.fillStyle = flash ? '#eeddbb' : (e.color || '#ccbb88');
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ccbb88';
                    // 身体（矩形骨架）
                    ctx.beginPath();
                    ctx.roundRect(e.x + 4, e.y + 6, size - 8, size - 12, 3);
                    ctx.fill();
                    // 肋骨线条
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#aa9966';
                    ctx.lineWidth = 1.5;
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.moveTo(e.x + 6, e.y + 10 + i * 6);
                        ctx.lineTo(e.x + size - 6, e.y + 10 + i * 6);
                        ctx.stroke();
                    }
                    // 头骨
                    ctx.fillStyle = flash ? '#eeddbb' : (e.color || '#ccbb88');
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(cx, cy - 4, size * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                    // 眼洞
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 6, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 4, cy - 6, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    // 盾牌
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#aa8844';
                    ctx.beginPath();
                    ctx.roundRect(e.x + size - 10, e.y + 4, 8, 12, 3);
                    ctx.fill();
                    ctx.fillStyle = '#886633';
                    ctx.beginPath();
                    ctx.roundRect(e.x + size - 8, e.y + 6, 4, 8, 2);
                    ctx.fill();
                    break;

                case 'wraith':
                    // 迷雾幽灵 - 白色半透明
                    ctx.fillStyle = flash ? '#ffffff' : (e.color || '#ccccdd');
                    ctx.globalAlpha = 0.7 + Math.sin(game.frame * 0.03) * 0.15;
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#ffffff44';
                    ctx.beginPath();
                    ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    // 锁链
                    ctx.globalAlpha = 0.4;
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#888899';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 3; i++) {
                        const wx = cx - size / 2 + i * 8 + Math.sin(game.frame * 0.04 + i) * 4;
                        const wy = cy + size / 2 - 2 + Math.sin(game.frame * 0.05 + i * 2) * 4;
                        ctx.beginPath();
                        ctx.moveTo(cx - size / 2 + i * 6, cy + size / 2 - 2);
                        ctx.quadraticCurveTo(wx + 2, wy + 6, wx, wy + 12);
                        ctx.stroke();
                    }
                    // 眼睛
                    ctx.globalAlpha = 0.8;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ff66ff';
                    ctx.fillStyle = '#ff66ff';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    break;

                default:
                    // 默认圆形
                    ctx.fillStyle = flash ? '#ff6666' : (e.color || '#2d1a1a');
                    ctx.beginPath();
                    ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
                    ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            // 血条
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(e.x, e.y - 8, size, 4);
            ctx.fillStyle = e.hp > 0 ? '#44ff44' : '#ff4444';
            ctx.fillRect(e.x, e.y - 8, size * (e.hp / (e.maxHp || 1)), 4);

            // 怪物名称缩写
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.font = '8px sans-serif';
            ctx.fillText(e.name ? e.name.substring(0, 2) : '??', e.x + 2, e.y + size + 10);
        }

        // ----- 绘制Boss（保留） -----
        function drawBoss(b, p) {
            const type = b.type || BOSS_TYPES[0];
            const flash = b.hitCooldown > 0;
            const pulse = 0.95 + Math.sin(game.frame * 0.05) * 0.05;

            ctx.shadowColor = type.glow || '#ff4444';
            ctx.shadowBlur = 60 * pulse;
            ctx.fillStyle = type.glow + '33';
            ctx.beginPath();
            ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 60 * pulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 30;
            ctx.shadowColor = type.color || '#ff4444';

            switch (type.shape) {
                case 'beast':
                    ctx.fillStyle = flash ? '#ffffff' : type.color;
                    ctx.beginPath();
                    ctx.ellipse(b.x + b.w / 2, b.y + b.h / 2 + 10, 30, 25, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(b.x + 8, b.y + b.h - 10, 12, 10);
                    ctx.fillRect(b.x + b.w - 20, b.y + b.h - 10, 12, 10);
                    ctx.fillRect(b.x + 5, b.y + b.h - 12, 10, 12);
                    ctx.fillRect(b.x + b.w - 15, b.y + b.h - 12, 10, 12);
                    ctx.fillStyle = '#ff0000';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(b.x + 20, b.y + 25, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + b.w - 20, b.y + 25, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    const dx = p.x + p.w / 2 - (b.x + 20);
                    const dy = p.y + p.h / 2 - (b.y + 25);
                    const d = Math.hypot(dx, dy);
                    if (d > 0) {
                        ctx.beginPath();
                        ctx.arc(b.x + 20 + (dx / d) * 4, b.y + 25 + (dy / d) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + b.w - 20 + (dx / d) * 4, b.y + 25 + (dy / d) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = type.glow + '66';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(b.x + b.w / 2, b.y + 50, 12 + Math.sin(game.frame * 0.03) * 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'ghost':
                    const alpha = 0.6 + Math.sin(game.frame * 0.04) * 0.2;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = flash ? '#ffffff' : type.color;
                    ctx.beginPath();
                    ctx.arc(b.x + b.w / 2, b.y + b.h / 2 - 5, 28, 0, Math.PI * 2);
                    ctx.fill();
                    for (let i = -2; i <= 2; i++) {
                        const wx = b.x + b.w / 2 + i * 12 + Math.sin(game.frame * 0.06 + i) * 5;
                        const wy = b.y + b.h - 5 + Math.sin(game.frame * 0.05 + i * 2) * 8;
                        ctx.beginPath();
                        ctx.moveTo(b.x + b.w / 2 + i * 10, b.y + b.h - 5);
                        ctx.quadraticCurveTo(wx + 5, wy + 10, wx, wy + 20 + Math.sin(game.frame * 0.04 + i) * 5);
                        ctx.lineWidth = 6;
                        ctx.strokeStyle = type.color;
                        ctx.shadowBlur = 30;
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#ff66ff';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(b.x + 18, b.y + 25, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + b.w - 18, b.y + 25, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    const dx2 = p.x + p.w / 2 - (b.x + 18);
                    const dy2 = p.y + p.h / 2 - (b.y + 25);
                    const d2 = Math.hypot(dx2, dy2);
                    if (d2 > 0) {
                        ctx.beginPath();
                        ctx.arc(b.x + 18 + (dx2 / d2) * 5, b.y + 25 + (dy2 / d2) * 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + b.w - 18 + (dx2 / d2) * 5, b.y + 25 + (dy2 / d2) * 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;
                case 'fire':
                    ctx.fillStyle = flash ? '#ffffff' : type.color;
                    ctx.shadowBlur = 50;
                    ctx.beginPath();
                    ctx.roundRect(b.x + 10, b.y + 10, b.w - 20, b.h - 10, 10);
                    ctx.fill();
                    for (let i = 0; i < 7; i++) {
                        const fx = b.x + 10 + i * 9 + Math.sin(game.frame * 0.05 + i) * 3;
                        const fy = b.y + 5 + Math.sin(game.frame * 0.07 + i * 2) * 8;
                        ctx.fillStyle = type.glow + '88';
                        ctx.shadowBlur = 40;
                        ctx.beginPath();
                        ctx.arc(fx, fy - 5, 10 + Math.sin(game.frame * 0.06 + i) * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = '#ffff00';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(b.x + 22, b.y + 30, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + b.w - 22, b.y + 30, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff4400';
                    const dx3 = p.x + p.w / 2 - (b.x + 22);
                    const dy3 = p.y + p.h / 2 - (b.y + 30);
                    const d3 = Math.hypot(dx3, dy3);
                    if (d3 > 0) {
                        ctx.beginPath();
                        ctx.arc(b.x + 22 + (dx3 / d3) * 4, b.y + 30 + (dy3 / d3) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + b.w - 22 + (dx3 / d3) * 4, b.y + 30 + (dy3 / d3) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.fillStyle = type.glow + '55';
                    ctx.shadowBlur = 60;
                    ctx.beginPath();
                    ctx.arc(b.x + b.w / 2, b.y + 55, 15 + Math.sin(game.frame * 0.05) * 3, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'ice':
                    ctx.fillStyle = flash ? '#ffffff' : type.color;
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.roundRect(b.x + 15, b.y + 15, b.w - 30, b.h - 20, 8);
                    ctx.fill();
                    for (let i = 0; i < 5; i++) {
                        const cx = b.x + 15 + i * 12 + Math.sin(game.frame * 0.03 + i) * 2;
                        ctx.fillStyle = type.glow + '88';
                        ctx.shadowBlur = 30;
                        ctx.beginPath();
                        ctx.moveTo(cx, b.y);
                        ctx.lineTo(cx + 6, b.y - 12);
                        ctx.lineTo(cx + 12, b.y);
                        ctx.fill();
                    }
                    ctx.fillStyle = '#88ddff';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.arc(b.x + 22, b.y + 28, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + b.w - 22, b.y + 28, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#004466';
                    const dx4 = p.x + p.w / 2 - (b.x + 22);
                    const dy4 = p.y + p.h / 2 - (b.y + 28);
                    const d4 = Math.hypot(dx4, dy4);
                    if (d4 > 0) {
                        ctx.beginPath();
                        ctx.arc(b.x + 22 + (dx4 / d4) * 4, b.y + 28 + (dy4 / d4) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + b.w - 22 + (dx4 / d4) * 4, b.y + 28 + (dy4 / d4) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    for (let i = 0; i < 6; i++) {
                        const fx = b.x + 10 + i * 12 + Math.sin(game.frame * 0.04 + i * 2) * 4;
                        const fy = b.y + 40 + Math.sin(game.frame * 0.05 + i * 1.5) * 6;
                        ctx.fillStyle = type.glow + '44';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(fx, fy, 4 + Math.sin(game.frame * 0.03 + i) * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;
                case 'void':
                    ctx.fillStyle = flash ? '#ffffff' : type.color;
                    ctx.shadowBlur = 50;
                    ctx.beginPath();
                    ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 28 + Math.sin(game.frame * 0.03) * 3, 0, Math.PI * 2);
                    ctx.fill();
                    for (let i = 0; i < 8; i++) {
                        const ang = i / 8 * Math.PI * 2 + game.frame * 0.02;
                        const len = 20 + Math.sin(game.frame * 0.04 + i * 1.5) * 10;
                        ctx.fillStyle = type.glow + '66';
                        ctx.shadowBlur = 40;
                        ctx.beginPath();
                        ctx.moveTo(b.x + b.w / 2 + Math.cos(ang) * 28, b.y + b.h / 2 + Math.sin(ang) * 28);
                        ctx.quadraticCurveTo(
                            b.x + b.w / 2 + Math.cos(ang + 0.2) * (28 + len),
                            b.y + b.h / 2 + Math.sin(ang + 0.2) * (28 + len),
                            b.x + b.w / 2 + Math.cos(ang + 0.1) * (28 + len * 1.2),
                            b.y + b.h / 2 + Math.sin(ang + 0.1) * (28 + len * 1.2)
                        );
                        ctx.lineWidth = 6;
                        ctx.stroke();
                    }
                    ctx.fillStyle = '#ff44ff';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(b.x + 20, b.y + 25, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + b.w - 20, b.y + 25, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#220044';
                    const dx5 = p.x + p.w / 2 - (b.x + 20);
                    const dy5 = p.y + p.h / 2 - (b.y + 25);
                    const d5 = Math.hypot(dx5, dy5);
                    if (d5 > 0) {
                        ctx.beginPath();
                        ctx.arc(b.x + 20 + (dx5 / d5) * 5, b.y + 25 + (dy5 / d5) * 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + b.w - 20 + (dx5 / d5) * 5, b.y + 25 + (dy5 / d5) * 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;
            }
            ctx.shadowBlur = 0;
        }

        // ----- 主绘制 -----
        function draw() {
            const w = game.world % 3;
            const theme = WORLDS[w] || WORLDS[0];
            const scary = theme.scary;

            ctx.clearRect(0, 0, W, H);

            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, theme.bg1);
            grad.addColorStop(1, theme.bg2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            let offsetX = 0;
            if (game.mapWidth > W) {
                const p = game.player;
                offsetX = Math.max(0, Math.min(game.mapWidth - W, p.x - W * 0.4));
            }

            ctx.save();
            ctx.translate(-offsetX, 0);

            if (scary >= 1) {
                const fog = ctx.createRadialGradient(W / 2 + offsetX, H / 2, 30, W / 2 + offsetX, H / 2, 500);
                fog.addColorStop(0, 'rgba(0,0,0,0)');
                fog.addColorStop(1, 'rgba(0,0,0,0.4)');
                ctx.fillStyle = fog;
                ctx.fillRect(offsetX, 0, W, H);
                for (let i = 0; i < 20 + scary * 10; i++) {
                    const x = (i * 37 + game.frame * 0.08) % game.mapWidth;
                    const y = (i * 29 + Math.sin(i + game.frame * 0.01) * 20) % H;
                    ctx.shadowColor = '#6b3aff';
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = `rgba(120,80,255,${0.05 + Math.sin(game.frame*0.02+i)*0.03})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 5 + Math.sin(game.frame * 0.03 + i) * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                if (scary >= 2) {
                    ctx.fillStyle = 'rgba(120,60,60,0.08)';
                    ctx.font = '34px sans-serif';
                    ctx.fillText('💀', 30, 55);
                    ctx.fillText('💀', game.mapWidth - 70, 45);
                }
            }

            for (const plat of game.platforms) {
                ctx.fillStyle = theme.plat;
                ctx.shadowColor = scary >= 2 ? '#ff333355' : 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.07)';
                ctx.beginPath();
                ctx.roundRect(plat.x + 4, plat.y - 1, plat.w - 8, 3, 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 出口
            const ex = game.exit.x,
                ey = game.exit.y;
            const canEnter = game.keysCollected >= game.totalKeys;
            ctx.shadowColor = canEnter ? '#6bcbff' : '#445566';
            ctx.shadowBlur = 40;
            ctx.fillStyle = canEnter ? 'rgba(100,200,255,0.3)' : 'rgba(50,50,80,0.2)';
            ctx.beginPath();
            ctx.arc(ex + 15, ey + 19, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = canEnter ? 35 : 10;
            ctx.fillStyle = canEnter ? '#4a8ab5' : '#3a3a5a';
            ctx.beginPath();
            ctx.roundRect(ex, ey, game.exit.w, game.exit.h, 6);
            ctx.fill();
            if (canEnter) {
                ctx.shadowBlur = 60;
                ctx.fillStyle = `rgba(100,220,255,${0.3 + Math.sin(game.frame*0.05)*0.2})`;
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 19, 12 + Math.sin(game.frame * 0.04) * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 70;
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 19, 5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#665555';
                ctx.shadowBlur = 5;
                ctx.font = '22px sans-serif';
                ctx.fillText('🔒', ex + 4, ey + 30);
            }
            ctx.shadowBlur = 0;

            // 钥匙
            for (const key of game.keys) {
                if (key.collected) continue;
                const bob = Math.sin(game.frame * 0.04 + key.x) * 3;
                ctx.shadowColor = '#f7d44a';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#f7d44a';
                ctx.beginPath();
                ctx.arc(key.x, key.y + bob, key.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffdd77';
                ctx.beginPath();
                ctx.arc(key.x - 3, key.y - 3 + bob, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff9e6';
                ctx.beginPath();
                ctx.arc(key.x + 2, key.y - 5 + bob, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 物品
            for (const item of game.items) {
                if (item.type === 'heal') {
                    const bob = Math.sin(game.frame * 0.04 + item.x) * 3;
                    ctx.shadowColor = '#44ff88';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#44ff88';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bob, item.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '18px sans-serif';
                    ctx.fillText('💚', item.x - 8, item.y + bob + 7);
                } else if (item.type === 'weapon') {
                    const bob = Math.sin(game.frame * 0.05 + item.x * 1.2) * 4;
                    ctx.shadowColor = '#ffaa44';
                    ctx.shadowBlur = 35;
                    ctx.fillStyle = '#ffaa44';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bob, item.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px sans-serif';
                    ctx.fillText(WEAPONS[item.weaponIdx]?.icon || '⚔', item.x - 7, item.y + bob + 6);
                }
            }
            ctx.shadowBlur = 0;

            // 绘制怪物（使用特色绘制函数）
            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;
                drawMonster(e);
            }
            ctx.shadowBlur = 0;

            // Boss
            if (game.isBoss && game.boss && game.boss.hp > 0) {
                drawBoss(game.boss, game.player);
                if (game.boss.hp < game.boss.maxHp * 0.3 && Math.floor(game.frame / 8) % 2 === 0) {
                    ctx.fillStyle = 'rgba(255,0,0,0.1)';
                    ctx.fillRect(offsetX, 0, W, H);
                }
            }

            // 子弹
            for (const bull of game.bullets) {
                if (bull.isEnemy) {
                    ctx.shadowColor = '#ff4444';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#ff4444';
                    ctx.beginPath();
                    ctx.arc(bull.x, bull.y, bull.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    continue;
                }
                ctx.shadowColor = bull.color || '#6bcbff';
                ctx.shadowBlur = 30;
                ctx.fillStyle = bull.color || '#6bcbff';
                ctx.beginPath();
                ctx.arc(bull.x, bull.y, bull.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(bull.x - 2, bull.y - 2, bull.r * 0.3, 0, Math.PI * 2);
                ctx.fill();
                if (bull.type === 'pierce') {
                    ctx.shadowBlur = 20;
                    ctx.strokeStyle = '#ff66ff66';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(bull.x, bull.y, bull.r + 4, 0, Math.PI * 2);
                    ctx.stroke();
                }
                if (bull.type === 'explode') {
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = '#ff883344';
                    ctx.beginPath();
                    ctx.arc(bull.x, bull.y, bull.r + 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.shadowBlur = 0;

            // 玩家
            const p = game.player;
            for (const t of p.trail) {
                ctx.globalAlpha = t.life / 20 * 0.2;
                ctx.fillStyle = '#3498db';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.roundRect(t.x, t.y, p.w, p.h, 4);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            if (p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            const capeWave = Math.sin(game.frame * 0.06) * 3;
            ctx.shadowColor = '#6bcbff';
            ctx.shadowBlur = 15;
            const capeColor = ['#2ecc71', '#8e44ad', '#ff3333'][game.world % 3] || '#2ecc71';
            ctx.fillStyle = capeColor;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(p.x + p.w, p.y + 6);
            ctx.quadraticCurveTo(p.x + p.w + 12 + capeWave, p.y + 16, p.x + p.w - 2 + capeWave * 0.5, p.y + 26);
            ctx.quadraticCurveTo(p.x + p.w - 6 + capeWave * 0.3, p.y + 20, p.x + p.w, p.y + 14);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.shadowColor = '#6bcbff';
            ctx.shadowBlur = 25;
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, p.h, 5);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#5dade2';
            ctx.beginPath();
            ctx.roundRect(p.x + 3, p.y + 4, 5, 12, 3);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(p.x + 16, p.y + 4, 5, 12, 3);
            ctx.fill();
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(p.x + 2, p.y + 20, p.w - 4, 3);

            ctx.fillStyle = '#5dade2';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(p.x + p.w / 2, p.y - 2, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(p.x + 7, p.y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + 17, p.y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(100,200,255,0.4)';
            ctx.beginPath();
            ctx.arc(p.x + 6, p.y - 6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + 16, p.y - 6, 3, 0, Math.PI * 2);
            ctx.fill();
            const mx = game._mouseX || 0;
            const my = game._mouseY || 0;
            const eyeDx = mx + offsetX - (p.x + p.w / 2);
            const eyeDy = my - (p.y + p.h / 2);
            const eyeDist = Math.hypot(eyeDx, eyeDy);
            if (eyeDist > 0) {
                const offsetX2 = (eyeDx / eyeDist) * 2;
                const offsetY2 = (eyeDy / eyeDist) * 2;
                ctx.fillStyle = '#44ff88';
                ctx.beginPath();
                ctx.arc(p.x + 7 + offsetX2, p.y - 4 + offsetY2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + 17 + offsetX2, p.y - 4 + offsetY2, 2.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#44ff88';
                ctx.beginPath();
                ctx.arc(p.x + 7, p.y - 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + 17, p.y - 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            for (const pt of game.particles) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = pt.color;
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life / pt.maxLife;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size * (pt.life / pt.maxLife), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            ctx.restore();

            if (game.screenShake > 0) {
                const shake = game.screenShake * 0.5;
                ctx.save();
                ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
                game.screenShake *= 0.9;
                if (game.screenShake < 0.1) game.screenShake = 0;
                ctx.restore();
            }

            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.font = '14px sans-serif';
            const expPct = Math.floor((exp / expToNext) * 100);
            const mapInfo = game.mapWidth > W ? ` 🌍 ${Math.floor(game.mapWidth/W*100)}%` : '';
            const terrainNames = ['塔楼', '峡谷', '浮岛', '洞穴', '桥梁', '阶梯'];
            ctx.fillText(`🗡️ ${game.totalKills}杀  |  EXP ${exp}/${expToNext} (${expPct}%)  |  ${terrainNames[game.terrainType] || ''}${mapInfo}`, 14, 28);
            if (game.hp < 30) {
                ctx.fillStyle = 'rgba(255,0,0,0.12)';
                ctx.fillRect(0, 0, W, H);
            }
            if (game.isBoss && game.boss && game.boss.hp > 0 && game.bossType) {
                ctx.fillStyle = '#ff444466';
                ctx.font = '18px sans-serif';
                ctx.fillText(`👹 ${game.bossType.desc}  Lv.${game.level+1}`, W / 2 - 80, 30);
            }
        }

        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w / 2) r = w / 2;
            if (r > h / 2) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        // ----- 事件绑定 -----
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { game.keysPressed.left = true;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { game.keysPressed.right = true;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === ' ') {
                game.keysPressed.up = true;
                e.preventDefault();
            }
            if (key === 'q' || key === 'Q') {
                game.player.weapon = (game.player.weapon + 1) % WEAPONS.length;
                playSound('weapon');
                updateUI();
                e.preventDefault();
            }
            if (key === 'e' || key === 'E') {
                currentSkill = (currentSkill + 1) % SKILLS.length;
                updateUI();
                e.preventDefault();
            }
            if (key === 'f' || key === 'F') {
                toggleStatPanel();
                e.preventDefault();
            }
            if (key === ' ') {
                e.preventDefault();
                if (game.gameOver || !game.running) {
                    initGame();
                }
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { game.keysPressed.left = false;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { game.keysPressed.right = false;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === ' ') {
                game.keysPressed.up = false;
                e.preventDefault();
            }
        });

        document.getElementById('skillDisplay').addEventListener('click', function() {
            currentSkill = (currentSkill + 1) % SKILLS.length;
            updateUI();
        });

        infiniteBtn.addEventListener('click', function() {
            game.infiniteMode = !game.infiniteMode;
            this.classList.toggle('active');
            this.textContent = game.infiniteMode ? t('infiniteOn') : t('infiniteOff');
            if (game.infiniteMode) {
                game.totalCycles = 0;
                game.level = 0;
                loadLevel(0);
                showMessage(t('infiniteStart'), t('infiniteSub'));
                setTimeout(() => msgOverlay.classList.remove('show'), 1500);
            }
            updateUI();
        });

        statBtn.addEventListener('click', toggleStatPanel);

        canvas.addEventListener('mousedown', (e) => {
            if (!game.running || game.gameOver || game.levelComplete) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            game._mouseX = mx;
            game._mouseY = my;
            shootBullet(mx, my);
        });
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            game._mouseX = (e.clientX - rect.left) * scaleX;
            game._mouseY = (e.clientY - rect.top) * scaleY;
        });

        // ----- 主循环 -----
        function gameLoop() {
            if (levelUpTimer > 0) {
                levelUpTimer--;
                if (levelUpTimer < 30) {
                    levelUpMsg.style.opacity = levelUpTimer / 30;
                }
                if (levelUpTimer <= 0) {
                    levelUpMsg.classList.remove('show');
                }
            }

            if (game.running && !game.gameOver && !game.levelComplete) {
                game.frame++;
                updatePlayer();
                if (game.particles.length > 500) game.particles.splice(0, 150);
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ----- 启动 -----
        initGame();
        setupMobileControls();
        gameLoop();
        updateAllUI();

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'q', 'Q', 'e', 'E', 'f', 'F'].includes(e.key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('click', () => { initAudio(); }, { once: true });

        window.addEventListener('resize', () => {
            setupMobileControls();
        });

        console.log('✅ 特色怪物版加载完成！8种怪物各具特色！');
        console.log('👾 腐化史莱姆 | 冰霜行者 | 暗影刺客 | 烈焰小鬼');
        console.log('👾 毒爆虫 | 水晶构造体 | 枯骨守卫 | 迷雾幽灵');
    </script>
</body>
