<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>暗影勇者 · 终极进化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            overflow: hidden;
        }
        #wrapper {
            background: #141425;
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            position: relative;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #1a1a30;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
            cursor: crosshair;
        }
        #miniStatPanel {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(10, 10, 26, 0.88);
            border: 1px solid #6bcbff55;
            border-radius: 12px;
            padding: 10px 14px;
            color: #ccc;
            font-size: 13px;
            min-width: 160px;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 40px #6bcbff22;
            z-index: 15;
            pointer-events: auto;
            transition: opacity 0.3s;
        }
        #miniStatPanel .title {
            color: #6bcbff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #miniStatPanel .title .close-btn {
            background: none;
            border: none;
            color: #667799;
            cursor: pointer;
            font-size: 16px;
        }
        #miniStatPanel .title .close-btn:hover {
            color: #ff6666;
        }
        #miniStatPanel .row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 12px;
        }
        #miniStatPanel .row .sname {
            color: #8899bb;
        }
        #miniStatPanel .row .sval {
            color: #fff;
            font-weight: bold;
        }
        #miniStatPanel .row button {
            background: #2a3a5a;
            color: #6bcbff;
            border: none;
            border-radius: 30px;
            padding: 0 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            line-height: 18px;
            transition: 0.15s;
        }
        #miniStatPanel .row button:hover {
            background: #3a4a6a;
        }
        #miniStatPanel .row button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #miniStatPanel .points {
            color: #44ff88;
            font-weight: bold;
            text-align: center;
            padding: 4px 0;
            border-top: 1px solid #33445544;
            margin-top: 4px;
            font-size: 13px;
        }
        #miniStatPanel .skill-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0;
            font-size: 12px;
            border-bottom: 1px solid #22334433;
        }
        #miniStatPanel .skill-row .skill-name {
            color: #ffaa44;
        }
        #miniStatPanel .skill-row .skill-status {
            color: #44ff88;
            font-size: 11px;
        }
        #miniStatPanel .skill-row .skill-status.locked {
            color: #665555;
        }
        #miniStatPanel .skill-row button {
            background: #2a3a2a;
            color: #44ff88;
            border: none;
            border-radius: 30px;
            padding: 0 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 11px;
            line-height: 18px;
            transition: 0.15s;
        }
        #miniStatPanel .skill-row button:hover {
            background: #3a4a3a;
        }
        #miniStatPanel .skill-row button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #miniStatPanel .skill-points {
            color: #ffaa44;
            font-size: 12px;
            text-align: center;
            padding: 2px 0;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: #ccc;
            font-weight: bold;
            font-size: 17px;
            padding: 0 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        #uiLeft {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }
        .label {
            color: #667799;
            font-weight: normal;
        }
        #hpDisplay {
            color: #ff6b6b;
            font-size: 22px;
            text-shadow: 0 0 25px #ff6b6b55;
        }
        #worldDisplay {
            color: #6bcbff;
            font-size: 20px;
            text-shadow: 0 0 25px #6bcbff55;
        }
        #keyDisplay {
            color: #f7d44a;
            font-size: 20px;
        }
        #jumpDisplay {
            color: #9b6bff;
            font-size: 20px;
            text-shadow: 0 0 25px #9b6bff55;
        }
        #weaponDisplay {
            color: #ffaa44;
            font-size: 18px;
        }
        #skillDisplay {
            color: #44ff88;
            font-size: 16px;
            background: #0a1a12;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #44ff8866;
        }
        #levelDisplay {
            color: #f7d44a;
            font-size: 20px;
            text-shadow: 0 0 25px #f7d44a55;
        }
        #bossHpBar {
            color: #ff3333;
            font-size: 18px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        #bossHpBar .bar {
            width: 150px;
            height: 12px;
            background: #2a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #663333;
        }
        #bossHpBar .fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3333, #ff8833);
            border-radius: 10px;
            transition: width 0.15s;
        }
        #bossNameDisplay {
            color: #ff8866;
            font-size: 16px;
            display: none;
            text-shadow: 0 0 30px #ff663355;
        }
        #infiniteToggle {
            background: #2a1a3a;
            color: #ffaa44;
            border: 2px solid #ffaa44;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #infiniteToggle:hover {
            background: #3a2a4a;
        }
        #infiniteToggle.active {
            border-color: #44ff88;
            color: #44ff88;
        }
        #hint {
            color: #445566;
            font-size: 13px;
            background: #0e0e1e;
            padding: 6px 18px;
            border-radius: 30px;
            text-align: right;
        }
        #msgOverlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 80px);
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #msgOverlay.show {
            display: flex;
        }
        #msgText {
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 80px #ff000066;
            animation: pop 0.5s ease;
            text-align: center;
            line-height: 1.4;
            padding: 20px;
        }
        #msgSub {
            font-size: 20px;
            color: #ff6666;
            margin-top: 10px;
            font-weight: normal;
            text-shadow: 0 0 40px #ff000044;
        }
        @keyframes pop {
            0% {
                transform: scale(0.2) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        #wrapper {
            position: relative;
        }
        @media (max-width: 760px) {
            #wrapper {
                padding: 10px;
            }
            canvas {
                width: 100%;
                height: auto;
            }
            #ui {
                font-size: 14px;
            }
            #hint {
                font-size: 11px;
                padding: 4px 12px;
            }
            #msgText {
                font-size: 28px;
            }
            #msgSub {
                font-size: 16px;
            }
            #uiLeft {
                gap: 12px;
            }
            #bossHpBar .bar {
                width: 80px;
            }
            #miniStatPanel {
                top: 10px;
                right: 10px;
                padding: 8px 10px;
                font-size: 11px;
                min-width: 120px;
            }
            #miniStatPanel .row {
                font-size: 10px;
            }
            #miniStatPanel .title {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <canvas id="gameCanvas" width="800" height="560"></canvas>

        <div id="miniStatPanel">
            <div class="title">
                <span>📊 属性</span>
                <button class="close-btn" id="closeMiniPanel">✕</button>
            </div>
            <div class="points" id="miniPoints">剩余点数: 0</div>
            <div class="row"><span class="sname">❤️HP</span><span class="sval" id="mHp">100</span><button onclick="upgradeStat('maxHp')">+</button></div>
            <div class="row"><span class="sname">🏃速度</span><span class="sval" id="mSpeed">4.2</span><button onclick="upgradeStat('speed')">+</button></div>
            <div class="row"><span class="sname">🦘跳跃</span><span class="sval" id="mJump">10.8</span><button onclick="upgradeStat('jumpPower')">+</button></div>
            <div class="row"><span class="sname">⚔️伤害</span><span class="sval" id="mDamage">+0%</span><button onclick="upgradeStat('damageBonus')">+</button></div>
            <div class="row"><span class="sname">🔫射速</span><span class="sval" id="mFireRate">1.00</span><button onclick="upgradeStat('fireRate')">+</button></div>
            <div class="skill-points" id="miniSkillPoints">🔓 技能点: 0</div>
            <div class="skill-row"><span class="skill-name">💥穿透</span><span class="skill-status" id="skPierce">🔒</span><button onclick="unlockSkill('pierce')">解锁</button></div>
            <div class="skill-row"><span class="skill-name">💣爆炸</span><span class="skill-status" id="skExplode">🔒</span><button onclick="unlockSkill('explode')">解锁</button></div>
            <div class="skill-row"><span class="skill-name">🎯跟踪</span><span class="skill-status" id="skHoming">🔒</span><button onclick="unlockSkill('homing')">解锁</button></div>
            <div class="skill-row"><span class="skill-name">🌀散射+</span><span class="skill-status" id="skSpread">🔒</span><button onclick="unlockSkill('spread')">解锁</button></div>
        </div>

        <div id="msgOverlay">
            <div id="msgText">🎉<div id="msgSub"></div></div>
        </div>
        <div id="ui">
            <div id="uiLeft">
                <span><span class="label">❤️</span> <span id="hpDisplay">100</span></span>
                <span><span class="label">⭐</span> <span id="levelDisplay">Lv.1</span></span>
                <span><span class="label">🌍</span> <span id="worldDisplay">1-1-1</span></span>
                <span><span class="label">🔑</span> <span id="keyDisplay">0 / 0</span></span>
                <span><span class="label">🦘</span> <span id="jumpDisplay">3</span></span>
                <span><span class="label">⚔️</span> <span id="weaponDisplay">🔫普通</span></span>
                <span id="skillDisplay">⏳ 技能: 就绪</span>
                <span id="bossNameDisplay" style="display:none;">👹 Boss</span>
                <button id="infiniteToggle">♾️ 无尽模式</button>
                <span id="bossHpBar" style="display:none;">
                    👹 <span class="bar"><span class="fill" id="bossFill"></span></span>
                    <span id="bossHpText">30</span>
                </span>
            </div>
            <span id="hint">🖱️射击 &nbsp;|&nbsp; ← → &nbsp;|&nbsp; 空格跳 &nbsp;|&nbsp; Q切武器 &nbsp;|&nbsp; R切子弹 &nbsp;|&nbsp; E技能</span>
        </div>
    </div>

    <script>
        // ================================================================
        //  暗影勇者 · 终极进化版 (完整修复)
        // ================================================================

        const W = 800,
            H = 560;
        const GRAVITY = 0.55;
        const FRICTION = 0.80;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const hpSpan = document.getElementById('hpDisplay');
        const worldSpan = document.getElementById('worldDisplay');
        const keySpan = document.getElementById('keyDisplay');
        const jumpSpan = document.getElementById('jumpDisplay');
        const weaponSpan = document.getElementById('weaponDisplay');
        const skillSpan = document.getElementById('skillDisplay');
        const levelSpan = document.getElementById('levelDisplay');
        const bossHpBar = document.getElementById('bossHpBar');
        const bossFill = document.getElementById('bossFill');
        const bossHpText = document.getElementById('bossHpText');
        const bossNameDisplay = document.getElementById('bossNameDisplay');
        const msgOverlay = document.getElementById('msgOverlay');
        const msgText = document.getElementById('msgText');
        const msgSub = document.getElementById('msgSub');
        const infiniteBtn = document.getElementById('infiniteToggle');

        const miniPoints = document.getElementById('miniPoints');
        const mHp = document.getElementById('mHp');
        const mSpeed = document.getElementById('mSpeed');
        const mJump = document.getElementById('mJump');
        const mDamage = document.getElementById('mDamage');
        const mFireRate = document.getElementById('mFireRate');
        const miniSkillPoints = document.getElementById('miniSkillPoints');
        const skPierce = document.getElementById('skPierce');
        const skExplode = document.getElementById('skExplode');
        const skHoming = document.getElementById('skHoming');
        const skSpread = document.getElementById('skSpread');

        document.getElementById('closeMiniPanel').addEventListener('click', () => {
            document.getElementById('miniStatPanel').style.display = 'none';
        });

        const WORLDS = [
            { name: '翡翠森林', bg1: '#1a3a2a', bg2: '#2a5a3a', plat: '#4a8a4a', scary: 0 },
            { name: '暗影沼泽', bg1: '#0a0a1a', bg2: '#1a0a2a', plat: '#2a1a3a', scary: 1 },
            { name: '地狱深渊', bg1: '#0a0000', bg2: '#1a0000', plat: '#3a0a0a', scary: 2 }
        ];

        const WEAPONS = [
            { name: '普通', damage: 1, speed: 9, color: '#6bcbff', spread: 1, icon: '🔫' },
            { name: '速射', damage: 1, speed: 14, color: '#ffaa44', spread: 1, icon: '⚡' },
            { name: '重炮', damage: 3, speed: 5, color: '#ff4444', spread: 1, icon: '💥' },
            { name: '散射', damage: 1, speed: 7, color: '#44ff88', spread: 3, icon: '🔱' }
        ];

        const BULLET_TYPES = {
            normal: { label: '普通', color: '#6bcbff', damage: 1, speed: 1, pierce: 0, explode: false, homing: false,
                spread: 1 },
            pierce: { label: '穿透', color: '#44ddff', damage: 1.2, speed: 1.1, pierce: 3, explode: false, homing: false,
                spread: 1 },
            explode: { label: '爆炸', color: '#ff6633', damage: 1.5, speed: 0.8, pierce: 0, explode: true, homing: false,
                spread: 1 },
            homing: { label: '跟踪', color: '#ff44ff', damage: 0.8, speed: 0.7, pierce: 0, explode: false, homing: true,
                spread: 1 },
            spread: { label: '散射+', color: '#44ffaa', damage: 1, speed: 0.9, pierce: 0, explode: false, homing: false,
                spread: 5 }
        };

        let unlockedSkills = { pierce: false, explode: false, homing: false, spread: false };
        let skillPoints = 0;
        let currentBulletIdx = 0;

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new(window.AudioContext || webkitAudioContext)(); } catch (e) {}
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                switch (type) {
                    case 'shoot':
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                        break;
                    case 'jump':
                        osc.frequency.setValueAtTime(300 + (game?.player?.jumpCount || 0) * 80, now);
                        gain.gain.setValueAtTime(0.10, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'kill':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;
                    case 'key':
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'damage':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                        gain.gain.setValueAtTime(0.35, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                    case 'heal':
                        osc.frequency.setValueAtTime(500, now);
                        osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'weapon':
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.25);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;
                    case 'death':
                        osc.frequency.setValueAtTime(100, now);
                        osc.frequency.exponentialRampToValueAtTime(15, now + 0.8);
                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                        osc.start(now);
                        osc.stop(now + 0.8);
                        break;
                    case 'boss_hit':
                        osc.frequency.setValueAtTime(60, now);
                        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        osc.start(now);
                        osc.stop(now + 0.15);
                        break;
                    case 'skill':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                        osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                        break;
                    case 'levelup':
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                        osc.start(now);
                        osc.stop(now + 0.35);
                        break;
                    case 'boss_spawn':
                        osc.frequency.setValueAtTime(100, now);
                        osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
                        osc.frequency.exponentialRampToValueAtTime(80, now + 0.6);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                        osc.start(now);
                        osc.stop(now + 0.6);
                        break;
                    case 'explode':
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                }
            } catch (e) {}
        }

        // ================================================================
        //  BOSS 定义
        // ================================================================
        const BOSS_TYPES = [{
            id: 'flesh',
            name: '腐肉聚合体',
            color: '#44aa44',
            eyeColor: '#88ff44',
            desc: '直线弹幕',
            hpMult: 1.0,
            speedMult: 0.6,
            attackPattern: 'linear'
        }, {
            id: 'banshee',
            name: '暗影女妖',
            color: '#aa44ff',
            eyeColor: '#cc88ff',
            desc: '散射+瞬移',
            hpMult: 0.8,
            speedMult: 1.4,
            attackPattern: 'spread'
        }, {
            id: 'watcher',
            name: '深渊守望者',
            color: '#ff4444',
            eyeColor: '#ff8844',
            desc: '环形+召唤',
            hpMult: 1.4,
            speedMult: 0.5,
            attackPattern: 'ring'
        }, {
            id: 'skeleton',
            name: '骸骨君王',
            color: '#dddddd',
            eyeColor: '#ff4444',
            desc: '追踪+冲刺',
            hpMult: 1.2,
            speedMult: 1.0,
            attackPattern: 'chase'
        }, {
            id: 'chaos',
            name: '混沌之卵',
            color: '#ff44aa',
            eyeColor: '#ff88cc',
            desc: '随机+分裂',
            hpMult: 0.9,
            speedMult: 0.8,
            attackPattern: 'random'
        }, {
            id: 'shadow',
            name: '终焉之影',
            color: '#222244',
            eyeColor: '#8844ff',
            desc: '全屏弹幕',
            hpMult: 1.6,
            speedMult: 1.2,
            attackPattern: 'omnidirectional'
        }];

        // ================================================================
        //  升级系统
        // ================================================================
        const STAT_CONFIG = {
            maxHp: { label: '生命上限', base: 100, cost: 2, inc: 10, min: 100 },
            speed: { label: '移动速度', base: 4.2, cost: 2, inc: 0.12, min: 3.0 },
            jumpPower: { label: '跳跃力', base: 10.8, cost: 2, inc: 0.25, min: 8.0 },
            damageBonus: { label: '伤害加成', base: 0, cost: 3, inc: 0.15, min: 0 },
            fireRate: { label: '射速', base: 1.0, cost: 3, inc: 0.06, min: 0.5 },
        };

        let statPoints = 0;
        let stats = {};
        let level = 1;
        let exp = 0;
        let expToNext = 20;

        function initStats() {
            for (const key in STAT_CONFIG) stats[key] = STAT_CONFIG[key].base;
            statPoints = 0;
            skillPoints = 0;
            unlockedSkills = { pierce: false, explode: false, homing: false, spread: false };
            currentBulletIdx = 0;
            level = 1;
            exp = 0;
            expToNext = 20;
            updateMiniUI();
        }

        function addExp(amount) {
            exp += amount;
            while (exp >= expToNext) {
                exp -= expToNext;
                level++;
                expToNext = Math.floor(20 + level * 15);
                const bonus = 1 + Math.floor(Math.random() * 3);
                statPoints += 2 + bonus;
                if (level % 3 === 0) skillPoints++;
                playSound('levelup');
                showMessage('⬆ 升级！', `等级 ${level}！获得 ${2+bonus} 属性点` + (level % 3 === 0 ? ' +1技能点' : ''));
                setTimeout(() => msgOverlay.classList.remove('show'), 1000);
                updateMiniUI();
                updateUI();
            }
            updateMiniUI();
            updateUI();
        }

        function upgradeStat(key) {
            if (statPoints <= 0) return;
            const cfg = STAT_CONFIG[key];
            if (!cfg) return;
            const cost = Math.floor(cfg.cost + (stats[key] - cfg.base) / cfg.inc * 0.3);
            if (statPoints < cost) return;
            statPoints -= cost;
            stats[key] += cfg.inc;
            updateMiniUI();
            updateUI();
            applyStats();
        }

        function applyStats() {
            const p = game?.player;
            if (!p) return;
            p.maxHp = stats.maxHp;
            p.speed = stats.speed;
            p.jumpPower = -stats.jumpPower;
            updateUI();
        }

        function unlockSkill(skillId) {
            if (skillPoints <= 0 || unlockedSkills[skillId]) return;
            unlockedSkills[skillId] = true;
            skillPoints--;
            playSound('levelup');
            showMessage('🔓 技能解锁！', BULLET_TYPES[skillId].label + ' 子弹已可用');
            setTimeout(() => msgOverlay.classList.remove('show'), 1000);
            updateMiniUI();
            updateUI();
        }

        function getAvailableBulletTypes() {
            const types = ['normal'];
            if (unlockedSkills.pierce) types.push('pierce');
            if (unlockedSkills.explode) types.push('explode');
            if (unlockedSkills.homing) types.push('homing');
            if (unlockedSkills.spread) types.push('spread');
            return types;
        }

        function getCurrentBulletType() {
            const types = getAvailableBulletTypes();
            return types[currentBulletIdx % types.length] || 'normal';
        }

        function cycleBulletType() {
            const types = getAvailableBulletTypes();
            if (types.length <= 1) return;
            currentBulletIdx = (currentBulletIdx + 1) % types.length;
            playSound('weapon');
            updateUI();
        }

        // ================================================================
        //  微型面板
        // ================================================================
        function updateMiniUI() {
            miniPoints.textContent = '剩余点数: ' + statPoints;
            mHp.textContent = stats.maxHp;
            mSpeed.textContent = stats.speed.toFixed(2);
            mJump.textContent = stats.jumpPower.toFixed(2);
            mDamage.textContent = '+' + (stats.damageBonus * 100).toFixed(0) + '%';
            mFireRate.textContent = stats.fireRate.toFixed(2);
            miniSkillPoints.textContent = '🔓 技能点: ' + skillPoints;

            const map = { pierce: skPierce, explode: skExplode, homing: skHoming, spread: skSpread };
            for (const [id, el] of Object.entries(map)) {
                if (unlockedSkills[id]) {
                    el.textContent = '✅';
                    el.className = 'skill-status';
                    el.parentElement.querySelector('button').disabled = true;
                } else {
                    el.textContent = '🔒';
                    el.className = 'skill-status locked';
                    el.parentElement.querySelector('button').disabled = skillPoints <= 0;
                }
            }
        }

        window.upgradeStat = upgradeStat;
        window.unlockSkill = unlockSkill;

        // ================================================================
        //  关卡生成
        // ================================================================
        function generateInfiniteLevel(cycle, branch, level) {
            const platforms = [];
            const enemies = [];
            const keys = [];
            const items = [];
            const difficulty = cycle * 1.8 + branch + level;

            const platCount = 7 + Math.floor(difficulty * 0.9) + Math.floor(cycle * 0.8);
            platforms.push({ x: 0, y: 460, w: W, h: 40 });

            const baseY = [420, 380, 340, 300, 260, 220, 180, 140, 100, 60];
            for (let i = 0; i < platCount; i++) {
                const offset = (i * 73 + cycle * 137 + level * 53) % 160;
                let x = 30 + i * 75 * (0.8 + cycle * 0.01) + offset * 0.6;
                if (x > W - 120) x = W - 120 - (i * 17) % 90;
                const yIdx = i % baseY.length;
                let y = baseY[yIdx] - (i % 5) * 12 - cycle * 3;
                if (y < 40) y = 40;
                let w = 60 + ((i * 7 + cycle * 11 + level * 13) % 100) + cycle * 4;
                if (w > 180) w = 180;
                platforms.push({ x, y, w, h: 14 });
            }
            platforms.sort((a, b) => a.y - b.y);

            const lastPlat = platforms[platforms.length - 1];
            const exitX = lastPlat.x + lastPlat.w / 2 - 15;
            const exitY = lastPlat.y - 40;

            const enemyCount = 4 + Math.floor(difficulty * 0.6) + Math.floor(cycle * 0.9);
            for (let i = 0; i < enemyCount; i++) {
                let plat = platforms[1 + (i * 3 + cycle * 7) % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                let lv = Math.min(4, Math.floor((difficulty + i + cycle * 0.6) / 2));
                const size = 18 + lv * 5;
                const type = ['mushroom', 'ghost', 'bat', 'mushroom', 'ghost', 'bat'][(i + cycle) % 6];
                enemies.push({
                    x: plat.x + 10 + i * 15,
                    y: plat.y - size,
                    w: size,
                    h: size,
                    type: type,
                    level: lv,
                    hp: 2 + lv + Math.floor(cycle * 0.4),
                    vx: (0.5 + lv * 0.2) * (i % 2 === 0 ? 1 : -1),
                    speed: 0.7 + lv * 0.2 + cycle * 0.03,
                    minX: plat.x + 3,
                    maxX: plat.x + plat.w - size - 3,
                    startY: plat.y - size,
                    damage: 10 + lv * 8 + Math.floor(cycle * 1.5),
                    hitFlash: 0,
                    aggroRange: 160 + lv * 40 + cycle * 10,
                    jumpTimer: 0,
                    expReward: 10 + lv * 4 + Math.floor(cycle * 2),
                });
            }

            const keyCount = 2 + Math.floor(difficulty / 3) + Math.floor(cycle * 0.4);
            const usedPlats = platforms.slice(1);
            for (let i = 0; i < Math.min(keyCount, usedPlats.length); i++) {
                const plat = usedPlats[i % usedPlats.length];
                keys.push({ x: plat.x + 12 + i * 18, y: plat.y - 28, collected: false, r: 9 });
            }
            while (keys.length < 2) {
                const plat = platforms[1 + keys.length % (platforms.length - 1)];
                keys.push({ x: plat.x + 30 + keys.length * 20, y: plat.y - 28, collected: false, r: 9 });
            }

            const healCount = 1 + Math.floor(difficulty / 4) + Math.floor(cycle * 0.25);
            for (let i = 0; i < Math.min(healCount, 6); i++) {
                let plat = platforms[1 + (i * 7 + cycle * 13) % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                items.push({
                    type: 'heal',
                    x: plat.x + 15 + i * 22,
                    y: plat.y - 30,
                    r: 12,
                    value: 20 + Math.floor(cycle * 3),
                });
            }

            if ((cycle + level + branch) % 2 === 1) {
                let plat = platforms[2 % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                const wIdx = Math.min(3, Math.floor(difficulty / 2) + 1);
                items.push({
                    type: 'weapon',
                    weaponIdx: wIdx,
                    x: plat.x + 30,
                    y: plat.y - 30,
                    r: 14,
                });
            }

            const bossType = BOSS_TYPES[Math.floor(Math.random() * BOSS_TYPES.length)];
            const bossPlat = platforms[Math.floor(platforms.length / 2)] || platforms[0];
            const baseHp = 40 + cycle * 28 + Math.floor(difficulty * 4);
            const bossHp = Math.floor(baseHp * bossType.hpMult);
            const boss = {
                x: bossPlat.x + bossPlat.w / 2 - 35,
                y: bossPlat.y - 75,
                w: 70,
                h: 75,
                hp: bossHp,
                maxHp: bossHp,
                timer: 0,
                bullets: [],
                hitCooldown: 0,
                expReward: 80 + cycle * 20,
                type: bossType,
                phase: 0,
                speed: 1.2 + cycle * 0.06,
                attackTimer: 0,
                spawnY: bossPlat.y - 75,
                teleportTimer: 0,
                spawnCount: 0,
                splitCount: 0,
                eyeAngle: 0,
                dashTimer: 0,
                dashDir: { x: 0, y: 0 },
            };

            enemies.splice(0, Math.floor(enemies.length / 3));
            return { platforms, enemies, keys, items, exit: { x: exitX, y: exitY, w: 30, h: 38 }, isBoss: true, boss };
        }

        function generateNormalLevel(worldIdx, branchIdx, levelIdx, cycleOffset) {
            const idx = worldIdx * 9 + branchIdx * 3 + levelIdx;
            const difficulty = worldIdx + branchIdx + levelIdx + cycleOffset * 0.5;
            const platforms = [];
            const enemies = [];
            const keys = [];
            const items = [];

            platforms.push({ x: 0, y: 460, w: W, h: 40 });

            const platCount = 5 + Math.floor(difficulty / 2);
            const baseY = [420, 380, 340, 300, 260, 220, 180];
            for (let i = 0; i < platCount; i++) {
                let x = 60 + i * 70 + (idx * 13) % 120;
                if (x > W - 100) x = W - 100;
                let y = baseY[i % baseY.length] - (i % 3) * 15;
                let w = 70 + (i * 7 + idx) % 50;
                platforms.push({ x, y, w, h: 14 });
            }
            platforms.sort((a, b) => a.y - b.y);

            const lastPlat = platforms[platforms.length - 1];
            const exitX = lastPlat.x + lastPlat.w / 2 - 15;
            const exitY = lastPlat.y - 40;

            const enemyCount = 3 + Math.floor(difficulty * 0.6);
            for (let i = 0; i < enemyCount; i++) {
                let plat = platforms[1 + (i * 3) % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                let lv = Math.min(2, Math.floor((difficulty + i) / 3));
                const size = 20 + lv * 6;
                const type = (worldIdx === 0) ? 'mushroom' : (worldIdx === 1) ? 'ghost' : 'bat';
                enemies.push({
                    x: plat.x + 10 + i * 20,
                    y: plat.y - size,
                    w: size,
                    h: size,
                    type: type,
                    level: lv,
                    hp: 2 + lv,
                    vx: (0.6 + lv * 0.2) * (i % 2 === 0 ? 1 : -1),
                    speed: 0.8 + lv * 0.2 + worldIdx * 0.05,
                    minX: plat.x + 5,
                    maxX: plat.x + plat.w - size - 5,
                    startY: plat.y - size,
                    damage: 10 + lv * 10,
                    hitFlash: 0,
                    aggroRange: 150 + lv * 50,
                    jumpTimer: 0,
                    expReward: 10 + lv * 5,
                });
            }

            const keyCount = 2 + Math.floor(difficulty / 2);
            const usedPlats = platforms.slice(1);
            for (let i = 0; i < Math.min(keyCount, usedPlats.length); i++) {
                const plat = usedPlats[i % usedPlats.length];
                keys.push({ x: plat.x + 15 + i * 20, y: plat.y - 28, collected: false, r: 9 });
            }
            while (keys.length < 2) {
                const plat = platforms[1 + keys.length % (platforms.length - 1)];
                keys.push({ x: plat.x + 30 + keys.length * 20, y: plat.y - 28, collected: false, r: 9 });
            }

            const healCount = 1 + Math.floor(difficulty / 3);
            for (let i = 0; i < healCount; i++) {
                let plat = platforms[1 + (i * 7 + idx) % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                items.push({
                    type: 'heal',
                    x: plat.x + 20 + i * 25,
                    y: plat.y - 30,
                    r: 12,
                    value: 20,
                });
            }
            if ((idx % 2 === 1) && difficulty > 0) {
                let plat = platforms[2 % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                const wIdx = Math.min(3, Math.floor(difficulty / 2) + 1);
                items.push({
                    type: 'weapon',
                    weaponIdx: wIdx,
                    x: plat.x + 30,
                    y: plat.y - 30,
                    r: 14,
                });
            }

            let isBoss = (branchIdx === 2 && levelIdx === 2);
            let boss = null;
            if (isBoss) {
                const bossPlat = platforms[Math.floor(platforms.length / 2)] || platforms[0];
                const bossHp = 40 + worldIdx * 20 + Math.floor(cycleOffset * 15);
                const bossType = BOSS_TYPES[worldIdx % BOSS_TYPES.length];
                boss = {
                    x: bossPlat.x + bossPlat.w / 2 - 30,
                    y: bossPlat.y - 70,
                    w: 60,
                    h: 70,
                    hp: Math.floor(bossHp * bossType.hpMult),
                    maxHp: Math.floor(bossHp * bossType.hpMult),
                    timer: 0,
                    bullets: [],
                    hitCooldown: 0,
                    expReward: 50 + worldIdx * 20,
                    type: bossType,
                    phase: 0,
                    speed: 1.0,
                };
                enemies.splice(0, Math.floor(enemies.length / 2));
            }

            return { platforms, enemies, keys, items, exit: { x: exitX, y: exitY, w: 30, h: 38 }, isBoss, boss };
        }

        // ================================================================
        //  游戏状态
        // ================================================================
        let game = {};

        function initGame() {
            initStats();
            game = {
                world: 0,
                branch: 0,
                level: 0,
                maxWorld: 3,
                maxBranch: 3,
                maxLevel: 3,
                infiniteMode: false,
                totalCycles: 0,
                hp: stats.maxHp,
                maxHp: stats.maxHp,
                keysCollected: 0,
                totalKeys: 0,
                running: true,
                levelComplete: false,
                gameOver: false,
                player: {
                    x: 40,
                    y: 400,
                    w: 24,
                    h: 30,
                    vx: 0,
                    vy: 0,
                    speed: stats.speed,
                    jumpPower: -stats.jumpPower,
                    onGround: false,
                    jumpCount: 0,
                    maxJumps: 3,
                    facing: 1,
                    invincible: 0,
                    weapon: 0,
                    trail: [],
                    maxHp: stats.maxHp,
                },
                platforms: [],
                enemies: [],
                keys: [],
                items: [],
                exit: { x: 680, y: 60, w: 30, h: 38 },
                keysPressed: { left: false, right: false, up: false },
                frame: 0,
                particles: [],
                bullets: [],
                boss: null,
                isBoss: false,
                totalKills: 0,
                screenShake: 0,
                skillCooldown: 0,
                skillActive: false,
                skillTimer: 0,
                skillMaxCooldown: 480,
                skillDuration: 90,
                bossSpawned: false,
                currentBossType: null,
                _mouseX: 0,
                _mouseY: 0,
            };
            loadLevel(0, 0, 0);
            updateUI();
            msgOverlay.classList.remove('show');
            game.running = true;
            game.gameOver = false;
            bossHpBar.style.display = 'none';
            bossNameDisplay.style.display = 'none';
            applyStats();
        }

        function loadLevel(w, b, l) {
            const cycle = game.totalCycles;
            const isInfinite = game.infiniteMode;

            let data;
            if (isInfinite) {
                data = generateInfiniteLevel(cycle, b, l);
                if (data.boss) {
                    bossNameDisplay.style.display = 'inline';
                    bossNameDisplay.textContent = '👹 ' + data.boss.type.name;
                    bossNameDisplay.style.color = data.boss.type.color;
                }
            } else {
                data = generateNormalLevel(w % 3, b, l, cycle * 0.5);
                if (data.boss) {
                    bossNameDisplay.style.display = 'inline';
                    bossNameDisplay.textContent = '👹 ' + data.boss.type.name;
                    bossNameDisplay.style.color = data.boss.type.color;
                }
            }

            game.platforms = data.platforms;
            game.enemies = data.enemies.map(e => ({ ...e, hitFlash: 0 }));
            game.keys = data.keys.map(k => ({ ...k, collected: false }));
            game.items = data.items.map(i => ({ ...i }));
            game.exit = data.exit;
            game.totalKeys = game.keys.length;
            game.keysCollected = 0;
            game.levelComplete = false;
            game.bullets = [];
            game.isBoss = data.isBoss || false;
            game.boss = data.boss ? { ...data.boss, bullets: [], hitCooldown: 0, timer: 0, teleportTimer: 0, dashTimer: 0,
                splitCount: 0 } : null;
            game.screenShake = 0;
            game.bossSpawned = false;
            if (game.boss) game.currentBossType = game.boss.type;

            const displayW = isInfinite ? (cycle * 3 + w + 1) : (w + 1);
            game.displayWorld = displayW;
            game.displayBranch = b + 1;
            game.displayLevel = l + 1;

            const p = game.player;
            p.x = 40;
            p.y = 400;
            p.vx = 0;
            p.vy = 0;
            p.onGround = false;
            p.jumpCount = 0;
            p.invincible = 0;
            p.trail = [];
            p.speed = stats.speed;
            p.jumpPower = -stats.jumpPower;
            p.maxHp = stats.maxHp;
            if (game.hp > p.maxHp) game.hp = p.maxHp;

            if (game.isBoss && game.boss) {
                bossHpBar.style.display = 'flex';
                bossNameDisplay.style.display = 'inline';
                updateBossUI();
                playSound('boss_spawn');
                showMessage('👹 ' + game.boss.type.name + ' 出现！', '击败它获得大量经验！');
                setTimeout(() => msgOverlay.classList.remove('show'), 1500);
            } else {
                bossHpBar.style.display = 'none';
                bossNameDisplay.style.display = 'none';
            }
            updateUI();
        }

        function updateUI() {
            hpSpan.textContent = Math.ceil(game.hp);
            const w = game.displayWorld || (game.world + 1);
            const b = game.displayBranch || (game.branch + 1);
            const l = game.displayLevel || (game.level + 1);
            worldSpan.textContent = `${w}-${b}-${l}`;
            keySpan.textContent = `${game.keysCollected} / ${game.totalKeys}`;
            const rem = Math.max(0, game.player.maxJumps - game.player.jumpCount);
            jumpSpan.textContent = rem;
            const bt = getCurrentBulletType();
            const label = BULLET_TYPES[bt]?.label || '普通';
            weaponSpan.textContent = WEAPONS[game.player.weapon].icon + ' ' + label;
            levelSpan.textContent = 'Lv.' + level;

            if (game.skillCooldown > 0) {
                const cdSec = Math.ceil(game.skillCooldown / 60);
                skillSpan.textContent = '⏳ 技能: ' + cdSec + 's';
                skillSpan.style.color = '#ff6666';
            } else if (game.skillActive) {
                skillSpan.textContent = '⏳ 技能: 激活中';
                skillSpan.style.color = '#44ff88';
            } else {
                skillSpan.textContent = '⏳ 技能: 就绪';
                skillSpan.style.color = '#44ff88';
            }
            updateMiniUI();
        }

        function updateBossUI() {
            if (!game.boss) return;
            const pct = Math.max(0, (game.boss.hp / game.boss.maxHp) * 100);
            bossFill.style.width = pct + '%';
            bossHpText.textContent = Math.ceil(game.boss.hp);
            if (game.boss.type) {
                bossNameDisplay.textContent = '👹 ' + game.boss.type.name;
                bossNameDisplay.style.color = game.boss.type.color;
            }
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

        // ================================================================
        //  粒子
        // ================================================================
        function spawnParticles(x, y, color, count = 12, speedMult = 1) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (1 + Math.random() * 3) * speedMult;
                game.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 30 + Math.random() * 30,
                    maxLife: 60,
                    color,
                    size: 3 + Math.random() * 5,
                });
            }
        }

        function spawnBlood(x, y, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 5;
                game.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 40 + Math.random() * 40,
                    maxLife: 80,
                    color: Math.random() > 0.5 ? '#8b0000' : '#cc0000',
                    size: 2 + Math.random() * 6,
                });
            }
        }

        function updateParticles() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06;
                p.life--;
                if (p.life <= 0) game.particles.splice(i, 1);
            }
            if (game.particles.length > 500) game.particles.splice(0, 150);
        }

        // ================================================================
        //  射击
        // ================================================================
        let lastShootTime = 0;
        let shootSoundCooldown = 0;

        function shootBullet(targetX, targetY) {
            const now = performance.now();
            const fireRate = Math.max(0.3, 1.0 / stats.fireRate);
            const coolDownMs = 70 * fireRate;
            if (now - lastShootTime < coolDownMs) return;
            lastShootTime = now;
            if (!game.running || game.gameOver || game.levelComplete) return;

            const p = game.player;
            const cx = p.x + p.w / 2,
                cy = p.y + p.h / 2;
            const dx = targetX - cx,
                dy = targetY - cy;
            const len = Math.hypot(dx, dy);
            if (len < 10) return;

            const weapon = WEAPONS[p.weapon];
            const btDef = BULLET_TYPES[getCurrentBulletType()] || BULLET_TYPES.normal;
            const damageBonus = 1 + stats.damageBonus;
            const count = btDef.spread || weapon.spread || 1;

            for (let i = 0; i < count; i++) {
                const angle = Math.atan2(dy, dx) + (i - (count - 1) / 2) * 0.2;
                const speed = (game.skillActive ? 0.5 : 1.0) * weapon.speed * btDef.speed;
                game.bullets.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    r: 5,
                    life: 130,
                    damage: Math.ceil(weapon.damage * damageBonus * btDef.damage),
                    color: btDef.color,
                    type: getCurrentBulletType(),
                    pierce: btDef.pierce || 0,
                    explode: btDef.explode || false,
                    homing: btDef.homing || false,
                    hitCount: 0,
                });
            }
            spawnParticles(cx, cy, btDef.color, 4);
            if (now - shootSoundCooldown > 100) { playSound('shoot');
                shootSoundCooldown = now; }
        }

        function activateSkill() {
            if (game.skillCooldown > 0 || game.skillActive) return;
            game.skillActive = true;
            game.skillTimer = game.skillDuration;
            playSound('skill');
            spawnParticles(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, '#44ff88', 30, 2);
        }

        // ================================================================
        //  玩家更新
        // ================================================================
        function updatePlayer() {
            const p = game.player;
            const keys = game.keysPressed;
            if (p.invincible > 0) p.invincible--;

            if (game.skillActive) {
                game.skillTimer--;
                if (game.skillTimer <= 0) { game.skillActive = false;
                    game.skillCooldown = game.skillMaxCooldown; }
            }
            if (game.skillCooldown > 0) game.skillCooldown--;

            if (keys.left) { p.vx = -p.speed;
                p.facing = -1; } else if (keys.right) { p.vx = p.speed;
                p.facing = 1; } else { p.vx *= FRICTION; if (Math.abs(p.vx) < 0.1) p.vx = 0; }

            if (keys.up) {
                if (p.jumpCount < p.maxJumps) {
                    const power = p.jumpCount === 0 ? p.jumpPower : p.jumpPower * (0.85 - p.jumpCount * 0.06);
                    p.vy = power;
                    p.jumpCount++;
                    p.onGround = false;
                    spawnParticles(p.x + p.w / 2, p.y + p.h, '#9b6bff', 6);
                    playSound('jump');
                    game.keysPressed.up = false;
                }
            }

            p.vy += GRAVITY;
            if (p.vy > 13) p.vy = 13;

            p.x += p.vx;
            if (p.x < 0) p.x = 0;
            if (p.x + p.w > W) p.x = W - p.w;

            p.y += p.vy;
            p.onGround = false;
            for (const plat of game.platforms) {
                if (rectCollide(p, plat)) {
                    if (p.vy > 0) { p.y = plat.y - p.h;
                        p.vy = 0;
                        p.onGround = true;
                        p.jumpCount = 0; } else if (p.vy < 0) { p.y = plat.y + plat.h;
                        p.vy = 0; }
                }
            }
            if (p.y > H + 50) { takeDamage(50); return; }

            if (game.frame % 2 === 0) {
                p.trail.push({ x: p.x, y: p.y, life: 20 });
                if (p.trail.length > 15) p.trail.shift();
            }
            for (let i = p.trail.length - 1; i >= 0; i--) {
                p.trail[i].life--;
                if (p.trail[i].life <= 0) p.trail.splice(i, 1);
            }

            for (const key of game.keys) {
                if (key.collected) continue;
                if (dist(p.x + p.w / 2, p.y + p.h / 2, key.x, key.y) < 26) {
                    key.collected = true;
                    game.keysCollected++;
                    spawnParticles(key.x, key.y, '#f7d44a', 20);
                    playSound('key');
                    addExp(5);
                    updateUI();
                }
            }

            for (let i = game.items.length - 1; i >= 0; i--) {
                const item = game.items[i];
                if (dist(p.x + p.w / 2, p.y + p.h / 2, item.x, item.y) < 25) {
                    if (item.type === 'heal') {
                        game.hp = Math.min(game.player.maxHp, game.hp + item.value);
                        spawnParticles(item.x, item.y, '#44ff88', 15);
                        playSound('heal');
                        addExp(5);
                        game.items.splice(i, 1);
                        updateUI();
                    } else if (item.type === 'weapon') {
                        game.player.weapon = item.weaponIdx;
                        spawnParticles(item.x, item.y, '#ffaa44', 20);
                        playSound('weapon');
                        addExp(10);
                        game.items.splice(i, 1);
                        updateUI();
                    }
                }
            }

            if (game.keysCollected >= game.totalKeys) {
                if (rectCollide(p, game.exit)) {
                    game.levelComplete = true;
                    addExp(50 + game.totalCycles * 10);
                    let nw = game.world,
                        nb = game.branch,
                        nl = game.level + 1;
                    if (nl >= game.maxLevel) { nl = 0;
                        nb++; if (nb >= game.maxBranch) { nb = 0;
                            nw++; if (nw >= game.maxWorld) {
                                if (game.infiniteMode) {
                                    nw = 0;
                                    game.totalCycles++;
                                    showMessage('♾️ 无尽轮回', '第 ' + game.totalCycles + ' 轮 · 难度提升！');
                                    setTimeout(() => {
                                        msgOverlay.classList.remove('show');
                                        game.world = 0;
                                        game.branch = 0;
                                        game.level = 0;
                                        loadLevel(0, 0, 0);
                                        game.levelComplete = false;
                                        updateUI();
                                    }, 1500);
                                    return;
                                } else {
                                    game.running = false;
                                    showMessage('🏆 通关！', '按空格开启无尽模式继续挑战');
                                    return;
                                }
                            } } }
                    }
                    const displayW = game.infiniteMode ? (game.totalCycles * 3 + nw + 1) : (nw + 1);
                    showMessage('🎉 过关！', '进入 ' + displayW + '-' + (nb + 1) + '-' + (nl + 1));
                    setTimeout(() => {
                        msgOverlay.classList.remove('show');
                        game.world = nw;
                        game.branch = nb;
                        game.level = nl;
                        loadLevel(nw, nb, nl);
                        game.levelComplete = false;
                        updateUI();
                    }, 1200);
                }
            }

            for (const e of game.enemies) {
                if (e.y > H + 50) continue;
                if (rectCollide(p, e)) {
                    if (p.vy > 0 && p.y + p.h - e.y < 20) {
                        e.y = H + 100;
                        p.vy = p.jumpPower * 0.6;
                        p.jumpCount = 0;
                        spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 30);
                        playSound('kill');
                        game.totalKills++;
                        addExp(e.expReward || 10);
                        if (Math.random() < 0.2) {
                            game.items.push({ type: 'heal', x: e.x + e.w / 2, y: e.y - 30, r: 12, value: 20 + Math.floor(game
                                    .totalCycles * 2) });
                        }
                    } else if (p.invincible <= 0) {
                        takeDamage(e.damage || 10);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
            }

            if (game.isBoss && game.boss && game.boss.hp > 0) {
                const b = game.boss;
                if (rectCollide(p, b)) {
                    if (p.vy > 0 && p.y + p.h - b.y < 30) {
                        b.hp -= 2 + Math.floor(stats.damageBonus);
                        b.hitCooldown = 15;
                        p.vy = p.jumpPower * 0.6;
                        p.jumpCount = 0;
                        spawnBlood(b.x + b.w / 2, b.y + 10, 30);
                        playSound('boss_hit');
                        game.screenShake = 10;
                        updateBossUI();
                        if (b.hp <= 0) bossDefeated();
                    } else if (p.invincible <= 0) {
                        takeDamage(25 + Math.floor(game.totalCycles * 0.5));
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
                updateBossAI();
            }

            const timeScale = game.skillActive ? 0.6 : 1.0;
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const bull = game.bullets[i];
                if (bull.homing && bull.life > 30) {
                    let target = null,
                        minDist = Infinity;
                    for (const e of game.enemies) {
                        if (e.y > H + 50) continue;
                        const d = dist(bull.x, bull.y, e.x + e.w / 2, e.y + e.h / 2);
                        if (d < minDist) { minDist = d;
                            target = e; }
                    }
                    if (target) {
                        const dx = target.x + target.w / 2 - bull.x;
                        const dy = target.y + target.h / 2 - bull.y;
                        const d = Math.hypot(dx, dy);
                        if (d > 0) {
                            bull.vx += (dx / d) * 0.06;
                            bull.vy += (dy / d) * 0.06;
                            const sp = Math.hypot(bull.vx, bull.vy);
                            if (sp > 10) { bull.vx = (bull.vx / sp) * 10;
                                bull.vy = (bull.vy / sp) * 10; }
                        }
                    }
                }
                bull.x += bull.vx * timeScale;
                bull.y += bull.vy * timeScale;
                bull.life--;
                if (bull.x < -20 || bull.x > W + 20 || bull.y < -20 || bull.y > H + 20 || bull.life <= 0) {
                    game.bullets.splice(i, 1);
                    continue;
                }
                let hit = false;
                for (const e of game.enemies) {
                    if (e.y > H + 50) continue;
                    if (dist(bull.x, bull.y, e.x + e.w / 2, e.y + e.h / 2) < bull.r + 12) {
                        e.hp -= bull.damage;
                        bull.hitCount++;
                        if (bull.explode) {
                            spawnParticles(bull.x, bull.y, '#ff6633', 30, 2);
                            playSound('explode');
                            for (const e2 of game.enemies) {
                                if (e2 === e || e2.y > H + 50) continue;
                                if (dist(bull.x, bull.y, e2.x + e2.w / 2, e2.y + e2.h / 2) < 60) {
                                    e2.hp -= Math.ceil(bull.damage * 0.5);
                                    if (e2.hp <= 0) {
                                        e2.y = H + 100;
                                        spawnBlood(e2.x + e2.w / 2, e2.y + e2.h / 2, 15);
                                        playSound('kill');
                                        game.totalKills++;
                                        addExp(e2.expReward || 10);
                                    } else e2.hitFlash = 10;
                                }
                            }
                            game.bullets.splice(i, 1);
                            hit = true;
                            break;
                        }
                        if (e.hp <= 0) {
                            e.y = H + 100;
                            spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                            playSound('kill');
                            game.totalKills++;
                            addExp(e.expReward || 10);
                            if (Math.random() < 0.15) {
                                game.items.push({ type: 'heal', x: e.x + e.w / 2, y: e.y - 30, r: 12, value: 20 + Math.floor(
                                        game.totalCycles * 2) });
                            }
                        } else { e.hitFlash = 10;
                            spawnParticles(bull.x, bull.y, '#ffaa44', 5); }
                        if (bull.pierce > 0 && bull.hitCount >= bull.pierce) { game.bullets.splice(i, 1);
                            hit = true; break; }
                        hit = true;
                        break;
                    }
                }
                if (!hit && game.isBoss && game.boss && game.boss.hp > 0) {
                    const b = game.boss;
                    if (bull.x > b.x && bull.x < b.x + b.w && bull.y > b.y && bull.y < b.y + b.h) {
                        b.hp -= bull.damage;
                        b.hitCooldown = 10;
                        spawnBlood(bull.x, bull.y, 10);
                        playSound('boss_hit');
                        game.screenShake = 6;
                        updateBossUI();
                        hit = true;
                        if (b.hp <= 0) bossDefeated();
                    }
                }
                if (hit) game.bullets.splice(i, 1);
            }

            const enemyTimeScale = game.skillActive ? 0.4 : 1.0;
            updateEnemies(enemyTimeScale);
            updateParticles();
            updateUI();
        }

        // ================================================================
        //  敌人AI
        // ================================================================
        function updateEnemies(timeScale) {
            const p = game.player;
            for (const e of game.enemies) {
                if (e.y > H + 50) continue;
                const dx = p.x + p.w / 2 - (e.x + e.w / 2);
                const dy = p.y + p.h / 2 - (e.y + e.h / 2);
                const d = Math.hypot(dx, dy);
                if (d < e.aggroRange && d > 20) {
                    e.x += Math.sign(dx) * e.speed * 0.6 * timeScale;
                    if (e.level >= 1 && Math.random() < 0.01 * timeScale) e.y -= 4 * timeScale;
                    if (e.x < 0) e.x = 0;
                    if (e.x > W - e.w) e.x = W - e.w;
                } else {
                    e.x += e.vx * e.speed * timeScale;
                    if (e.x < e.minX || e.x > e.maxX) e.vx *= -1;
                }
                if (e.type === 'bat') e.y += Math.sin(game.frame * 0.05 + e.x) * 0.4 * timeScale;
                else if (e.type === 'ghost') e.y = e.startY + Math.sin(game.frame * 0.04 + e.x * 0.1) * 10 * timeScale;
                if (e.hitFlash > 0) e.hitFlash--;
            }
        }

        // ================================================================
        //  Boss AI (6种)
        // ================================================================
        function updateBossAI() {
            const b = game.boss;
            if (!b || b.hp <= 0) return;
            const p = game.player;
            const dx = p.x + p.w / 2 - (b.x + b.w / 2);
            const dy = p.y + p.h / 2 - (b.y + b.h / 2);
            const d = Math.hypot(dx, dy);
            const timeScale = game.skillActive ? 0.5 : 1.0;
            const pattern = b.type.attackPattern;

            if (pattern === 'chase') {
                if (b.dashTimer > 0) {
                    b.dashTimer -= timeScale;
                    b.x += b.dashDir.x * 4 * timeScale;
                    b.y += b.dashDir.y * 4 * timeScale;
                } else {
                    if (d > 120) { b.x += Math.sign(dx) * 1.2 * timeScale;
                        b.y += Math.sign(dy) * 0.8 * timeScale; } else if (d < 80 && Math.random() < 0.02 * timeScale) {
                        b.dashTimer = 20;
                        b.dashDir = { x: Math.sign(dx), y: Math.sign(dy) }; }
                }
            } else if (pattern === 'spread' || pattern === 'teleport') {
                if (b.teleportTimer !== undefined) {
                    b.teleportTimer -= timeScale;
                    if (b.teleportTimer <= 0 && Math.random() < 0.02 * timeScale) {
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 100 + Math.random() * 150;
                        b.x = p.x + p.w / 2 + Math.cos(angle) * dist - b.w / 2;
                        b.y = p.y + p.h / 2 + Math.sin(angle) * dist - b.h / 2;
                        b.x = Math.max(20, Math.min(W - b.w - 20, b.x));
                        b.y = Math.max(50, Math.min(380, b.y));
                        b.teleportTimer = 60 + Math.random() * 60;
                        spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#aa44ff', 20, 2);
                    }
                } else {
                    if (d > 150) { b.x += Math.sign(dx) * 0.6 * timeScale;
                        b.y += Math.sign(dy) * 0.4 * timeScale; } else if (d < 80) { b.x -= Math.sign(dx) * 0.4 * timeScale;
                        b.y -= Math.sign(dy) * 0.3 * timeScale; }
                }
            } else {
                if (d > 150) { b.x += Math.sign(dx) * 0.6 * timeScale;
                    b.y += Math.sign(dy) * 0.4 * timeScale; } else if (d < 80) { b.x -= Math.sign(dx) * 0.4 * timeScale;
                    b.y -= Math.sign(dy) * 0.3 * timeScale; }
            }

            b.x = Math.max(20, Math.min(W - b.w - 20, b.x));
            b.y = Math.max(50, Math.min(380, b.y));

            b.timer++;
            let fireRate = Math.max(10, 40 - Math.floor((b.maxHp - b.hp) / 4) - Math.floor(game.totalCycles * 0.5));
            if (fireRate < 10) fireRate = 10;

            if (b.timer > fireRate / Math.max(0.3, timeScale)) {
                b.timer = 0;
                const angle = Math.atan2(dy, dx);
                const baseSpeed = (2.5 + (1 - b.hp / b.maxHp) * 1.8 + game.totalCycles * 0.08) * timeScale;

                switch (pattern) {
                    case 'linear':
                        for (let i = -1; i <= 1; i++) {
                            const a = angle + i * 0.15;
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * baseSpeed, vy: Math.sin(
                                    a) * baseSpeed, r: 8, color: '#44ff44' });
                        }
                        break;
                    case 'spread':
                        for (let i = -3; i <= 3; i++) {
                            const a = angle + i * 0.2;
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * baseSpeed * 0.8, vy: Math
                                    .sin(a) * baseSpeed * 0.8, r: 6, color: '#cc88ff' });
                        }
                        break;
                    case 'ring':
                        for (let i = 0; i < 8 + Math.floor(game.totalCycles * 0.3); i++) {
                            const a = (i / 8) * Math.PI * 2 + game.frame * 0.02;
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * baseSpeed * 0.6, vy: Math
                                    .sin(a) * baseSpeed * 0.6, r: 7, color: '#ff8844' });
                        }
                        if (b.hp < b.maxHp * 0.5 && Math.random() < 0.1) {
                            game.enemies.push({
                                x: b.x + Math.random() * b.w,
                                y: b.y + b.h + 10,
                                w: 20,
                                h: 20,
                                type: 'ghost',
                                level: 1,
                                hp: 3 + Math.floor(game.totalCycles * 0.3),
                                vx: (Math.random() - 0.5) * 2,
                                speed: 1.0 + game.totalCycles * 0.05,
                                minX: 0,
                                maxX: W,
                                startY: b.y + b.h + 10,
                                damage: 10 + Math.floor(game.totalCycles * 0.5),
                                hitFlash: 0,
                                aggroRange: 200,
                                jumpTimer: 0,
                                expReward: 5 + Math.floor(game.totalCycles * 0.5),
                            });
                        }
                        break;
                    case 'chase':
                        for (let i = -2; i <= 2; i++) {
                            const a = angle + i * 0.25;
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * baseSpeed * 0.9, vy: Math
                                    .sin(a) * baseSpeed * 0.9, r: 9, color: '#ff4444' });
                        }
                        break;
                    case 'random':
                        for (let i = 0; i < 5 + Math.floor(game.totalCycles * 0.2); i++) {
                            const a = Math.random() * Math.PI * 2;
                            const sp = baseSpeed * (0.5 + Math.random() * 0.8);
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) *
                                    sp, r: 5 + Math.random() * 4, color: '#ff88cc' });
                        }
                        if (b.hp < b.maxHp * 0.4 && b.splitCount < 3) {
                            b.splitCount++;
                            for (let i = 0; i < 2; i++) {
                                const a2 = Math.random() * Math.PI * 2;
                                const d2 = 40 + Math.random() * 30;
                                const cx = b.x + b.w / 2 + Math.cos(a2) * d2;
                                const cy = b.y + b.h / 2 + Math.sin(a2) * d2;
                                game.enemies.push({
                                    x: cx - 12,
                                    y: cy - 12,
                                    w: 24,
                                    h: 24,
                                    type: 'mushroom',
                                    level: 2,
                                    hp: 5 + Math.floor(game.totalCycles * 0.5),
                                    vx: (Math.random() - 0.5) * 3,
                                    speed: 1.5 + game.totalCycles * 0.05,
                                    minX: 0,
                                    maxX: W,
                                    startY: cy - 12,
                                    damage: 15 + Math.floor(game.totalCycles * 0.5),
                                    hitFlash: 0,
                                    aggroRange: 200,
                                    jumpTimer: 0,
                                    expReward: 8 + Math.floor(game.totalCycles * 0.5),
                                });
                            }
                        }
                        break;
                    case 'omnidirectional':
                        for (let i = 0; i < 12 + Math.floor(game.totalCycles * 0.5); i++) {
                            const a = (i / 12) * Math.PI * 2 + game.frame * 0.015;
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * baseSpeed * 0.7, vy: Math
                                    .sin(a) * baseSpeed * 0.7, r: 6, color: '#8844ff' });
                        }
                        break;
                }
            }

            for (let i = b.bullets.length - 1; i >= 0; i--) {
                const bull = b.bullets[i];
                bull.x += bull.vx;
                bull.y += bull.vy;
                if (bull.x < -30 || bull.x > W + 30 || bull.y < -30 || bull.y > H + 30) { b.bullets.splice(i, 1); continue; }
                if (dist(p.x + p.w / 2, p.y + p.h / 2, bull.x, bull.y) < bull.r + 12) {
                    if (p.invincible <= 0) {
                        takeDamage(15 + Math.floor(game.totalCycles * 0.3));
                        b.bullets.splice(i, 1);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
            }
            if (b.hitCooldown > 0) b.hitCooldown--;
        }

        function bossDefeated() {
            const b = game.boss;
            spawnBlood(b.x + b.w / 2, b.y + b.h / 2, 100);
            spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ff8833', 60, 2);
            game.screenShake = 25;
            playSound('death');
            const expReward = (b.expReward || 80) + game.totalCycles * 15;
            addExp(expReward);
            game.boss = null;
            game.isBoss = false;
            game.items.push({ type: 'heal', x: b.x + 10, y: b.y + 10, r: 12, value: 60 + game.totalCycles * 5 });
            game.items.push({ type: 'heal', x: b.x + b.w - 30, y: b.y + 10, r: 12, value: 60 + game.totalCycles * 5 });
            game.items.push({ type: 'weapon', weaponIdx: 3, x: b.x + b.w / 2 - 10, y: b.y + b.h + 10, r: 14 });
            showMessage('💀 ' + b.type.name + ' 被击败！', '获得 ' + expReward + ' 经验！');
            setTimeout(() => {
                msgOverlay.classList.remove('show');
                const p = game.player;
                for (const item of game.items) {
                    if (dist(p.x + p.w / 2, p.y + p.h / 2, item.x, item.y) < 60) {
                        if (item.type === 'heal') {
                            game.hp = Math.min(game.player.maxHp, game.hp + item.value);
                            spawnParticles(item.x, item.y, '#44ff88', 10);
                            playSound('heal');
                            game.items = game.items.filter(it => it !== item);
                        } else if (item.type === 'weapon') {
                            game.player.weapon = item.weaponIdx;
                            spawnParticles(item.x, item.y, '#ffaa44', 15);
                            playSound('weapon');
                            game.items = game.items.filter(it => it !== item);
                        }
                    }
                }
                updateUI();
            }, 2000);
            bossHpBar.style.display = 'none';
            bossNameDisplay.style.display = 'none';
            updateUI();
        }

        // ================================================================
        //  伤害与死亡
        // ================================================================
        function takeDamage(amount) {
            if (game.player.invincible > 0) return;
            game.hp -= amount;
            game.player.invincible = 30;
            game.screenShake = 8;
            playSound('damage');
            spawnBlood(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, 25);
            if (game.hp <= 0) { game.hp = 0;
                gameOver(); }
            updateUI();
        }

        function gameOver() {
            game.running = false;
            game.gameOver = true;
            playSound('death');
            showMessage('💀 死亡', '在无尽第 ' + (game.totalCycles + 1) + ' 轮倒下\n按 空格键 重新开始');
        }

        function showMessage(title, sub) {
            msgText.innerHTML = title + '<div id="msgSub">' + (sub || '') + '</div>';
            msgOverlay.classList.add('show');
        }

        // ================================================================
        //  绘制（完整背景修复）
        // ================================================================
        function draw() {
            const w = game.world % 3;
            const theme = WORLDS[w] || WORLDS[0];
            const scary = theme.scary + (game.infiniteMode ? 0.5 : 0);

            // 清空画布
            ctx.clearRect(0, 0, W, H);

            // ---- 背景渐变 ----
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, theme.bg1);
