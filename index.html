<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>👻 暗影勇者 · 双人联机版</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js">
    </script>
    <style>
        /* ===== 样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            overflow: hidden;
            touch-action: none;
        }
        #wrapper {
            background: #141425;
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #1a1a30;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: auto;
            max-width: 800px;
            max-height: 550px;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: #ccc;
            font-weight: bold;
            font-size: 17px;
            padding: 0 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        #uiLeft {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }
        .label {
            color: #667799;
            font-weight: normal;
        }
        #hpDisplay {
            color: #ff6b6b;
            font-size: 22px;
            text-shadow: 0 0 25px #ff6b6b55;
        }
        #worldDisplay {
            color: #6bcbff;
            font-size: 20px;
            text-shadow: 0 0 25px #6bcbff55;
        }
        #keyDisplay {
            color: #f7d44a;
            font-size: 20px;
        }
        #jumpDisplay {
            color: #9b6bff;
            font-size: 20px;
            text-shadow: 0 0 25px #9b6bff55;
        }
        #weaponDisplay {
            color: #ffaa44;
            font-size: 18px;
        }
        #skillDisplay {
            color: #44ff88;
            font-size: 16px;
            background: #0a1a12;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #44ff8866;
            cursor: pointer;
        }
        #skillDisplay:hover {
            background: #1a2a22;
        }
        #levelDisplay {
            color: #f7d44a;
            font-size: 20px;
            text-shadow: 0 0 25px #f7d44a55;
        }
        #bossNameDisplay {
            color: #ff4444;
            font-size: 18px;
            text-shadow: 0 0 30px #ff444466;
            display: none;
        }
        #bossHpBar {
            color: #ff3333;
            font-size: 18px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        #bossHpBar .bar {
            width: 180px;
            height: 14px;
            background: #2a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #663333;
        }
        #bossHpBar .fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3333, #ff8833);
            border-radius: 10px;
            transition: width .15s;
        }
        .btn {
            background: #2a1a3a;
            color: #ffaa44;
            border: 2px solid #ffaa44;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        .btn:hover {
            background: #3a2a4a;
        }
        .btn.active {
            border-color: #44ff88;
            color: #44ff88;
        }
        .btn-stat {
            background: #1a2a3a;
            color: #6bcbff;
            border: 2px solid #6bcbff;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        .btn-stat:hover {
            background: #2a3a4a;
        }
        #hint {
            color: #445566;
            font-size: 13px;
            background: #0e0e1e;
            padding: 6px 18px;
            border-radius: 30px;
            text-align: right;
        }
        #msgOverlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 80px);
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #msgOverlay.show {
            display: flex;
        }
        #msgText {
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 80px #ff000066;
            animation: pop .5s ease;
            text-align: center;
            line-height: 1.4;
            padding: 20px;
        }
        #msgSub {
            font-size: 20px;
            color: #ff6666;
            margin-top: 10px;
            font-weight: normal;
            text-shadow: 0 0 40px #ff000044;
        }
        @keyframes pop {
            0% {
                transform: scale(.2) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        #statPanel {
            position: absolute;
            top: 80px;
            right: 20px;
            background: #0a0a1aee;
            border: 2px solid #6bcbff;
            border-radius: 16px;
            padding: 20px 24px;
            color: #fff;
            z-index: 20;
            display: none;
            min-width: 240px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 60px #6bcbff33;
            font-size: 14px;
        }
        #statPanel h3 {
            text-align: center;
            color: #f7d44a;
            margin-bottom: 12px;
            font-size: 20px;
        }
        #statPanel .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid #33445544;
        }
        #statPanel .stat-row .stat-name {
            color: #aabbdd;
        }
        #statPanel .stat-row .stat-val {
            color: #fff;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }
        #statPanel .stat-row button {
            background: #2a3a5a;
            color: #6bcbff;
            border: 1px solid #6bcbff;
            border-radius: 30px;
            padding: 0 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        #statPanel .stat-row button:hover {
            background: #3a4a6a;
        }
        #statPanel .stat-row button:disabled {
            opacity: .3;
            cursor: not-allowed;
        }
        #statPanel .points-remaining {
            text-align: center;
            color: #44ff88;
            font-size: 18px;
            margin: 10px 0 8px;
            padding: 6px;
            background: #0a1a12;
            border-radius: 10px;
            border: 1px solid #44ff8844;
        }
        #statPanel .close-btn {
            display: block;
            margin: 10px auto 0;
            background: #3a1a1a;
            color: #ff6666;
            border: 1px solid #ff6666;
            border-radius: 30px;
            padding: 4px 24px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        #statPanel .close-btn:hover {
            background: #4a2a2a;
        }
        #wrapper {
            position: relative;
        }
        #levelUpMsg {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #f7d44a;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 40px #f7d44a88;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            transition: opacity .3s;
        }
        #levelUpMsg.show {
            opacity: 1;
        }
        #skillTreePanel {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: #0a0a1aee;
            border: 2px solid #f7d44a;
            border-radius: 20px;
            padding: 20px 28px;
            color: #fff;
            z-index: 25;
            display: none;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 60px #f7d44a33;
            min-width: 380px;
            max-width: 90vw;
        }
        #skillTreePanel h3 {
            text-align: center;
            color: #f7d44a;
            font-size: 22px;
            margin-bottom: 10px;
            border-bottom: 1px solid #f7d44a44;
            padding-bottom: 8px;
        }
        .skill-tree-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #33445555;
        }
        .skill-tree-row .skill-name {
            color: #aabbdd;
            font-weight: bold;
            min-width: 100px;
        }
        .skill-tree-row .skill-cost {
            color: #ffaa44;
            font-size: 14px;
            margin: 0 8px;
        }
        .skill-tree-row .skill-status {
            font-size: 14px;
            min-width: 60px;
            text-align: center;
        }
        .skill-tree-row button {
            background: #2a3a5a;
            color: #6bcbff;
            border: 1px solid #6bcbff;
            border-radius: 30px;
            padding: 0 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: .2s;
        }
        .skill-tree-row button:hover {
            background: #3a4a6a;
        }
        .skill-tree-row button:disabled {
            opacity: .3;
            cursor: not-allowed;
        }
        .currency-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            padding: 10px 0;
            color: #ccddff;
            font-size: 16px;
            border-bottom: 1px solid #33445555;
            margin-bottom: 8px;
        }
        .currency-row span {
            background: #0a0a1a;
            padding: 2px 16px;
            border-radius: 30px;
        }
        #skillTreeClose {
            display: block;
            margin: 12px auto 0;
            background: #3a1a1a;
            color: #ff6666;
            border: 1px solid #ff6666;
            border-radius: 30px;
            padding: 4px 24px;
            font-weight: bold;
            cursor: pointer;
        }
        #skillTreeBtn {
            border-color: #f7d44a;
            color: #f7d44a;
        }
        #roomDisplay {
            color: #44ff88;
            font-size: 14px;
            display: none;
        }
        #peerStatus {
            color: #8899aa;
            font-size: 12px;
        }
        #roomInput {
            width: 70px;
            background: #1a1a30;
            color: #fff;
            border: 1px solid #445566;
            border-radius: 10px;
            padding: 3px 6px;
            font-size: 13px;
            display: inline-block;
        }
        #roomInput:focus {
            outline: none;
            border-color: #6bcbff;
        }
        #modeToggle {
            font-size: 12px;
            padding: 2px 10px;
            border-color: #44ff88;
            color: #44ff88;
        }
        #mobileControls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: calc(100% - 80px);
            pointer-events: none;
            z-index: 5;
            display: none;
        }
        #mobileControls.active {
            display: block;
        }
        .ctrl-zone {
            position: absolute;
            pointer-events: auto;
            touch-action: none;
        }
        #joystickZone {
            left: 20px;
            bottom: 30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 2px solid rgba(255, 255, 255, .15);
        }
        #joystickKnob {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(100, 200, 255, .4);
            border: 2px solid rgba(100, 200, 255, .6);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #shootZone {
            right: 20px;
            bottom: 30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 100, 100, .15);
            border: 2px solid rgba(255, 100, 100, .3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .4);
            font-size: 14px;
            font-weight: bold;
            pointer-events: auto;
        }
        #jumpBtn {
            position: absolute;
            left: 180px;
            bottom: 40px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(155, 107, 255, .25);
            border: 2px solid rgba(155, 107, 255, .4);
            color: rgba(255, 255, 255, .5);
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }
        #mobileWeaponBtn {
            position: absolute;
            right: 170px;
            bottom: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 170, 68, .2);
            border: 2px solid rgba(255, 170, 68, .3);
            color: rgba(255, 255, 255, .4);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }
        #mobileSkillBtn {
            position: absolute;
            right: 170px;
            bottom: 95px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(68, 255, 136, .2);
            border: 2px solid rgba(68, 255, 136, .3);
            color: rgba(255, 255, 255, .4);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }
        @media(max-width:760px) {
            #wrapper {
                padding: 10px;
            }
            #ui {
                font-size: 13px;
            }
            #hint {
                font-size: 10px;
                padding: 4px 10px;
                display: none;
            }
            #msgText {
                font-size: 28px;
            }
            #msgSub {
                font-size: 16px;
            }
            #uiLeft {
                gap: 10px;
            }
            #bossHpBar .bar {
                width: 80px;
            }
            #statPanel {
                top: 60px;
                right: 10px;
                padding: 14px 16px;
                min-width: 180px;
                font-size: 12px;
            }
            #levelUpMsg {
                font-size: 20px;
                top: 20px;
                left: 20px;
            }
            #mobileControls.active {
                display: block !important;
            }
            .btn,
            .btn-stat {
                font-size: 12px;
                padding: 3px 12px;
            }
            #skillTreePanel {
                min-width: 300px;
                padding: 14px 16px;
                top: 40px;
            }
            #roomInput {
                width: 55px;
                font-size: 12px;
            }
        }
        @media(pointer:coarse) {
            #mobileControls.active {
                display: block !important;
            }
            #hint {
                display: none;
            }
        }
        @media(pointer:fine) {
            #mobileControls.active {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <canvas id="gameCanvas" width="800" height="550"></canvas>
        <div id="msgOverlay"><div id="msgText">🎉<div id="msgSub"></div></div></div>
        <div id="levelUpMsg">⬆ Lv.1</div>

        <div id="mobileControls">
            <div id="joystickZone" class="ctrl-zone"><div id="joystickKnob"></div></div>
            <div id="shootZone" class="ctrl-zone">🔫</div>
            <div id="jumpBtn" class="ctrl-zone">⬆</div>
            <div id="mobileWeaponBtn" class="ctrl-zone">⚔</div>
            <div id="mobileSkillBtn" class="ctrl-zone">⏳</div>
        </div>

        <div id="statPanel">
            <h3>📊 属性分配</h3>
            <div class="points-remaining" id="pointsRemaining">剩余: 0</div>
            <div class="stat-row"><span class="stat-name">❤️ 生命</span><span class="stat-val" id="statHp">100</span><button onclick="upgradeStat('maxHp')">+</button></div>
            <div class="stat-row"><span class="stat-name">🏃 速度</span><span class="stat-val" id="statSpeed">4.2</span><button onclick="upgradeStat('speed')">+</button></div>
            <div class="stat-row"><span class="stat-name">🦘 跳跃</span><span class="stat-val" id="statJump">10.8</span><button onclick="upgradeStat('jumpPower')">+</button></div>
            <div class="stat-row"><span class="stat-name">⚔️ 伤害</span><span class="stat-val" id="statDamage">+0</span><button onclick="upgradeStat('damageBonus')">+</button></div>
            <div class="stat-row"><span class="stat-name">🔫 射速</span><span class="stat-val" id="statFireRate">1.0</span><button onclick="upgradeStat('fireRate')">+</button></div>
            <button class="close-btn" onclick="toggleStatPanel()">✕ 关闭</button>
        </div>

        <div id="skillTreePanel">
            <h3>🌳 技能树</h3>
            <div class="currency-row"><span>🪙 金币: <span id="goldDisplay">0</span></span><span>💎 宝石: <span id="gemDisplay">0</span></span></div>
            <div id="skillTreeList"></div>
            <button id="skillTreeClose">✕ 关闭</button>
        </div>

        <div id="ui">
            <div id="uiLeft">
                <span><span class="label">❤️</span> <span id="hpDisplay">100</span></span>
                <span><span class="label">⭐</span> <span id="levelDisplay">Lv.1</span></span>
                <span><span class="label">🌍</span> <span id="worldDisplay">1-1</span></span>
                <span><span class="label">🔑</span> <span id="keyDisplay">0 / 0</span></span>
                <span><span class="label">🦘</span> <span id="jumpDisplay">3</span></span>
                <span><span class="label">⚔️</span> <span id="weaponDisplay">普通</span></span>
                <span id="skillDisplay">⏳ 技能: 凝滞</span>
                <span id="bossNameDisplay">👹 Boss</span>
                <span id="bossHpBar"><span class="bar"><span class="fill" id="bossFill"></span></span></span>
                <button class="btn" id="infiniteToggle">♾️ 无尽</button>
                <button class="btn-stat" id="statBtn">📊 属性</button>
                <button class="btn" id="skillTreeBtn" style="border-color:#f7d44a;color:#f7d44a;">🌳 技能树</button>
                <button class="btn" id="hostBtn" style="border-color:#44ff88;color:#44ff88;font-size:13px;">🏠 创建</button>
                <button class="btn" id="joinBtn" style="border-color:#6bcbff;color:#6bcbff;font-size:13px;">🔗 加入</button>
                <input id="roomInput" placeholder="6位码" style="width:70px;background:#1a1a30;color:#fff;border:1px solid #445566;border-radius:10px;padding:3px 6px;font-size:13px;">
                <span id="roomDisplay" style="color:#44ff88;font-size:14px;display:none;"></span>
                <span id="peerStatus" style="color:#8899aa;font-size:12px;">🔴 离线</span>
                <button class="btn" id="modeToggle" style="border-color:#44ff88;color:#44ff88;font-size:11px;padding:2px 10px;">🤝 合作</button>
                <button class="btn" id="langToggle">🌐 EN</button>
            </div>
            <span id="hint">🖱️射击 | ← → 移动 | 空格跳 | Q切武器 | E切换技能 | F属性 | 点击技能树解锁</span>
        </div>
    </div>

    <script>
        // ================================================================
        //  👻 暗影勇者 · 双人联机完整版
        //  所有JS代码都在这一个 <script> 标签里
        // ================================================================

        // ----- 常量与UI -----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W = 800,
            H = 550;

        const hpSpan = document.getElementById('hpDisplay');
        const worldSpan = document.getElementById('worldDisplay');
        const keySpan = document.getElementById('keyDisplay');
        const jumpSpan = document.getElementById('jumpDisplay');
        const weaponSpan = document.getElementById('weaponDisplay');
        const skillSpan = document.getElementById('skillDisplay');
        const levelSpan = document.getElementById('levelDisplay');
        const bossNameSpan = document.getElementById('bossNameDisplay');
        const bossHpBar = document.getElementById('bossHpBar');
        const bossFill = document.getElementById('bossFill');
        const msgOverlay = document.getElementById('msgOverlay');
        const msgText = document.getElementById('msgText');
        const msgSub = document.getElementById('msgSub');
        const infiniteBtn = document.getElementById('infiniteToggle');
        const statBtn = document.getElementById('statBtn');
        const statPanel = document.getElementById('statPanel');
        const pointsRemaining = document.getElementById('pointsRemaining');
        const levelUpMsg = document.getElementById('levelUpMsg');

        const GRAVITY = 0.55;
        const FRICTION = 0.80;

        // ===== 联机变量 =====
        let peer = null;
        let conn = null;
        let isHost = false;
        let roomCode = '';
        let isConnected = false;
        let syncCounter = 0;
        let gameMode = 'coop';
        let otherPlayer = { x: 150, y: 300, hp: 100, maxHp: 100, facing: 1, weapon: 0, jumpCount: 0, maxJumps: 3,
            alive: true, gold: 0, gems: 0, level: 1, exp: 0, expToNext: 20, statPoints: 0, stats: {}, unlockedSkills: [] };

        // ----- 世界主题 -----
        const WORLDS = [
            { name: '翡翠森林', bg1: '#1a3a2a', bg2: '#2a5a3a', plat: '#4a8a4a', scary: 0 },
            { name: '暗影沼泽', bg1: '#0a0a1a', bg2: '#1a0a2a', plat: '#2a1a3a', scary: 1 },
            { name: '地狱深渊', bg1: '#0a0000', bg2: '#1a0000', plat: '#3a0a0a', scary: 2 }
        ];

        // ----- 6种武器 -----
        const WEAPONS = [

        // ----- 音频 -----
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) { try { audioCtx = new(window.AudioContext || webkitAudioContext)(); } catch (e) {} }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                switch (type) {
                    case 'shoot':
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                        break;
                    case 'jump':
                        osc.frequency.setValueAtTime(300 + (game?.player?.jumpCount || 0) * 80, now);
                        gain.gain.setValueAtTime(0.10, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'kill':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;

                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                        gain.gain.setValueAtTime(0.12, now);

        function upgradeStat(key) {
            if (playerData.statPoints <= 0) return;
            const cfg = STAT_CONFIG[key];
            if (!cfg) return;
            const cost = Math.floor(cfg.cost);
            if (playerData.statPoints < cost) return;
            playerData.statPoints -= cost;
            playerData.stats[key] += cfg.inc;
            updateStatUI();
            updateUI();
            applyStats();
        }

        function applyStats() {
            const p = game?.player;
            if (!p) return;
            p.maxHp = playerData.stats.maxHp;
            p.speed = playerData.stats.speed;
            p.jumpPower = -playerData.stats.jumpPower;
            if (playerData.unlockedSkills.has('skill_speed')) p.speed += 0.3;
            if (playerData.unlockedSkills.has('skill_jump')) p.maxJumps = 4;
            else p.maxJumps = 3;
            p.maxHp = playerData.stats.maxHp;
            if (playerData.hp > p.maxHp) playerData.hp = p.maxHp;
            updateUI();

        // ----- 移动端控制 -----
        let joystickDX = 0,

        function setupMobileControls() {
            const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
            if (!isMobile) { document.getElementById('mobileControls').classList.remove('active'); return; }
            document.getElementById('mobileControls').classList.add('active');
            const joystickZone = document.getElementById('joystickZone');
            const knob = document.getElementById('joystickKnob');
            const shootZone = document.getElementById('shootZone');
            const jumpBtn = document.getElementById('jumpBtn');
            const weaponBtn = document.getElementById('mobileWeaponBtn');
            const skillBtn = document.getElementById('mobileSkillBtn');

            let joystickTouchId = null;
            let shootTouchId = null;

            joystickZone.addEventListener('touchstart', (e) => { e.preventDefault(); const touch = e.changedTouches[0];
                    joystickTouchId = touch.identifier;
                    updateJoystick(touch); });
            joystickZone.addEventListener('touchmove', (e) => { e.preventDefault(); for (const touch of e
                        .changedTouches) { if (touch.identifier === joystickTouchId) updateJoystick(touch); } });
            joystickZone.addEventListener('touchend', (e) => { e.preventDefault();
                    joystickTouchId = null;
                    joystickDX = 0;
                    joystickDY = 0;
                    knob.style.top = '50%';
                    knob.style.left = '50%';
                    knob.style.transform = 'translate(-50%, -50%)';
                    game.touchLeft = false;
                    game.touchRight = false;
                    game.keysPressed.up = false; });

            function updateJoystick(touch) {
                const rect = joystickZone.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                let dx = (touch.clientX - cx) / (rect.width / 2);
                let dy = (touch.clientY - cy) / (rect.height / 2);
                const dist = Math.hypot(dx, dy);
                if (dist > 1) { dx /= dist;
                    dy /= dist; }
                joystickDX = dx;
                joystickDY = dy;
                knob.style.top = (50 + dy * 35) + '%';
                knob.style.left = (50 + dx * 35) + '%';
                knob.style.transform = 'translate(-50%, -50%)';
                game.touchLeft = dx < -0.3;
                game.touchRight = dx > 0.3;
                if (dy < -0.5) game.keysPressed.up = true;
                else game.keysPressed.up = false;
            }

            shootZone.addEventListener('touchstart', (e) => { e.preventDefault(); const touch = e.changedTouches[0];
                    shootTouchId = touch.identifier;
                    game.touchShoot = true; const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width /
                        rect.width; const scaleY = canvas.height / rect.height; const cx = (touch.clientX - rect.left) *
                        scaleX; const cy = (touch.clientY - rect.top) * scaleY;
                    game.touchX = cx;
                    game.touchY = cy;
                    tryShootMobile(cx, cy); });
            shootZone.addEventListener('touchmove', (e) => { e.preventDefault(); for (const touch of e
                        .changedTouches) { if (touch.identifier === shootTouchId) { const rect = canvas
                            .getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY =
                            canvas.height / rect.height; const cx = (touch.clientX - rect.left) * scaleX; const cy =
                            (touch.clientY - rect.top) * scaleY;
                        game.touchX = cx;
                        game.touchY = cy;
                        tryShootMobile(cx, cy); } } });
            shootZone.addEventListener('touchend', (e) => { e.preventDefault();
                    shootTouchId = null;
                    game.touchShoot = false; });

            function tryShootMobile(cx, cy) {
                if (!game.running || game.gameOver || game.levelComplete) return;
                game._mouseX = cx;
                game._mouseY = cy;
                shootBullet(cx, cy);
            }

            jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault();
                    game.keysPressed.up = true;
                    game.touchJump = true; });
            jumpBtn.addEventListener('touchend', (e) => { e.preventDefault();
                    game.keysPressed.up = false;
                    game.touchJump = false; });
            jumpBtn.addEventListener('touchcancel', () => { game.keysPressed.up = false;
                    game.touchJump = false; });

            weaponBtn.addEventListener('touchstart', (e) => { e.preventDefault();
                    game.player.weapon = (game.player.weapon + 1) % WEAPONS.length;
                    playSound('weapon');
                    updateUI(); });

            skillBtn.addEventListener('touchstart', (e) => { e.preventDefault();

            document.addEventListener('touchmove', (e) => { if (e.target.closest('#wrapper')) e.preventDefault(); }, {
                passive: false });
        }

        // ----- 加载关卡 -----
        function loadLevel(levelIdx) {
            const cycle = game.totalCycles;
            const difficulty = levelIdx + cycle * 3;
            const mapScale = 1 + Math.floor(cycle / 2) * 0.2;
            game.mapWidth = Math.min(1200, Math.floor(W * mapScale));
            game.mapHeight = H;

            const terrainIdx = (levelIdx + cycle * 7) % TERRAIN_TEMPLATES.length;
            game.terrainType = terrainIdx;
            const seed = levelIdx * 100 + cycle * 33;

            let platforms = [];
            platforms.push({ x: 0, y: game.mapHeight - 40, w: game.mapWidth, h: 40 });
            const extraPlats = TERRAIN_TEMPLATES[terrainIdx](seed);
            for (const p of extraPlats) { if (p.x + p.w < game.mapWidth - 20) platforms.push(p); }
            if (platforms.length < 3) {
                for (let i = 0; i < 5; i++) {
                    const x = 60 + i * 130 + Math.sin(seed + i) * 30;
                    const y = 350 - i * 50 + Math.sin(seed * 1.5 + i * 2) * 15;
                    platforms.push({ x: Math.max(10, Math.min(game.mapWidth - 70, x)), y: Math.max(60, Math.min(440, y)),
                        w: 70 + Math.sin(seed + i * 1.5) * 20, h: 14 });
                }
            }
            platforms.sort((a, b) => a.y - b.y);

            const lastPlat = platforms[platforms.length - 1] || platforms[0];
            const exitX = Math.min(game.mapWidth - 50, lastPlat.x + lastPlat.w / 2 - 15);
            const exitY = lastPlat.y - 40;

            // ---- 8种怪物混合 ----
            const enemies = [];
            const enemyCount = 4 + Math.floor(difficulty * 0.7);
            for (let i = 0; i < enemyCount; i++) {
                let plat = platforms[1 + (i * 3) % (platforms.length - 1)];
                if (!plat) plat = platforms[1] || platforms[0];
                const typeIdx = (levelIdx + i * 3 + cycle * 5) % MONSTER_TYPES.length;
                const mType = MONSTER_TYPES[typeIdx];
                const lvl = Math.min(2, Math.floor((difficulty + i) / 3));
                const size = (mType.size || 20) + lvl * 4;
                const hp = mType.hp + lvl + Math.floor(cycle * 0.5);
                const dmg = mType.damage + lvl * 3 + Math.floor(cycle * 1.5);
                enemies.push({
                    x: plat.x + 10 + i * 20,
                    y: plat.y - size,
                    w: size,
                    h: size,
                    type: mType.id,
                    name: mType.name,
                    color: mType.color,
                    glow: mType.glow,
                    level: lvl,
                    hp: hp,
                    maxHp: hp,
                    vx: (0.6 + lvl * 0.2) * (i % 2 === 0 ? 1 : -1),
                    speed: mType.speed + lvl * 0.05 + cycle * 0.02,
                    minX: Math.max(0, plat.x + 5),
                    maxX: Math.min(game.mapWidth, plat.x + plat.w - size - 5),
                    startY: plat.y - size,
                    damage: dmg,
                    hitFlash: 0,
                    aggroRange: mType.aggro + lvl * 20 + cycle * 5,
                    expReward: mType.exp + lvl * 2 + Math.floor(cycle * 2),
                    goldReward: (mType.goldReward || 3) + lvl,
                    gemReward: 0,
                    split: mType.split || false,
                    ranged: mType.ranged || false,
                    stealth: mType.stealth || false,
                    explode: mType.explode || false,
                    slow: mType.slow || false,
                    shootTimer: 0,
                    stealthTimer: 0,
                    isStealthed: false,
                });
            }

            // ---- 钥匙 ----
            const keys = [];
            const keyCount = 2 + Math.floor(difficulty / 2);
            const usedPlats = platforms.slice(1);
            for (let i = 0; i < Math.min(keyCount, usedPlats.length); i++) {
                const plat = usedPlats[i % usedPlats.length];
                keys.push({ x: plat.x + 15 + i * 20, y: plat.y - 28, collected: false, r: 9 });
            }
            while (keys.length < 2) {
                const plat = platforms[1 + keys.length % (platforms.length - 1)] || platforms[0];
                keys.push({ x: plat.x + 30 + keys.length * 20, y: plat.y - 28, collected: false, r: 9 });
            }

            // ---- 物品 ----
            const items = [];
            const healCount = 1 + Math.floor(difficulty / 3);
            for (let i = 0; i < healCount; i++) {
                let plat = platforms[1 + (i * 7 + levelIdx) % (platforms.length - 1)];
                if (!plat) plat = platforms[1] || platforms[0];
                items.push({ type: 'heal', x: plat.x + 20 + i * 25, y: plat.y - 30, r: 12, value: 20 });
            }
            if ((levelIdx % 2 === 1) && difficulty > 0) {
                let plat = platforms[2 % (platforms.length - 1)];
                if (!plat) plat = platforms[1] || platforms[0];
                const wIdx = Math.min(5, Math.floor(difficulty / 2) + 1);
                items.push({ type: 'weapon', weaponIdx: wIdx, x: plat.x + 30, y: plat.y - 30, r: 14 });
            }

            // ---- Boss ----
            let isBoss = (levelIdx % 5 === 4);
            let boss = null;
            let bossType = null;
            if (isBoss) {
                const bossPlat = platforms[Math.floor(platforms.length / 2)] || platforms[0];
                const bossIdx = (levelIdx + cycle * 7) % BOSS_TYPES.length;
                bossType = BOSS_TYPES[bossIdx];
                const hpMult = 1 + cycle * 0.3 + levelIdx * 0.05;
                const bossHp = Math.floor((60 + cycle * 20 + levelIdx * 5) * hpMult);
                boss = {
                    x: Math.min(game.mapWidth - 100, bossPlat.x + bossPlat.w / 2 - 35),
                    y: bossPlat.y - 80,
                    w: 70,
                    h: 80,
                    hp: bossHp,
                    maxHp: bossHp,
                    timer: 0,
                    bullets: [],
                    hitCooldown: 0,
                    expReward: 80 + cycle * 15 + levelIdx * 5,
                    type: bossType,
                    phase: 0,
                    gemReward: bossType.gemReward || 3,
                };
                enemies.splice(0, Math.floor(enemies.length / 2));
                game.bossType = bossType;
                bossNameSpan.textContent = t('boss') + ' ' + bossType.desc;
                bossNameSpan.style.display = 'block';
            } else {
                game.bossType = null;
                bossNameSpan.style.display = 'none';
            }

            game.platforms = platforms;
            game.enemies = enemies.map(e => ({ ...e, hitFlash: 0 }));
            game.keys = keys.map(k => ({ ...k, collected: false }));
            game.items = items.map(i => ({ ...i }));
            game.exit = { x: exitX, y: exitY, w: 30, h: 38 };
            game.totalKeys = game.keys.length;
            game.keysCollected = 0;
            game.levelComplete = false;
            game.bullets = [];
            game.isBoss = isBoss;
            game.boss = boss ? { ...boss, bullets: [], hitCooldown: 0, timer: 0 } : null;
            game.screenShake = 0;
            game.bossSpawned = isBoss;
            game.thunderTimer = 0;

            const p = game.player;
            p.x = 40;
            p.y = 400;
            p.vx = 0;
            p.vy = 0;
            p.onGround = false;
            p.jumpCount = 0;
            p.invincible = 0;
            p.trail = [];
            p.speed = playerData.stats.speed;
            p.jumpPower = -playerData.stats.jumpPower;
            p.maxHp = playerData.stats.maxHp;
            p.healTimer = 0;
            if (playerData.hp > p.maxHp) playerData.hp = p.maxHp;

            game.otherPlayer.x = 150;
            game.otherPlayer.y = 300;
            game.otherPlayer.alive = true;

            if (game.isBoss && game.boss) { bossHpBar.style.display = 'flex';
                updateBossUI(); } else { bossHpBar.style.display = 'none'; }
            updateUI();
        }
