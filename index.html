<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>👻 暗影勇者 · 无尽Boss</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            overflow: hidden;
        }
        #wrapper {
            background: #141425;
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            position: relative;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #1a1a30;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
            cursor: crosshair;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: #ccc;
            font-weight: bold;
            font-size: 17px;
            padding: 0 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        #uiLeft {
            display: flex;
            gap: 18px;
            align-items: center;
            flex-wrap: wrap;
        }
        .label {
            color: #667799;
            font-weight: normal;
        }
        #hpDisplay {
            color: #ff6b6b;
            font-size: 22px;
            text-shadow: 0 0 25px #ff6b6b55;
        }
        #worldDisplay {
            color: #6bcbff;
            font-size: 20px;
            text-shadow: 0 0 25px #6bcbff55;
        }
        #keyDisplay {
            color: #f7d44a;
            font-size: 20px;
        }
        #jumpDisplay {
            color: #9b6bff;
            font-size: 20px;
            text-shadow: 0 0 25px #9b6bff55;
        }
        #weaponDisplay {
            color: #ffaa44;
            font-size: 18px;
        }
        #skillDisplay {
            color: #44ff88;
            font-size: 16px;
            background: #0a1a12;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #44ff8866;
        }
        #levelDisplay {
            color: #f7d44a;
            font-size: 20px;
            text-shadow: 0 0 25px #f7d44a55;
        }
        #bossNameDisplay {
            color: #ff4444;
            font-size: 18px;
            text-shadow: 0 0 30px #ff444466;
            display: none;
        }
        #bossHpBar {
            color: #ff3333;
            font-size: 18px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        #bossHpBar .bar {
            width: 180px;
            height: 14px;
            background: #2a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #663333;
        }
        #bossHpBar .fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3333, #ff8833);
            border-radius: 10px;
            transition: width 0.15s;
        }
        #infiniteToggle {
            background: #2a1a3a;
            color: #ffaa44;
            border: 2px solid #ffaa44;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #infiniteToggle:hover {
            background: #3a2a4a;
        }
        #infiniteToggle.active {
            border-color: #44ff88;
            color: #44ff88;
        }
        #statBtn {
            background: #1a2a3a;
            color: #6bcbff;
            border: 2px solid #6bcbff;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #statBtn:hover {
            background: #2a3a4a;
        }
        #hint {
            color: #445566;
            font-size: 13px;
            background: #0e0e1e;
            padding: 6px 18px;
            border-radius: 30px;
            text-align: right;
        }
        #msgOverlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 80px);
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #msgOverlay.show {
            display: flex;
        }
        #msgText {
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 80px #ff000066;
            animation: pop 0.5s ease;
            text-align: center;
            line-height: 1.4;
            padding: 20px;
        }
        #msgSub {
            font-size: 20px;
            color: #ff6666;
            margin-top: 10px;
            font-weight: normal;
            text-shadow: 0 0 40px #ff000044;
        }
        @keyframes pop {
            0% {
                transform: scale(0.2) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        #statPanel {
            position: absolute;
            top: 80px;
            right: 20px;
            background: #0a0a1aee;
            border: 2px solid #6bcbff;
            border-radius: 16px;
            padding: 20px 24px;
            color: #fff;
            z-index: 20;
            display: none;
            min-width: 240px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 60px #6bcbff33;
            font-size: 14px;
        }
        #statPanel h3 {
            text-align: center;
            color: #f7d44a;
            margin-bottom: 12px;
            font-size: 20px;
        }
        #statPanel .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid #33445544;
        }
        #statPanel .stat-row .stat-name {
            color: #aabbdd;
        }
        #statPanel .stat-row .stat-val {
            color: #fff;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }
        #statPanel .stat-row button {
            background: #2a3a5a;
            color: #6bcbff;
            border: 1px solid #6bcbff;
            border-radius: 30px;
            padding: 0px 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #statPanel .stat-row button:hover {
            background: #3a4a6a;
        }
        #statPanel .stat-row button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #statPanel .points-remaining {
            text-align: center;
            color: #44ff88;
            font-size: 18px;
            margin: 10px 0 8px 0;
            padding: 6px;
            background: #0a1a12;
            border-radius: 10px;
            border: 1px solid #44ff8844;
        }
        #statPanel .close-btn {
            display: block;
            margin: 10px auto 0 auto;
            background: #3a1a1a;
            color: #ff6666;
            border: 1px solid #ff6666;
            border-radius: 30px;
            padding: 4px 24px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        #statPanel .close-btn:hover {
            background: #4a2a2a;
        }
        #wrapper {
            position: relative;
        }
        @media (max-width: 760px) {
            #wrapper {
                padding: 10px;
            }
            canvas {
                width: 100%;
                height: auto;
            }
            #ui {
                font-size: 13px;
            }
            #hint {
                font-size: 10px;
                padding: 4px 10px;
            }
            #msgText {
                font-size: 28px;
            }
            #msgSub {
                font-size: 16px;
            }
            #uiLeft {
                gap: 10px;
            }
            #bossHpBar .bar {
                width: 80px;
            }
            #statPanel {
                top: 60px;
                right: 10px;
                padding: 14px 16px;
                min-width: 180px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="wrapper">
        <canvas id="gameCanvas" width="800" height="550"></canvas>
        <div id="msgOverlay">
            <div id="msgText">🎉<div id="msgSub"></div></div>
        </div>
        <div id="statPanel">
            <h3>📊 属性分配</h3>
            <div class="points-remaining" id="pointsRemaining">剩余: 0</div>
            <div class="stat-row"><span class="stat-name">❤️ 生命</span><span class="stat-val" id="statHp">100</span><button onclick="upgradeStat('maxHp')">+</button></div>
            <div class="stat-row"><span class="stat-name">🏃 速度</span><span class="stat-val" id="statSpeed">4.2</span><button onclick="upgradeStat('speed')">+</button></div>
            <div class="stat-row"><span class="stat-name">🦘 跳跃</span><span class="stat-val" id="statJump">10.8</span><button onclick="upgradeStat('jumpPower')">+</button></div>
            <div class="stat-row"><span class="stat-name">⚔️ 伤害</span><span class="stat-val" id="statDamage">+0</span><button onclick="upgradeStat('damageBonus')">+</button></div>
            <div class="stat-row"><span class="stat-name">🔫 射速</span><span class="stat-val" id="statFireRate">1.0</span><button onclick="upgradeStat('fireRate')">+</button></div>
            <button class="close-btn" onclick="toggleStatPanel()">✕ 关闭</button>
        </div>
        <div id="ui">
            <div id="uiLeft">
                <span><span class="label">❤️</span> <span id="hpDisplay">100</span></span>
                <span><span class="label">⭐</span> <span id="levelDisplay">Lv.1</span></span>
                <span><span class="label">🌍</span> <span id="worldDisplay">1-1</span></span>
                <span><span class="label">🔑</span> <span id="keyDisplay">0 / 0</span></span>
                <span><span class="label">🦘</span> <span id="jumpDisplay">3</span></span>
                <span><span class="label">⚔️</span> <span id="weaponDisplay">普通</span></span>
                <span id="skillDisplay">⏳ 技能: 就绪</span>
                <span id="bossNameDisplay">👹 Boss</span>
                <span id="bossHpBar"><span class="bar"><span class="fill" id="bossFill"></span></span></span>
                <button id="infiniteToggle">♾️ 无尽</button>
                <button id="statBtn">📊 属性</button>
            </div>
            <span id="hint">🖱️射击 &nbsp;|&nbsp; ← → 移动 &nbsp;|&nbsp; 空格跳 &nbsp;|&nbsp; Q切武器 &nbsp;|&nbsp; E技能 &nbsp;|&nbsp; F属性</span>
        </div>
    </div>

    <script>
        // ================================================================
        //  👻 暗影勇者 · 无尽Boss版
        //  5种Boss、动态地图、升级系统、无限模式
        // ================================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let W = 800,
            H = 550;

        const hpSpan = document.getElementById('hpDisplay');
        const worldSpan = document.getElementById('worldDisplay');
        const keySpan = document.getElementById('keyDisplay');
        const jumpSpan = document.getElementById('jumpDisplay');
        const weaponSpan = document.getElementById('weaponDisplay');
        const skillSpan = document.getElementById('skillDisplay');
        const levelSpan = document.getElementById('levelDisplay');
        const bossNameSpan = document.getElementById('bossNameDisplay');
        const bossHpBar = document.getElementById('bossHpBar');
        const bossFill = document.getElementById('bossFill');
        const msgOverlay = document.getElementById('msgOverlay');
        const msgText = document.getElementById('msgText');
        const msgSub = document.getElementById('msgSub');
        const infiniteBtn = document.getElementById('infiniteToggle');
        const statBtn = document.getElementById('statBtn');
        const statPanel = document.getElementById('statPanel');
        const pointsRemaining = document.getElementById('pointsRemaining');

        const GRAVITY = 0.55;
        const FRICTION = 0.80;

        const WORLDS = [
            { name: '翡翠森林', bg1: '#1a3a2a', bg2: '#2a5a3a', plat: '#4a8a4a', scary: 0 },
            { name: '暗影沼泽', bg1: '#0a0a1a', bg2: '#1a0a2a', plat: '#2a1a3a', scary: 1 },
            { name: '地狱深渊', bg1: '#0a0000', bg2: '#1a0000', plat: '#3a0a0a', scary: 2 }
        ];

        const WEAPONS = [
            { name: '普通', damage: 1, speed: 9, color: '#6bcbff', spread: 1, icon: '🔫' },
            { name: '速射', damage: 1, speed: 14, color: '#ffaa44', spread: 1, icon: '⚡' },
            { name: '重炮', damage: 3, speed: 5, color: '#ff4444', spread: 1, icon: '💥' },
            { name: '散射', damage: 1, speed: 7, color: '#44ff88', spread: 3, icon: '🔱' }
        ];

        // ---------- 5种Boss定义 ----------
        const BOSS_TYPES = [
            {
                id: '腐化巨兽',
                color: '#44aa44',
                glow: '#88ff88',
                shape: 'beast',
                desc: '腐化巨兽',
                hpMult: 1.0,
                speed: 0.6,
                bulletColor: '#44ff44',
                attackType: 'spray'
            },
            {
                id: '暗影幽灵',
                color: '#aa44ff',
                glow: '#cc88ff',
                shape: 'ghost',
                desc: '暗影幽灵',
                hpMult: 0.8,
                speed: 1.2,
                bulletColor: '#cc66ff',
                attackType: 'scatter'
            },
            {
                id: '火焰领主',
                color: '#ff6622',
                glow: '#ff8844',
                shape: 'fire',
                desc: '火焰领主',
                hpMult: 1.2,
                speed: 0.5,
                bulletColor: '#ff6633',
                attackType: 'ring'
            },
            {
                id: '冰霜女王',
                color: '#44ccff',
                glow: '#88ddff',
                shape: 'ice',
                desc: '冰霜女王',
                hpMult: 0.9,
                speed: 0.7,
                bulletColor: '#66ddff',
                attackType: 'cone'
            },
            {
                id: '虚空使者',
                color: '#8833cc',
                glow: '#bb66ff',
                shape: 'void',
                desc: '虚空使者',
                hpMult: 1.4,
                speed: 0.4,
                bulletColor: '#aa44ff',
                attackType: 'nova'
            }
        ];

        // ---------- 音频 ----------
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new(window.AudioContext || webkitAudioContext)(); } catch (e) {}
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                switch (type) {
                    case 'shoot':
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                        break;
                    case 'jump':
                        osc.frequency.setValueAtTime(300 + (game?.player?.jumpCount || 0) * 80, now);
                        gain.gain.setValueAtTime(0.10, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'kill':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;
                    case 'key':
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'damage':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                        gain.gain.setValueAtTime(0.35, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                    case 'heal':
                        osc.frequency.setValueAtTime(500, now);
                        osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'weapon':
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.25);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;
                    case 'death':
                        osc.frequency.setValueAtTime(100, now);
                        osc.frequency.exponentialRampToValueAtTime(15, now + 0.8);
                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                        osc.start(now);
                        osc.stop(now + 0.8);
                        break;
                    case 'boss_hit':
                        osc.frequency.setValueAtTime(60, now);
                        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        osc.start(now);
                        osc.stop(now + 0.15);
                        break;
                    case 'skill':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                        osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                        gain.gain.setValueAtTime(0.2, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                        break;
                    case 'levelup':
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
                        gain.gain.setValueAtTime(0.25, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                        osc.start(now);
                        osc.stop(now + 0.35);
                        break;
                }
            } catch (e) {}
        }

        // ---------- 升级系统 ----------
        const STAT_CONFIG = {
            maxHp: { label: '生命上限', base: 100, cost: 2, inc: 10, min: 100 },
            speed: { label: '移动速度', base: 4.2, cost: 2, inc: 0.15, min: 3.0 },
            jumpPower: { label: '跳跃力', base: 10.8, cost: 2, inc: 0.3, min: 8.0 },
            damageBonus: { label: '伤害加成', base: 0, cost: 3, inc: 0.2, min: 0 },
            fireRate: { label: '射速', base: 1.0, cost: 3, inc: 0.08, min: 0.5 },
        };

        let statPoints = 0;
        let stats = {};
        let level = 1;
        let exp = 0;
        let expToNext = 20;

        function initStats() {
            stats = {};
            for (const key in STAT_CONFIG) {
                stats[key] = STAT_CONFIG[key].base;
            }
            statPoints = 0;
            level = 1;
            exp = 0;
            expToNext = 20;
            updateStatUI();
        }

        function addExp(amount) {
            exp += amount;
            while (exp >= expToNext) {
                exp -= expToNext;
                level++;
                expToNext = Math.floor(20 + level * 15);
                statPoints += 3;
                playSound('levelup');
                showMessage('⬆ 升级！', `等级 ${level}！获得 3 个属性点`);
                setTimeout(() => msgOverlay.classList.remove('show'), 1200);
                updateStatUI();
                updateUI();
            }
            updateStatUI();
            updateUI();
        }

        function upgradeStat(key) {
            if (statPoints <= 0) return;
            const cfg = STAT_CONFIG[key];
            if (!cfg) return;
            const cost = Math.floor(cfg.cost);
            if (statPoints < cost) return;
            statPoints -= cost;
            stats[key] += cfg.inc;
            updateStatUI();
            updateUI();
            applyStats();
        }

        function applyStats() {
            const p = game?.player;
            if (!p) return;
            p.maxHp = stats.maxHp;
            p.speed = stats.speed;
            p.jumpPower = -stats.jumpPower;
            updateUI();
        }

        function updateStatUI() {
            pointsRemaining.textContent = `剩余: ${statPoints}`;
            document.getElementById('statHp').textContent = stats.maxHp;
            document.getElementById('statSpeed').textContent = stats.speed.toFixed(2);
            document.getElementById('statJump').textContent = stats.jumpPower.toFixed(2);
            document.getElementById('statDamage').textContent = '+' + (stats.damageBonus * 100).toFixed(0) + '%';
            document.getElementById('statFireRate').textContent = stats.fireRate.toFixed(2);
            document.querySelectorAll('#statPanel .stat-row button').forEach(b => {
                b.disabled = statPoints <= 0;
            });
        }

        function toggleStatPanel() {
            if (statPanel.style.display === 'block') {
                statPanel.style.display = 'none';
            } else {
                statPanel.style.display = 'block';
                updateStatUI();
            }
        }

        window.upgradeStat = upgradeStat;
        window.toggleStatPanel = toggleStatPanel;

        // ---------- 游戏状态 ----------
        let game = {};

        function initGame() {
            initStats();
            game = {
                world: 0,
                level: 0,
                maxLevel: 5,
                infiniteMode: false,
                totalCycles: 0,
                mapWidth: W,
                mapHeight: H,
                hp: stats.maxHp,
                maxHp: stats.maxHp,
                keysCollected: 0,
                totalKeys: 0,
                running: true,
                levelComplete: false,
                gameOver: false,
                player: {
                    x: 40,
                    y: 400,
                    w: 24,
                    h: 30,
                    vx: 0,
                    vy: 0,
                    speed: stats.speed,
                    jumpPower: -stats.jumpPower,
                    onGround: false,
                    jumpCount: 0,
                    maxJumps: 3,
                    facing: 1,
                    invincible: 0,
                    weapon: 0,
                    trail: [],
                    maxHp: stats.maxHp,
                },
                platforms: [],
                enemies: [],
                keys: [],
                items: [],
                exit: { x: 740, y: 60, w: 30, h: 38 },
                keysPressed: { left: false, right: false, up: false },
                frame: 0,
                particles: [],
                bullets: [],
                boss: null,
                isBoss: false,
                totalKills: 0,
                screenShake: 0,
                skillCooldown: 0,
                skillActive: false,
                skillTimer: 0,
                skillMaxCooldown: 480,
                skillDuration: 90,
                bossSpawned: false,
                bossType: null,
                bossPhase: 0,
                bossTimer: 0,
            };
            loadLevel(0);
            updateUI();
            msgOverlay.classList.remove('show');
            game.running = true;
            game.gameOver = false;
            bossHpBar.style.display = 'none';
            bossNameSpan.style.display = 'none';
            applyStats();
        }

        function loadLevel(levelIdx) {
            const cycle = game.totalCycles;
            const difficulty = levelIdx + cycle * 3;
            const mapScale = 1 + Math.floor(cycle / 2) * 0.2;
            game.mapWidth = Math.min(1200, Math.floor(W * mapScale));
            game.mapHeight = H;

            const platforms = [];
            const enemies = [];
            const keys = [];
            const items = [];

            // 地面
            platforms.push({ x: 0, y: game.mapHeight - 40, w: game.mapWidth, h: 40 });

            // 动态平台
            const platCount = 6 + Math.floor(difficulty / 2);
            const baseY = [420, 380, 340, 300, 260, 220, 180, 140];
            for (let i = 0; i < platCount; i++) {
                let x = 60 + i * 80 + (levelIdx * 17) % 120;
                if (x > game.mapWidth - 80) x = game.mapWidth - 80;
                let y = baseY[i % baseY.length] - (i % 3) * 15;
                let w = 70 + (i * 7 + levelIdx) % 50;
                platforms.push({ x, y, w, h: 14 });
            }
            platforms.sort((a, b) => a.y - b.y);

            const lastPlat = platforms[platforms.length - 1];
            const exitX = Math.min(game.mapWidth - 50, lastPlat.x + lastPlat.w / 2 - 15);
            const exitY = lastPlat.y - 40;

            // 敌人
            const enemyCount = 3 + Math.floor(difficulty * 0.6);
            for (let i = 0; i < enemyCount; i++) {
                let plat = platforms[1 + (i * 3) % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                let lvl = Math.min(2, Math.floor((difficulty + i) / 3));
                const size = 20 + lvl * 6;
                const type = (i % 3 === 0) ? 'mushroom' : (i % 3 === 1) ? 'ghost' : 'bat';
                enemies.push({
                    x: plat.x + 10 + i * 20,
                    y: plat.y - size,
                    w: size,
                    h: size,
                    type: type,
                    level: lvl,
                    hp: 2 + lvl + Math.floor(cycle * 0.5),
                    vx: (0.6 + lvl * 0.2) * (i % 2 === 0 ? 1 : -1),
                    speed: 0.8 + lvl * 0.2 + cycle * 0.03,
                    minX: Math.max(0, plat.x + 5),
                    maxX: Math.min(game.mapWidth, plat.x + plat.w - size - 5),
                    startY: plat.y - size,
                    damage: 10 + lvl * 10 + Math.floor(cycle * 2),
                    hitFlash: 0,
                    aggroRange: 150 + lvl * 50 + cycle * 10,
                    expReward: 10 + lvl * 5 + Math.floor(cycle * 2),
                });
            }

            // 钥匙
            const keyCount = 2 + Math.floor(difficulty / 2);
            const usedPlats = platforms.slice(1);
            for (let i = 0; i < Math.min(keyCount, usedPlats.length); i++) {
                const plat = usedPlats[i % usedPlats.length];
                keys.push({ x: plat.x + 15 + i * 20, y: plat.y - 28, collected: false, r: 9 });
            }
            while (keys.length < 2) {
                const plat = platforms[1 + keys.length % (platforms.length - 1)];
                keys.push({ x: plat.x + 30 + keys.length * 20, y: plat.y - 28, collected: false, r: 9 });
            }

            // 物品
            const healCount = 1 + Math.floor(difficulty / 3);
            for (let i = 0; i < healCount; i++) {
                let plat = platforms[1 + (i * 7 + levelIdx) % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                items.push({
                    type: 'heal',
                    x: plat.x + 20 + i * 25,
                    y: plat.y - 30,
                    r: 12,
                    value: 20,
                });
            }
            if ((levelIdx % 2 === 1) && difficulty > 0) {
                let plat = platforms[2 % (platforms.length - 1)];
                if (!plat) plat = platforms[1];
                const wIdx = Math.min(3, Math.floor(difficulty / 2) + 1);
                items.push({
                    type: 'weapon',
                    weaponIdx: wIdx,
                    x: plat.x + 30,
                    y: plat.y - 30,
                    r: 14,
                });
            }

            // Boss：每5关出现一次
            let isBoss = (levelIdx % 5 === 4);
            let boss = null;
            let bossType = null;
            if (isBoss) {
                const bossPlat = platforms[Math.floor(platforms.length / 2)] || platforms[0];
                const bossIdx = (levelIdx + cycle * 7) % BOSS_TYPES.length;
                bossType = BOSS_TYPES[bossIdx];
                const hpMult = 1 + cycle * 0.3 + levelIdx * 0.05;
                const bossHp = Math.floor((60 + cycle * 20 + levelIdx * 5) * hpMult);
                boss = {
                    x: Math.min(game.mapWidth - 100, bossPlat.x + bossPlat.w / 2 - 35),
                    y: bossPlat.y - 80,
                    w: 70,
                    h: 80,
                    hp: bossHp,
                    maxHp: bossHp,
                    timer: 0,
                    bullets: [],
                    hitCooldown: 0,
                    expReward: 80 + cycle * 15 + levelIdx * 5,
                    type: bossType,
                    phase: 0,
                    phaseTimer: 0,
                };
                enemies.splice(0, Math.floor(enemies.length / 2));
                game.bossType = bossType;
                bossNameSpan.textContent = '👹 ' + bossType.desc;
                bossNameSpan.style.display = 'block';
            } else {
                game.bossType = null;
                bossNameSpan.style.display = 'none';
            }

            game.platforms = platforms;
            game.enemies = enemies.map(e => ({ ...e, hitFlash: 0 }));
            game.keys = keys.map(k => ({ ...k, collected: false }));
            game.items = items.map(i => ({ ...i }));
            game.exit = { x: exitX, y: exitY, w: 30, h: 38 };
            game.totalKeys = game.keys.length;
            game.keysCollected = 0;
            game.levelComplete = false;
            game.bullets = [];
            game.isBoss = isBoss;
            game.boss = boss ? { ...boss, bullets: [], hitCooldown: 0, timer: 0 } : null;
            game.screenShake = 0;
            game.bossSpawned = isBoss;

            const p = game.player;
            p.x = 40;
            p.y = 400;
            p.vx = 0;
            p.vy = 0;
            p.onGround = false;
            p.jumpCount = 0;
            p.invincible = 0;
            p.trail = [];
            p.speed = stats.speed;
            p.jumpPower = -stats.jumpPower;
            p.maxHp = stats.maxHp;
            if (game.hp > p.maxHp) game.hp = p.maxHp;

            if (game.isBoss && game.boss) {
                bossHpBar.style.display = 'flex';
                updateBossUI();
            } else {
                bossHpBar.style.display = 'none';
            }
            updateUI();
        }

        function updateUI() {
            hpSpan.textContent = Math.ceil(game.hp);
            const displayLvl = game.level + 1 + game.totalCycles * 5;
            worldSpan.textContent = `${displayLvl}`;
            keySpan.textContent = `${game.keysCollected} / ${game.totalKeys}`;
            const rem = Math.max(0, game.player.maxJumps - game.player.jumpCount);
            jumpSpan.textContent = rem;
            weaponSpan.textContent = WEAPONS[game.player.weapon].icon + ' ' + WEAPONS[game.player.weapon].name;
            levelSpan.textContent = `Lv.${level}`;

            if (game.skillCooldown > 0) {
                const cdSec = Math.ceil(game.skillCooldown / 60);
                skillSpan.textContent = `⏳ 技能: ${cdSec}s`;
                skillSpan.style.color = '#ff6666';
            } else if (game.skillActive) {
                skillSpan.textContent = `⏳ 技能: 激活中`;
                skillSpan.style.color = '#44ff88';
            } else {
                skillSpan.textContent = `⏳ 技能: 就绪`;
                skillSpan.style.color = '#44ff88';
            }
            updateStatUI();
        }

        function updateBossUI() {
            if (!game.boss) return;
            const pct = Math.max(0, (game.boss.hp / game.boss.maxHp) * 100);
            bossFill.style.width = pct + '%';
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function dist(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        // ---------- 粒子 ----------
        function spawnParticles(x, y, color, count = 12, speedMult = 1) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (1 + Math.random() * 3) * speedMult;
                game.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 30 + Math.random() * 30,
                    maxLife: 60,
                    color,
                    size: 3 + Math.random() * 5,
                });
            }
        }

        function spawnBlood(x, y, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 5;
                game.particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 1,
                    life: 40 + Math.random() * 40,
                    maxLife: 80,
                    color: Math.random() > 0.5 ? '#8b0000' : '#cc0000',
                    size: 2 + Math.random() * 6,
                });
            }
        }

        function updateParticles() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06;
                p.life--;
                if (p.life <= 0) game.particles.splice(i, 1);
            }
            if (game.particles.length > 500) game.particles.splice(0, 150);
        }

        // ---------- 射击 ----------
        let lastShootTime = 0;
        let shootSoundCooldown = 0;

        function shootBullet(targetX, targetY) {
            const now = performance.now();
            const fireRate = Math.max(0.3, 1.0 / stats.fireRate);
            const coolDownMs = 70 * fireRate;
            if (now - lastShootTime < coolDownMs) return;
            lastShootTime = now;

            if (!game.running || game.gameOver || game.levelComplete) return;
            const p = game.player;
            const cx = p.x + p.w / 2;
            const cy = p.y + p.h / 2;
            const dx = targetX - cx;
            const dy = targetY - cy;
            const len = Math.hypot(dx, dy);
            if (len < 10) return;
            const weapon = WEAPONS[p.weapon];
            const count = weapon.spread || 1;
            const damageBonus = 1 + stats.damageBonus;
            for (let i = 0; i < count; i++) {
                const angle = Math.atan2(dy, dx) + (i - (count - 1) / 2) * 0.25;
                const speed = game.skillActive ? weapon.speed * 0.4 : weapon.speed;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                game.bullets.push({
                    x: cx,
                    y: cy,
                    vx: vx,
                    vy: vy,
                    r: 5,
                    life: 130,
                    damage: Math.ceil(weapon.damage * damageBonus),
                    color: weapon.color,
                });
            }
            spawnParticles(cx, cy, weapon.color, 4);
            if (now - shootSoundCooldown > 100) {
                playSound('shoot');
                shootSoundCooldown = now;
            }
        }

        // ---------- 技能 ----------
        function activateSkill() {
            if (game.skillCooldown > 0 || game.skillActive) return;
            game.skillActive = true;
            game.skillTimer = game.skillDuration;
            playSound('skill');
            spawnParticles(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, '#44ff88', 30, 2);
        }

        // ---------- 绘制Boss (5种不同形状) ----------
        function drawBoss(b, p) {
            const type = b.type || BOSS_TYPES[0];
            const flash = b.hitCooldown > 0;
            const pulse = 0.95 + Math.sin(game.frame * 0.05) * 0.05;

            // 光晕
            ctx.shadowColor = type.glow || '#ff4444';
            ctx.shadowBlur = 60 * pulse;
            ctx.fillStyle = type.glow + '33';
            ctx.beginPath();
            ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 60 * pulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 30;
            ctx.shadowColor = type.color || '#ff4444';

            switch (type.shape) {
                case 'beast':
                    // 腐化巨兽 - 四足怪物
                    ctx.fillStyle = flash ? '#ffffff' : type.color;
                    ctx.beginPath();
                    ctx.ellipse(b.x + b.w / 2, b.y + b.h / 2 + 10, 30, 25, 0, 0, Math.PI * 2);
                    ctx.fill();
                    // 腿
                    ctx.fillRect(b.x + 8, b.y + b.h - 10, 12, 10);
                    ctx.fillRect(b.x + b.w - 20, b.y + b.h - 10, 12, 10);
                    ctx.fillRect(b.x + 5, b.y + b.h - 12, 10, 12);
                    ctx.fillRect(b.x + b.w - 15, b.y + b.h - 12, 10, 12);
                    // 眼睛
                    ctx.fillStyle = '#ff0000';
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(b.x + 20, b.y + 25, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + b.w - 20, b.y + 25, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    const dx = p.x + p.w / 2 - (b.x + 20);
                    const dy = p.y + p.h / 2 - (b.y + 25);
                    const d = Math.hypot(dx, dy);
                    if (d > 0) {
                        ctx.beginPath();
                        ctx.arc(b.x + 20 + (dx / d) * 4, b.y + 25 + (dy / d) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + b.w - 20 + (dx / d) * 4, b.y + 25 + (dy / d) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // 毒液腺体
                    ctx.fillStyle = type.glow + '66';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(b.x + b.w / 2, b.y + 50, 12 + Math.sin(game.frame * 0.03) * 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'ghost':
                    // 暗影幽灵 - 半透明灵体
                    const alpha = 0.6 + Math.sin(game.frame * 0.04) * 0.2;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = flash ? '#ffffff' : type.color;
                    ctx.beginPath();
                    ctx.arc(b.x + b.w / 2, b.y + b.h / 2 - 5, 28, 0, Math.PI * 2);
                    ctx.fill();
                    // 飘带
                    for (let i = -2; i <= 2; i++) {
                        const wx = b.x + b.w / 2 + i * 12 + Math.sin(game.frame * 0.06 + i) * 5;
                        const wy = b.y + b.h - 5 + Math.sin(game.frame * 0.05 + i * 2) * 8;
                        ctx.beginPath();
                        ctx.moveTo(b.x + b.w / 2 + i * 10, b.y + b.h - 5);
                        ctx.quadraticCurveTo(wx + 5, wy + 10, wx, wy + 20 + Math.sin(game.frame * 0.04 + i) * 5);
                        ctx.lineWidth = 6;
                        ctx.strokeStyle = type.color;
                        ctx.shadowBlur = 30;
                        ctx.stroke();
                    }
                    ctx.globalAlpha = 1;
                    // 眼睛
                    ctx.fillStyle = '#ff66ff';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(b.x + 18, b.y + 25, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + b.w - 18, b.y + 25, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    const dx2 = p.x + p.w / 2 - (b.x + 18);
                    const dy2 = p.y + p.h / 2 - (b.y + 25);
                    const d2 = Math.hypot(dx2, dy2);
                    if (d2 > 0) {
                        ctx.beginPath();
                        ctx.arc(b.x + 18 + (dx2 / d2) * 5, b.y + 25 + (dy2 / d2) * 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + b.w - 18 + (dx2 / d2) * 5, b.y + 25 + (dy2 / d2) * 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;

                case 'fire':
                    // 火焰领主 - 火焰巨人
                    ctx.fillStyle = flash ? '#ffffff' : type.color;
                    ctx.shadowBlur = 50;
                    // 身体
                    ctx.beginPath();
                    ctx.roundRect(b.x + 10, b.y + 10, b.w - 20, b.h - 10, 10);
                    ctx.fill();
                    // 火焰头发
                    for (let i = 0; i < 7; i++) {
                        const fx = b.x + 10 + i * 9 + Math.sin(game.frame * 0.05 + i) * 3;
                        const fy = b.y + 5 + Math.sin(game.frame * 0.07 + i * 2) * 8;
                        ctx.fillStyle = type.glow + '88';
                        ctx.shadowBlur = 40;
                        ctx.beginPath();
                        ctx.arc(fx, fy - 5, 10 + Math.sin(game.frame * 0.06 + i) * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // 眼睛
                    ctx.fillStyle = '#ffff00';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.arc(b.x + 22, b.y + 30, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + b.w - 22, b.y + 30, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ff4400';
                    const dx3 = p.x + p.w / 2 - (b.x + 22);
                    const dy3 = p.y + p.h / 2 - (b.y + 30);
                    const d3 = Math.hypot(dx3, dy3);
                    if (d3 > 0) {
                        ctx.beginPath();
                        ctx.arc(b.x + 22 + (dx3 / d3) * 4, b.y + 30 + (dy3 / d3) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + b.w - 22 + (dx3 / d3) * 4, b.y + 30 + (dy3 / d3) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // 火焰核心
                    ctx.fillStyle = type.glow + '55';
                    ctx.shadowBlur = 60;
                    ctx.beginPath();
                    ctx.arc(b.x + b.w / 2, b.y + 55, 15 + Math.sin(game.frame * 0.05) * 3, 0, Math.PI * 2);
                    ctx.fill();
                    break;

                case 'ice':
                    // 冰霜女王 - 冰晶女性
                    ctx.fillStyle = flash ? '#ffffff' : type.color;
                    ctx.shadowBlur = 40;
                    // 身体
                    ctx.beginPath();
                    ctx.roundRect(b.x + 15, b.y + 15, b.w - 30, b.h - 20, 8);
                    ctx.fill();
                    // 冰晶冠
                    for (let i = 0; i < 5; i++) {
                        const cx = b.x + 15 + i * 12 + Math.sin(game.frame * 0.03 + i) * 2;
                        ctx.fillStyle = type.glow + '88';
                        ctx.shadowBlur = 30;
                        ctx.beginPath();
                        ctx.moveTo(cx, b.y);
                        ctx.lineTo(cx + 6, b.y - 12);
                        ctx.lineTo(cx + 12, b.y);
                        ctx.fill();
                    }
                    // 眼睛
                    ctx.fillStyle = '#88ddff';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.arc(b.x + 22, b.y + 28, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + b.w - 22, b.y + 28, 8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#004466';
                    const dx4 = p.x + p.w / 2 - (b.x + 22);
                    const dy4 = p.y + p.h / 2 - (b.y + 28);
                    const d4 = Math.hypot(dx4, dy4);
                    if (d4 > 0) {
                        ctx.beginPath();
                        ctx.arc(b.x + 22 + (dx4 / d4) * 4, b.y + 28 + (dy4 / d4) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + b.w - 22 + (dx4 / d4) * 4, b.y + 28 + (dy4 / d4) * 4, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // 冰晶飘动
                    for (let i = 0; i < 6; i++) {
                        const fx = b.x + 10 + i * 12 + Math.sin(game.frame * 0.04 + i * 2) * 4;
                        const fy = b.y + 40 + Math.sin(game.frame * 0.05 + i * 1.5) * 6;
                        ctx.fillStyle = type.glow + '44';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(fx, fy, 4 + Math.sin(game.frame * 0.03 + i) * 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;

                case 'void':
                    // 虚空使者 - 虚空生物
                    ctx.fillStyle = flash ? '#ffffff' : type.color;
                    ctx.shadowBlur = 50;
                    // 核心球体
                    ctx.beginPath();
                    ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 28 + Math.sin(game.frame * 0.03) * 3, 0, Math.PI * 2);
                    ctx.fill();
                    // 触手
                    for (let i = 0; i < 8; i++) {
                        const ang = i / 8 * Math.PI * 2 + game.frame * 0.02;
                        const len = 20 + Math.sin(game.frame * 0.04 + i * 1.5) * 10;
                        ctx.fillStyle = type.glow + '66';
                        ctx.shadowBlur = 40;
                        ctx.beginPath();
                        ctx.moveTo(b.x + b.w / 2 + Math.cos(ang) * 28, b.y + b.h / 2 + Math.sin(ang) * 28);
                        ctx.quadraticCurveTo(
                            b.x + b.w / 2 + Math.cos(ang + 0.2) * (28 + len),
                            b.y + b.h / 2 + Math.sin(ang + 0.2) * (28 + len),
                            b.x + b.w / 2 + Math.cos(ang + 0.1) * (28 + len * 1.2),
                            b.y + b.h / 2 + Math.sin(ang + 0.1) * (28 + len * 1.2)
                        );
                        ctx.lineWidth = 6;
                        ctx.stroke();
                    }
                    // 眼睛
                    ctx.fillStyle = '#ff44ff';
                    ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.arc(b.x + 20, b.y + 25, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(b.x + b.w - 20, b.y + 25, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#220044';
                    const dx5 = p.x + p.w / 2 - (b.x + 20);
                    const dy5 = p.y + p.h / 2 - (b.y + 25);
                    const d5 = Math.hypot(dx5, dy5);
                    if (d5 > 0) {
                        ctx.beginPath();
                        ctx.arc(b.x + 20 + (dx5 / d5) * 5, b.y + 25 + (dy5 / d5) * 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(b.x + b.w - 20 + (dx5 / d5) * 5, b.y + 25 + (dy5 / d5) * 5, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    break;
            }
            ctx.shadowBlur = 0;
        }

        // ---------- 玩家更新 ----------
        function updatePlayer() {
            const p = game.player;
            const keys = game.keysPressed;

            if (p.invincible > 0) p.invincible--;

            if (game.skillActive) {
                game.skillTimer--;
                if (game.skillTimer <= 0) {
                    game.skillActive = false;
                    game.skillCooldown = game.skillMaxCooldown;
                }
            }
            if (game.skillCooldown > 0) {
                game.skillCooldown--;
            }

            if (keys.left) { p.vx = -p.speed;
                p.facing = -1; } else if (keys.right) { p.vx = p.speed;
                p.facing = 1; } else { p.vx *= FRICTION; if (Math.abs(p.vx) < 0.1) p.vx = 0; }

            if (keys.up) {
                if (p.jumpCount < p.maxJumps) {
                    const power = p.jumpCount === 0 ? p.jumpPower : p.jumpPower * (0.85 - p.jumpCount * 0.06);
                    p.vy = power;
                    p.jumpCount++;
                    p.onGround = false;
                    spawnParticles(p.x + p.w / 2, p.y + p.h, '#9b6bff', 6);
                    playSound('jump');
                    game.keysPressed.up = false;
                }
            }

            p.vy += GRAVITY;
            if (p.vy > 13) p.vy = 13;

            p.x += p.vx;
            if (p.x < 0) p.x = 0;
            if (p.x + p.w > game.mapWidth) p.x = game.mapWidth - p.w;

            p.y += p.vy;
            p.onGround = false;
            for (const plat of game.platforms) {
                if (rectCollide(p, plat)) {
                    if (p.vy > 0) {
                        p.y = plat.y - p.h;
                        p.vy = 0;
                        p.onGround = true;
                        p.jumpCount = 0;
                    } else if (p.vy < 0) {
                        p.y = plat.y + plat.h;
                        p.vy = 0;
                    }
                }
            }
            if (p.y > game.mapHeight + 50) { takeDamage(50); return; }

            if (game.frame % 2 === 0) {
                p.trail.push({ x: p.x, y: p.y, life: 20 });
                if (p.trail.length > 15) p.trail.shift();
            }
            for (let i = p.trail.length - 1; i >= 0; i--) {
                p.trail[i].life--;
                if (p.trail[i].life <= 0) p.trail.splice(i, 1);
            }

            for (const key of game.keys) {
                if (key.collected) continue;
                if (dist(p.x + p.w / 2, p.y + p.h / 2, key.x, key.y) < 26) {
                    key.collected = true;
                    game.keysCollected++;
                    spawnParticles(key.x, key.y, '#f7d44a', 20);
                    playSound('key');
                    addExp(5);
                    updateUI();
                }
            }

            for (let i = game.items.length - 1; i >= 0; i--) {
                const item = game.items[i];
                if (dist(p.x + p.w / 2, p.y + p.h / 2, item.x, item.y) < 25) {
                    if (item.type === 'heal') {
                        game.hp = Math.min(game.player.maxHp, game.hp + item.value);
                        spawnParticles(item.x, item.y, '#44ff88', 15);
                        playSound('heal');
                        addExp(5);
                        game.items.splice(i, 1);
                        updateUI();
                    } else if (item.type === 'weapon') {
                        p.weapon = item.weaponIdx;
                        spawnParticles(item.x, item.y, '#ffaa44', 20);
                        playSound('weapon');
                        addExp(10);
                        game.items.splice(i, 1);
                        updateUI();
                    }
                }
            }

            if (game.keysCollected >= game.totalKeys) {
                if (rectCollide(p, game.exit)) {
                    game.levelComplete = true;
                    addExp(50);
                    let nl = game.level + 1;
                    if (nl >= game.maxLevel) {
                        nl = 0;
                        game.totalCycles++;
                        if (game.infiniteMode) {
                            showMessage('♾️ 无尽模式', `第 ${game.totalCycles} 轮开始！`);
                        } else {
                            game.running = false;
                            showMessage('🏆 通关！', '开启无尽模式继续挑战');
                            return;
                        }
                    }
                    showMessage('🎉 过关！', `进入第 ${nl+1 + game.totalCycles*5} 关`);
                    setTimeout(() => {
                        msgOverlay.classList.remove('show');
                        game.level = nl;
                        loadLevel(nl);
                        game.levelComplete = false;
                        updateUI();
                    }, 1200);
                }
            }

            // 敌人碰撞
            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;
                if (rectCollide(p, e)) {
                    if (p.vy > 0 && p.y + p.h - e.y < 20) {
                        e.y = game.mapHeight + 100;
                        p.vy = p.jumpPower * 0.6;
                        p.jumpCount = 0;
                        spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 30);
                        playSound('kill');
                        game.totalKills++;
                        addExp(e.expReward || 10);
                        if (Math.random() < 0.2) {
                            game.items.push({ type: 'heal', x: e.x + e.w / 2, y: e.y - 30, r: 12, value: 20 });
                        }
                    } else if (p.invincible <= 0) {
                        takeDamage(e.damage || 10);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
            }

            // Boss
            if (game.isBoss && game.boss && game.boss.hp > 0) {
                const b = game.boss;
                if (rectCollide(p, b)) {
                    if (p.vy > 0 && p.y + p.h - b.y < 30) {
                        b.hp -= 2;
                        b.hitCooldown = 15;
                        p.vy = p.jumpPower * 0.6;
                        p.jumpCount = 0;
                        spawnBlood(b.x + b.w / 2, b.y + 10, 30);
                        playSound('boss_hit');
                        game.screenShake = 12;
                        updateBossUI();
                        if (b.hp <= 0) bossDefeated();
                    } else if (p.invincible <= 0) {
                        takeDamage(30);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
                updateBossAI();
            }

            const timeScale = game.skillActive ? 0.6 : 1.0;
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const bull = game.bullets[i];
                bull.x += bull.vx * timeScale;
                bull.y += bull.vy * timeScale;
                bull.life--;
                if (bull.x < -20 || bull.x > game.mapWidth + 20 || bull.y < -20 || bull.y > game.mapHeight + 20 || bull
                    .life <= 0) {
                    game.bullets.splice(i, 1);
                    continue;
                }
                let hit = false;
                for (const e of game.enemies) {
                    if (e.y > game.mapHeight + 50) continue;
                    if (dist(bull.x, bull.y, e.x + e.w / 2, e.y + e.h / 2) < bull.r + 12) {
                        e.hp -= bull.damage;
                        if (e.hp <= 0) {
                            e.y = game.mapHeight + 100;
                            spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                            playSound('kill');
                            game.totalKills++;
                            addExp(e.expReward || 10);
                            if (Math.random() < 0.15) {
                                game.items.push({ type: 'heal', x: e.x + e.w / 2, y: e.y - 30, r: 12, value: 20 });
                            }
                        } else {
                            e.hitFlash = 10;
                            spawnParticles(bull.x, bull.y, '#ffaa44', 5);
                        }
                        hit = true;
                        break;
                    }
                }
                if (!hit && game.isBoss && game.boss && game.boss.hp > 0) {
                    const b = game.boss;
                    if (bull.x > b.x && bull.x < b.x + b.w && bull.y > b.y && bull.y < b.y + b.h) {
                        b.hp -= bull.damage;
                        b.hitCooldown = 10;
                        spawnBlood(bull.x, bull.y, 10);
                        playSound('boss_hit');
                        game.screenShake = 8;
                        updateBossUI();
                        hit = true;
                        if (b.hp <= 0) bossDefeated();
                    }
                }
                if (hit) game.bullets.splice(i, 1);
            }

            const enemyTimeScale = game.skillActive ? 0.4 : 1.0;
            updateEnemies(enemyTimeScale);
            updateParticles();
            updateUI();
        }

        // ---------- 敌人AI ----------
        function updateEnemies(timeScale = 1.0) {
            const p = game.player;
            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;
                const dx = p.x + p.w / 2 - (e.x + e.w / 2);
                const dy = p.y + p.h / 2 - (e.y + e.h / 2);
                const d = Math.hypot(dx, dy);
                if (d < e.aggroRange && d > 20) {
                    e.x += Math.sign(dx) * e.speed * 0.6 * timeScale;
                    if (e.level >= 1 && Math.random() < 0.01 * timeScale) e.y -= 4 * timeScale;
                    if (e.x < 0) e.x = 0;
                    if (e.x > game.mapWidth - e.w) e.x = game.mapWidth - e.w;
                } else {
                    e.x += e.vx * e.speed * timeScale;
                    if (e.x < e.minX || e.x > e.maxX) e.vx *= -1;
                }
                if (e.type === 'bat') e.y += Math.sin(game.frame * 0.05 + e.x) * 0.4 * timeScale;
                else if (e.type === 'ghost') e.y = e.startY + Math.sin(game.frame * 0.04 + e.x * 0.1) * 10 * timeScale;
                if (e.hitFlash > 0) e.hitFlash--;
            }
        }

        // ---------- Boss AI (5种不同攻击) ----------
        function updateBossAI() {
            const b = game.boss;
            if (!b || b.hp <= 0) return;
            const p = game.player;
            const dx = p.x + p.w / 2 - (b.x + b.w / 2);
            const dy = p.y + p.h / 2 - (b.y + b.h / 2);
            const d = Math.hypot(dx, dy);
            const timeScale = game.skillActive ? 0.5 : 1.0;
            const type = b.type || BOSS_TYPES[0];

            // Boss移动
            if (d > 120) {
                b.x += Math.sign(dx) * 0.5 * timeScale;
                b.y += Math.sign(dy) * 0.3 * timeScale;
            }
            b.x = Math.max(20, Math.min(game.mapWidth - b.w - 20, b.x));
            b.y = Math.max(50, Math.min(450, b.y));

            b.timer++;
            let fireRate = 35 - Math.floor((b.maxHp - b.hp) / 6);
            if (fireRate < 12) fireRate = 12;

            if (b.timer > fireRate / timeScale) {
                b.timer = 0;
                const angle = Math.atan2(dy, dx);
                const speed = (2.0 + (1 - b.hp / b.maxHp) * 2.0) * timeScale;

                switch (type.attackType) {
                    case 'spray':
                        // 腐化巨兽：喷吐毒液
                        for (let i = -3; i <= 3; i++) {
                            const a = angle + i * 0.15;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed,
                                vy: Math.sin(a) * speed,
                                r: 8,
                                color: type.bulletColor || '#44ff44',
                            });
                        }
                        break;

                    case 'scatter':
                        // 暗影幽灵：散射暗影弹
                        for (let i = 0; i < 6; i++) {
                            const a = (i / 6) * Math.PI * 2 + game.frame * 0.02;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed * 0.8,
                                vy: Math.sin(a) * speed * 0.8,
                                r: 6,
                                color: type.bulletColor || '#cc66ff',
                            });
                        }
                        break;

                    case 'ring':
                        // 火焰领主：环形火球
                        for (let i = 0; i < 10; i++) {
                            const a = (i / 10) * Math.PI * 2 + game.frame * 0.015;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed * 1.2,
                                vy: Math.sin(a) * speed * 1.2,
                                r: 7,
                                color: type.bulletColor || '#ff6633',
                            });
                        }
                        break;

                    case 'cone':
                        // 冰霜女王：扇形冰锥
                        for (let i = -4; i <= 4; i++) {
                            const a = angle + i * 0.12;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed * 0.9,
                                vy: Math.sin(a) * speed * 0.9,
                                r: 5,
                                color: type.bulletColor || '#66ddff',
                            });
                        }
                        break;

                    case 'nova':
                    default:
                        // 虚空使者：星爆
                        for (let i = 0; i < 12; i++) {
                            const a = (i / 12) * Math.PI * 2 + game.frame * 0.025;
                            b.bullets.push({
                                x: b.x + b.w / 2,
                                y: b.y + b.h / 2,
                                vx: Math.cos(a) * speed * 0.6,
                                vy: Math.sin(a) * speed * 0.6,
                                r: 4,
                                color: type.bulletColor || '#aa44ff',
                            });
                        }
                        break;
                }

                // Boss低血量额外攻击
                if (b.hp < b.maxHp * 0.3) {
                    for (let i = 0; i < 6; i++) {
                        const a = (i / 6) * Math.PI * 2 + game.frame * 0.03;
                        b.bullets.push({
                            x: b.x + b.w / 2,
                            y: b.y + b.h / 2,
                            vx: Math.cos(a) * speed * 0.5,
                            vy: Math.sin(a) * speed * 0.5,
                            r: 4,
                            color: '#ffffff',
                        });
                    }
                }
            }

            // Boss子弹更新
            for (let i = b.bullets.length - 1; i >= 0; i--) {
                const bull = b.bullets[i];
                bull.x += bull.vx;
                bull.y += bull.vy;
                if (bull.x < -30 || bull.x > game.mapWidth + 30 || bull.y < -30 || bull.y > game.mapHeight + 30) {
                    b.bullets.splice(i, 1);
                    continue;
                }
                if (dist(p.x + p.w / 2, p.y + p.h / 2, bull.x, bull.y) < bull.r + 12) {
                    if (p.invincible <= 0) {
                        takeDamage(20);
                        b.bullets.splice(i, 1);
                        if (game.hp <= 0) { gameOver(); return; }
                    }
                }
            }
            if (b.hitCooldown > 0) b.hitCooldown--;
        }

        function bossDefeated() {
            const b = game.boss;
            spawnBlood(b.x + b.w / 2, b.y + b.h / 2, 80);
            spawnParticles(b.x + b.w / 2, b.y + b.h / 2, '#ff8833', 50);
            game.screenShake = 25;
            playSound('death');
            addExp(b.expReward || 50);
            game.boss = null;
            game.isBoss = false;
            game.items.push({ type: 'heal', x: b.x + 20, y: b.y + 10, r: 12, value: 50 });
            game.items.push({ type: 'weapon', weaponIdx: 3, x: b.x + b.w - 30, y: b.y + 10, r: 14 });
            bossHpBar.style.display = 'none';
            bossNameSpan.style.display = 'none';
            showMessage('💀 Boss击败！', `${b.type?.desc || 'Boss'} 已被消灭！`);
            setTimeout(() => { msgOverlay.classList.remove('show'); }, 1500);
        }

        // ---------- 伤害/死亡 ----------
        function takeDamage(amount) {
            if (game.player.invincible > 0) return;
            game.hp -= amount;
            game.player.invincible = 30;
            game.screenShake = 8;
            playSound('damage');
            spawnBlood(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, 20);
            if (game.hp <= 0) { game.hp = 0;
                gameOver(); }
            updateUI();
        }

        function gameOver() {
            game.running = false;
            game.gameOver = true;
            playSound('death');
            showMessage('💀 死亡', '按 空格键 重新开始');
        }

        function showMessage(title, sub = '') {
            msgText.innerHTML = `${title}<div id="msgSub">${sub}</div>`;
            msgOverlay.classList.add('show');
        }

        // ---------- 绘制 ----------
        function draw() {
            const w = game.world % 3;
            const theme = WORLDS[w] || WORLDS[0];
            const scary = theme.scary;

            ctx.clearRect(0, 0, W, H);

            // 背景（适配地图宽度）
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, theme.bg1);
            grad.addColorStop(1, theme.bg2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // 视口偏移（地图大于屏幕时跟随玩家）
            let offsetX = 0;
            if (game.mapWidth > W) {
                const p = game.player;
                offsetX = Math.max(0, Math.min(game.mapWidth - W, p.x - W * 0.4));
            }

            ctx.save();
            ctx.translate(-offsetX, 0);

            // 恐怖特效
            if (scary >= 1) {
                const fog = ctx.createRadialGradient(W / 2 + offsetX, H / 2, 30, W / 2 + offsetX, H / 2, 500);
                fog.addColorStop(0, 'rgba(0,0,0,0)');
                fog.addColorStop(1, 'rgba(0,0,0,0.4)');
                ctx.fillStyle = fog;
                ctx.fillRect(offsetX, 0, W, H);
                for (let i = 0; i < 20 + scary * 10; i++) {
                    const x = (i * 37 + game.frame * 0.08) % game.mapWidth;
                    const y = (i * 29 + Math.sin(i + game.frame * 0.01) * 20) % H;
                    ctx.shadowColor = '#6b3aff';
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = `rgba(120,80,255,${0.05 + Math.sin(game.frame*0.02+i)*0.03})`;
                    ctx.beginPath();
                    ctx.arc(x, y, 5 + Math.sin(game.frame * 0.03 + i) * 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
                if (scary >= 2) {
                    ctx.fillStyle = 'rgba(120,60,60,0.08)';
                    ctx.font = '34px sans-serif';
                    ctx.fillText('💀', 30, 55);
                    ctx.fillText('💀', game.mapWidth - 70, 45);
                }
            }

            // 平台
            for (const plat of game.platforms) {
                ctx.fillStyle = theme.plat;
                ctx.shadowColor = scary >= 2 ? '#ff333355' : 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.07)';
                ctx.beginPath();
                ctx.roundRect(plat.x + 4, plat.y - 1, plat.w - 8, 3, 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 出口
            const ex = game.exit.x,
                ey = game.exit.y;
            const canEnter = game.keysCollected >= game.totalKeys;
            ctx.shadowColor = canEnter ? '#6bcbff' : '#445566';
            ctx.shadowBlur = 40;
            ctx.fillStyle = canEnter ? 'rgba(100,200,255,0.3)' : 'rgba(50,50,80,0.2)';
            ctx.beginPath();
            ctx.arc(ex + 15, ey + 19, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = canEnter ? 35 : 10;
            ctx.fillStyle = canEnter ? '#4a8ab5' : '#3a3a5a';
            ctx.beginPath();
            ctx.roundRect(ex, ey, game.exit.w, game.exit.h, 6);
            ctx.fill();
            if (canEnter) {
                ctx.shadowBlur = 60;
                ctx.fillStyle = `rgba(100,220,255,${0.3 + Math.sin(game.frame*0.05)*0.2})`;
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 19, 12 + Math.sin(game.frame * 0.04) * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 70;
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 19, 5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#665555';
                ctx.shadowBlur = 5;
                ctx.font = '22px sans-serif';
                ctx.fillText('🔒', ex + 4, ey + 30);
            }
            ctx.shadowBlur = 0;

            // 钥匙
            for (const key of game.keys) {
                if (key.collected) continue;
                const bob = Math.sin(game.frame * 0.04 + key.x) * 3;
                ctx.shadowColor = '#f7d44a';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#f7d44a';
                ctx.beginPath();
                ctx.arc(key.x, key.y + bob, key.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffdd77';
                ctx.beginPath();
                ctx.arc(key.x - 3, key.y - 3 + bob, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff9e6';
                ctx.beginPath();
                ctx.arc(key.x + 2, key.y - 5 + bob, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 物品
            for (const item of game.items) {
                if (item.type === 'heal') {
                    const bob = Math.sin(game.frame * 0.04 + item.x) * 3;
                    ctx.shadowColor = '#44ff88';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#44ff88';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bob, item.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '18px sans-serif';
                    ctx.fillText('+', item.x - 6, item.y + bob + 7);
                } else if (item.type === 'weapon') {
                    const bob = Math.sin(game.frame * 0.05 + item.x * 1.2) * 4;
                    ctx.shadowColor = '#ffaa44';
                    ctx.shadowBlur = 35;
                    ctx.fillStyle = '#ffaa44';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bob, item.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px sans-serif';
                    ctx.fillText(WEAPONS[item.weaponIdx]?.icon || '⚔', item.x - 7, item.y + bob + 6);
                }
            }
            ctx.shadowBlur = 0;

            // 敌人
            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;
                const flash = e.hitFlash > 0;
                ctx.shadowColor = '#ff4444';
                ctx.shadowBlur = 25;
                const col = ['#2d1a1a', '#4a1a1a', '#6a1a1a'][e.level] || '#2d1a1a';
                ctx.fillStyle = flash ? '#ff6666' : col;
                const size = e.w;
                ctx.beginPath();
                ctx.arc(e.x + size / 2, e.y + size / 2, size / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0000';
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(e.x + size * 0.3, e.y + size * 0.35, size * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x + size * 0.7, e.y + size * 0.35, size * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#0a0a0a';
                ctx.beginPath();
                ctx.arc(e.x + size * 0.35, e.y + size * 0.4, size * 0.07, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x + size * 0.75, e.y + size * 0.4, size * 0.07, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.fillText('Lv' + e.level, e.x + 2, e.y + size + 14);
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(e.x, e.y - 8, size, 4);
                ctx.fillStyle = e.hp > 0 ? '#44ff44' : '#ff4444';
                ctx.fillRect(e.x, e.y - 8, size * (e.hp / (1 + e.level)), 4);
            }
            ctx.shadowBlur = 0;

            // Boss绘制
            if (game.isBoss && game.boss && game.boss.hp > 0) {
                drawBoss(game.boss, game.player);
                // Boss血条（低血量闪烁）
                if (game.boss.hp < game.boss.maxHp * 0.3 && Math.floor(game.frame / 8) % 2 === 0) {
                    ctx.fillStyle = 'rgba(255,0,0,0.1)';
                    ctx.fillRect(offsetX, 0, W, H);
                }
            }

            // 子弹
            for (const bull of game.bullets) {
                ctx.shadowColor = bull.color || '#6bcbff';
                ctx.shadowBlur = 30;
                ctx.fillStyle = bull.color || '#6bcbff';
                ctx.beginPath();
                ctx.arc(bull.x, bull.y, bull.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(bull.x - 2, bull.y - 2, bull.r * 0.3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 玩家
            const p = game.player;
            for (const t of p.trail) {
                ctx.globalAlpha = t.life / 20 * 0.2;
                ctx.fillStyle = '#3498db';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.roundRect(t.x, t.y, p.w, p.h, 4);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            if (p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            const capeWave = Math.sin(game.frame * 0.06) * 3;
            ctx.shadowColor = '#6bcbff';
            ctx.shadowBlur = 15;
            const capeColor = ['#2ecc71', '#8e44ad', '#ff3333'][game.world % 3] || '#2ecc71';
            ctx.fillStyle = capeColor;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(p.x + p.w, p.y + 6);
            ctx.quadraticCurveTo(p.x + p.w + 12 + capeWave, p.y + 16, p.x + p.w - 2 + capeWave * 0.5, p.y + 26);
            ctx.quadraticCurveTo(p.x + p.w - 6 + capeWave * 0.3, p.y + 20, p.x + p.w, p.y + 14);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.shadowColor = '#6bcbff';
            ctx.shadowBlur = 25;
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, p.h, 5);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#5dade2';
            ctx.beginPath();
            ctx.roundRect(p.x + 3, p.y + 4, 5, 12, 3);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(p.x + 16, p.y + 4, 5, 12, 3);
            ctx.fill();
            ctx.fillStyle = '#2c3e50';
