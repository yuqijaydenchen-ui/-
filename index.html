<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>👻 Shadow Hero · 暗影勇者</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        #app {
            position: relative;
            width: 100%;
            max-width: 840px;
            aspect-ratio: 840 / 620;
            background: #141425;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            touch-action: none;
        }
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #0a0a1a;
            touch-action: none;
        }
        
        /* ===== 主菜单 ===== */
        #mainMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 10, 26, 0.94);
            backdrop-filter: blur(8px);
            z-index: 20;
            padding: 20px;
            transition: opacity 0.5s ease;
        }
        #mainMenu.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #mainMenu .title {
            font-size: clamp(2.2rem, 10vw, 4.6rem);
            font-weight: 900;
            color: #f7d44a;
            text-shadow: 0 0 60px #f7d44a66;
            letter-spacing: 4px;
            text-align: center;
            line-height: 1.1;
        }
        #mainMenu .subtitle {
            font-size: clamp(0.8rem, 3vw, 1.3rem);
            color: #8899bb;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 2px;
        }
        #mainMenu .lang-toggle {
            position: absolute;
            top: 16px;
            right: 20px;
            background: transparent;
            border: 1px solid #667799;
            color: #aabbdd;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }
        #mainMenu .lang-toggle:hover,
        #mainMenu .lang-toggle:active {
            background: #66779944;
            border-color: #6bcbff;
            color: #6bcbff;
        }
        #mainMenu .menu-btn {
            background: transparent;
            border: 2px solid #6bcbff;
            color: #6bcbff;
            padding: 14px 48px;
            margin: 5px 0;
            border-radius: 60px;
            font-size: clamp(1rem, 3vw, 1.3rem);
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            width: 80%;
            max-width: 340px;
            text-align: center;
            touch-action: manipulation;
        }
        #mainMenu .menu-btn:hover,
        #mainMenu .menu-btn:active {
            background: #6bcbff;
            color: #0a0a1a;
            transform: scale(1.03);
            box-shadow: 0 0 40px #6bcbff66;
        }
        #mainMenu .menu-btn.secondary {
            border-color: #667799;
            color: #667799;
        }
        #mainMenu .menu-btn.secondary:hover,
        #mainMenu .menu-btn.secondary:active {
            background: #667799;
            color: #0a0a1a;
            box-shadow: 0 0 40px #66779966;
        }
        #mainMenu .menu-btn.danger {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        #mainMenu .menu-btn.danger:hover,
        #mainMenu .menu-btn.danger:active {
            background: #ff6b6b;
            color: #0a0a1a;
            box-shadow: 0 0 40px #ff6b6b66;
        }
        #mainMenu .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 80%;
            max-width: 340px;
            margin: 4px 0;
            color: #aabbdd;
            font-size: clamp(0.85rem, 2.5vw, 1.05rem);
        }
        #mainMenu .settings-row input[type="range"] {
            width: 100px;
            accent-color: #6bcbff;
            background: #2a2a4a;
            height: 4px;
            border-radius: 4px;
            touch-action: none;
        }
        #mainMenu .settings-row .toggle-btn {
            background: #2a2a4a;
            border: 1px solid #667799;
            color: #aabbdd;
            padding: 4px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
        }
        #mainMenu .settings-row .toggle-btn.on {
            border-color: #44ff88;
            color: #44ff88;
            background: #1a2a1a;
        }
        #mainMenu .settings-row .toggle-btn.off {
            border-color: #ff6b6b;
            color: #ff6b6b;
            background: #2a1a1a;
        }
        #mainMenu .save-info {
            color: #667799;
            font-size: clamp(0.65rem, 2vw, 0.85rem);
            margin-top: 12px;
            text-align: center;
        }
        #mainMenu .version {
            position: absolute;
            bottom: 12px;
            right: 20px;
            color: #445566;
            font-size: 0.7rem;
            opacity: 0.5;
        }

        /* ===== 游戏内 UI (覆盖在 canvas 上的 HTML 元素) ===== */
        #gameUI {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #gameUI .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        #gameUI .hud-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size: 12px;
            color: #aabbdd;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        #gameUI .hud-left .hp-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #gameUI .hud-left .hp-bar-bg {
            width: 120px;
            height: 10px;
            background: rgba(255,0,0,0.2);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #gameUI .hud-left .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #44ff88);
            border-radius: 5px;
            transition: width 0.2s;
            width: 100%;
        }
        #gameUI .hud-left .info-text {
            font-size: 11px;
            opacity: 0.7;
        }
        #gameUI .hud-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            font-size: 12px;
            color: #aabbdd;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        }
        #gameUI .hud-right .weapon-skill {
            display: flex;
            gap: 12px;
        }
        #gameUI .hud-right .badge {
            background: rgba(255,255,255,0.08);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.06);
            font-size: 11px;
        }

        /* Boss 血条 */
        #bossHud {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 400px;
            display: none;
            background: rgba(0,0,0,0.6);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,50,50,0.3);
            backdrop-filter: blur(4px);
        }
        #bossHud.show {
            display: block;
        }
        #bossHud .boss-name {
            color: #ff6666;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 0 20px rgba(255,50,50,0.3);
        }
        #bossHud .boss-hp-bg {
            width: 100%;
            height: 8px;
            background: rgba(255,0,0,0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 3px;
            border: 1px solid rgba(255,50,50,0.2);
        }
        #bossHud .boss-hp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff2222, #ff6644);
            border-radius: 4px;
            transition: width 0.3s;
            width: 100%;
        }
        #bossHud .boss-hp-text {
            color: #ff8888;
            font-size: 10px;
            text-align: center;
            margin-top: 2px;
        }

        /* 消息覆盖层 */
        #msgOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 15;
            pointer-events: auto;
        }
        #msgOverlay.show {
            display: flex;
        }
        #msgOverlay .msg-box {
            text-align: center;
            padding: 30px 40px;
            background: rgba(10,10,26,0.9);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 80%;
        }
        #msgOverlay .msg-title {
            font-size: 28px;
            font-weight: 900;
            color: #f7d44a;
            text-shadow: 0 0 40px #f7d44a44;
        }
        #msgOverlay .msg-sub {
            font-size: 16px;
            color: #8899bb;
            margin-top: 8px;
        }
        #msgOverlay .msg-btn {
            margin-top: 16px;
            background: transparent;
            border: 2px solid #6bcbff;
            color: #6bcbff;
            padding: 10px 32px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            pointer-events: auto;
            transition: 0.2s;
        }
        #msgOverlay .msg-btn:hover,
        #msgOverlay .msg-btn:active {
            background: #6bcbff;
            color: #0a0a1a;
        }

        /* ===== 触摸控件 ===== */
        #touchControls {
            position: absolute;
            bottom: 12px;
            left: 0;
            width: 100%;
            height: 120px;
            pointer-events: none;
            z-index: 5;
            display: none;
        }
        #touchControls.active {
            display: block;
        }
        #joystickZone {
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 110px;
            height: 110px;
            pointer-events: auto;
            touch-action: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.12);
        }
        #joystickKnob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44px;
            height: 44px;
            margin-left: -22px;
            margin-top: -22px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #6bcbff, #2a6a9a);
            box-shadow: 0 0 30px #6bcbff55;
            pointer-events: none;
            transition: none;
        }
        #shootBtn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ff6b6b, #aa2a2a);
            border: 3px solid #ff6b6b88;
            box-shadow: 0 0 40px #ff6b6b44;
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
            z-index: 6;
            text-shadow: 0 0 20px #fff;
        }
        #shootBtn:active {
            transform: scale(0.88);
            box-shadow: 0 0 60px #ff6b6b88;
        }
        #jumpBtn {
            position: absolute;
            bottom: 24px;
            right: 108px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #9b6bff, #5a2a9a);
            border: 3px solid #9b6bff88;
            box-shadow: 0 0 30px #9b6bff44;
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            touch-action: manipulation;
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
            z-index: 6;
        }
        #jumpBtn:active {
            transform: scale(0.88);
            box-shadow: 0 0 50px #9b6bff88;
        }

        @media (max-width: 600px) {
            #app {
                border-radius: 0;
                max-width: 100%;
                aspect-ratio: auto;
                height: 100vh;
                width: 100vw;
            }
            #mainMenu .menu-btn {
                padding: 12px 32px;
                width: 90%;
            }
            #mainMenu .settings-row {
                width: 90%;
            }
            #mainMenu .title {
                font-size: 2.4rem;
            }
            #touchControls.active {
                display: block;
            }
            #gameUI .hud-left .hp-bar-bg {
                width: 80px;
            }
            #bossHud {
                width: 80%;
                top: 50px;
            }
        }
        @media (pointer: coarse) {
            #touchControls.active {
                display: block;
            }
        }
        @media (pointer: fine) {
            #touchControls.active {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div id="app">
        <canvas id="gameCanvas" width="840" height="620"></canvas>

        <!-- ===== 游戏内 UI ===== -->
        <div id="gameUI">
            <div class="hud-top">
                <div class="hud-left">
                    <div class="hp-row">
                        <span id="hpLabel">❤️</span>
                        <div class="hp-bar-bg">
                            <div class="hp-bar-fill" id="hpFill" style="width:100%"></div>
                        </div>
                        <span id="hpText">100/100</span>
                    </div>
                    <div class="info-text">
                        <span id="worldDisplay">🌍 翡翠森林</span>
                        <span style="margin:0 8px">|</span>
                        <span id="levelDisplay">📊 关 1</span>
                        <span style="margin:0 8px">|</span>
                        <span id="keyDisplay">🔑 0</span>
                        <span style="margin:0 8px">|</span>
                        <span id="jumpDisplay">⬆ 3</span>
                    </div>
                </div>
                <div class="hud-right">
                    <div class="weapon-skill">
                        <span class="badge" id="weaponDisplay">🔫 普通</span>
                        <span class="badge" id="skillDisplay">⚡ 技能</span>
                    </div>
                    <div class="info-text">
                        <span id="killDisplay">🗡️ 0 杀</span>
                        <span style="margin:0 8px">|</span>
                        <span id="expDisplay">⭐ EXP 0/20</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Boss 血条 -->
        <div id="bossHud">
            <div class="boss-name" id="bossNameDisplay">👹 BOSS</div>
            <div class="boss-hp-bg">
                <div class="boss-hp-fill" id="bossFill" style="width:100%"></div>
            </div>
            <div class="boss-hp-text" id="bossHpText">100 / 100</div>
        </div>

        <!-- 消息覆盖层 -->
        <div id="msgOverlay">
            <div class="msg-box">
                <div class="msg-title" id="msgTitle">🎉 关卡完成</div>
                <div class="msg-sub" id="msgSub">继续前进！</div>
                <button class="msg-btn" id="msgBtn">继续</button>
            </div>
        </div>

        <!-- 主菜单 -->
        <div id="mainMenu">
            <button class="lang-toggle" id="langToggle">🌐 中文</button>
            <div class="title" id="menuTitle">👻 暗影勇者</div>
            <div class="subtitle" id="menuSub">⚔️ 无尽轮回 · 终极进化 ⚔️</div>

            <button class="menu-btn" id="btnNewGame">🔥 开始新游戏</button>
            <button class="menu-btn" id="btnContinue">📂 继续游戏</button>

            <div class="settings-row">
                <span id="labelVolume">🔊 音效</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="70" />
                <span id="volumeLabel">70%</span>
            </div>
            <div class="settings-row">
                <span id="labelShake">📳 屏幕震动</span>
                <button class="toggle-btn on" id="toggleShake">开</button>
            </div>

            <button class="menu-btn secondary" id="btnReset">🔄 重置进度</button>
            <div class="save-info" id="saveInfo">📀 未找到存档</div>
            <div class="version">v3.2 · 中英双语</div>
        </div>

        <!-- 触摸控件 -->
        <div id="touchControls">
            <div id="joystickZone">
                <div id="joystickKnob"></div>
            </div>
            <div id="shootBtn">🔫</div>
            <div id="jumpBtn">⬆</div>
        </div>
    </div>

    <script>
        // ================================================================
        //  👻 暗影勇者 · 完整版（中英双语 + 全部 UI）
        // ================================================================

        // ---------- DOM ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const app = document.getElementById('app');
        const mainMenu = document.getElementById('mainMenu');
        const btnNew = document.getElementById('btnNewGame');
        const btnContinue = document.getElementById('btnContinue');
        const btnReset = document.getElementById('btnReset');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeLabel = document.getElementById('volumeLabel');
        const toggleShake = document.getElementById('toggleShake');
        const saveInfo = document.getElementById('saveInfo');
        const langToggle = document.getElementById('langToggle');
        const menuTitle = document.getElementById('menuTitle');
        const menuSub = document.getElementById('menuSub');
        const labelVolume = document.getElementById('labelVolume');
        const labelShake = document.getElementById('labelShake');
        const touchControls = document.getElementById('touchControls');
        const joystickZone = document.getElementById('joystickZone');
        const joystickKnob = document.getElementById('joystickKnob');
        const shootBtn = document.getElementById('shootBtn');
        const jumpBtn = document.getElementById('jumpBtn');

        // 游戏内 UI 元素
        const hpFill = document.getElementById('hpFill');
        const hpText = document.getElementById('hpText');
        const worldDisplay = document.getElementById('worldDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const keyDisplay = document.getElementById('keyDisplay');
        const jumpDisplay = document.getElementById('jumpDisplay');
        const weaponDisplay = document.getElementById('weaponDisplay');
        const skillDisplay = document.getElementById('skillDisplay');
        const killDisplay = document.getElementById('killDisplay');
        const expDisplay = document.getElementById('expDisplay');
        const bossHud = document.getElementById('bossHud');
        const bossFill = document.getElementById('bossFill');
        const bossHpText = document.getElementById('bossHpText');
        const bossNameDisplay = document.getElementById('bossNameDisplay');
        const msgOverlay = document.getElementById('msgOverlay');
        const msgTitle = document.getElementById('msgTitle');
        const msgSub = document.getElementById('msgSub');
        const msgBtn = document.getElementById('msgBtn');

        const W = 840,
            H = 620;
        const SAVE_KEY = 'shadow_hero_save_v3';

        // ---------- 双语词库 ----------
        const LANG = {
            zh: {
                title: '👻 暗影勇者',
                sub: '⚔️ 无尽轮回 · 终极进化 ⚔️',
                newGame: '🔥 开始新游戏',
                continue: '📂 继续游戏',
                volume: '🔊 音效',
                shake: '📳 屏幕震动',
                reset: '🔄 重置进度',
                on: '开',
                off: '关',
                noSave: '📀 未找到存档',
                saveExists: '📀 存档已存在',
                confirmReset: '⚠️ 确定要重置所有进度吗？此操作不可撤销！',
                resetDone: '✅ 已重置所有进度',
                loadFail: '⚠️ 存档加载失败，将开始新游戏',
                langLabel: '🌐 中文',
                hp: '❤️ 生命',
                kills: '杀',
                exp: '⭐ EXP',
                level: '关',
                keys: '🔑 钥匙',
                jumps: '⬆ 跳跃',
                weapon: '🔫 武器',
                skill: '⚡ 技能',
                world: '🌍',
                boss: '👹 BOSS',
                levelComplete: '🎉 关卡完成！',
                levelCompleteSub: '继续前进！',
                gameOver: '💀 游戏结束',
                gameOverSub: '点击重新开始',
                continueBtn: '继续',
                restartBtn: '重新开始',
            },
            en: {
                title: '👻 Shadow Hero',
                sub: '⚔️ Endless Cycle · Ultimate Evolution ⚔️',
                newGame: '🔥 New Game',
                continue: '📂 Continue',
                volume: '🔊 Sound',
                shake: '📳 Screen Shake',
                reset: '🔄 Reset Progress',
                on: 'On',
                off: 'Off',
                noSave: '📀 No save found',
                saveExists: '📀 Save exists',
                confirmReset: '⚠️ Reset all progress? This cannot be undone!',
                resetDone: '✅ Progress reset',
                loadFail: '⚠️ Save load failed, starting new game',
                langLabel: '🌐 English',
                hp: '❤️ HP',
                kills: 'Kills',
                exp: '⭐ EXP',
                level: 'Lv',
                keys: '🔑 Keys',
                jumps: '⬆ Jumps',
                weapon: '🔫 Weapon',
                skill: '⚡ Skill',
                world: '🌍',
                boss: '👹 BOSS',
                levelComplete: '🎉 Level Complete!',
                levelCompleteSub: 'Continue forward!',
                gameOver: '💀 Game Over',
                gameOverSub: 'Click to restart',
                continueBtn: 'Continue',
                restartBtn: 'Restart',
            }
        };

        let currentLang = 'zh';

        function t(key) {
            return LANG[currentLang]?.[key] || LANG.zh[key] || key;
        }

        function updateUIStrings() {
            menuTitle.textContent = t('title');
            menuSub.textContent = t('sub');
            btnNew.textContent = t('newGame');
            btnContinue.textContent = t('continue');
            labelVolume.textContent = t('volume');
            labelShake.textContent = t('shake');
            btnReset.textContent = t('reset');
            toggleShake.textContent = settings.shakeEnabled ? t('on') : t('off');

        // ---------- 音频 ----------
        let audioCtx = null;
        let masterGain = null;

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new(window.AudioContext || webkitAudioContext)();
                    masterGain = audioCtx.createGain();
                    masterGain.gain.value = settings.volume / 100;
                    masterGain.connect(audioCtx.destination);
                } catch (e) {}
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx || !masterGain) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(masterGain);
                const now = audioCtx.currentTime;
                const vol = settings.volume / 100;
                switch (type) {
                    case 'shoot':
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
                        gain.gain.setValueAtTime(0.12 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now);
                        osc.stop(now + 0.05);
                        break;
                    case 'jump':
                        osc.frequency.setValueAtTime(300 + (game?.player?.jumpCount || 0) * 80, now);
                        gain.gain.setValueAtTime(0.10 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'kill':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
                        gain.gain.setValueAtTime(0.25 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;
                    case 'key':
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
                        gain.gain.setValueAtTime(0.12 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                        osc.start(now);
                        osc.stop(now + 0.1);
                        break;
                    case 'damage':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                        gain.gain.setValueAtTime(0.35 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                    case 'heal':
                        osc.frequency.setValueAtTime(500, now);
                        osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
                        gain.gain.setValueAtTime(0.2 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                        osc.start(now);
                        osc.stop(now + 0.2);
                        break;
                    case 'weapon':
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(1100, now + 0.25);
                        gain.gain.setValueAtTime(0.2 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now);
                        osc.stop(now + 0.25);
                        break;
                    case 'death':
                        osc.frequency.setValueAtTime(100, now);
                        osc.frequency.exponentialRampToValueAtTime(15, now + 0.8);
                        gain.gain.setValueAtTime(0.4 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                        osc.start(now);
                        osc.stop(now + 0.8);
                        break;
                    case 'boss_hit':
                        osc.frequency.setValueAtTime(60, now);
                        osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                        gain.gain.setValueAtTime(0.4 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                        osc.start(now);
                        osc.stop(now + 0.15);
                        break;
                    case 'skill':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                        osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
                        gain.gain.setValueAtTime(0.2 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                        osc.start(now);
                        osc.stop(now + 0.4);
                        break;
                    case 'levelup':
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
                        gain.gain.setValueAtTime(0.25 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                        osc.start(now);
                        osc.stop(now + 0.35);
                        break;
                    case 'boss_spawn':
                        osc.frequency.setValueAtTime(100, now);
                        osc.frequency.exponentialRampToValueAtTime(400, now + 0.3);
                        osc.frequency.exponentialRampToValueAtTime(80, now + 0.6);
                        gain.gain.setValueAtTime(0.3 * vol, now);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                        osc.start(now);
                        osc.stop(now + 0.6);
                        break;
                    case 'explode':
                        osc.frequency.setValueAtTime(150, now);
                        osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                        gain.gain.setValueAtTime(0.4 * vol, now);

                        osc.start(now);
                        osc.stop(now + 0.3);
                        break;
                    default:
                        break;
                }
            } catch (e) {}
        }

                    saveInfo.textContent = `📀 ${t('saveExists')} · ${d.toLocaleDateString()} ${d.toLocaleTimeString()}`;

            try {
                stats = saveData.stats || {};
                for (const key in STAT_CONFIG) {
                    if (stats[key] === undefined) stats[key] = STAT_CONFIG[key].base;

                level = saveData.level || 1;

                game.world = saveData.world || 0;
                game.branch = saveData.branch || 0;
                game.level = saveData.level || 0;
                game.totalCycles = saveData.totalCycles || 0;
                game.infiniteMode = saveData.infiniteMode || false;
                game.hp = saveData.hp || stats.maxHp;
                game.maxHp = saveData.maxHp || stats.maxHp;
                game.player.weapon = saveData.weapon || 0;
                game.totalKills = saveData.totalKills || 0;
                applyStats();
                loadLevel(game.world, game.branch, game.level);
                updateGameUI();

        // ---------- 触控 ----------
        let joystickActive = false;
        let joystickData = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickActive = true;
            updateJoystick(e);
        }, { passive: false });

        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (joystickActive) updateJoystick(e);
        }, { passive: false });

        joystickZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            joystickActive = false;
            joystickData.x = 0;
            joystickData.y = 0;
            joystickKnob.style.transform = 'translate(0, 0)';
            if (game.keysPressed) {
                game.keysPressed.left = false;
                game.keysPressed.right = false;
                game.keysPressed.up = false;
            }
        }, { passive: false });

        function updateJoystick(e) {
            const rect = joystickZone.getBoundingClientRect();
            const touch = e.touches[0];
            if (!touch) return;
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = touch.clientX - cx;
            let dy = touch.clientY - cy;
            const maxDist = rect.width / 2 - 10;
            const dist = Math.hypot(dx, dy);
            if (dist > maxDist) {
                dx = (dx / dist) * maxDist;
                dy = (dy / dist) * maxDist;
            }
            joystickData.x = dx / maxDist;
            joystickData.y = dy / maxDist;
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            if (game.keysPressed) {
                game.keysPressed.left = joystickData.x < -0.3;
                game.keysPressed.right = joystickData.x > 0.3;
                game.keysPressed.up = joystickData.y < -0.3;
            }
        }

        // ---------- 射击与跳跃 ----------
        function shootBullet(tx, ty) {
            if (!game || !game.running || game.gameOver) return;
            const p = game.player;
            const cx = p.x + p.w / 2;
            const cy = p.y + p.h / 2;
            const dx = tx - cx;
            const dy = ty - cy;
            const len = Math.hypot(dx, dy);
            if (len < 10) return;
            const speed = 8;
            const bt = getCurrentBulletType();
            const bType = BULLET_TYPES[bt] || BULLET_TYPES.normal;
            game.bullets.push({
                x: cx,
                y: cy,
                vx: (dx / len) * speed,
                vy: (dy / len) * speed,
                r: 5,
                life: 80,
                damage: bType.damage,
                color: bType.color,
                type: bt,
                pierce: bType.pierce || 0,
                explode: bType.explode || false,
                homing: bType.homing || false,
                spread: bType.spread || 1,
                trail: [],
            });
            playSound('shoot');
        }

        // ---------- 画布绘制 (简化，主要用于游戏元素) ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);
            // 背景
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(1, '#1a1a30');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // 平台
            if (game.platforms) {
                for (const plat of game.platforms) {
                    ctx.fillStyle = '#3a5a6a';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#3a5a6a66';
                    ctx.beginPath();
                    ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 4);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            // 出口
            if (game.exit && !game.isBoss) {
                ctx.fillStyle = '#44ff8844';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#44ff8844';
                ctx.beginPath();
                ctx.roundRect(game.exit.x, game.exit.y, game.exit.w, game.exit.h, 4);
                ctx.fill();
                ctx.fillStyle = '#44ff88';
                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('🚪', game.exit.x + game.exit.w / 2, game.exit.y + game.exit.h - 4);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
            }

            // 玩家
            if (game.player) {
                const p = game.player;
                ctx.fillStyle = '#3498db';
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#6bcbff66';
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, p.h, 5);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#5dade2';
                ctx.beginPath();
                ctx.arc(p.x + p.w / 2, p.y - 4, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(p.x + 6, p.y - 6, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + 18, p.y - 6, 3, 0, Math.PI * 2);
                ctx.fill();
            }

            // 子弹
            if (game.bullets) {
                for (const bull of game.bullets) {
                    ctx.fillStyle = bull.color || '#6bcbff';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = bull.color || '#6bcbff';
                    ctx.beginPath();
                    ctx.arc(bull.x, bull.y, bull.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            // 敌人
            if (game.enemies) {
                for (const e of game.enemies) {
                    ctx.fillStyle = '#c0392b';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ff444466';
                    ctx.beginPath();
                    ctx.arc(e.x + e.w / 2, e.y + e.h / 2, e.w / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(e.x + 6, e.y + 6, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(e.x + e.w - 6, e.y + 6, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // 辅助函数
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w / 2) r = w / 2;
            if (r > h / 2) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        // ---------- 主循环 ----------
        function gameLoop() {
            if (game && game.running && !game.gameOver) {
                const p = game.player;
                if (p) {
                    if (game.keysPressed?.left) {
                        p.x -= p.speed * 0.5;
                        p.facing = -1;
                    }
                    if (game.keysPressed?.right) {
                        p.x += p.speed * 0.5;
                        p.facing = 1;
                    }
                    if (game.keysPressed?.up && p.onGround) {
                        p.vy = p.jumpPower;
                        p.onGround = false;
                        p.jumpCount++;
                        playSound('jump');
                        updateGameUI();
                    }
                    p.vy += 0.4;
                    p.y += p.vy;
                    if (p.y > 400) {
                        p.y = 400;
                        p.vy = 0;
                        p.onGround = true;
                        p.jumpCount = 0;
                    }
                    if (p.x < 0) p.x = 0;
                    if (p.x + p.w > W) p.x = W - p.w;
                }
                // 更新子弹
                if (game.bullets) {
                    for (let i = game.bullets.length - 1; i >= 0; i--) {
                        const b = game.bullets[i];
                        b.x += b.vx;
                        b.y += b.vy;
                        b.life--;
                        if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20 || b.life <= 0) {
                            game.bullets.splice(i, 1);
                        }
                    }
                }
                // 屏幕震动
                if (game.screenShake > 0 && settings.shakeEnabled) {
                    const shake = game.screenShake * 0.3;
                    canvas.style.transform = `translate(${(Math.random()-0.5)*shake*2}px, ${(Math.random()-0.5)*shake*2}px)`;
                    game.screenShake *= 0.9;
                    if (game.screenShake < 0.1) {
                        game.screenShake = 0;
                        canvas.style.transform = '';
                    }
                }
                // 更新 UI
                updateGameUI();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- 键盘支持 ----------
        document.addEventListener('keydown', (e) => {
            if (!game.keysPressed) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') game.keysPressed.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') game.keysPressed.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') {
                game.keysPressed.up = true;
                e.preventDefault();
            }
            if (e.key === 'q' || e.key === 'Q') {
                if (game.player) {
                    game.player.weapon = (game.player.weapon + 1) % WEAPONS.length;
                    playSound('weapon');
                    updateGameUI();
                }
                e.preventDefault();
            }
            if (e.key === 'r' || e.key === 'R') {
                const types = ['normal', 'pierce', 'explode', 'homing', 'spread'];
                const avail = types.filter(t => unlockedSkills[t] || t === 'normal');
                if (avail.length > 1) {
                    const idx = (avail.indexOf(getCurrentBulletType()) + 1) % avail.length;
                    currentBulletIdx = types.indexOf(avail[idx]);
                    playSound('weapon');
                    updateGameUI();
                }
                e.preventDefault();
            }
            if (e.key === 'e' || e.key === 'E') {
                if (game && game.running && game.skillCooldown <= 0) {
                    game.skillActive = true;
                    game.skillTimer = 90;
                    game.skillCooldown = 480;
                    playSound('skill');
                }
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (!game.keysPressed) return;
            if (e.key === 'ArrowLeft' || e.key === 'a') game.keysPressed.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') game.keysPressed.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') game.keysPressed.up = false;
        });

        // 鼠标射击
        canvas.addEventListener('mousedown', (e) => {
            if (!game || !game.running || game.gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            shootBullet(mx, my);
        });

        // 自动保存
        setInterval(() => {
            if (game && game.running) {
                saveGame();
            }
        }, 30000);

        // ---------- 启动 ----------
        loadSettings();
        updateUIStrings();
        initGame();
        gameLoop();

        console.log('👻 暗影勇者 · 中英双语移动版 已启动！');
        console.log('🔥 全部 UI 已补全！');
    </script>

</body>
