            ctx.fillRect(p.x + 2, p.y + 20, p.w - 4, 3);

            ctx.fillStyle = '#5dade2';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(p.x + p.w / 2, p.y - 2, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(p.x + 7, p.y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + 17, p.y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(100,200,255,0.4)';
            ctx.beginPath();
            ctx.arc(p.x + 6, p.y - 6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + 16, p.y - 6, 3, 0, Math.PI * 2);
            ctx.fill();
            const mx = game._mouseX || 0;
            const my = game._mouseY || 0;
            const eyeDx = mx + offsetX - (p.x + p.w / 2);
            const eyeDy = my - (p.y + p.h / 2);
            const eyeDist = Math.hypot(eyeDx, eyeDy);
            if (eyeDist > 0) {
                const offsetX2 = (eyeDx / eyeDist) * 2;
                const offsetY2 = (eyeDy / eyeDist) * 2;
                ctx.fillStyle = '#44ff88';
                ctx.beginPath();
                ctx.arc(p.x + 7 + offsetX2, p.y - 4 + offsetY2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + 17 + offsetX2, p.y - 4 + offsetY2, 2.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#44ff88';
                ctx.beginPath();
                ctx.arc(p.x + 7, p.y - 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + 17, p.y - 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            // 粒子
            for (const pt of game.particles) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = pt.color;
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life / pt.maxLife;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size * (pt.life / pt.maxLife), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            ctx.restore();

            // 屏幕震动（在视口之后）
            if (game.screenShake > 0) {
                const shake = game.screenShake * 0.5;
                ctx.save();
                ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
                game.screenShake *= 0.9;
                if (game.screenShake < 0.1) game.screenShake = 0;
                ctx.restore();
            }

            // HUD
            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.font = '14px sans-serif';
            const expPct = Math.floor((exp / expToNext) * 100);
            const mapInfo = game.mapWidth > W ? ` 🌍 ${Math.floor(game.mapWidth/W*100)}%` : '';
            ctx.fillText(`🗡️ ${game.totalKills}杀  |  EXP ${exp}/${expToNext} (${expPct}%)${mapInfo}`, 14, 28);
            if (game.hp < 30) {
                ctx.fillStyle = 'rgba(255,0,0,0.12)';
                ctx.fillRect(0, 0, W, H);
            }
            // Boss名字在顶部
            if (game.isBoss && game.boss && game.boss.hp > 0 && game.bossType) {
                ctx.fillStyle = '#ff444466';
                ctx.font = '18px sans-serif';
                ctx.fillText(`👹 ${game.bossType.desc}  Lv.${game.level+1}`, W / 2 - 80, 30);
            }
        }

        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w / 2) r = w / 2;
            if (r > h / 2) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        // ---------- 事件 ----------
        canvas.addEventListener('mousedown', (e) => {
            if (!game.running || game.gameOver || game.levelComplete) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            game._mouseX = mx;
            game._mouseY = my;
            shootBullet(mx, my);
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            game._mouseX = (e.clientX - rect.left) * scaleX;
            game._mouseY = (e.clientY - rect.top) * scaleY;
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { game.keysPressed.left = true;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { game.keysPressed.right = true;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === ' ') {
                game.keysPressed.up = true;
                e.preventDefault();
            }
            if (key === 'q' || key === 'Q') {
                game.player.weapon = (game.player.weapon + 1) % WEAPONS.length;
                playSound('weapon');
                updateUI();
                e.preventDefault();
            }
            if (key === 'e' || key === 'E') {
                activateSkill();
                updateUI();
                e.preventDefault();
            }
            if (key === 'f' || key === 'F') {
                toggleStatPanel();
                e.preventDefault();
            }
            if (key === ' ') {
                e.preventDefault();
                if (game.gameOver || !game.running) {
                    initGame();
                }
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key;
            if (key === 'ArrowLeft' || key === 'a' || key === 'A') { game.keysPressed.left = false;
                e.preventDefault(); }
            if (key === 'ArrowRight' || key === 'd' || key === 'D') { game.keysPressed.right = false;
                e.preventDefault(); }
            if (key === 'ArrowUp' || key === 'w' || key === 'W' || key === ' ') {
                game.keysPressed.up = false;
                e.preventDefault();
            }
        });

        infiniteBtn.addEventListener('click', function() {
            game.infiniteMode = !game.infiniteMode;
            this.classList.toggle('active');
            this.textContent = game.infiniteMode ? '♾️ 无尽 (开)' : '♾️ 无尽 (关)';
            if (game.infiniteMode) {
                game.totalCycles = 0;
                game.level = 0;
                loadLevel(0);
                showMessage('♾️ 无尽模式已开启', '每5关随机Boss，地图越来越大！');
                setTimeout(() => msgOverlay.classList.remove('show'), 1500);
            }
            updateUI();
        });

        statBtn.addEventListener('click', toggleStatPanel);

        // ---------- 主循环 ----------
        function gameLoop() {
            if (game.running && !game.gameOver && !game.levelComplete) {
                game.frame++;
                updatePlayer();
                if (game.particles.length > 500) game.particles.splice(0, 150);
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        initGame();
        gameLoop();

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'q', 'Q', 'e', 'E', 'f', 'F'].includes(e.key)) {
                e.preventDefault();
            }
        });
        document.addEventListener('click', () => { initAudio(); }, { once: true });
    </script>
</body>
</html>
