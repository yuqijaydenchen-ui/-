        function rectCollide(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

        function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

        // ----- 粒子 -----
        function spawnParticles(x, y, color, count = 12, speedMult = 1) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = (1 + Math.random() * 3) * speedMult;
                game.particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1, life: 30 + Math
                        .random() * 30, maxLife: 60, color, size: 3 + Math.random() * 5 });
            }
        }

        function spawnExplosion(x, y, color, count = 40) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 6;
                game.particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1, life: 30 + Math
                        .random() * 30, maxLife: 60, color: Math.random() > 0.5 ? color : '#ffaa44', size: 3 + Math
                        .random() * 8 });
            }
        }

        function spawnBlood(x, y, count = 20) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 5;
                game.particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1, life: 40 + Math
                        .random() * 40, maxLife: 80, color: Math.random() > 0.5 ? '#8b0000' : '#cc0000', size: 2 +
                        Math.random() * 6 });
            }
        }

        function updateParticles() {
            for (let i = game.particles.length - 1; i >= 0; i--) {
                const p = game.particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06;
                p.life--;
                if (p.life <= 0) game.particles.splice(i, 1);
            }
            if (game.particles.length > 500) game.particles.splice(0, 150);
        }

        // ----- 射击 -----
        let lastShootTime = 0;
        let shootSoundCooldown = 0;

        function shootBullet(targetX, targetY) {
            const now = performance.now();
            const fireRate = Math.max(0.3, 1.0 / playerData.stats.fireRate);
            const coolDownMs = 70 * fireRate;
            if (now - lastShootTime < coolDownMs) return;
            lastShootTime = now;

            if (!game.running || game.gameOver || game.levelComplete) return;
            const p = game.player;
            const cx = p.x + p.w / 2;
            const cy = p.y + p.h / 2;
            const dx = targetX - cx;
            const dy = targetY - cy;
            const len = Math.hypot(dx, dy);
            if (len < 10) return;
            const weapon = WEAPONS[p.weapon];
            const count = weapon.spread || 1;
            const damageBonus = 1 + playerData.stats.damageBonus;
            const isPierce = weapon.type === 'pierce' || playerData.unlockedSkills.has('skill_pierce');
            const isExplode = weapon.type === 'explode' || playerData.unlockedSkills.has('skill_explode');
            const pierceCount = isPierce ? 5 : 1;
            const explodeRadius = isExplode ? 30 : 15;

            for (let i = 0; i < count; i++) {
                const angle = Math.atan2(dy, dx) + (i - (count - 1) / 2) * 0.25;
                const speed = game.skillActive && game.skillType === 0 ? weapon.speed * 0.4 : weapon.speed;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;
                game.bullets.push({
                    x: cx,
                    y: cy,
                    vx: vx,
                    vy: vy,
                    r: isPierce ? 4 : (isExplode ? 7 : 5),
                    life: isPierce ? 200 : 130,
                    damage: Math.ceil(weapon.damage * damageBonus),
                    color: weapon.color,
                    type: isExplode ? 'explode' : (isPierce ? 'pierce' : 'normal'),
                    pierceCount: pierceCount,
                    isEnemy: false,
                    explodeRadius: explodeRadius,
                    owner: 'self',
                });
            }
            spawnParticles(cx, cy, weapon.color, 4);
            if (now - shootSoundCooldown > 100) { playSound('shoot');
                shootSoundCooldown = now; }
        }

        // ----- 技能激活 -----
        function activateSkill() {
            if (game.skillCooldown > 0 || game.skillActive) return;
            const skMap = { 1: 'skill_heal', 2: 'skill_dash', 3: 'skill_thunder' };
            if (currentSkill > 0 && skMap[currentSkill] && !playerData.unlockedSkills.has(skMap[currentSkill])) {
                showMessage('❌ 技能未解锁', '请在技能树中解锁');
                setTimeout(() => msgOverlay.classList.remove('show'), 1200);
                return;
            }
            const skill = SKILLS[currentSkill];
            game.skillActive = true;
            game.skillTimer = skill.duration;
            game.skillCooldown = skill.cooldown;
            game.skillType = currentSkill;
            playSound('skill');

            switch (currentSkill) {
                case 0:
                    spawnParticles(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, '#44ff88', 30,
                        2);
                    break;
                case 1:
                    playerData.hp = Math.min(game.player.maxHp, playerData.hp + 20);
                    spawnParticles(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, '#44ff88', 40,
                        2);
                    playSound('heal');
                    break;
                case 2:
                    const p = game.player;
                    const dashDist = 80;
                    const dir = p.facing;
                    p.x += dir * dashDist;
                    p.x = Math.max(0, Math.min(game.mapWidth - p.w, p.x));
                    spawnParticles(p.x + p.w / 2, p.y + p.h / 2, '#aa44ff', 30, 3);
                    for (const e of game.enemies) {
                        if (e.y > game.mapHeight + 50) continue;
                        if (Math.abs(e.x - p.x) < 120 && Math.abs(e.y - p.y) < 60) {
                            e.hp -= 5 + playerData.stats.damageBonus * 2;
                            if (e.hp <= 0) {
                                e.y = game.mapHeight + 100;
                                spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                                playSound('kill');
                                game.totalKills++;
                                addExp(e.expReward || 10);
                                playerData.gold += (e.goldReward || 3);
                            } else { e.hitFlash = 15; }
                        }
                    }
                    break;
                case 3:
                    spawnParticles(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, '#ffff44', 40,
                        3);
                    game.thunderTimer = 60;
                    playSound('thunder');
                    thunderStrike();
                    break;
            }
            updateUI();
            updateSkillTreeUI();
        }

        function thunderStrike() {
            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;
                const tx = e.x + Math.random() * 60 - 30;
                const ty = e.y - 20;
                spawnExplosion(tx, ty, '#ffff44', 20);
                if (dist(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, tx, ty) < 100) {
                    e.hp -= 8 + playerData.stats.damageBonus * 2;
                    if (e.hp <= 0) {
                        e.y = game.mapHeight + 100;
                        spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                        playSound('kill');
                        game.totalKills++;
                        addExp(e.expReward || 10);
                        playerData.gold += (e.goldReward || 3);
                    } else { e.hitFlash = 15; }
                }
            }
            if (game.isBoss && game.boss && game.boss.hp > 0) {
                const b = game.boss;
                const tx = b.x + b.w / 2 + Math.random() * 40 - 20;
                const ty = b.y + b.h / 2;
                spawnExplosion(tx, ty, '#ffff44', 30);
                b.hp -= 5 + playerData.stats.damageBonus * 1.5;
                updateBossUI();
                if (b.hp <= 0) bossDefeated();
            }
            game.screenShake = 8;
        }

        // ----- 玩家更新 -----
        function updatePlayer() {
            const p = game.player;
            const keys = game.keysPressed;

            if (p.invincible > 0) p.invincible--;
            if (p.healTimer > 0) {
                p.healTimer--;
                if (p.healTimer % 10 === 0) { playerData.hp = Math.min(p.maxHp, playerData.hp + 5);
                    spawnParticles(p.x + p.w / 2, p.y + p.h / 2, '#44ff88', 2); }
            }
            if (game.skillCooldown > 0) game.skillCooldown--;
            if (game.skillActive) {
                game.skillTimer--;
                if (game.skillTimer <= 0) { game.skillActive = false; if (game.skillType === 3) game.thunderTimer = 0; }
            }
            if (game.thunderTimer > 0) {
                game.thunderTimer--;
                if (game.thunderTimer % 10 === 0) thunderStrike();
            }

            let moveX = 0;
            if (keys.left || game.touchLeft) moveX = -1;
            if (keys.right || game.touchRight) moveX = 1;
            if (Math.abs(joystickDX) > 0.1) moveX = joystickDX;
            if (moveX < 0) { p.vx = -p.speed * Math.min(1, Math.abs(moveX));
                p.facing = -1; } else if (moveX > 0) { p.vx = p.speed * Math.min(1, Math.abs(moveX));
                p.facing = 1; } else { p.vx *= FRICTION; if (Math.abs(p.vx) < 0.1) p.vx = 0; }

            const jumpRequest = keys.up || game.touchJump || (joystickDY < -0.5);
            if (jumpRequest) {
                if (p.jumpCount < p.maxJumps) {
                    const power = p.jumpCount === 0 ? p.jumpPower : p.jumpPower * (0.85 - p.jumpCount * 0.06);
                    p.vy = power;
                    p.jumpCount++;
                    p.onGround = false;
                    spawnParticles(p.x + p.w / 2, p.y + p.h, '#9b6bff', 6);
                    playSound('jump');
                    if (keys.up) game.keysPressed.up = false;
                    if (game.touchJump) game.touchJump = false;
                }
            }
            p.vy += GRAVITY;
            if (p.vy > 13) p.vy = 13;
            p.x += p.vx;
            if (p.x < 0) p.x = 0;
            if (p.x + p.w > game.mapWidth) p.x = game.mapWidth - p.w;
            p.y += p.vy;
            p.onGround = false;
            for (const plat of game.platforms) {
                if (rectCollide(p, plat)) {
                    if (p.vy > 0) { p.y = plat.y - p.h;
                        p.vy = 0;
                        p.onGround = true;
                        p.jumpCount = 0; } else if (p.vy < 0) { p.y = plat.y + plat.h;
                        p.vy = 0; }
                }
            }
            if (p.y > game.mapHeight + 50) { takeDamage(50); return; }

            if (game.frame % 2 === 0) { p.trail.push({ x: p.x, y: p.y, life: 20 }); if (p.trail.length > 15) p.trail
                        .shift(); }
            for (let i = p.trail.length - 1; i >= 0; i--) { p.trail[i].life--; if (p.trail[i].life <= 0) p.trail.splice(
                        i, 1); }

            // 收集钥匙
            for (const key of game.keys) {
                if (key.collected) continue;
                if (dist(p.x + p.w / 2, p.y + p.h / 2, key.x, key.y) < 26) {
                    key.collected = true;
                    game.keysCollected++;
                    spawnParticles(key.x, key.y, '#f7d44a', 20);
                    playSound('key');
                    addExp(5);
                    playerData.gold += 2;
                    updateUI();
                    updateSkillTreeUI();
                }
            }

            // 拾取物品
            for (let i = game.items.length - 1; i >= 0; i--) {
                const item = game.items[i];
                if (dist(p.x + p.w / 2, p.y + p.h / 2, item.x, item.y) < 25) {
                    if (item.type === 'heal') {
                        p.healTimer = 240;
                        spawnParticles(item.x, item.y, '#44ff88', 15);
                        playSound('heal');
                        addExp(5);
                        game.items.splice(i, 1);
                        updateUI();
                    } else if (item.type === 'weapon') {
                        p.weapon = item.weaponIdx;
                        spawnParticles(item.x, item.y, '#ffaa44', 20);
                        playSound('weapon');
                        addExp(10);
                        game.items.splice(i, 1);
                        updateUI();
                    }
                }
            }

            // 过关
            if (game.keysCollected >= game.totalKeys) {
                if (rectCollide(p, game.exit)) {
                    game.levelComplete = true;
                    addExp(50);
                    let nl = game.level + 1;
                    if (nl >= game.maxLevel) {
                        nl = 0;
                        game.totalCycles++;
                        if (game.infiniteMode) {
                            showMessage(t('infiniteStart'), t('infiniteSub'));
                        } else {
                            game.running = false;
                            showMessage(t('victory'), t('victorySub'));
                            return;
                        }
                    }
                    const nextLevel = nl + 1 + game.totalCycles * 5;
                    showMessage(t('levelComplete'), t('levelCompleteSub', { n: nextLevel }));
                    setTimeout(() => {
                        msgOverlay.classList.remove('show');
                        game.level = nl;
                        loadLevel(nl);
                        game.levelComplete = false;
                        updateUI();
                    }, 1200);
                }
            }

            // 敌人碰撞
            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;
                if (e.explode && e.hp > 0) {
                    const d = dist(p.x + p.w / 2, p.y + p.h / 2, e.x + e.w / 2, e.y + e.h / 2);
                    if (d < 60) {
                        spawnExplosion(e.x + e.w / 2, e.y + e.h / 2, '#88cc33', 40);
                        game.screenShake = 10;
                        if (d < 45) { takeDamage(e.damage); if (playerData.hp <= 0) { gameOver(); return; } }
                        e.y = game.mapHeight + 100;
                        playSound('kill');
                        continue;
                    }
                }
                if (rectCollide(p, e)) {
                    if (p.vy > 0 && p.y + p.h - e.y < 20) {
                        e.y = game.mapHeight + 100;
                        p.vy = p.jumpPower * 0.6;
                        p.jumpCount = 0;
                        spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 30);
                        playSound('kill');
                        game.totalKills++;
                        addExp(e.expReward || 10);
                        playerData.gold += (e.goldReward || 3);
                        if (e.split && e.hp > 1) {
                            for (let s = 0; s < 2; s++) {
                                const size2 = e.w * 0.6;
                                game.enemies.push({
                                    x: e.x + s * 30 - 10,
                                    y: e.y + 20,
                                    w: size2,
                                    h: size2,
                                    type: e.type,
                                    name: e.name,
                                    color: e.color,
                                    glow: e.glow,
                                    level: e.level,
                                    hp: Math.ceil(e.maxHp / 2),
                                    maxHp: Math.ceil(e.maxHp / 2),
                                    vx: (0.4 + Math.random() * 0.4) * (s === 0 ? 1 : -1),
                                    speed: e.speed * 1.2,
                                    minX: 10,
                                    maxX: game.mapWidth - 10,
                                    startY: e.y + 20,
                                    damage: e.damage * 0.6,
                                    hitFlash: 0,
                                    aggroRange: e.aggroRange,
                                    expReward: Math.ceil(e.expReward / 2),
                                    goldReward: Math.ceil((e.goldReward || 3) / 2),
                                    split: false,
                                    ranged: false,
                                    stealth: false,
                                    explode: false,
                                    slow: false,
                                    shootTimer: 0,
                                    stealthTimer: 0,
                                    isStealthed: false,
                                });
                            }
                        }
                        if (Math.random() < 0.2) game.items.push({ type: 'heal', x: e.x + e.w / 2, y: e.y - 30, r: 12,
                                value: 20 });
                        updateUI();
                        updateSkillTreeUI();
                    } else if (p.invincible <= 0) {
                        takeDamage(e.damage || 10);
                        if (playerData.hp <= 0) { gameOver(); return; }
                    }
                }
            }

            // Boss
            if (game.isBoss && game.boss && game.boss.hp > 0) {
                const b = game.boss;
                if (rectCollide(p, b)) {
                    if (p.vy > 0 && p.y + p.h - b.y < 30) {
                        b.hp -= 2;
                        b.hitCooldown = 15;
                        p.vy = p.jumpPower * 0.6;
                        p.jumpCount = 0;
                        spawnBlood(b.x + b.w / 2, b.y + 10, 30);
                        playSound('boss_hit');
                        game.screenShake = 12;
                        updateBossUI();
                        if (b.hp <= 0) bossDefeated();
                    } else if (p.invincible <= 0) {
                        takeDamage(30);
                        if (playerData.hp <= 0) { gameOver(); return; }
                    }
                }
                updateBossAI();
            }

            // 子弹更新
            const timeScale = game.skillActive && game.skillType === 0 ? 0.6 : 1.0;
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const bull = game.bullets[i];
                if (bull.isEnemy) {
                    bull.x += bull.vx * timeScale;
                    bull.y += bull.vy * timeScale;
                    bull.life--;
                    if (bull.x < -20 || bull.x > game.mapWidth + 20 || bull.y < -20 || bull.y > game.mapHeight + 20 ||
                        bull.life <= 0) { game.bullets.splice(i, 1); continue; }
                    const p2 = game.player;
                    if (dist(p2.x + p2.w / 2, p2.y + p2.h / 2, bull.x, bull.y) < bull.r + 12) {
                        if (p2.invincible <= 0) { takeDamage(bull.damage || 10); if (playerData.hp <= 0) { gameOver(); return; } }
                        game.bullets.splice(i, 1);
                    }
                    continue;
                }

                bull.x += bull.vx * timeScale;
                bull.y += bull.vy * timeScale;
                bull.life--;
                if (bull.x < -20 || bull.x > game.mapWidth + 20 || bull.y < -20 || bull.y > game.mapHeight + 20 ||
                    bull.life <= 0) { game.bullets.splice(i, 1); continue; }
                let hit = false;

                if (bull.type === 'explode') {
                    let exploded = false;
                    for (const e of game.enemies) {
                        if (e.y > game.mapHeight + 50) continue;
                        if (dist(bull.x, bull.y, e.x + e.w / 2, e.y + e.h / 2) < bull.r + (bull.explodeRadius || 20)) {
                            e.hp -= bull.damage;
                            if (e.hp <= 0) {
                                e.y = game.mapHeight + 100;
                                spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                                playSound('kill');
                                game.totalKills++;
                                addExp(e.expReward || 10);
                                playerData.gold += (e.goldReward || 3);
                                if (e.split && e.hp > 1) {
                                    for (let s = 0; s < 2; s++) {
                                        const size2 = e.w * 0.6;
                                        game.enemies.push({
                                            x: e.x + s * 30 - 10,
                                            y: e.y + 20,
                                            w: size2,
                                            h: size2,
                                            type: e.type,
                                            name: e.name,
                                            color: e.color,
                                            glow: e.glow,
                                            level: e.level,
                                            hp: Math.ceil(e.maxHp / 2),
                                            maxHp: Math.ceil(e.maxHp / 2),
                                            vx: (0.4 + Math.random() * 0.4) * (s === 0 ? 1 : -1),
                                            speed: e.speed * 1.2,
                                            minX: 10,
                                            maxX: game.mapWidth - 10,
                                            startY: e.y + 20,
                                            damage: e.damage * 0.6,
                                            hitFlash: 0,
                                            aggroRange: e.aggroRange,
                                            expReward: Math.ceil(e.expReward / 2),
                                            goldReward: Math.ceil((e.goldReward || 3) / 2),
                                            split: false,
                                            ranged: false,
                                            stealth: false,
                                            explode: false,
                                            slow: false,
                                            shootTimer: 0,
                                            stealthTimer: 0,
                                            isStealthed: false,
                                        });
                                    }
                                }
                            } else { e.hitFlash = 10; }
                            exploded = true;
                        }
                    }
                    if (exploded) {
                        spawnExplosion(bull.x, bull.y, '#ff8833', 30);
                        game.screenShake = 6;
                        if (game.isBoss && game.boss && game.boss.hp > 0) {
                            const b = game.boss;
                            if (dist(bull.x, bull.y, b.x + b.w / 2, b.y + b.h / 2) < 60) {
                                b.hp -= bull.damage;
                                updateBossUI();
                                if (b.hp <= 0) bossDefeated();
                            }
                        }
                        game.bullets.splice(i, 1);
                        updateUI();
                        updateSkillTreeUI();
                        continue;
                    }
                }

                for (const e of game.enemies) {
                    if (e.y > game.mapHeight + 50) continue;
                    if (dist(bull.x, bull.y, e.x + e.w / 2, e.y + e.h / 2) < bull.r + 12) {
                        e.hp -= bull.damage;
                        if (e.hp <= 0) {
                            e.y = game.mapHeight + 100;
                            spawnBlood(e.x + e.w / 2, e.y + e.h / 2, 20);
                            playSound('kill');
                            game.totalKills++;
                            addExp(e.expReward || 10);
                            playerData.gold += (e.goldReward || 3);
                            if (e.split && e.hp > 1) {
                                for (let s = 0; s < 2; s++) {
                                    const size2 = e.w * 0.6;
                                    game.enemies.push({
                                        x: e.x + s * 30 - 10,
                                        y: e.y + 20,
                                        w: size2,
                                        h: size2,
                                        type: e.type,
                                        name: e.name,
                                        color: e.color,
                                        glow: e.glow,
                                        level: e.level,
                                        hp: Math.ceil(e.maxHp / 2),
                                        maxHp: Math.ceil(e.maxHp / 2),
                                        vx: (0.4 + Math.random() * 0.4) * (s === 0 ? 1 : -1),
                                        speed: e.speed * 1.2,
                                        minX: 10,
                                        maxX: game.mapWidth - 10,
                                        startY: e.y + 20,
                                        damage: e.damage * 0.6,
                                        hitFlash: 0,
                                        aggroRange: e.aggroRange,
                                        expReward: Math.ceil(e.expReward / 2),
                                        goldReward: Math.ceil((e.goldReward || 3) / 2),
                                        split: false,
                                        ranged: false,
                                        stealth: false,
                                        explode: false,
                                        slow: false,
                                        shootTimer: 0,
                                        stealthTimer: 0,
                                        isStealthed: false,
                                    });
                                }
                            }
                            if (Math.random() < 0.15) game.items.push({ type: 'heal', x: e.x + e.w / 2, y: e.y - 30,
                                    r: 12, value: 20 });
                        } else { e.hitFlash = 10;
                            spawnParticles(bull.x, bull.y, '#ffaa44', 5); }
                        hit = true;
                        if (bull.type !== 'pierce') break;
                        bull.pierceCount--;
                        if (bull.pierceCount <= 0) { hit = true; break; }
                    }
                }
                if (hit && bull.type === 'pierce') continue;
                if (hit) { game.bullets.splice(i, 1); continue; }

                if (!hit && game.isBoss && game.boss && game.boss.hp > 0 && bull.type !== 'explode') {
                    const b = game.boss;
                    if (bull.x > b.x && bull.x < b.x + b.w && bull.y > b.y && bull.y < b.y + b.h) {
                        b.hp -= bull.damage;
                        b.hitCooldown = 10;
                        spawnBlood(bull.x, bull.y, 10);
                        playSound('boss_hit');
                        game.screenShake = 8;
                        updateBossUI();
                        hit = true;
                        if (b.hp <= 0) bossDefeated();
                        if (bull.type !== 'pierce') game.bullets.splice(i, 1);
                    }
                }
                if (hit && bull.type === 'pierce') { bull.pierceCount--; if (bull.pierceCount <= 0) game.bullets.splice(
                            i, 1); } else if (hit) { game.bullets.splice(i, 1); }
            }

            if (gameMode === 'pvp') {
                checkPVPDamage();
            }

            const enemyTimeScale = game.skillActive && game.skillType === 0 ? 0.4 : 1.0;
            updateEnemies(enemyTimeScale);
            updateParticles();
            updateUI();
            updateSkillTreeUI();
            syncLoop();
        }

        // ----- 敌人AI -----
        function updateEnemies(timeScale = 1.0) {
            const p = game.player;
            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;
                if (e.stealth) {
                    e.stealthTimer--;
                    if (e.stealthTimer <= 0) {
                        e.isStealthed = !e.isStealthed;
                        e.stealthTimer = 60 + Math.random() * 60;
                        if (e.isStealthed) {
                            const angle = Math.random() * Math.PI * 2;
                            const dist2 = 60 + Math.random() * 80;
                            e.x = p.x + p.w / 2 + Math.cos(angle) * dist2 - e.w / 2;
                            e.y = p.y + p.h / 2 + Math.sin(angle) * dist2 - e.h / 2;
                            e.x = Math.max(0, Math.min(game.mapWidth - e.w, e.x));
                            e.y = Math.max(20, Math.min(game.mapHeight - 40, e.y));
                            spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#6633cc', 15);
                        }
                    }
                    if (e.isStealthed) continue;
                }
                if (e.ranged) {
                    const d = dist(p.x + p.w / 2, p.y + p.h / 2, e.x + e.w / 2, e.y + e.h / 2);
                    if (d < e.aggroRange) {
                        e.shootTimer--;
                        if (e.shootTimer <= 0) {
                            e.shootTimer = 35 + Math.random() * 30;
                            const angle = Math.atan2(p.y + p.h / 2 - (e.y + e.h / 2), p.x + p.w / 2 - (e.x + e.w / 2));
                            const speed = 2.5 + e.level * 0.4;
                            const color = e.type === 'imp' ? '#ff6633' : (e.type === 'crystal' ? '#aa66ff' : '#ccccdd');
                            const size = e.type === 'crystal' ? 6 : 5;
                            let vx = Math.cos(angle) * speed;
                            let vy = Math.sin(angle) * speed;
                            if (e.type === 'crystal') {
                                const dx2 = p.x + p.w / 2 - (e.x + e.w / 2);
                                const dy2 = p.y + p.h / 2 - (e.y + e.h / 2);
                                const d2 = Math.hypot(dx2, dy2);
                                if (d2 > 0) { vx = (dx2 / d2) * speed;
                                    vy = (dy2 / d2) * speed; }
                            }
                            game.bullets.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: vx, vy: vy, r: size, life: 120,
                                damage: e.damage * 0.4, color: color, type: 'normal', isEnemy: true });
                            spawnParticles(e.x + e.w / 2, e.y + e.h / 2, color, 5);
                        }
                    }
                }
                const dx = p.x + p.w / 2 - (e.x + e.w / 2);
                const dy = p.y + p.h / 2 - (e.y + e.h / 2);
                const d = Math.hypot(dx, dy);
                const slowMult = (e.slow && p.invincible <= 0) ? 0.5 : 1.0;
                if (d < e.aggroRange && d > 20) {
                    e.x += Math.sign(dx) * e.speed * 0.6 * timeScale * slowMult;
                    if (e.level >= 1 && Math.random() < 0.01 * timeScale) e.y -= 4 * timeScale;
                    if (e.x < 0) e.x = 0;
                    if (e.x > game.mapWidth - e.w) e.x = game.mapWidth - e.w;
                } else {
                    e.x += e.vx * e.speed * timeScale * slowMult;
                    if (e.x < e.minX || e.x > e.maxX) e.vx *= -1;
                }
                if (e.type === 'frost') {
                    if (game.frame % 10 === 0) spawnParticles(e.x + e.w / 2, e.y + e.h, '#88ddff', 2);
                }
                if (e.type === 'wraith') {
                    e.y = e.startY + Math.sin(game.frame * 0.04 + e.x * 0.1) * 8;
                }
                if (e.type === 'slime') {
                    if (game.frame % 8 === 0 && d < 200) e.y -= 2;
                }
                if (e.hitFlash > 0) e.hitFlash--;
            }
            for (let i = game.bullets.length - 1; i >= 0; i--) {
                const bull = game.bullets[i];
                if (!bull.isEnemy) continue;
                if (bull.x < -20 || bull.x > game.mapWidth + 20 || bull.y < -20 || bull.y > game.mapHeight + 20 ||
                    bull.life <= 0) { game.bullets.splice(i, 1); continue; }
                const p = game.player;
                if (dist(p.x + p.w / 2, p.y + p.h / 2, bull.x, bull.y) < bull.r + 12) {
                    if (p.invincible <= 0) { takeDamage(bull.damage || 10); if (playerData.hp <= 0) { gameOver(); return; } }
                    game.bullets.splice(i, 1);
                }
            }
        }

        // ----- Boss AI -----
        function updateBossAI() {
            const b = game.boss;
            if (!b || b.hp <= 0) return;
            const p = game.player;
            const dx = p.x + p.w / 2 - (b.x + b.w / 2);
            const dy = p.y + p.h / 2 - (b.y + b.h / 2);
            const d = Math.hypot(dx, dy);
            const timeScale = game.skillActive && game.skillType === 0 ? 0.5 : 1.0;
            const type = b.type || BOSS_TYPES[0];

            if (d > 120) { b.x += Math.sign(dx) * 0.5 * timeScale;
                b.y += Math.sign(dy) * 0.3 * timeScale; }
            b.x = Math.max(20, Math.min(game.mapWidth - b.w - 20, b.x));
            b.y = Math.max(50, Math.min(450, b.y));

            b.timer++;
            let fireRate = 35 - Math.floor((b.maxHp - b.hp) / 6);
            if (fireRate < 12) fireRate = 12;

            if (b.timer > fireRate / timeScale) {
                b.timer = 0;
                const angle = Math.atan2(dy, dx);
                const speed = (2.0 + (1 - b.hp / b.maxHp) * 2.0) * timeScale;

                switch (type.attackType) {
                    case 'spray':
                        for (let i = -3; i <= 3; i++) { const a = angle + i * 0.15;
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * speed, vy: Math
                                        .sin(a) * speed, r: 8, color: type.bulletColor || '#44ff44' }); }
                        break;
                    case 'scatter':
                        for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 + game.frame * 0.02;
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * speed * 0.8,
                                    vy: Math.sin(a) * speed * 0.8, r: 6, color: type.bulletColor || '#cc66ff' }); }
                        break;
                    case 'ring':
                        for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2 + game.frame * 0.015;
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * speed * 1.2,
                                    vy: Math.sin(a) * speed * 1.2, r: 7, color: type.bulletColor || '#ff6633' }); }
                        break;
                    case 'cone':
                        for (let i = -4; i <= 4; i++) { const a = angle + i * 0.12;
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * speed * 0.9,
                                    vy: Math.sin(a) * speed * 0.9, r: 5, color: type.bulletColor || '#66ddff' }); }
                        break;
                    case 'nova':
                    default:
                        for (let i = 0; i < 12; i++) { const a = (i / 12) * Math.PI * 2 + game.frame * 0.025;
                            b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * speed * 0.6,
                                    vy: Math.sin(a) * speed * 0.6, r: 4, color: type.bulletColor || '#aa44ff' }); }
                        break;
                }

                if (b.hp < b.maxHp * 0.3) {
                    for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2 + game.frame * 0.03;
                        b.bullets.push({ x: b.x + b.w / 2, y: b.y + b.h / 2, vx: Math.cos(a) * speed * 0.5, vy: Math
                                    .sin(a) * speed * 0.5, r: 4, color: '#ffffff' }); }
                }
            }

            for (let i = b.bullets.length - 1; i >= 0; i--) {
                const bull = b.bullets[i];
                bull.x += bull.vx;
                bull.y += bull.vy;
                if (bull.x < -30 || bull.x > game.mapWidth + 30 || bull.y < -30 || bull.y > game.mapHeight + 30) { b
                            .bullets.splice(i, 1); continue; }
                if (dist(p.x + p.w / 2, p.y + p.h / 2, bull.x, bull.y) < bull.r + 12) {
                    if (p.invincible <= 0) { takeDamage(20);
                        b.bullets.splice(i, 1); if (playerData.hp <= 0) { gameOver(); return; } }
                }
            }
            if (b.hitCooldown > 0) b.hitCooldown--;
        }

        function bossDefeated() {
            const b = game.boss;
            spawnBlood(b.x + b.w / 2, b.y + b.h / 2, 80);
            spawnExplosion(b.x + b.w / 2, b.y + b.h / 2, '#ff8833', 50);
            game.screenShake = 25;
            playSound('death');
            addExp(b.expReward || 50);
            playerData.gems += (b.gemReward || 3);
            game.boss = null;
            game.isBoss = false;
            game.items.push({ type: 'heal', x: b.x + 20, y: b.y + 10, r: 12, value: 20 });
            game.items.push({ type: 'weapon', weaponIdx: Math.floor(Math.random() * WEAPONS.length), x: b.x + b.w - 30, y: b
                        .y + 10, r: 14 });
            bossHpBar.style.display = 'none';
            bossNameSpan.style.display = 'none';
            const bossName = b.type?.desc || 'Boss';
            showMessage(t('bossDefeated'), t('bossDefeatedSub', { name: bossName }) + `  💎+${b.gemReward || 3}`);
            setTimeout(() => { msgOverlay.classList.remove('show'); }, 1500);
            updateUI();
            updateSkillTreeUI();
        }

        function takeDamage(amount) {
            if (game.player.invincible > 0) return;
            playerData.hp -= amount;
            game.player.invincible = 30;
            game.screenShake = 8;
            playSound('damage');
            spawnBlood(game.player.x + game.player.w / 2, game.player.y + game.player.h / 2, 20);
            if (playerData.hp <= 0) { playerData.hp = 0;
                gameOver(); }
            updateUI();
        }

        function gameOver() {
            game.running = false;
            game.gameOver = true;
            playSound('death');
            showMessage(t('gameOver'), t('restart'));
        }

        function showMessage(title, sub = '') {
            msgText.innerHTML = `${title}<div id="msgSub">${sub}</div>`;
            msgOverlay.classList.add('show');
        }

        // ----- 绘制怪物 -----
        function drawMonster(e) {
            const flash = e.hitFlash > 0;
            const size = e.w;
            const cx = e.x + size / 2;
            const cy = e.y + size / 2;

            if (e.stealth && e.isStealthed) ctx.globalAlpha = 0.2;
            ctx.shadowColor = e.glow || '#ff4444';
            ctx.shadowBlur = 20;

            switch (e.type) {
                case 'slime':
                    ctx.fillStyle = flash ? '#88ff88' : (e.color || '#44aa44');
                    ctx.beginPath();
                    ctx.arc(cx, cy + 2, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 2, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 1, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 1, 2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'frost':
                    ctx.fillStyle = flash ? '#88ddff' : (e.color || '#44ccff');
                    ctx.beginPath();
                    ctx.roundRect(e.x + 2, e.y + 2, size - 4, size - 4, 6);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#004466';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#88ddff';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 3, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 3, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'assassin':
                    ctx.fillStyle = flash ? '#9966ff' : (e.color || '#6633cc');
                    ctx.globalAlpha = e.isStealthed ? 0.2 : 0.8;
                    ctx.beginPath();
                    ctx.arc(cx, cy, size / 2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ff0000';
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 2, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 2, 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    break;
                case 'imp':
                    ctx.fillStyle = flash ? '#ff8844' : (e.color || '#ff6622');
                    ctx.shadowBlur = 35;
                    ctx.shadowColor = '#ff4400';
                    ctx.beginPath();
                    ctx.arc(cx, cy + 2, size / 2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffff00';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ff4400';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 1, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 1, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'bomber':
                    ctx.fillStyle = flash ? '#aadd44' : (e.color || '#88cc33');
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = '#88cc33';
                    const swell = 1 + Math.sin(game.frame * 0.04) * 0.05;
                    ctx.beginPath();
                    ctx.arc(cx, cy, size / 2 * swell, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 3, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 2, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 6, cy - 2, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'crystal':
                    ctx.fillStyle = flash ? '#cc88ff' : (e.color || '#aa66ff');
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#aa66ff';
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - size / 2);
                    ctx.lineTo(cx + size / 2, cy);
                    ctx.lineTo(cx, cy + size / 2);
                    ctx.lineTo(cx - size / 2, cy);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#ffffff88';
                    ctx.beginPath();
                    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'skeleton':
                    ctx.fillStyle = flash ? '#eeddbb' : (e.color || '#ccbb88');
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ccbb88';
                    ctx.beginPath();
                    ctx.roundRect(e.x + 4, e.y + 6, size - 8, size - 12, 3);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#1a1a2e';
                    ctx.beginPath();
                    ctx.arc(cx - 4, cy - 6, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 4, cy - 6, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'wraith':
                    ctx.fillStyle = flash ? '#ffffff' : (e.color || '#ccccdd');
                    ctx.globalAlpha = 0.7 + Math.sin(game.frame * 0.03) * 0.15;
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#ffffff44';
                    ctx.beginPath();
                    ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 0.8;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#ff66ff';
                    ctx.fillStyle = '#ff66ff';
                    ctx.beginPath();
                    ctx.arc(cx - 5, cy - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(cx + 5, cy - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    break;
                default:
                    ctx.fillStyle = flash ? '#ff6666' : (e.color || '#2d1a1a');
                    ctx.beginPath();
                    ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
                    ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(e.x, e.y - 8, size, 4);
            ctx.fillStyle = e.hp > 0 ? '#44ff44' : '#ff4444';
            ctx.fillRect(e.x, e.y - 8, size * (e.hp / (e.maxHp || 1)), 4);
        }

        // ----- 绘制Boss -----
        function drawBoss(b, p) {
            const type = b.type || BOSS_TYPES[0];
            const flash = b.hitCooldown > 0;
            const pulse = 0.95 + Math.sin(game.frame * 0.05) * 0.05;

            ctx.shadowColor = type.glow || '#ff4444';
            ctx.shadowBlur = 60 * pulse;
            ctx.fillStyle = type.glow + '33';
            ctx.beginPath();
            ctx.arc(b.x + b.w / 2, b.y + b.h / 2, 60 * pulse, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 30;
            ctx.shadowColor = type.color || '#ff4444';
            ctx.fillStyle = flash ? '#ffffff' : type.color;
            ctx.beginPath();
            ctx.roundRect(b.x + 10, b.y + 10, b.w - 20, b.h - 10, 10);
            ctx.fill();
            ctx.fillStyle = '#ff0000';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(b.x + 20, b.y + 25, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(b.x + b.w - 20, b.y + 25, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            const dx = p.x + p.w / 2 - (b.x + 20);
            const dy = p.y + p.h / 2 - (b.y + 25);
            const d = Math.hypot(dx, dy);
            if (d > 0) {
                ctx.beginPath();
                ctx.arc(b.x + 20 + (dx / d) * 4, b.y + 25 + (dy / d) * 4, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(b.x + b.w - 20 + (dx / d) * 4, b.y + 25 + (dy / d) * 4, 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        // ----- 主绘制 -----
        function draw() {
            const w = game.world % 3;
            const theme = WORLDS[w] || WORLDS[0];
            const scary = theme.scary;

            ctx.clearRect(0, 0, W, H);

            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, theme.bg1);
            grad.addColorStop(1, theme.bg2);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            let offsetX = 0;
            if (game.mapWidth > W) {
                const p = game.player;
                offsetX = Math.max(0, Math.min(game.mapWidth - W, p.x - W * 0.4));
            }

            ctx.save();
            ctx.translate(-offsetX, 0);

            if (scary >= 1) {
                const fog = ctx.createRadialGradient(W / 2 + offsetX, H / 2, 30, W / 2 + offsetX, H / 2, 500);
                fog.addColorStop(0, 'rgba(0,0,0,0)');
                fog.addColorStop(1, 'rgba(0,0,0,0.4)');
                ctx.fillStyle = fog;
                ctx.fillRect(offsetX, 0, W, H);
            }

            for (const plat of game.platforms) {
                ctx.fillStyle = theme.plat;
                ctx.shadowColor = scary >= 2 ? '#ff333355' : 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.roundRect(plat.x, plat.y, plat.w, plat.h, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.07)';
                ctx.beginPath();
                ctx.roundRect(plat.x + 4, plat.y - 1, plat.w - 8, 3, 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            const ex = game.exit.x,
                ey = game.exit.y;
            const canEnter = game.keysCollected >= game.totalKeys;
            ctx.shadowColor = canEnter ? '#6bcbff' : '#445566';
            ctx.shadowBlur = 40;
            ctx.fillStyle = canEnter ? 'rgba(100,200,255,0.3)' : 'rgba(50,50,80,0.2)';
            ctx.beginPath();
            ctx.arc(ex + 15, ey + 19, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = canEnter ? 35 : 10;
            ctx.fillStyle = canEnter ? '#4a8ab5' : '#3a3a5a';
            ctx.beginPath();
            ctx.roundRect(ex, ey, game.exit.w, game.exit.h, 6);
            ctx.fill();
            if (canEnter) {
                ctx.shadowBlur = 60;
                ctx.fillStyle = `rgba(100,220,255,${0.3 + Math.sin(game.frame*0.05)*0.2})`;
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 19, 12 + Math.sin(game.frame * 0.04) * 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 70;
                ctx.beginPath();
                ctx.arc(ex + 15, ey + 19, 5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#665555';
                ctx.shadowBlur = 5;
                ctx.font = '22px sans-serif';
                ctx.fillText('🔒', ex + 4, ey + 30);
            }
            ctx.shadowBlur = 0;

            for (const key of game.keys) {
                if (key.collected) continue;
                const bob = Math.sin(game.frame * 0.04 + key.x) * 3;
                ctx.shadowColor = '#f7d44a';
                ctx.shadowBlur = 30;
                ctx.fillStyle = '#f7d44a';
                ctx.beginPath();
                ctx.arc(key.x, key.y + bob, key.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffdd77';
                ctx.beginPath();
                ctx.arc(key.x - 3, key.y - 3 + bob, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff9e6';
                ctx.beginPath();
                ctx.arc(key.x + 2, key.y - 5 + bob, 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            for (const item of game.items) {
                if (item.type === 'heal') {
                    const bob = Math.sin(game.frame * 0.04 + item.x) * 3;
                    ctx.shadowColor = '#44ff88';
                    ctx.shadowBlur = 30;
                    ctx.fillStyle = '#44ff88';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bob, item.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '18px sans-serif';
                    ctx.fillText('💚', item.x - 8, item.y + bob + 7);
                } else if (item.type === 'weapon') {
                    const bob = Math.sin(game.frame * 0.05 + item.x * 1.2) * 4;
                    ctx.shadowColor = '#ffaa44';
                    ctx.shadowBlur = 35;
                    ctx.fillStyle = '#ffaa44';
                    ctx.beginPath();
                    ctx.arc(item.x, item.y + bob, item.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff';
                    ctx.font = '16px sans-serif';
                    ctx.fillText(WEAPONS[item.weaponIdx]?.icon || '⚔', item.x - 7, item.y + bob + 6);
                }
            }
            ctx.shadowBlur = 0;

            for (const e of game.enemies) {
                if (e.y > game.mapHeight + 50) continue;
                drawMonster(e);
            }
            ctx.shadowBlur = 0;

            if (game.isBoss && game.boss && game.boss.hp > 0) {
                drawBoss(game.boss, game.player);
                if (game.boss.hp < game.boss.maxHp * 0.3 && Math.floor(game.frame / 8) % 2 === 0) {
                    ctx.fillStyle = 'rgba(255,0,0,0.1)';
                    ctx.fillRect(offsetX, 0, W, H);
                }
            }

            for (const bull of game.bullets) {
                if (bull.isEnemy) {
                    ctx.shadowColor = '#ff4444';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#ff4444';
                    ctx.beginPath();
                    ctx.arc(bull.x, bull.y, bull.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    continue;
                }
                ctx.shadowColor = bull.color || '#6bcbff';
                ctx.shadowBlur = 30;
                ctx.fillStyle = bull.color || '#6bcbff';
                ctx.beginPath();
                ctx.arc(bull.x, bull.y, bull.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(bull.x - 2, bull.y - 2, bull.r * 0.3, 0, Math.PI * 2);
                ctx.fill();
                if (bull.type === 'pierce') {
                    ctx.shadowBlur = 20;
                    ctx.strokeStyle = '#ff66ff66';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(bull.x, bull.y, bull.r + 4, 0, Math.PI * 2);
                    ctx.stroke();
                }
                if (bull.type === 'explode') {
                    ctx.shadowBlur = 40;
                    ctx.fillStyle = '#ff883344';
                    ctx.beginPath();
                    ctx.arc(bull.x, bull.y, bull.r + 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.shadowBlur = 0;

            // ---- 绘制对方玩家 ----
            if (isConnected && game.otherPlayer) {
                const op = game.otherPlayer;
                if (op.alive !== false) {
                    ctx.globalAlpha = 0.85;
                    ctx.shadowColor = '#ff66ff';
                    ctx.shadowBlur = 20;
                    ctx.fillStyle = '#ff44aa';
                    ctx.beginPath();
                    ctx.roundRect(op.x, op.y, 24, 30, 5);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.font = '10px sans-serif';
                    ctx.fillText('👤 队友', op.x, op.y - 6);
                    ctx.globalAlpha = 1;
                    if (op.hp !== undefined) {
                        ctx.fillStyle = 'rgba(0,0,0,0.6)';
                        ctx.fillRect(op.x, op.y - 10, 24, 4);
                        ctx.fillStyle = '#ff4444';
                        ctx.fillRect(op.x, op.y - 10, 24 * Math.max(0, op.hp / (op.maxHp || 100)), 4);
                    }
                    if (op.weapon !== undefined && WEAPONS[op.weapon]) {
                        ctx.font = '12px sans-serif';
                        ctx.fillStyle = '#fff';
                        ctx.fillText(WEAPONS[op.weapon].icon, op.x + 6, op.y + 20);
                    }
                }
            }

            // ---- 绘制自己 ----
            const p = game.player;
            for (const t of p.trail) {
                ctx.globalAlpha = t.life / 20 * 0.2;
                ctx.fillStyle = '#3498db';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.roundRect(t.x, t.y, p.w, p.h, 4);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            if (p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0) ctx.globalAlpha = 0.5;
            const capeWave = Math.sin(game.frame * 0.06) * 3;
            ctx.shadowColor = '#6bcbff';
            ctx.shadowBlur = 15;
            const capeColor = ['#2ecc71', '#8e44ad', '#ff3333'][game.world % 3] || '#2ecc71';
            ctx.fillStyle = capeColor;
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(p.x + p.w, p.y + 6);
            ctx.quadraticCurveTo(p.x + p.w + 12 + capeWave, p.y + 16, p.x + p.w - 2 + capeWave * 0.5, p.y + 26);
            ctx.quadraticCurveTo(p.x + p.w - 6 + capeWave * 0.3, p.y + 20, p.x + p.w, p.y + 14);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;

            ctx.shadowColor = '#6bcbff';
            ctx.shadowBlur = 25;
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, p.h, 5);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#5dade2';
            ctx.beginPath();
            ctx.roundRect(p.x + 3, p.y + 4, 5, 12, 3);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(p.x + 16, p.y + 4, 5, 12, 3);
            ctx.fill();
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(p.x + 2, p.y + 20, p.w - 4, 3);

            ctx.fillStyle = '#5dade2';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(p.x + p.w / 2, p.y - 2, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(p.x + 7, p.y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + 17, p.y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(100,200,255,0.4)';
            ctx.beginPath();
            ctx.arc(p.x + 6, p.y - 6, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + 16, p.y - 6, 3, 0, Math.PI * 2);
            ctx.fill();
            const mx = game._mouseX || 0;
            const my = game._mouseY || 0;
            const eyeDx = mx + offsetX - (p.x + p.w / 2);
            const eyeDy = my - (p.y + p.h / 2);
            const eyeDist = Math.hypot(eyeDx, eyeDy);
            if (eyeDist > 0) {
                const offsetX2 = (eyeDx / eyeDist) * 2;
                const offsetY2 = (eyeDy / eyeDist) * 2;
                ctx.fillStyle = '#44ff88';
                ctx.beginPath();
                ctx.arc(p.x + 7 + offsetX2, p.y - 4 + offsetY2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + 17 + offsetX2, p.y - 4 + offsetY2, 2.5, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#44ff88';
                ctx.beginPath();
                ctx.arc(p.x + 7, p.y - 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(p.x + 17, p.y - 4, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;

            for (const pt of game.particles) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = pt.color;
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life / pt.maxLife;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size * (pt.life / pt.maxLife), 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            ctx.restore();

            if (game.screenShake > 0) {
                const shake = game.screenShake * 0.5;
                ctx.save();
                ctx.translate((Math.random() - 0.5) * shake * 2, (Math.random() - 0.5) * shake * 2);
                game.screenShake *= 0.9;
                if (game.screenShake < 0.1) game.screenShake = 0;
                ctx.restore();
            }

            ctx.fillStyle = 'rgba(255,255,255,0.08)';
            ctx.font = '14px sans-serif';
            const expPct = Math.floor((playerData.exp / playerData.expToNext) * 100);
            const mapInfo = game.mapWidth > W ? ` 🌍 ${Math.floor(game.mapWidth/W*100)}%` : '';
            const terrainNames = ['塔楼', '峡谷', '浮岛', '洞穴', '桥梁', '阶梯'];
            const statusText = isConnected ? '🟢 联机' : '🔴 单机';
            ctx.fillText(`🗡️ ${game.totalKills}杀  |  EXP ${playerData.exp}/${playerData.expToNext} (${expPct}%)  |  ${terrainNames[game.terrainType] || ''}${mapInfo}  🪙${playerData.gold} 💎${playerData.gems}  ${statusText}`, 14, 28);
            if (playerData.hp < 30) {
                ctx.fillStyle = 'rgba(255,0,0,0.12)';
                ctx.fillRect(0, 0, W, H);
            }
            if (game.isBoss && game.boss && game.boss.hp > 0 && game.bossType) {
                ctx.fillStyle = '#ff444466';
                ctx.font = '18px sans-serif';
                ctx.fillText(`👹 ${game.bossType.desc}  Lv.${game.level+1}`, W / 2 - 80, 30);
            }
        }

        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
            if (r > w / 2) r = w / 2;
            if (r > h / 2) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;
        }

        function createRoom() {
            if (peer) { peer.destroy();
                peer = null; }
            isHost = true;
            roomCode = generateRoomCode();
            peer = new Peer(roomCode);
            peer.on('open', () => {
                document.getElementById('roomDisplay').textContent = '🏠 ' + roomCode;
                document.getElementById('roomDisplay').style.display = 'inline';
                document.getElementById('peerStatus').textContent = t('peerWaiting');
                document.getElementById('peerStatus').style.color = '#f7d44a';
                showMessage('🎮 房间已创建', '🏠 房间: ' + roomCode + '\n' + t('enterCode'));
                document.getElementById('roomInput').style.display = 'inline-block';
            });
            peer.on('connection', (incomingConn) => {
                conn = incomingConn;
                setupConnection();
                document.getElementById('peerStatus').textContent = t('peerConnected');
                document.getElementById('peerStatus').style.color = '#44ff88';
                msgOverlay.classList.remove('show');
                isConnected = true;
                sendFullSync();
            });
            peer.on('error', (err) => {
                console.log('Peer错误:', err);
                showMessage(t('createFailed'), t('roomExists'));
                document.getElementById('peerStatus').textContent = t('peerOffline');
                document.getElementById('peerStatus').style.color = '#8899aa';
            });
        }

        function joinRoom() {
            const code = document.getElementById('roomInput').value.toUpperCase().trim();
            if (code.length !== 6) {
                showMessage(t('invalidCode'), t('enterCode'));
                setTimeout(() => msgOverlay.classList.remove('show'), 1200);
                return;
            }
            if (peer) { peer.destroy();
                peer = null; }
            isHost = false;
            roomCode = code;
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(roomCode);
                setupConnection();
                document.getElementById('peerStatus').textContent = t('peerConnecting');
                document.getElementById('peerStatus').style.color = '#f7d44a';
            });
            peer.on('error', (err) => {
                console.log('加入错误:', err);
                showMessage(t('joinFailed'), t('roomExists'));
                document.getElementById('peerStatus').textContent = t('peerOffline');
                document.getElementById('peerStatus').style.color = '#8899aa';
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                isConnected = true;
                document.getElementById('peerStatus').textContent = t('peerConnected');
                document.getElementById('peerStatus').style.color = '#44ff88';
                msgOverlay.classList.remove('show');
                if (!isHost) {
                    conn.send({ type: 'requestSync' });
                }
            });
            conn.on('data', (data) => {
                receiveSyncData(data);
            });
            conn.on('close', () => {
                isConnected = false;
                document.getElementById('peerStatus').textContent = t('peerDisconnected');
                document.getElementById('peerStatus').style.color = '#8899aa';
                showMessage(t('disconnected'), t('opponentLeft'));
            });
        }
