<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <title>👻 暗影勇者 · 特色怪物</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
            overflow: hidden;
            touch-action: none;
        }
        #wrapper {
            background: #141425;
            padding: 20px;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            position: relative;
            max-width: 100vw;
            max-height: 100vh;
            max-height: 100dvh;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 16px;
            background: #1a1a30;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.7);
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: auto;
            max-width: 800px;
            max-height: 550px;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            color: #ccc;
            font-weight: bold;
            font-size: 17px;
            padding: 0 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        #uiLeft {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
        }
        .label {
            color: #667799;
            font-weight: normal;
        }
        #hpDisplay {
            color: #ff6b6b;
            font-size: 22px;
            text-shadow: 0 0 25px #ff6b6b55;
        }
        #worldDisplay {
            color: #6bcbff;
            font-size: 20px;
            text-shadow: 0 0 25px #6bcbff55;
        }
        #keyDisplay {
            color: #f7d44a;
            font-size: 20px;
        }
        #jumpDisplay {
            color: #9b6bff;
            font-size: 20px;
            text-shadow: 0 0 25px #9b6bff55;
        }
        #weaponDisplay {
            color: #ffaa44;
            font-size: 18px;
            cursor: pointer;
            transition: .2s;
            padding: 2px 8px;
            border-radius: 8px;
        }
        #weaponDisplay:hover {
            background: rgba(255, 170, 68, 0.15);
        }
        #skillDisplay {
            color: #44ff88;
            font-size: 16px;
            background: #0a1a12;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #44ff8866;
            cursor: pointer;
        }
        #skillDisplay:hover {
            background: #1a2a22;
        }
        #goldDisplay {
            color: #ffaa00;
            font-size: 18px;
            text-shadow: 0 0 20px #ffaa0055;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 8px;
        }
        #goldDisplay:hover {
            background: rgba(255, 170, 0, 0.15);
        }
        #gemDisplay {
            color: #cc44ff;
            font-size: 18px;
            text-shadow: 0 0 20px #cc44ff55;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 8px;
        }
        #gemDisplay:hover {
            background: rgba(204, 68, 255, 0.15);
        }
        #levelDisplay {
            color: #f7d44a;
            font-size: 20px;
            text-shadow: 0 0 25px #f7d44a55;
        }
        #bossNameDisplay {
            color: #ff4444;
            font-size: 18px;
            text-shadow: 0 0 30px #ff444466;
            display: none;
        }
        #bossHpBar {
            color: #ff3333;
            font-size: 18px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        #bossHpBar .bar {
            width: 180px;
            height: 14px;
            background: #2a1a1a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #663333;
        }
        #bossHpBar .fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff3333, #ff8833);
            border-radius: 10px;
            transition: width .15s;
        }
        .btn {
            background: #2a1a3a;
            color: #ffaa44;
            border: 2px solid #ffaa44;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        .btn:hover {
            background: #3a2a4a;
        }
        .btn.active {
            border-color: #44ff88;
            color: #44ff88;
        }
        .btn-stat {
            background: #1a2a3a;
            color: #6bcbff;
            border: 2px solid #6bcbff;
            border-radius: 30px;
            padding: 4px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        .btn-stat:hover {
            background: #2a3a4a;
        }
        #hint {
            color: #445566;
            font-size: 13px;
            background: #0e0e1e;
            padding: 6px 18px;
            border-radius: 30px;
            text-align: right;
        }
        #msgOverlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            height: calc(100% - 80px);
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 16px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            z-index: 10;
        }
        #msgOverlay.show {
            display: flex;
        }
        #msgText {
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 80px #ff000066;
            animation: pop .5s ease;
            text-align: center;
            line-height: 1.4;
            padding: 20px;
        }
        #msgSub {
            font-size: 20px;
            color: #ff6666;
            margin-top: 10px;
            font-weight: normal;
            text-shadow: 0 0 40px #ff000044;
        }
        @keyframes pop {
            0% {
                transform: scale(.2) rotate(-10deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }
        #statPanel {
            position: absolute;
            top: 80px;
            right: 20px;
            background: #0a0a1aee;
            border: 2px solid #6bcbff;
            border-radius: 16px;
            padding: 20px 24px;
            color: #fff;
            z-index: 20;
            display: none;
            min-width: 240px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 60px #6bcbff33;
            font-size: 14px;
        }
        #statPanel h3 {
            text-align: center;
            color: #f7d44a;
            margin-bottom: 12px;
            font-size: 20px;
        }
        #statPanel .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            border-bottom: 1px solid #33445544;
        }
        #statPanel .stat-row .stat-name {
            color: #aabbdd;
        }
        #statPanel .stat-row .stat-val {
            color: #fff;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }
        #statPanel .stat-row button {
            background: #2a3a5a;
            color: #6bcbff;
            border: 1px solid #6bcbff;
            border-radius: 30px;
            padding: 0 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        #statPanel .stat-row button:hover {
            background: #3a4a6a;
        }
        #statPanel .stat-row button:disabled {
            opacity: .3;
            cursor: not-allowed;
        }
        #statPanel .points-remaining {
            text-align: center;
            color: #44ff88;
            font-size: 18px;
            margin: 10px 0 8px;
            padding: 6px;
            background: #0a1a12;
            border-radius: 10px;
            border: 1px solid #44ff8844;
        }
        #statPanel .close-btn {
            display: block;
            margin: 10px auto 0;
            background: #3a1a1a;
            color: #ff6666;
            border: 1px solid #ff6666;
            border-radius: 30px;
            padding: 4px 24px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        #statPanel .close-btn:hover {
            background: #4a2a2a;
        }
        #shopPanel {
            position: absolute;
            top: 80px;
            right: 20px;
            background: #0a0a1aee;
            border: 2px solid #ffaa44;
            border-radius: 16px;
            padding: 20px 24px;
            color: #fff;
            z-index: 22;
            display: none;
            min-width: 260px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 60px #ffaa4433;
            font-size: 14px;
        }
        #shopPanel h3 {
            text-align: center;
            color: #f7d44a;
            margin-bottom: 12px;
            font-size: 18px;
        }
        #shopPanel .shop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid #33445544;
        }
        #shopPanel .shop-row .shop-name {
            color: #aabbdd;
            flex: 1;
        }
        #shopPanel .shop-row .shop-cost {
            color: #ffaa00;
            font-weight: bold;
            margin: 0 8px;
            min-width: 50px;
            text-align: right;
        }
        #shopPanel .shop-row .shop-gemcost {
            color: #cc44ff;
            font-weight: bold;
            margin: 0 8px;
            min-width: 50px;
            text-align: right;
        }
        #shopPanel .shop-row button {
            background: #2a3a5a;
            color: #6bcbff;
            border: 1px solid #6bcbff;
            border-radius: 30px;
            padding: 0 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: .2s;
            touch-action: manipulation;
        }
        #shopPanel .shop-row button:hover {
            background: #3a4a6a;
        }
        #shopPanel .shop-row button:disabled {
            opacity: .3;
            cursor: not-allowed;
        }
        #shopPanel .shop-row .owned {
            color: #44ff88;
            font-size: 12px;
        }
        #shopPanel .close-btn {
            display: block;
            margin: 10px auto 0;
            background: #3a1a1a;
            color: #ff6666;
            border: 1px solid #ff6666;
            border-radius: 30px;
            padding: 4px 24px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        #shopPanel .close-btn:hover {
            background: #4a2a2a;
        }
        #wrapper {
            position: relative;
        }
        #levelUpMsg {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #f7d44a;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 40px #f7d44a88;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            transition: opacity .3s;
        }
        #levelUpMsg.show {
            opacity: 1;
        }
        #mobileControls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            height: calc(100% - 80px);
            pointer-events: none;
            z-index: 5;
            display: none;
        }
        #mobileControls.active {
            display: block;
        }
        .ctrl-zone {
            position: absolute;
            pointer-events: auto;
            touch-action: none;
        }
        #joystickZone {
            left: 20px;
            bottom: 30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
            border: 2px solid rgba(255, 255, 255, .15);
        }
        #joystickKnob {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(100, 200, 255, .4);
            border: 2px solid rgba(100, 200, 255, .6);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #shootZone {
            right: 20px;
            bottom: 30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 100, 100, .15);
            border: 2px solid rgba(255, 100, 100, .3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, .4);
            font-size: 14px;
            font-weight: bold;
            pointer-events: auto;
        }
        #jumpBtn {
            position: absolute;
            left: 180px;
            bottom: 40px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(155, 107, 255, .25);
            border: 2px solid rgba(155, 107, 255, .4);
            color: rgba(255, 255, 255, .5);
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }
        #mobileWeaponBtn {
            position: absolute;
            right: 170px;
            bottom: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 170, 68, .2);
            border: 2px solid rgba(255, 170, 68, .3);
            color: rgba(255, 255, 255, .4);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }
        #mobileSkillBtn {
            position: absolute;
            right: 170px;
            bottom: 95px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(68, 255, 136, .2);
            border: 2px solid rgba(68, 255, 136, .3);
            color: rgba(255, 255, 255, .4);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: manipulation;
        }

        @media(orientation:portrait) and (max-width:500px) {
            #wrapper {
                padding: 6px;
                border-radius: 14px;
            }
            canvas {
                max-width: 96vw;
                max-height: 48vh;
                border-radius: 10px;
            }
            #ui {
                font-size: 11px;
                margin-top: 6px;
                padding: 0 4px;
                gap: 3px;
            }
            #uiLeft {
                gap: 6px;
            }
            #hpDisplay {
                font-size: 16px;
            }
            #worldDisplay {
                font-size: 14px;
            }
            #keyDisplay,
            #jumpDisplay,
            #goldDisplay,
            #gemDisplay {
                font-size: 13px;
            }
            #weaponDisplay,
            #bossHpBar {
                font-size: 12px;
            }
            #skillDisplay {
                font-size: 11px;
                padding: 1px 8px;
            }
            #levelDisplay {
                font-size: 14px;
            }
            #hint {
                font-size: 9px;
                padding: 3px 8px;
                display: none;
            }
            #msgText {
                font-size: 22px;
            }
            #msgSub {
                font-size: 13px;
            }
            #bossHpBar .bar {
                width: 60px;
            }
            #statPanel {
                top: 40px;
                right: 8px;
                padding: 10px 14px;
                min-width: 160px;
                font-size: 11px;
            }
            #shopPanel {
                top: 40px;
                right: 8px;
                padding: 10px 14px;
                min-width: 180px;
                font-size: 11px;
            }
            #levelUpMsg {
                font-size: 16px;
                top: 10px;
                left: 10px;
            }
            #mobileControls.active {
                display: block !important;
            }
            #joystickZone {
                left: 8px;
                bottom: 12px;
                width: 110px;
                height: 110px;
            }
            #joystickKnob {
                width: 38px;
                height: 38px;
            }
            #shootZone {
                right: 8px;
                bottom: 12px;
                width: 90px;
                height: 90px;
                font-size: 11px;
            }
            #jumpBtn {
                left: 130px;
                bottom: 18px;
                width: 55px;
                height: 55px;
                font-size: 13px;
            }
            #mobileWeaponBtn {
                right: 120px;
                bottom: 12px;
                width: 40px;
                height: 40px;
                font-size: 14px;
            }
            #mobileSkillBtn {
                right: 120px;
                bottom: 60px;
                width: 40px;
                height: 40px;
                font-size: 13px;
            }
            .btn,
            .btn-stat {
                font-size: 10px;
                padding: 2px 10px;
            }
            .mp-btn {
                font-size: 11px;
                padding: 6px 12px;
            }
        }
        @media(orientation:landscape) and (max-height:500px) {
            #wrapper {
                padding: 4px;
                border-radius: 12px;
            }
            canvas {
                max-width: 70vw;
                max-height: 85vh;
                border-radius: 8px;
            }
            #ui {
                font-size: 12px;
                margin-top: 4px;
                padding: 0 6px;
                gap: 4px;
            }
            #uiLeft {
                gap: 8px;
            }
            #hint {
                font-size: 9px;
                display: none;
            }
            #mobileControls.active {
                display: block !important;
            }
            #joystickZone {
                left: 6px;
                bottom: 6px;
                width: 100px;
                height: 100px;
            }
            #shootZone {
                right: 6px;
                bottom: 6px;
                width: 80px;
                height: 80px;
                font-size: 10px;
            }
            #jumpBtn {
                left: 120px;
                bottom: 10px;
                width: 50px;
                height: 50px;
                font-size: 12px;
            }
        }
        @media(max-width:760px) {
            #wrapper {
                padding: 10px;
            }
            #ui {
                font-size: 13px;
            }
            #hint {
                font-size: 10px;
                padding: 4px 10px;
                display: none;
            }
            #msgText {
                font-size: 28px;
            }
            #msgSub {
                font-size: 16px;
            }
            #uiLeft {
                gap: 10px;
            }
            #bossHpBar .bar {
                width: 80px;
            }
            #statPanel {
                top: 60px;
                right: 10px;
                padding: 14px 16px;
                min-width: 180px;
                font-size: 12px;
            }
            #levelUpMsg {
                font-size: 20px;
                top: 20px;
                left: 20px;
            }
            #mobileControls.active {
                display: block !important;
            }
            .btn,
            .btn-stat {
                font-size: 12px;
                padding: 3px 12px;
            }
        }
        @media(pointer:coarse) {
            #mobileControls.active {
                display: block !important;
            }
            #hint {
                display: none;
            }
        }
        @media(pointer:fine) {
            #mobileControls.active {
                display: none !important;
            }
        }
        #mpControls {
            position: fixed;
            right: 16px;
            bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 40;
        }
        #mpStatus {
            position: fixed;
            right: 16px;
            bottom: 16px;
            background: #14142bee;
            border: 2px solid #ffaa44;
            border-radius: 16px;
            padding: 12px 16px;
            color: #fff;
            z-index: 40;
            min-width: 190px;
            box-shadow: 0 0 40px #ffaa4433;
            backdrop-filter: blur(8px);
            display: none;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
        }
        .mp-status-row {
            color: #ccc;
        }
        .mp-status-row b {
            color: #f7d44a;
            font-size: 17px;
            letter-spacing: 2px;
        }
        .mp-score {
            color: #ff8833;
            font-weight: bold;
        }
        .mp-btn {
            background: #2a1a3a;
            color: #ffaa44;
            border: 2px solid #ffaa44;
            border-radius: 30px;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: .2s;
            touch-action: manipulation;
        }
        .mp-btn:hover {
            background: #3a2a4a;
        }
        .mp-btn.mp-primary {
            background: #1a2a3a;
            color: #6bcbff;
            border-color: #6bcbff;
        }
        .mp-btn.mp-primary:hover {
            background: #2a3a4a;
        }
        .mp-btn.mp-leave {
            background: #3a1a1a;
            color: #ff6666;
            border-color: #ff6666;
        }
        .mp-btn.mp-leave:hover {
            background: #4a2a2a;
        }
        .mp-btn.mp-close {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 20px;
        }
        .mp-modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .75);
            z-index: 50;
            backdrop-filter: blur(6px);
        }
        .mp-modal.show {
            display: flex;
        }
        .mp-modal-box {
            background: #141425;
            border: 2px solid #6bcbff;
            border-radius: 20px;
            padding: 28px;
            min-width: 300px;
            max-width: 90vw;
            color: #fff;
            text-align: center;
            position: relative;
            box-shadow: 0 0 60px #6bcbff33;
        }
        .mp-modal-box h3 {
            color: #f7d44a;
            margin-bottom: 16px;
            font-size: 20px;
        }
        .mp-modal-label {
            color: #aabbdd;
            margin: 10px 0 6px;
            font-size: 14px;
        }
        .mp-radio {
            display: block;
            padding: 10px;
            margin: 6px 0;
            background: #1a1a30;
            border: 1px solid #334455;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
        }
        .mp-radio:has(input:checked) {
            border-color: #44ff88;
            color: #44ff88;
        }
        .mp-code-big {
            font-size: 40px;
            font-weight: bold;
            color: #f7d44a;
            letter-spacing: 8px;
            background: #0a0a1a;
            padding: 12px;
            border-radius: 14px;

                game.levelComplete = false; if (MP.enabled && MP.isHost) { resetPlayersForLevel(); try { MP.conn
                        .send({ type: 'level', state: buildState(), title, sub }); } catch (e2) {} } updateUI(); },
                1200); }

        function handleExitCollision(p) { if (!game.running || game.levelComplete) return; if (game.keysCollected < game
                .totalKeys) return; if (!rectCollide(p, game.exit)) return;
            advanceLevelHost(); }

        function resetPlayersForLevel() { const p = game.player;
            p.x = 40;
            p.y = 400;
            p.vx = 0;
            p.vy = 0;
            p.onGround = false;
            p.jumpCount = 0;
            p.invincible = 0;
            p.dead = false;
            game.hp = p.maxHp; if (game.player2) { const g = game.player2;
                g.x = 60;
                g.y = 400;
                g.vx = 0;
                g.vy = 0;
                g.onGround = false;
                g.jumpCount = 0;
                g.invincible = 0;
                g.dead = false;
                g.hp = g.maxHp; }
            MP.guestRespawn = 0; }

        function drawRemotePlayer(p, bodyColor, glowColor) { if (!p || p.dead) return; const blink = p.invincible > 0 && Math
                .floor(p.invincible / 4) % 2 === 0; const prevAlpha = ctx.globalAlpha; if (blink) ctx.globalAlpha = 0.5; const
                capeWave = Math.sin(game.frame * 0.06) * 3;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 15;
            ctx.fillStyle = bodyColor;
            ctx.globalAlpha = (blink ? 0.5 : 1) * 0.6;
            ctx.beginPath();
            ctx.moveTo(p.x + p.w, p.y + 6);
            ctx.quadraticCurveTo(p.x + p.w + 12 + capeWave, p.y + 16, p.x + p.w - 2 + capeWave * 0.5, p.y + 26);
            ctx.quadraticCurveTo(p.x + p.w - 6 + capeWave * 0.3, p.y + 20, p.x + p.w, p.y + 14);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = blink ? 0.5 : 1;
            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 25;
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, p.h, 5);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffddaa';
            ctx.beginPath();
            ctx.roundRect(p.x + 3, p.y + 4, 5, 12, 3);
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(p.x + 16, p.y + 4, 5, 12, 3);
            ctx.fill();
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(p.x + 2, p.y + 20, p.w - 4, 3);
            ctx.fillStyle = bodyColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = glowColor;
            ctx.beginPath();
            ctx.arc(p.x + p.w / 2, p.y - 2, 15, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(p.x + 7, p.y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + 17, p.y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffcc44';
            ctx.beginPath();
            ctx.arc(p.x + 6, p.y - 6, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(p.x + 16, p.y - 6, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(MP.isHost ? (currentLang === 'zh' ? '🤝 队友' : '🤝 Teammate') : (currentLang === 'zh' ?
                '👑 房主' : '👑 Host'), p.x + p.w / 2, p.y - 30);
            ctx.textAlign = 'left'; const bw = 36;
            ctx.fillStyle = 'rgba(0,0,0,0.65)';
            ctx.fillRect(p.x + p.w / 2 - bw / 2, p.y - 38, bw, 4);
            ctx.fillStyle = (p.hp || 0) > (p.maxHp || 1) * 0.3 ? '#44ff88' : '#ff4444';
            ctx.fillRect(p.x + p.w / 2 - bw / 2, p.y - 38, bw * Math.max(0, (p.hp || 0) / (p.maxHp || 1)), 4);
            ctx.globalAlpha = prevAlpha; }

        function guestLeft() { if (MP.conn) { try { MP.conn.close(); } catch (e2) {} }
            MP.conn = null;
            MP.connected = false;
            game.player2 = null;
            updateMPStatusUI();
            mpToast(t('mpLeft')); }

        function hostLeft() { mpToast(t('mpHostLeft')); if (MP.conn) { try { MP.conn.close(); } catch (e2) {} } if (MP.peer) { try {
                    MP.peer.destroy(); } catch (e2) {} }
            MP.conn = null;
            MP.peer = null;
            MP.connected = false;
            MP.enabled = false;
            MP.isHost = false;
            MP.hostPlayer = null;
            game.player2 = null;
            MP.hostScore = 0;
            MP.guestScore = 0;
            updateMPStatusUI();
            initGame(); }

        function leaveRoom() { const wasHost = MP.isHost; if (MP.conn) { try { MP.conn.close(); } catch (e2) {} } if (MP.peer) { try {
                    MP.peer.destroy(); } catch (e2) {} }
            MP.conn = null;
            MP.peer = null;
            MP.connected = false;
            MP.enabled = false;
            MP.isHost = false;
            MP.hostPlayer = null;
            game.player2 = null;
            MP.hostScore = 0;
            MP.guestScore = 0;
            clearTimeout(MP.joinTimeout); if (!wasHost) { initGame(); }
            updateMPStatusUI();
            closeMpModal();
            mpToast(wasHost ? t('mpRoomClosed') : t('mpLeftRoom')); }

        function updateMPStatusUI() { const controls = document.getElementById('mpControls'); const status = document
                .getElementById('mpStatus'); const infBtn = document.getElementById('infiniteToggle'); const stBtn = document
                .getElementById('statBtn'); if (MP.enabled) { controls.style.display = 'none';
                status.style.display = 'flex';
                document.getElementById('mpCodeDisplay').textContent = MP.roomCode || '------';
                document.getElementById('mpModeDisplay').textContent = MP.mode === 'pvp' ? (currentLang === 'zh' ?
                    '⚔️ PVP 对战' : '⚔️ PVP Battle') : (currentLang === 'zh' ? '🤝 合作闯关' : '🤝 Co-op'); const connEl = document
                    .getElementById('mpConnDisplay'); if (MP.isHost) { connEl.textContent = MP.connected ? t('mpConnOk') :
                        t('mpConnWait'); } else { connEl.textContent = MP.connected ? t('mpConnGuest') : t('mpConnGuestWait'); } const
                    scoreEl = document.getElementById('mpScoreDisplay'); if (MP.mode === 'pvp') { scoreEl.style.display =
                        'block'; if (MP.isHost) { scoreEl.textContent = t('mpPVPScore', { h: MP.hostScore,
                            g: MP.guestScore }); } else { scoreEl.textContent = t('mpPVPScoreGuest', { g: MP
                            .guestScore, h: MP.hostScore }); } } else { scoreEl.style.display = 'none'; } if (infBtn)
                    infBtn.disabled = true; if (stBtn) stBtn.disabled = MP.isHost ? false : true; } else { controls.style
                    .display = 'flex';
                status.style.display = 'none'; if (infBtn) infBtn.disabled = false; if (stBtn) stBtn.disabled = false; } }

        function gameLoop() { if (levelUpTimer > 0) { levelUpTimer--; if (levelUpTimer < 30) levelUpMsg.style.opacity =
                    levelUpTimer / 30; if (levelUpTimer <= 0) levelUpMsg.classList.remove('show'); } if (MP.enabled) { if (MP
                    .isHost) { if (game.running && !game.gameOver && !game.levelComplete) { game.frame++; if (!game.player
                            .dead) updatePlayer(); if (game.player2 && !game.player2.dead) updatePlayerRemote(game.player2,
                            MP.guestCtrl);
                        updatePVP();
                        updateHostRespawns(); if (game.particles.length > 500) game.particles.splice(0, 150);
                        MP.snapTimer++; if (MP.snapTimer >= 2) { MP.snapTimer = 0;
                            sendSnapshot(); }
                        MP.pingTimer++; if (MP.pingTimer >= 120) { MP.pingTimer = 0; try { MP.conn.send({ type:
                                    'ping' }); } catch (e2) {} } if (MP.connected && game.frame - MP.lastPong >
                            420) { const connEl = document.getElementById('mpConnDisplay'); if (connEl && !connEl
                                .textContent.includes('⚠️')) connEl.textContent = t('mpConnBad'); } }
                    draw(); } else { game.frame++;
                    sendGuestInput();
                    updateGuestLocal(); if (MP.gotFirstState && game.frame - MP.lastState > 420) { const connEl =
                            document.getElementById('mpConnDisplay'); if (connEl && !connEl.textContent.includes(
                            '⚠️')) connEl.textContent = t('mpSyncBad'); }
                    draw(); }
                requestAnimationFrame(gameLoop); return; } if (game.running && !game.gameOver && !game.levelComplete) { game
                    .frame++;
                updatePlayer(); if (game.particles.length > 500) game.particles.splice(0, 150); }
            draw();
            requestAnimationFrame(gameLoop); }
        initGame();
        setupMobileControls();
        gameLoop();
        updateAllUI();
        updateMPStatusUI();
        updateGoldGemUI();
        updateShopUI();
        refreshLangUI();
        window.addEventListener('beforeunload', () => { if (MP.peer) { try { MP.peer.destroy(); } catch (e2) {} } });
        window.addEventListener('keydown', (e) => { if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'q', 'Q',
                'e', 'E', 'r', 'R', 'f', 'F'
            ].includes(e.key)) e.preventDefault(); });
        document.addEventListener('click', () => { initAudio(); }, { once: true });
        window.addEventListener('resize', () => { setupMobileControls(); });
        window.addEventListener('orientationchange', () => { setTimeout(() => { setupMobileControls(); }, 300); });
        console.log('✅ 特色怪物版加载完成！9种怪物（含精英）各具特色！');
        console.log('🪙 金币解锁武器 | 💎 宝石解锁技能 | 🌐 完整中英文 | 📱 移动端横竖屏适配');
    </script>
</body>
